<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マッチノート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5F0; --card:#FFFFFF; --ink:#212820; --muted:#68725F; --line:#DBE1D4;
  --accent:#2F6BBF; --accent-soft:#E3ECF8; --accent-ink:#FFFFFF;
  --win:#2E7D4F; --win-soft:#E2F0E6; --lose:#C4482F; --lose-soft:#F8E7E1;
  --chip:#EEF1EA; --shadow:0 1px 3px rgba(30,40,30,.08);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141915; --card:#1D241E; --ink:#E8ECE4; --muted:#95A18E; --line:#2D372D;
    --accent:#79A8E8; --accent-soft:#22334A; --accent-ink:#101720;
    --win:#63C08A; --win-soft:#1E3527; --lose:#E57B60; --lose-soft:#3E241C;
    --chip:#27302A; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141915; --card:#1D241E; --ink:#E8ECE4; --muted:#95A18E; --line:#2D372D;
  --accent:#79A8E8; --accent-soft:#22334A; --accent-ink:#101720;
  --win:#63C08A; --win-soft:#1E3527; --lose:#E57B60; --lose-soft:#3E241C;
  --chip:#27302A; --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  font-size:16px; line-height:1.6; min-height:100vh;
}
.num{font-family:'Archivo','Zen Kaku Gothic New',sans-serif; font-variant-numeric:tabular-nums;}
.wrap{max-width:480px; margin:0 auto; padding:16px 16px 96px;}
header.app{
  display:flex; align-items:baseline; gap:8px; padding:14px 4px 10px;
}
header.app h1{font-family:'Archivo',sans-serif; font-size:20px; font-weight:800; letter-spacing:.02em;}
header.app .sub{font-size:12px; color:var(--muted);}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px;}
.stack{display:flex; flex-direction:column; gap:12px;}
button{
  font-family:inherit; font-size:16px; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; cursor:pointer; touch-action:manipulation;
}
button:active{transform:scale(.98);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
button.ghost{background:transparent;}
button.small{font-size:13px; padding:7px 12px; border-radius:10px;}
.label{font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase;}
input[type=text], input[type=date], textarea{
  width:100%; font-family:inherit; font-size:16px; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
}
input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.hidden{display:none !important;}
/* ---------- home ---------- */
.match-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left;}
.match-item .mark{font-size:22px; font-weight:800; width:1.1em; text-align:center; flex:none;}
.match-item .mark:empty{display:none;}
.match-item .score{font-size:22px; font-weight:800;}
.match-item .meta{flex:1; min-width:0;}
.match-item .meta .t{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.match-item .meta .d{font-size:12px; color:var(--muted);}
.badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;}
.badge.live{background:var(--lose-soft); color:var(--lose);}
.badge.done{background:var(--chip); color:var(--muted);}
.empty{color:var(--muted); text-align:center; padding:32px 8px; font-size:14px;}
.tabs{display:flex; gap:8px;}
.tabs button{flex:1; border-radius:999px; font-weight:700; padding:10px; font-size:15px; background:var(--chip); border-color:transparent; color:var(--muted);}
.tabs button.on{background:var(--accent-soft); color:var(--accent);}
.note-item{width:100%; text-align:left;}
.note-item .t{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.note-item .d{font-size:12px; color:var(--muted);}
.note-item .p{font-size:13px; color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
/* Claudeの分析（マークダウン）の見た目 */
.md{font-size:15px; line-height:1.75; overflow-wrap:break-word;}
.md > *:first-child{margin-top:0;}
.md h2{font-size:19px; font-weight:700; margin:22px 0 8px; padding-bottom:6px; border-bottom:2px solid var(--accent); color:var(--accent);}
.md h3{font-size:16px; font-weight:700; margin:18px 0 6px;}
.md h4{font-size:15px; font-weight:700; margin:14px 0 4px; color:var(--muted);}
.md p{margin:10px 0;}
.md strong{font-weight:700; background:linear-gradient(transparent 62%, var(--accent-soft) 62%);}
.md em{font-style:normal; color:var(--muted);}
.md code{font-family:ui-monospace,monospace; font-size:.92em; background:var(--chip); padding:1px 5px; border-radius:5px;}
.md ul, .md ol{margin:10px 0; padding-left:1.4em;}
.md li{margin:5px 0;}
.md hr{border:none; border-top:1px solid var(--line); margin:20px 0;}
.md .tablewrap{overflow-x:auto; margin:12px 0;}
.md table{border-collapse:collapse; font-size:14px; min-width:100%;}
.md th, .md td{border:1px solid var(--line); padding:7px 10px; text-align:left; white-space:nowrap;}
.md th{background:var(--chip); font-weight:700;}
.md td{font-variant-numeric:tabular-nums;}
/* ふり返り */
.rv h4{font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px;}
.rv h4 .n{font-size:11px; font-weight:700; background:var(--chip); color:var(--muted); border-radius:999px; padding:1px 7px;}
.rv ul{list-style:none; display:flex; flex-direction:column; gap:6px; margin-top:6px;}
.rv li{font-size:14px; line-height:1.6; padding-left:18px; position:relative;}
.rv li::before{content:""; position:absolute; left:4px; top:.62em; width:6px; height:6px; border-radius:999px; background:currentColor;}
.rv .good h4{color:var(--win);} .rv .good li{color:var(--ink);} .rv .good li::before{background:var(--win);}
.rv .bad h4{color:var(--lose);} .rv .bad li::before{background:var(--lose);}
.rv .next h4{color:var(--accent);} .rv .next li::before{background:var(--accent);}
.rv .headline{font-size:15px; font-weight:700; line-height:1.6;}
.rv .cmp{font-size:13px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px;}
.rv .cmp b{color:var(--ink);}
/* ---------- record ---------- */
.scoreboard{display:flex; align-items:stretch; gap:10px;}
.scoreboard .box{flex:1; text-align:center; padding:10px 6px; border-radius:12px; background:var(--card); border:1px solid var(--line);}
.scoreboard .big{font-size:34px; font-weight:800; line-height:1.1;}
.scoreboard .who{font-size:12px; color:var(--muted); font-weight:700;}
.gamehead{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.gamehead .gnum{font-weight:800; font-size:17px;}
.serve-pill{font-size:13px; font-weight:700; border-radius:999px; padding:6px 14px; border:1px solid var(--line); background:var(--chip);}
.serve-pill.mine{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
.ptscore{text-align:center; font-size:44px; font-weight:800; letter-spacing:.04em; padding:4px 0 8px;}
.ptscore .sep{color:var(--muted); font-weight:500; padding:0 10px;}
.dots{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:22px;}
.dot{width:20px; height:20px; border-radius:999px; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.dot.w{background:var(--win-soft); color:var(--win);}
.dot.l{background:var(--lose-soft); color:var(--lose);}
.btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.btn-grid .full{grid-column:1 / -1;}
.pt-btn{font-size:17px; font-weight:700; padding:16px 8px; border-radius:14px;}
.pt-btn small{display:block; font-size:12px; font-weight:500; color:inherit; opacity:.75;}
.pt-btn.w{background:var(--win-soft); color:var(--win); border-color:transparent;}
.pt-btn.l{background:var(--lose-soft); color:var(--lose); border-color:transparent;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chips button{background:var(--chip); border-color:transparent; border-radius:999px; font-size:14px; font-weight:500; padding:9px 14px;}
.sheet-title{font-weight:700; font-size:15px;}
.rowline{display:flex; gap:8px; align-items:center;}
.rowline > *{flex:1;}
.toast{
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); font-size:14px; font-weight:700;
  padding:10px 18px; border-radius:999px; opacity:0; transition:opacity .25s; pointer-events:none;
  max-width:90vw; text-align:center; z-index:50;
}
.toast.show{opacity:1;}
.footbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--card); border-top:1px solid var(--line);
}
.footbar .in{max-width:480px; margin:0 auto; display:flex; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.footbar button{flex:1;}
/* ---------- summary ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.tile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
.tiles .tile:last-child:nth-child(odd){grid-column:1 / -1;} /* 奇数個のときは最後を横いっぱいに */
.tile .v{font-size:26px; font-weight:800;}
.tile .k{font-size:12px; color:var(--muted); font-weight:700;}
.tile.good .v{color:var(--win);}
.tile.bad .v{color:var(--lose);}
.bar-row{display:flex; align-items:center; gap:10px; font-size:14px;}
.bar-row .name{width:9.5em; flex:none; color:var(--ink);}
.bar-row .track, .svrow .track{display:block; height:10px; background:var(--chip); border-radius:999px; overflow:hidden;}
.bar-row .track{flex:1;}
.bar-row .fill, .svrow .fill{display:block; height:100%; border-radius:999px; background:var(--accent);}
.svrow{display:flex; flex-direction:column; gap:5px;}
.svrow .svtop{display:flex; justify-content:space-between; align-items:baseline; font-size:14px;}
.svrow .svtop .v{font-weight:700;}
.bar-row.badfill .fill{background:var(--lose);}
.bar-row .n{width:2em; text-align:right; font-weight:700;}
.h2{font-size:15px; font-weight:700; padding:6px 2px 0;}
.loglist{display:flex; flex-direction:column; gap:10px; font-size:14px;}
.logg{border-top:1px solid var(--line); padding-top:8px;}
.logg:first-child{border-top:none; padding-top:0;}
.logg .gt{font-weight:700; display:flex; gap:8px; align-items:center;}
.logg .gt .res{font-size:12px; padding:1px 8px; border-radius:999px; font-weight:700;}
.logg .gt .res.w{background:var(--win-soft); color:var(--win);}
.logg .gt .res.l{background:var(--lose-soft); color:var(--lose);}
.logpts{color:var(--muted); font-size:13px; line-height:1.9;}
.logpts b{font-weight:700;}
.logpts b.w{color:var(--win);} .logpts b.l{color:var(--lose);}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="app"><h1>マッチノート</h1><span class="sub">テニス試合レコーダー</span></header>

  <!-- ===== ホーム ===== -->
  <div id="view-home" class="stack">
    <div class="tabs"><button class="on">試合</button><button id="tab-to-serve">サーブ練習</button><button id="tab-to-notes">分析・課題</button></div>
    <button class="primary hidden" id="upd-note" style="background:var(--win);border-color:var(--win)">🆕 新しいバージョンがあります — タップして更新</button>
    <button class="primary pt-btn" id="btn-new">＋ 新しい試合をはじめる</button>
    <div class="label">試合の記録</div>
    <div id="match-list" class="stack"></div>
    <div class="card stack" style="gap:8px">
      <div class="label">データ</div>
      <div class="rowline">
        <button class="small" id="btn-export">書き出す（コピー）</button>
        <button class="small" id="btn-import">読み込む（貼り付け）</button>
      </div>
      <textarea id="io-area" rows="3" class="hidden" placeholder="ここに貼り付けてから「読み込む」をもう一度押してください"></textarea>
      <button class="small" id="btn-check-update">アプリが最新か たしかめる</button>
      <div style="font-size:12px;color:var(--win);font-weight:700" id="save-status"></div>
      <div style="font-size:12px;color:var(--muted)">記録はこの端末のブラウザ内だけに保存されます。<br><span id="ver-label"></span></div>
    </div>
  </div>

  <!-- ===== サーブ練習タブ ===== -->
  <div id="view-serve" class="stack hidden">
    <div class="tabs"><button id="tab-to-home2">試合</button><button class="on">サーブ練習</button><button id="tab-to-notes2">分析・課題</button></div>
    <div class="tiles" id="serve-tiles"></div>
    <div id="serve-step1" class="btn-grid">
      <button class="pt-btn w" id="sv-1in">◯ 1st 入った</button>
      <button class="pt-btn l" id="sv-1out">✕ 1st フォルト</button>
    </div>
    <div id="serve-step2" class="btn-grid hidden">
      <button class="pt-btn w" id="sv-2in">◯ 2nd 入った</button>
      <button class="pt-btn l" id="sv-2out">✕ 2nd フォルト</button>
    </div>
    <button class="ghost small" id="sv-undo">↩︎ ひとつ前を取り消す</button>
    <div class="rowline">
      <button class="small" id="sv-save">この練習を保存する</button>
      <button class="ghost small" id="sv-reset" style="color:var(--lose)">リセット</button>
    </div>
    <div class="label">過去のサーブ練習</div>
    <div id="serve-list" class="stack"></div>
  </div>

  <!-- ===== 分析・課題タブ ===== -->
  <div id="view-notes" class="stack hidden">
    <div class="tabs"><button id="tab-to-home">試合</button><button id="tab-to-serve2">サーブ練習</button><button class="on">分析・課題</button></div>
    <button class="primary pt-btn" id="btn-new-note">＋ 分析・課題を保存する</button>
    <div class="label">保存した分析・課題</div>
    <div id="note-list" class="stack"></div>
  </div>

  <!-- ===== 分析・課題を読む ===== -->
  <div id="view-note-read" class="stack hidden">
    <div class="card stack" style="gap:6px">
      <div style="font-weight:700;font-size:18px" id="read-title"></div>
      <div style="font-size:12px;color:var(--muted)" id="read-date"></div>
    </div>
    <div class="card md" id="read-body"></div>
    <div class="rowline">
      <button id="btn-edit-note">✏️ 編集する</button>
      <button class="ghost" id="btn-read-back">もどる</button>
    </div>
  </div>

  <!-- ===== 分析・課題の編集 ===== -->
  <div id="view-note-edit" class="stack hidden">
    <div class="card stack">
      <div><div class="label">タイトル</div><input type="text" id="note-title" placeholder="例：園田大会の課題"></div>
      <div><div class="label">内容</div><textarea id="note-body" rows="14" placeholder="Claudeの分析やアドバイスをここに貼り付けてください"></textarea></div>
      <button class="primary" id="btn-save-note">保存する</button>
      <div class="rowline">
        <button class="ghost small" id="btn-cancel-note">もどる</button>
        <button class="ghost small" id="btn-del-note" style="color:var(--lose)">削除する</button>
      </div>
    </div>
  </div>

  <!-- ===== 新規試合 ===== -->
  <div id="view-new" class="stack hidden">
    <div class="card stack">
      <div><div class="label">日付</div><input type="date" id="in-date"></div>
      <div><div class="label">大会・試合名</div><input type="text" id="in-title" placeholder="例：園田大会 1回戦"></div>
      <div><div class="label">最初のサーブ</div>
        <div class="rowline">
          <button id="first-serve-me" class="primary">自分</button>
          <button id="first-serve-opp">相手</button>
        </div>
      </div>
      <div><div class="label">ゲーム形式</div>
        <div class="rowline">
          <button id="fmt-deuce" class="primary">デュースあり</button>
          <button id="fmt-noad">ノーアド</button>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">ノーアド＝40-40になったら次の1本でゲームが決まる</div>
      </div>
      <button class="primary pt-btn" id="btn-start">記録をはじめる</button>
      <button class="ghost small" id="btn-cancel-new">やめる</button>
    </div>
  </div>

  <!-- ===== 記録 ===== -->
  <div id="view-rec" class="stack hidden">
    <button class="ghost small" id="rec-title" style="text-align:left">✏️ 試合名</button>
    <div class="scoreboard num">
      <div class="box"><div class="who">自分</div><div class="big" id="sc-me">0</div></div>
      <div class="box"><div class="who">相手</div><div class="big" id="sc-opp">0</div></div>
    </div>
    <div class="card stack" style="gap:10px">
      <div class="gamehead">
        <span class="gnum" id="g-num">第1ゲーム</span>
        <span style="display:flex;gap:6px">
          <button class="serve-pill" id="fmt-toggle">デュースあり</button>
          <button class="serve-pill" id="serve-toggle">サーブ：自分</button>
        </span>
      </div>
      <div class="ptscore num" id="pt-score">0<span class="sep">-</span>0</div>
      <div class="dots" id="pt-dots"></div>
    </div>

    <!-- 手順1：まずサーブ、つぎにポイントの結果 -->
    <div id="step1" class="stack">
      <div class="label" id="step1-guide"></div>
      <div class="btn-grid hidden" id="btns-serve1">
        <button class="pt-btn w" data-sv="1in">◯ 1st 入った</button>
        <button class="pt-btn l" data-sv="1out">✕ 1st フォルト</button>
      </div>
      <div class="btn-grid hidden" id="btns-serve2">
        <button class="pt-btn w" data-sv="2in">◯ 2nd 入った</button>
        <button class="pt-btn l" data-sv="2out">✕ ダブルフォルト</button>
      </div>
      <div class="btn-grid hidden" id="btns-result">
        <button class="pt-btn w" data-act="w">◯ 取った</button>
        <button class="pt-btn l" data-act="l">✕ 落とした</button>
      </div>
      <button class="ghost small" id="btn-undo">↩︎ ひとつ前を取り消す</button>
    </div>

    <!-- 手順2：理由チップ -->
    <div id="step2" class="card stack hidden">
      <div class="sheet-title" id="sheet-title">どうやって？</div>
      <div class="chips" id="chip-box"></div>
      <input type="text" id="in-memo" placeholder="ひとことメモ（例：深いフォア）※なくてOK">
      <div class="rowline">
        <button class="small" id="btn-skip-reason">理由なしで記録</button>
        <button class="ghost small" id="btn-cancel-pt">もどる</button>
      </div>
    </div>
  </div>

  <!-- ===== 集計 ===== -->
  <div id="view-sum" class="stack hidden">
    <div class="card" style="text-align:center">
      <div id="sum-title" style="font-weight:700"></div>
      <button class="ghost small" id="sum-rename" style="margin-top:6px">✏️ 試合名・日付を変える</button>
      <div class="num" id="sum-score" style="font-size:46px;font-weight:800;letter-spacing:.03em"></div>
      <div id="sum-keep" style="font-size:13px;color:var(--muted)"></div>
    </div>
    <div class="tiles" id="sum-tiles"></div>
    <div class="card stack" id="sum-review" style="gap:12px"></div>
    <button id="btn-save-review">このふり返りを「分析・課題」に保存する</button>
    <div class="card stack" id="sum-serve-card" style="gap:8px"></div>
    <div class="card stack" style="gap:8px">
      <div class="h2">◯ ポイントの取り方</div>
      <div class="stack" id="sum-winways" style="gap:8px"></div>
      <div class="h2">✕ ポイントの落とし方</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = "matchnote-v1";
const BKEY = "matchnote-v1-backup"; // 前回アプリを開いたときの控え（万一のとき戻せるように）
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }; // 日本時間の今日

/* ---------- 理由の定義 ---------- */
const R = {
  win: [
    {id:"ace",  label:"サービスエース", group:"winner", serveOnly:true},
    {id:"gs",   label:"良いサーブで相手がミス", group:"winner", serveOnly:true},
    {id:"rm",   label:"相手リターンミス", group:"oppErr", serveOnly:true},
    {id:"oout", label:"相手アウト",   group:"oppErr"},
    {id:"onet", label:"相手ネット",   group:"oppErr"},
    {id:"odf",  label:"相手ダブルフォルト", group:"oppErr", returnOnly:true},
    {id:"fw",   label:"フォアで決めた", group:"winner"},
    {id:"bw",   label:"バックで決めた", group:"winner"},
    {id:"deepf", label:"深いフォアで崩した", group:"winner"},
    {id:"deepb", label:"深いバックで崩した", group:"winner"},
    {id:"vw",   label:"ボレー・スマッシュ", group:"winner"},
    {id:"pass", label:"パッシング",   group:"winner"},
    {id:"wother", label:"その他", group:"other"},
  ],
  lose: [
    // リターン（相手サーブの1球目）は打ち方まで分けて、先頭に置く
    {id:"rmf",  label:"リターンミス フォア", group:"myErr", returnOnly:true},
    {id:"rmb",  label:"リターンミス バック", group:"myErr", returnOnly:true},
    {id:"rmbs", label:"リターンミス バックスライス", group:"myErr", returnOnly:true},
    {id:"fout", label:"フォア アウト", group:"myErr"},
    {id:"fnet", label:"フォア ネット", group:"myErr"},
    {id:"bout", label:"バック アウト", group:"myErr"},
    {id:"bsout", label:"バックスライス アウト", group:"myErr"},
    {id:"bnet", label:"バック ネット", group:"myErr"},
    {id:"bsnet", label:"バックスライス ネット", group:"myErr"},
    {id:"vmiss",label:"ボレーミス",  group:"myErr"},
    {id:"rmiss",label:"リターンミス", group:"myErr", returnOnly:true, hidden:true}, // 旧データ用（新しくは選べない）
    {id:"oace", label:"相手のサービスエース",  group:"oppGood", returnOnly:true},
    {id:"goodserve", label:"サーブが良くてミス", group:"oppGood", returnOnly:true},
    {id:"deepmiss", label:"相手の球が深くてミス", group:"oppGood"},
    {id:"ow",   label:"相手に決められた", group:"oppGood"},
    {id:"lother", label:"その他", group:"other"},
  ],
  df: {id:"df", label:"ダブルフォルト", group:"myErr"},
};
const reasonLabel = id => {
  if(id === "df") return R.df.label;
  const all = R.win.concat(R.lose);
  const f = all.find(r => r.id === id);
  return f ? f.label : "";
};

/* ---------- データ ---------- */
let db = load();
let cur = null;            // 記録中の試合オブジェクト
let pending = null;        // 手順1で選んだ内容 {win, serve}
function parseDb(text){
  const d = JSON.parse(text);
  if(!d || !Array.isArray(d.matches)) return null;
  if(!Array.isArray(d.notes)) d.notes = [];
  if(!Array.isArray(d.serves)) d.serves = [];
  if(!d.serveLive || !Array.isArray(d.serveLive.attempts)) d.serveLive = {attempts:[], pending:false};
  return d;
}
function load(){
  let main = null, backup = null;
  try{ main = parseDb(localStorage.getItem(KEY)); }catch(e){}
  try{ backup = parseDb(localStorage.getItem(BKEY)); }catch(e){}
  // 本体が読めない・空なのに控えに記録が残っているときは控えから復活させる
  const count = d => d ? d.matches.length + d.notes.length + d.serves.length : -1;
  const d = count(backup) > count(main) ? backup : main;
  if(d){
    try{ localStorage.setItem(BKEY, JSON.stringify(d)); }catch(e){} // 開いた時点の状態を控えに残す
    return d;
  }
  return {matches:[], notes:[], serves:[], serveLive:{attempts:[], pending:false}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("保存できませんでした（容量不足かも）"); } }

/* ---------- 画面切り替え ---------- */
const views = ["view-home","view-serve","view-notes","view-note-read","view-note-edit","view-new","view-rec","view-sum"];
function show(v){
  views.forEach(x => $(x).classList.toggle("hidden", x !== v));
  $("foot-rec").classList.toggle("hidden", v !== "view-rec");
  $("foot-sum").classList.toggle("hidden", v !== "view-sum");
  window.scrollTo(0,0);
}
let toastTimer = null;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- スコア計算 ---------- */
function gameScore(pts, noAd){ // 現在ゲームのポイント数 → 表示
  let me=0, op=0;
  pts.forEach(p => p.win ? me++ : op++);
  const disp = n => ["0","15","30","40"][Math.min(n,3)];
  if(me>=3 && op>=3){
    if(me===op) return {t: noAd ? "40-40 次で決着！" : "デュース", me, op, done:false};
    if(!noAd && Math.abs(me-op)===1) return {t:(me>op?"Ad 自分":"Ad 相手"), me, op, done:false};
  }
  return {t:disp(me)+"|"+disp(op), me, op};
}
function gameDone(pts, noAd){
  let me=0, op=0;
  pts.forEach(p => p.win ? me++ : op++);
  const need = noAd ? 1 : 2;
  if((me>=4 || op>=4) && Math.abs(me-op)>=need) return {done:true, iWon:me>op};
  return {done:false};
}
function matchGames(m){ // 終了ゲームの取得数
  let me=0, op=0;
  m.games.forEach(g => { if(g.won===true) me++; else if(g.won===false) op++; });
  return {me, op};
}
function curGame(m){ return m.games[m.games.length-1]; }

/* ---------- ホーム ---------- */
function resultMark(m){          // 勝ち○ / 負け●（終了した試合だけ）
  if(!m.finished) return "";
  const {me, op} = matchGames(m);
  return me > op ? "○" : me < op ? "●" : "";
}
function renderHome(){
  $("save-status").textContent =
    "✓ 保存ずみ：試合 " + db.matches.length + "件・サーブ練習 " + db.serves.length + "件・分析 " + db.notes.length + "件";
  const box = $("match-list"); box.innerHTML = "";
  if(db.matches.length === 0){
    box.innerHTML = '<div class="card empty">まだ記録がありません。<br>「新しい試合をはじめる」から！</div>';
    return;
  }
  [...db.matches].reverse().forEach(m => {
    const {me, op} = matchGames(m);
    const b = document.createElement("button");
    b.className = "card match-item";
    b.innerHTML =
      '<span class="mark">'+resultMark(m)+'</span>'+
      '<span class="score num">'+me+"-"+op+'</span>'+
      '<span class="meta"><span class="t"></span><span class="d">'+m.date+"</span></span>"+
      '<span class="badge '+(m.finished?"done":"live")+'">'+(m.finished?"終了":"記録中")+"</span>";
    b.querySelector(".t").textContent = m.title || "（名前なし）";
    b.addEventListener("click", ()=>{ cur = m; m.finished ? renderSummary() : renderRec(); });
    box.appendChild(b);
  });
}

/* ---------- サーブ練習タブ ---------- */
function serveStats(atts){
  const s1n = atts.length, s1in = atts.filter(a=>a.first).length;
  const done2 = atts.filter(a=>!a.first && a.second!==null);
  const s2n = done2.length, s2in = done2.filter(a=>a.second).length;
  const df = done2.filter(a=>!a.second).length;
  return {s1n, s1in, s2n, s2in, df};
}
const svpct = (w,n) => n>0 ? Math.round(w/n*100)+"%" : "—";
function renderServe(){
  const L = db.serveLive;
  const s = serveStats(L.attempts);
  $("serve-tiles").innerHTML =
    '<div class="tile good"><div class="v num">'+svpct(s.s1in,s.s1n)+'</div><div class="k">1stサーブ '+s.s1in+"/"+s.s1n+'</div></div>' +
    '<div class="tile good"><div class="v num">'+svpct(s.s2in,s.s2n)+'</div><div class="k">2ndサーブ '+s.s2in+"/"+s.s2n+'</div></div>' +
    '<div class="tile bad"><div class="v num">'+s.df+'</div><div class="k">ダブルフォルト</div></div>' +
    '<div class="tile"><div class="v num">'+s.s1n+'</div><div class="k">打ったポイント数</div></div>';
  $("serve-step1").classList.toggle("hidden", L.pending);
  $("serve-step2").classList.toggle("hidden", !L.pending);
  const box = $("serve-list"); box.innerHTML = "";
  if(db.serves.length === 0){
    box.innerHTML = '<div class="card empty">保存した練習はまだありません。</div>';
  }
  [...db.serves].reverse().forEach(r=>{
    const b = document.createElement("button");
    b.className = "card note-item";
    b.innerHTML = '<span class="t">'+r.date+'</span><span class="p">1st '+svpct(r.s1in,r.s1n)+"（"+r.s1in+"/"+r.s1n+"）・2nd "+svpct(r.s2in,r.s2n)+"（"+r.s2in+"/"+r.s2n+"）・DF "+r.df+"</span>";
    b.addEventListener("click", ()=>{
      if(confirm(r.date+" の練習記録を削除しますか？")){
        db.serves = db.serves.filter(x=>x.id!==r.id);
        save(); renderServe(); toast("削除しました");
      }
    });
    box.appendChild(b);
  });
  show("view-serve");
}
$("sv-1in").addEventListener("click", ()=>{ db.serveLive.attempts.push({first:true, second:null}); save(); renderServe(); });
$("sv-1out").addEventListener("click", ()=>{ db.serveLive.attempts.push({first:false, second:null}); db.serveLive.pending = true; save(); renderServe(); });
$("sv-2in").addEventListener("click", ()=>{ const a = db.serveLive.attempts; a[a.length-1].second = true; db.serveLive.pending = false; save(); renderServe(); });
$("sv-2out").addEventListener("click", ()=>{ const a = db.serveLive.attempts; a[a.length-1].second = false; db.serveLive.pending = false; save(); renderServe(); toast("ダブルフォルト"); });
$("sv-undo").addEventListener("click", ()=>{
  const L = db.serveLive;
  if(L.attempts.length === 0){ toast("取り消すものがありません"); return; }
  if(L.pending){ L.attempts.pop(); L.pending = false; }
  else{
    const last = L.attempts[L.attempts.length-1];
    if(!last.first && last.second !== null){ last.second = null; L.pending = true; } // 2ndの入力だけ取り消す
    else L.attempts.pop();
  }
  save(); renderServe(); toast("ひとつ取り消しました");
});
$("sv-reset").addEventListener("click", ()=>{
  if(db.serveLive.attempts.length === 0) return;
  if(!confirm("いまのカウントを保存せずに消しますか？")) return;
  db.serveLive = {attempts:[], pending:false};
  save(); renderServe();
});
$("sv-save").addEventListener("click", ()=>{
  const L = db.serveLive;
  if(L.pending){ toast("2ndサーブの結果を入力してください"); return; }
  if(L.attempts.length === 0){ toast("まだ記録がありません"); return; }
  const s = serveStats(L.attempts);
  db.serves.push({id:"s"+Math.random().toString(36).slice(2,10), date:today(), ...s});
  db.serveLive = {attempts:[], pending:false};
  save(); renderServe(); toast("練習を保存しました");
});
$("tab-to-serve").addEventListener("click", renderServe);
$("tab-to-serve2").addEventListener("click", renderServe);
$("tab-to-home2").addEventListener("click", ()=>{ renderHome(); show("view-home"); });
$("tab-to-notes2").addEventListener("click", ()=>{ renderNotes(); show("view-notes"); });

/* ---------- Claudeの分析（マークダウン）を見やすく表示する ---------- */
function mdToHtml(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  const lines = String(src||"").replace(/\r/g,"").split("\n");
  const isHr = L => /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L);
  const isUl = L => /^\s*[-*・]\s+/.test(L);
  const isOl = L => /^\s*\d+[.)]\s+/.test(L);
  const isH  = L => /^#{1,6}\s+/.test(L);
  const cells = L => L.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
  const out = [];
  let i = 0;
  while(i < lines.length){
    const L = lines[i];
    if(/^\s*$/.test(L)){ i++; continue; }
    if(isHr(L)){ out.push("<hr>"); i++; continue; }
    const h = L.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; const lv = n <= 2 ? 2 : (n === 3 ? 3 : 4); out.push("<h"+lv+">"+inline(h[2])+"</h"+lv+">"); i++; continue; }
    // 表（|---|---| の行があるもの）
    const next = lines[i+1] || "";
    if(L.includes("|") && next.includes("-") && /^[\s|:\-]+$/.test(next)){
      const head = cells(L); i += 2;
      const rows = [];
      while(i < lines.length && lines[i].includes("|")){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="tablewrap"><table><thead><tr>' + head.map(c=>"<th>"+c+"</th>").join("") +
        "</tr></thead><tbody>" + rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("") + "</tbody></table></div>");
      continue;
    }
    if(isUl(L)){
      const items = [];
      while(i < lines.length && isUl(lines[i])){ items.push("<li>"+inline(lines[i].replace(/^\s*[-*・]\s+/,""))+"</li>"); i++; }
      out.push("<ul>"+items.join("")+"</ul>"); continue;
    }
    if(isOl(L)){
      const items = [];
      while(i < lines.length && isOl(lines[i])){ items.push("<li>"+inline(lines[i].replace(/^\s*\d+[.)]\s+/,""))+"</li>"); i++; }
      out.push("<ol>"+items.join("")+"</ol>"); continue;
    }
    const para = [];
    while(i < lines.length && !/^\s*$/.test(lines[i]) && !isHr(lines[i]) && !isH(lines[i]) && !isUl(lines[i]) && !isOl(lines[i]) && !lines[i].includes("|")){
      para.push(inline(lines[i])); i++;
    }
    if(para.length) out.push("<p>"+para.join("<br>")+"</p>");
    else { out.push("<p>"+inline(lines[i])+"</p>"); i++; }   // 表になり損ねた | 行など
  }
  return out.join("");
}

/* ---------- 分析・課題タブ ---------- */
let editingNoteId = null;
function renderNotes(){
  const box = $("note-list"); box.innerHTML = "";
  if(db.notes.length === 0){
    box.innerHTML = '<div class="card empty">まだ保存がありません。<br>試合の集計画面で「振り返り用テキストをコピー」→ Claudeに貼って分析してもらい、その答えをここに保存しましょう。</div>';
    return;
  }
  [...db.notes].reverse().forEach(n=>{
    const b = document.createElement("button");
    b.className = "card note-item stack";
    b.style.gap = "4px";
    b.innerHTML = '<span class="t"></span><span class="d">'+n.date+'</span><span class="p"></span>';
    b.querySelector(".t").textContent = n.title || "（タイトルなし）";
    b.querySelector(".p").textContent = n.body.replace(/[#*`>|-]/g, " ").replace(/\s+/g, " ").trim(); // 一覧では記号を消して読みやすく
    b.addEventListener("click", ()=>openNoteRead(n.id));
    box.appendChild(b);
  });
}
function openNoteRead(id){
  const n = db.notes.find(x=>x.id===id);
  if(!n) return;
  editingNoteId = id;
  $("read-title").textContent = n.title || "（タイトルなし）";
  $("read-date").textContent = n.date;
  $("read-body").innerHTML = mdToHtml(n.body);
  show("view-note-read");
}
function openNote(id){
  editingNoteId = id;
  const n = id ? db.notes.find(x=>x.id===id) : null;
  $("note-title").value = n ? n.title : "";
  $("note-body").value = n ? n.body : "";
  $("btn-del-note").classList.toggle("hidden", !n);
  show("view-note-edit");
}
$("btn-edit-note").addEventListener("click", ()=>openNote(editingNoteId));
$("btn-read-back").addEventListener("click", ()=>{ renderNotes(); show("view-notes"); });
$("tab-to-notes").addEventListener("click", ()=>{ renderNotes(); show("view-notes"); });
$("tab-to-home").addEventListener("click", ()=>{ renderHome(); show("view-home"); });
$("btn-new-note").addEventListener("click", ()=>openNote(null));
$("btn-save-note").addEventListener("click", ()=>{
  const title = $("note-title").value.trim();
  const body = $("note-body").value.trim();
  if(!title && !body){ toast("タイトルか内容を入れてください"); return; }
  let id = editingNoteId;
  if(id){
    const n = db.notes.find(x=>x.id===id);
    if(n){ n.title = title; n.body = body; }
  }else{
    id = "n"+Math.random().toString(36).slice(2,10);
    db.notes.push({id, date:today(), title, body});
  }
  save(); renderNotes(); openNoteRead(id); toast("保存しました");   // 保存したら整形した状態で見せる
});
$("btn-cancel-note").addEventListener("click", ()=>{ renderNotes(); show("view-notes"); });
$("btn-del-note").addEventListener("click", ()=>{
  if(!editingNoteId) return;
  if(!confirm("このメモを削除しますか？")) return;
  db.notes = db.notes.filter(x=>x.id!==editingNoteId);
  save(); renderNotes(); show("view-notes"); toast("削除しました");
});

/* ---------- 新規試合 ---------- */
let firstServeMine = true;
let fmtNoAd = false;
function setFirstServe(mine){
  firstServeMine = mine;
  $("first-serve-me").className = mine ? "primary" : "";
  $("first-serve-opp").className = mine ? "" : "primary";
}
function setFmt(noAd){
  fmtNoAd = noAd;
  $("fmt-deuce").className = noAd ? "" : "primary";
  $("fmt-noad").className = noAd ? "primary" : "";
}
$("btn-new").addEventListener("click", ()=>{
  $("in-date").value = today();
  $("in-title").value = "";
  setFirstServe(true);
  setFmt(false);
  show("view-new");
});
$("first-serve-me").addEventListener("click", ()=>setFirstServe(true));
$("first-serve-opp").addEventListener("click", ()=>setFirstServe(false));
$("fmt-deuce").addEventListener("click", ()=>setFmt(false));
$("fmt-noad").addEventListener("click", ()=>setFmt(true));
$("btn-cancel-new").addEventListener("click", ()=>show("view-home"));
$("btn-start").addEventListener("click", ()=>{
  cur = {
    id: "m"+Math.random().toString(36).slice(2,10),
    date: $("in-date").value || today(),
    title: $("in-title").value.trim(),
    noAd: fmtNoAd,
    finished: false,
    games: [{n:1, myServe:firstServeMine, points:[], won:null}],
  };
  db.matches.push(cur); save();
  renderRec();
});

/* ---------- 記録画面 ---------- */
function renderRec(){
  $("rec-title").textContent = "✏️ " + (cur.title || "（名前なし）");
  const g = curGame(cur);
  const {me, op} = matchGames(cur);
  $("sc-me").textContent = me;
  $("sc-opp").textContent = op;
  $("g-num").textContent = "第"+g.n+"ゲーム";
  const st = $("serve-toggle");
  st.textContent = "サーブ：" + (g.myServe ? "自分" : "相手");
  st.classList.toggle("mine", g.myServe);
  $("fmt-toggle").textContent = cur.noAd ? "ノーアド" : "デュースあり";
  const gs = gameScore(g.points, cur.noAd);
  $("pt-score").innerHTML = gs.t.includes("|")
    ? gs.t.split("|")[0] + '<span class="sep">-</span>' + gs.t.split("|")[1]
    : gs.t;
  const dots = $("pt-dots"); dots.innerHTML = "";
  g.points.forEach(p=>{
    const d = document.createElement("span");
    d.className = "dot " + (p.win ? "w" : "l");
    d.textContent = p.win ? "○" : "×";
    dots.appendChild(d);
  });
  // 自分のサーブのときは「サーブが入ったか」を先に押す → そのあとポイントの結果
  const sv = cur.sv || null;
  const stage = !g.myServe ? "result" : (sv && sv.serve) ? "result" : (sv && sv.fault1) ? "serve2" : "serve1";
  $("btns-serve1").classList.toggle("hidden", stage !== "serve1");
  $("btns-serve2").classList.toggle("hidden", stage !== "serve2");
  $("btns-result").classList.toggle("hidden", stage !== "result");
  $("step1-guide").textContent =
    stage === "serve1" ? "① サーブを打ったら押す" :
    stage === "serve2" ? "セカンドサーブは？" :
    (g.myServe ? "② "+sv.serve+"サーブが入りました。ポイントの結果は？" : "ポイントの結果は？");
  $("step2").classList.add("hidden");

}

/* ---------- 集計 ---------- */
function collectStats(m){
  const s = {
    gMe:0,gOp:0, keep:0, serveG:0, brk:0, retG:0,
    ptWin:0, ptLose:0, ace:0, df:0, retMiss:0,
    myErr:0, myErrDetail:{}, oppErr:0, winner:0, oppGood:0,
    sv1:{w:0,n:0}, sv2:{w:0,n:0},
    winWays:{}, loseWays:{},
  };
  m.games.forEach(g=>{
    if(g.won === true){ s.gMe++; if(g.myServe) s.keep++; else s.brk++; }
    if(g.won === false) s.gOp++;
    if(g.won !== null){ g.myServe ? s.serveG++ : s.retG++; }
    g.points.forEach(p=>{
      p.win ? s.ptWin++ : s.ptLose++;
      if(p.serve === "1st"){ s.sv1.n++; if(p.win) s.sv1.w++; }
      if(p.serve === "2nd" || p.serve === "2nd-df"){ s.sv2.n++; if(p.win) s.sv2.w++; }
      if(p.reason === "df") s.df++;
      if(p.reason === "ace") s.ace++;
      if(["rmf","rmb","rmbs","rmiss"].indexOf(p.reason) >= 0) s.retMiss++;
      const all = R.win.concat(R.lose);
      const r = p.reason === "df" ? R.df : all.find(x=>x.id===p.reason);
      if(r){
        if(p.win){ s.winWays[r.label] = (s.winWays[r.label]||0)+1; }
        else{ s.loseWays[r.label] = (s.loseWays[r.label]||0)+1; }
        if(!p.win && r.group === "myErr"){ s.myErr++; s.myErrDetail[r.label]=(s.myErrDetail[r.label]||0)+1; }
        if(p.win && r.group === "oppErr") s.oppErr++;
        if(p.win && r.group === "winner") s.winner++;
        if(!p.win && r.group === "oppGood") s.oppGood++;
      }
    });
  });
  return s;
}
function bars(box, obj, bad){
  box.innerHTML = "";
  const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  if(entries.length === 0){ box.innerHTML = '<div style="font-size:13px;color:var(--muted)">記録なし</div>'; return; }
  const max = entries[0][1];
  entries.forEach(([name,n])=>{
    const row = document.createElement("div");
    row.className = "bar-row" + (bad ? " badfill" : "");
    row.innerHTML = '<span class="name"></span><span class="track"><span class="fill" style="width:'+Math.round(n/max*100)+'%"></span></span><span class="n num">'+n+"</span>";
    row.querySelector(".name").textContent = name;
    box.appendChild(row);
  });
}
/* ---------- 試合が終わったら自動でふり返りを作る ---------- */
function pct100(w,n){ return n>0 ? Math.round(w/n*100) : null; }
function prevFinished(m){
  const idx = db.matches.indexOf(m);
  for(let i=idx-1; i>=0; i--) if(db.matches[i].finished) return db.matches[i];
  return null;
}
function autoReview(m){
  const s = collectStats(m);
  const all1 = s.sv1.n + s.sv2.n;
  const in1 = pct100(s.sv1.n, all1), w1 = pct100(s.sv1.w, s.sv1.n), w2 = pct100(s.sv2.w, s.sv2.n);
  const cw = l => s.winWays[l] || 0, cl = l => s.loseWays[l] || 0;
  const foreW = cw("フォアで決めた") + cw("深いフォアで崩した");
  const foreL = cl("フォア アウト") + cl("フォア ネット");
  const backW = cw("バックで決めた") + cw("深いバックで崩した");
  const backL = cl("バック アウト") + cl("バック ネット") + cl("バックスライス アウト") + cl("バックスライス ネット");
  const sorted = o => Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const topWin = sorted(s.winWays)[0], topLose = sorted(s.loseWays)[0];
  const totalPt = s.ptWin + s.ptLose;
  const good = [], bad = [], next = [];

  // サーブ
  if(in1 !== null && all1 >= 4){
    if(in1 >= 60) good.push("1stサーブが " + in1 + "% 入った（" + s.sv1.n + "/" + all1 + "）。ここが安定していた。");
    else if(in1 < 50){
      bad.push("1stサーブが " + in1 + "% しか入っていない（" + s.sv1.n + "/" + all1 + "）。");
      next.push("1stは力を8割に落として、まず 55% 入れることを目標にする。");
    }
  }
  if(s.ace >= 2) good.push("サービスエースが " + s.ace + "本。");
  if(s.df === 0 && s.serveG >= 2) good.push("ダブルフォルトがゼロ。");
  if(s.df >= 3){ bad.push("ダブルフォルトが " + s.df + "本。"); next.push("2ndは回転量を上げて、まず確実に入れる。"); }
  if(w1 !== null && s.sv1.n >= 4 && w1 >= 70) good.push("1stが入ったときは " + w1 + "% 取れている。入れれば取れる形ができていた。");
  if(w2 !== null && s.sv2.n >= 4 && w2 < 40){ bad.push("2ndサーブのときの勝率が " + w2 + "%（" + s.sv2.w + "/" + s.sv2.n + "）。2ndを狙われている。"); }

  // キープ・ブレーク
  if(s.serveG >= 2 && s.keep === s.serveG) good.push("サービスゲームを全部キープ（" + s.keep + "/" + s.serveG + "）。");
  else if(s.serveG >= 1 && s.keep < s.serveG) bad.push("ブレークされたのが " + (s.serveG - s.keep) + "ゲーム（キープ " + s.keep + "/" + s.serveG + "）。");
  if(s.brk >= 2) good.push("相手のサーブを " + s.brk + "回ブレークできた。");
  else if(s.retG >= 3 && s.brk === 0) bad.push("相手のサーブを1回もブレークできていない（0/" + s.retG + "ゲーム）。");

  // 決めた vs ミス
  if(s.winner > s.myErr && s.winner >= 3) good.push("自分で決めた " + s.winner + "本 が 自分のミス " + s.myErr + "本 を上回った。攻めが機能していた。");
  else if(s.myErr > s.winner && s.myErr >= 3) bad.push("自分のミス " + s.myErr + "本 が 決めた " + s.winner + "本 を上回った。自滅の形になっている。");
  if(totalPt >= 10 && s.myErr / totalPt >= 0.3) bad.push("全ポイントの " + Math.round(s.myErr/totalPt*100) + "% が自分のミスでの失点。");

  // ショット別の収支
  const bal = (name, w, l) => {
    if(w + l < 4) return;
    const d = w - l;
    const line = name + "の収支 " + (d >= 0 ? "+" : "") + d + "（決めた " + w + " / ミス " + l + "）。";
    (d >= 0 ? good : bad).push(line);
    if(d <= -3) next.push(name + "のミスを減らす。厳しい球は無理に打たず、深く返して立て直す。");
  };
  bal("フォア", foreW, foreL);
  bal("バック", backW, backL);

  // リターン
  if(s.retMiss >= 3){
    bad.push("リターンミスが " + s.retMiss + "本。相手のサーブの1球目で落としている。");
    next.push("リターンは「深く返す」だけに集中して、1球目から攻めない。");
  }

  // 最多の取り方・落とし方
  if(topWin && topWin[1] >= 3) good.push("一番点になったのは「" + topWin[0] + "」で " + topWin[1] + "本。");
  if(topLose && topLose[1] >= 3){
    bad.push("一番落としたのは「" + topLose[0] + "」で " + topLose[1] + "本。");
    if(topLose[0] !== "ダブルフォルト") next.push("次の試合は「" + topLose[0] + "」を半分に減らすことを目標にする。");
  }

  if(good.length === 0) good.push("記録を最後まで取り切れた。まずはここから。");
  if(bad.length === 0) bad.push("大きな穴は見当たらない。この内容を続ける。");
  if(next.length === 0) next.push("いまの形を続けて、次はポイント数をもう一段増やす。");

  // 見出し（一言でいうと）
  let headline;
  if(s.gMe > s.gOp) headline = "○ " + s.gMe + "-" + s.gOp + " で勝ち。" + good[0].replace(/。$/, "") + "のが勝因。";
  else if(s.gMe < s.gOp) headline = "● " + s.gMe + "-" + s.gOp + " で負け。" + bad[0].replace(/。$/, "") + "のが大きい。";
  else headline = s.gMe + "-" + s.gOp + "。" + bad[0].replace(/。$/, "") + "が課題。";

  // 前回との比較
  const p = prevFinished(m);
  let cmp = null;
  if(p){
    const ps = collectStats(p);
    const pAll1 = ps.sv1.n + ps.sv2.n;
    const pin1 = pct100(ps.sv1.n, pAll1);
    const rows = [];
    const diff = (name, now, before, goodIsUp) => {
      if(now === null || before === null) return;
      const d = now - before;
      if(d === 0){ rows.push(name + " は前回と同じ " + now); return; }
      const up = d > 0;
      const mark = (up === goodIsUp) ? "↑" : "↓";
      rows.push(name + " " + before + " → <b>" + now + "</b> " + mark);
    };
    diff("1stが入った率(%)", in1, pin1, true);
    diff("自分のミス(本)", s.myErr, ps.myErr, false);
    diff("決めた(本)", s.winner, ps.winner, true);
    diff("ダブルフォルト(本)", s.df, ps.df, false);
    if(rows.length) cmp = {title: "前回（" + (p.title || "試合") + "・" + p.date + "）とくらべて", rows};
  }
  const uniq = a => a.filter((x,i)=>a.indexOf(x)===i);
  return {headline, good: uniq(good).slice(0,4), bad: uniq(bad).slice(0,5), next: uniq(next).slice(0,3), cmp};
}
function renderReview(m){
  const r = autoReview(m);
  const sec = (cls, title, items) =>
    '<div class="' + cls + '"><h4>' + title + '<span class="n">' + items.length + '</span></h4><ul>' +
    items.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul></div>";
  $("sum-review").className = "card stack rv";
  $("sum-review").innerHTML =
    '<div class="headline">' + esc(r.headline) + "</div>" +
    sec("good", "よかった点", r.good) +
    sec("bad", "課題", r.bad) +
    sec("next", "つぎにやること", r.next) +
    (r.cmp ? '<div class="cmp"><b>' + esc(r.cmp.title) + "</b><br>" + r.cmp.rows.join(" ／ ") + "</div>" : "");
  return r;
}
function reviewToMarkdown(m, r){
  let t = "## 一言でいうと\n\n" + r.headline + "\n\n";
  t += "## よかった点\n\n" + r.good.map(x=>"- "+x).join("\n") + "\n\n";
  t += "## 課題\n\n" + r.bad.map(x=>"- "+x).join("\n") + "\n\n";
  t += "## つぎにやること\n\n" + r.next.map((x,i)=>(i+1)+". "+x).join("\n") + "\n";
  if(r.cmp) t += "\n---\n\n**" + r.cmp.title + "**\n\n" + r.cmp.rows.map(x=>"- "+x.replace(/<\/?b>/g,"**")).join("\n") + "\n";
  return t;
}
function renderSummary(){
  const m = cur, s = collectStats(m);
  $("sum-title").textContent = (m.title || "試合") + "（" + m.date + (m.noAd ? "・ノーアド" : "") + "）";
  const mk = resultMark(m);
  $("sum-score").textContent = (mk ? mk + " " : "") + s.gMe + " - " + s.gOp;
  $("sum-keep").textContent =
    "キープ " + s.keep + "/" + s.serveG + "ゲーム ・ ブレーク " + s.brk + "/" + s.retG + "ゲーム";
  const tiles = $("sum-tiles");
  const pct = (w,n)=> n>0 ? Math.round(w/n*100)+"%" : "—";
  tiles.innerHTML =
    tile(s.ptWin+" / "+(s.ptWin+s.ptLose), "取ったポイント", "good") +
    tile(s.myErr, "自分のミスでの失点", "bad") +
    tile(s.retMiss, "うちリターンミス", "bad") +
    tile(s.ace, "サービスエース", "good") +
    tile(s.df, "ダブルフォルト", "bad") +
    tile(s.winner, "自分で決めた（ウィナー）", "good") +
    tile(s.oppErr, "相手のミスで取った", "");
  function tile(v,k,cls){ return '<div class="tile '+cls+'"><div class="v num">'+v+'</div><div class="k">'+k+"</div></div>"; }
  const svrow = (name, o) =>
    '<div class="svrow"><div class="svtop"><span>'+name+'</span><span class="v num">'+pct(o.w,o.n)+"（"+o.w+"/"+o.n+'）</span></div>'+
    '<span class="track"><span class="fill" style="width:'+(o.n? o.w/o.n*100:0)+'%"></span></span></div>';
  $("sum-serve-card").innerHTML =
    '<div class="h2">サーブ</div>' +
    svrow("1stサーブが入った率", {w:s.sv1.n, n:s.sv1.n + s.sv2.n}) +
    svrow("1stサーブで取った率", s.sv1) +
    svrow("2ndサーブで取った率", s.sv2);
  lastReview = renderReview(m);
  bars($("sum-winways"), s.winWays, false);
  bars($("sum-loseways"), s.loseWays, true);
  // ポイントログ
  const log = $("sum-log"); log.innerHTML = "";
  m.games.forEach(g=>{
    if(g.points.length === 0) return;
    const d = document.createElement("div"); d.className = "logg";
    const res = g.won === null ? "" :
      '<span class="res '+(g.won?"w":"l")+'">'+(g.won?(g.myServe?"キープ":"ブレーク"):(g.myServe?"ブレークされた":"相手キープ"))+"</span>";
    let pts = "";
    g.points.forEach((p,i)=>{
      const mark = p.win ? '<b class="w">○</b>' : '<b class="l">×</b>';
      const sv = p.serve === "2nd" ? "(2nd)" : p.serve === "2nd-df" ? "" : "";
      const r = p.reason ? reasonLabel(p.reason) : "";
      const memo = p.memo ? "「"+esc(p.memo)+"」" : "";
      pts += mark + sv + (r||memo ? " " + esc(r) + memo : "") + (i < g.points.length-1 ? "　/　" : "");
    });
    d.innerHTML = '<div class="gt">第'+g.n+"ゲーム（サーブ："+(g.myServe?"自分":"相手")+"）"+res+'</div><div class="logpts">'+pts+"</div>";
    log.appendChild(d);
  });
  show("view-sum");
}
function esc(t){ const d=document.createElement("span"); d.textContent=t; return d.innerHTML; }

/* 振り返りテキスト */
let lastReview = null;
$("btn-save-review").addEventListener("click", ()=>{
  if(!lastReview) return;

  if(found){ found.title = title; found.body = body; found.date = cur.date; }
  else db.notes.push({id:"n"+Math.random().toString(36).slice(2,10), matchId: cur.id, date: cur.date, title, body});
  save(); toast(found ? "「分析・課題」の内容を更新しました" : "「分析・課題」に保存しました");
});
$("btn-copy-review").addEventListener("click", ()=>{
  const m = cur, s = collectStats(m);
  let t = "テニスの試合の振り返りです。アドバイスをください。\n";
  t += "■ " + (m.title||"試合") + "（" + m.date + "）\n";
  t += "スコア " + s.gMe + "-" + s.gOp + "（キープ" + s.keep + "/" + s.serveG + "、ブレーク" + s.brk + "/" + s.retG + "）\n";
  t += "取ったポイント " + s.ptWin + "/" + (s.ptWin+s.ptLose) + "\n";
  t += "エース" + s.ace + " / ダブルフォルト" + s.df + " / 自分のミス失点" + s.myErr + "（うちリターンミス" + s.retMiss + "） / ウィナー" + s.winner + " / 相手ミスでの得点" + s.oppErr + "\n";
  t += "1stサーブが入った " + s.sv1.n + "/" + (s.sv1.n + s.sv2.n) + "、1stで取った " + s.sv1.w + "/" + s.sv1.n + "、2ndで取った " + s.sv2.w + "/" + s.sv2.n + "\n";
  t += "◯取り方: " + Object.entries(s.winWays).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+"×"+v).join("、") + "\n";
  t += "✕落とし方: " + Object.entries(s.loseWays).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+"×"+v).join("、") + "\n";
  t += "\n■ ポイントログ\n";
  m.games.forEach(g=>{
    if(g.points.length===0) return;
    t += "第"+g.n+"G("+(g.myServe?"自分":"相手")+"サーブ"+(g.won===null?"":g.won?"・取":"・落")+") ";
    t += g.points.map(p=>{
      let x = p.win?"○":"×";
      if(p.serve==="2nd") x+="(2nd)";
      if(p.reason) x+= reasonLabel(p.reason);
      if(p.memo) x+="「"+p.memo+"」";
      return x;
    }).join(" / ") + "\n";
  });
  navigator.clipboard.writeText(t).then(()=>toast("コピーしました"), ()=>{
    $("io-area").value = t; toast("コピーできませんでした");
  });
});

/* ---------- 書き出し・読み込み ---------- */
$("btn-export").addEventListener("click", ()=>{
  const t = JSON.stringify(db);
  navigator.clipboard.writeText(t).then(()=>toast("全データをコピーしました。メモ帳などに保存してください"), ()=>{
    const a = $("io-area"); a.classList.remove("hidden"); a.value = t; a.select();
    toast("下の欄を全選択してコピーしてください");
  });
});
$("btn-import").addEventListener("click", ()=>{
  const a = $("io-area");
  if(a.classList.contains("hidden") || !a.value.trim()){
    a.classList.remove("hidden"); a.value=""; a.focus();
    toast("書き出したデータを貼り付けて、もう一度押してください");
    return;
  }
  try{
    const d = JSON.parse(a.value);
    if(!d || !Array.isArray(d.matches)) throw 0;
    db = d; save(); a.classList.add("hidden"); a.value="";
    renderHome(); toast("読み込みました");
  }catch(e){ toast("読み込めませんでした。データを確認してください"); }
});

/* ---------- 更新の確認 ---------- */
const VER = 17; // リリースのたびに version.json の v と一緒に上げる
$("ver-label").textContent = "マッチノート v" + VER;
function checkUpdate(manual){
  fetch("version.json", {cache:"no-store"}).then(r=>r.json()).then(d=>{
    if(d && d.v > VER){
      const note = $("upd-note");
      note.classList.remove("hidden");
      note.dataset.v = d.v;
      if(manual) toast("新しい v" + d.v + " があります。緑のボタンで更新できます");
    } else if(manual){
      toast("いま最新版です（v" + VER + "）");
    }
  }).catch(()=>{ if(manual) toast("確認できませんでした。電波のあるところでお試しください"); });
}
$("btn-check-update").addEventListener("click", ()=>checkUpdate(true));
$("upd-note").addEventListener("click", ()=>{
  location.href = "./?v=" + ($("upd-note").dataset.v || "new"); // ?v=付きで開き直すと最新が読み込まれる（記録は消えない）
});

/* ---------- 起動 ---------- */
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist(); } // 記録が消えにくくなるようブラウザに依頼
checkUpdate(false);
renderHome();
const liveMatch = db.matches.find(m=>!m.finished);
if(liveMatch){ cur = liveMatch; renderRec(); } else { show("view-home"); }
</script>
</body>
</html>
