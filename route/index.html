<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高校ルート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-v1.png">
<link rel="icon" href="icon-192-v1.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F7FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --ink:#1A2432; --muted:#54637A; --line:#DCE4EE;
  --accent:#2C6FE4; --accent-soft:#E6EEFC; --accent-ink:#FFFFFF;
  --done:#12A06A; --done-soft:#E3F5EC;
  --gold:#C9982F; --gold-soft:#FBF2DC;
  --chip:#EDF1F7; --shadow:0 1px 3px rgba(20,40,70,.08); --shadow-lg:0 8px 24px rgba(20,40,70,.14);
  --new:#E9640F; --red:#D64545;
  --eng:#2C6FE4; --eng-soft:#E6EEFC;
  --math:#0E8F8F; --math-soft:#DDF2F2;
  --jpn:#B5563F; --jpn-soft:#FBE9E4;
  --sci:#7A5AC4; --sci-soft:#EDE7FB;
  --navy1:#12203C; --navy2:#27456F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121721; --card:#1B2230; --ink:#E9EEF6; --muted:#93A1B4; --line:#2C3648;
    --accent:#6FA4F5; --accent-soft:#23324B; --accent-ink:#0E1520;
    --done:#4FCB98; --done-soft:#1B3A2E;
    --gold:#E4BC63; --gold-soft:#3A2E18;
    --chip:#242D3D; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
    --new:#FF9450; --red:#F08A80;
    --eng:#6FA4F5; --eng-soft:#23324B;
    --math:#4FC3C3; --math-soft:#183434;
    --jpn:#EE9F8B; --jpn-soft:#3A241E;
    --sci:#B49CF0; --sci-soft:#2A2340;
  }
}
:root[data-theme="dark"]{
  --bg:#121721; --card:#1B2230; --ink:#E9EEF6; --muted:#93A1B4; --line:#2C3648;
  --accent:#6FA4F5; --accent-soft:#23324B; --accent-ink:#0E1520;
  --done:#4FCB98; --done-soft:#1B3A2E;
  --gold:#E4BC63; --gold-soft:#3A2E18;
  --chip:#242D3D; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  --new:#FF9450; --red:#F08A80;
  --eng:#6FA4F5; --eng-soft:#23324B;
  --math:#4FC3C3; --math-soft:#183434;
  --jpn:#EE9F8B; --jpn-soft:#3A241E;
  --sci:#B49CF0; --sci-soft:#2A2340;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  font-size:16px; line-height:1.65; min-height:100vh;
}
.num{font-variant-numeric:tabular-nums;}
.wrap{max-width:560px; margin:0 auto; padding:0 14px calc(104px + env(safe-area-inset-bottom));}
button, input, textarea, select{font-family:inherit; color:inherit;}
button{background:none; border:none; cursor:pointer; touch-action:manipulation;}
button:active{transform:scale(.98);}
.hidden{display:none !important;}

header.app{position:sticky; top:0; z-index:30; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 2px 8px;}
.title-row{display:flex; align-items:center; gap:8px; padding:0 2px;}
.title-row h1{font-size:20px; font-weight:900; letter-spacing:.02em;}
.title-row .ver{font-size:11px; color:var(--muted); font-weight:700;}
.title-row .spacer{flex:1;}
.icon-btn{width:38px; height:38px; border-radius:12px; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; box-shadow:var(--shadow);}
.icon-btn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

.update{width:100%; margin-top:10px; background:var(--new); color:#fff; border-radius:16px; padding:13px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); text-align:left;}
.update svg{width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex:none;}
.update .t{flex:1; line-height:1.3;}
.update .t b{display:block; font-size:15px; font-weight:900;}
.update .t span{font-size:11px; opacity:.92; font-weight:700;}
.update .go{background:rgba(255,255,255,.22); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:900; flex:none;}

.card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:14px;}
.card + .card{margin-top:12px;}
.sec-title{font-size:13px; font-weight:900; color:var(--muted); margin:22px 2px 8px; letter-spacing:.04em;}
.sec-title:first-child{margin-top:14px;}

.chip{display:inline-block; font-size:11px; font-weight:900; border-radius:999px; padding:3px 10px; background:var(--chip); color:var(--muted);}
.chip.eng{background:var(--eng-soft); color:var(--eng);}
.chip.math{background:var(--math-soft); color:var(--math);}
.chip.jpn{background:var(--jpn-soft); color:var(--jpn);}
.chip.sci{background:var(--sci-soft); color:var(--sci);}
.chip.round{background:var(--gold-soft); color:var(--gold);}

/* ==== 今日 ==== */
.todaycard .top{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.todaycard .top b{font-size:16px; font-weight:900; flex:1; line-height:1.35;}
.todaycard .variant{font-size:11px; font-weight:700; color:var(--muted); margin:-4px 0 8px;}
.todaycard .task{background:var(--accent-soft); border-radius:14px; padding:14px; text-align:center; margin-bottom:10px;}
.todaycard .task .dayno{font-size:12px; font-weight:900; color:var(--accent); letter-spacing:.04em;}
.todaycard .task .body{font-size:26px; font-weight:900; line-height:1.35; margin-top:2px; word-break:break-word;}
.todaycard .task .body.small{font-size:20px;}
.bar{height:8px; border-radius:999px; background:var(--chip); overflow:hidden; margin:2px 0 6px;}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--accent);}
.meta{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--muted);}
.btnrow{display:flex; gap:8px; margin-top:12px;}
.btn{flex:1; border-radius:13px; padding:12px 10px; font-size:15px; font-weight:900; text-align:center; border:1px solid var(--line); background:var(--card); color:var(--ink);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.btn.small{flex:none; padding:10px 14px; font-size:13px;}
.btn.ghost{background:var(--chip); border-color:transparent; color:var(--muted); font-size:13px;}
.btn.done{background:var(--done); color:#fff; border-color:transparent;}

.empty{text-align:center; padding:26px 16px; color:var(--muted);}
.empty .big{font-size:34px;}
.empty b{display:block; font-size:16px; color:var(--ink); margin:6px 0 4px;}
.empty p{font-size:13px; line-height:1.7;}

.notice{background:var(--gold-soft); border:1px solid transparent; border-radius:16px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start;}
.notice .ic{font-size:18px; line-height:1.2;}
.notice .tx{flex:1; font-size:13px; font-weight:700; color:var(--ink); line-height:1.6;}
.notice .tx span{display:block; color:var(--muted); font-weight:500; font-size:12px; margin-top:2px;}
.notice .arrow{font-size:16px; color:var(--muted);}

/* ==== ルート ==== */
.gradehead{font-size:12px; font-weight:900; color:var(--muted); margin:12px 4px 6px; letter-spacing:.06em;}
.rowitem{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:11px 4px; border-bottom:1px solid var(--line);}
.rowitem:last-child{border-bottom:none;}
.rowitem .no{width:24px; height:24px; border-radius:8px; background:var(--chip); color:var(--muted); font-size:11px; font-weight:900; display:grid; place-items:center; flex:none;}
.rowitem .tx{flex:1; min-width:0;}
.rowitem .tx b{display:block; font-size:15px; font-weight:800; line-height:1.35;}
.rowitem .tx span{display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin-top:1px;}
.rowitem .tx em{display:block; font-style:normal; font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.5;}
.rowitem .go{font-size:15px; color:var(--muted); flex:none;}
.rowitem.plain{opacity:.72;}
.rowitem.running .tx b{color:var(--accent);}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:5px; vertical-align:middle;}

/* ==== 鉄則 ==== */
.tlist .rowitem .tx b{font-size:15px;}
.doc{font-size:14px; line-height:1.85; white-space:pre-wrap; word-break:break-word;}
.tetsu-item{display:flex; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line);}
.tetsu-item:last-child{border-bottom:none;}
.tetsu-item .tx{flex:1; font-size:14px; line-height:1.8; white-space:pre-wrap; word-break:break-word;}
.tetsu-item .tm{flex:none; font-size:11px; font-weight:900; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 9px; align-self:flex-start; white-space:nowrap;}
.tetsu-head{font-size:13px; font-weight:900; color:var(--accent); background:var(--accent-soft); border-radius:10px; padding:7px 11px; margin:12px 0 2px; white-space:pre-wrap;}
.tetsu-head:first-child{margin-top:0;}

/* ==== シート ==== */
.mask{position:fixed; inset:0; background:rgba(10,18,32,.45); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s;}
.mask.on{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--bg); border-radius:22px 22px 0 0;
  max-height:90vh; display:flex; flex-direction:column; transform:translateY(101%); transition:transform .22s cubic-bezier(.2,.7,.3,1);}
.sheet.on{transform:translateY(0);}
.sheet .grab{width:38px; height:4px; border-radius:2px; background:var(--line); margin:9px auto 4px; flex:none;}
.sheet .shead{display:flex; align-items:center; gap:10px; padding:4px 16px 10px; flex:none;}
.sheet .shead b{flex:1; font-size:17px; font-weight:900; line-height:1.35;}
.sheet .sbody{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px calc(24px + env(safe-area-inset-bottom));}
.x{width:32px; height:32px; border-radius:10px; background:var(--chip); display:grid; place-items:center; font-size:15px; font-weight:900; color:var(--muted); flex:none;}

.varrow{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
.varbtn{border:1px solid var(--line); background:var(--card); border-radius:11px; padding:9px 12px; font-size:13px; font-weight:800;}
.varbtn.on{background:var(--accent); color:var(--accent-ink); border-color:transparent;}

.roundhead{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:11px 4px; border-bottom:1px solid var(--line); font-size:14px; font-weight:900;}
.roundhead .cnt{font-size:11px; font-weight:700; color:var(--muted);}
.roundhead .sp{flex:1;}
.dayline{display:flex; gap:10px; padding:7px 6px; font-size:13.5px; border-bottom:1px dashed var(--line); align-items:baseline;}
.dayline:last-child{border-bottom:none;}
.dayline .d{width:66px; flex:none; color:var(--muted); font-weight:800; font-size:12px;}
.dayline .t{flex:1; font-weight:700;}
.dayline.now{background:var(--accent-soft); border-radius:8px; border-bottom-color:transparent;}
.dayline.now .d{color:var(--accent);}
.dayline.past{opacity:.5;}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; border-radius:12px; color:var(--muted); position:relative;}
.tabbar button.on{color:var(--accent);}
.tabbar svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.tabbar span{font-size:10.5px; font-weight:900;}
.tabbar .badge{position:absolute; top:3px; right:calc(50% - 18px); width:8px; height:8px; border-radius:50%; background:var(--new);}

.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
  background:var(--navy1); color:#fff; font-size:13.5px; font-weight:800; padding:11px 18px; border-radius:999px; z-index:80;
  opacity:0; pointer-events:none; transition:.2s; box-shadow:var(--shadow-lg); max-width:88vw; text-align:center;}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

.setrow{display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line); width:100%; text-align:left;}
.setrow:last-child{border-bottom:none;}
.setrow .tx{flex:1;}
.setrow .tx b{display:block; font-size:15px; font-weight:800;}
.setrow .tx span{display:block; font-size:12px; color:var(--muted); font-weight:600;}
.setrow .val{font-size:13px; font-weight:800; color:var(--accent);}
.link{color:var(--accent); font-weight:800; text-decoration:none;}
.lead{font-size:13px; color:var(--muted); line-height:1.75; padding:0 4px 4px;}
</style>
</head>
<body>

<div class="wrap">
  <header class="app">
    <div class="title-row">
      <h1>高校ルート</h1><span class="ver" id="verLabel"></span>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" aria-label="表示を切りかえる">
        <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </div>
    <button class="update hidden" id="updateBar">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span class="t"><b>新しい高校ルートがあります</b><span>タップすると最新にします</span></span>
      <span class="go">更新</span>
    </button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>今日</span></button>
  <button data-tab="route"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19h5a4 4 0 0 0 0-8h-3a4 4 0 0 1 0-8h5"/></svg><span>ルート</span></button>
  <button data-tab="tetsu"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8 7.5h7M8 11h5"/></svg><span>鉄則</span></button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-2.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4z"/></svg><span>設定</span></button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shead"><b id="sheetTitle"></b><button class="x" id="sheetX">✕</button></div>
  <div class="sbody" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const VER = 1;
const KEY = 'route.v1';
const SUBJ_CLASS = {'英語':'eng','数学':'math','国語':'jpn','理科':'sci'};

/* ---------- 保存データ ---------- */
let S = load();
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY) || '{}');
    return { active: o.active || {}, order: o.order || [], theme: o.theme || '' };
  }catch(e){ return { active:{}, order:[], theme:'' }; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- データ操作 ---------- */
const BOOKS = {}; ROUTE.books.forEach(b => BOOKS[b.id] = b);
function bookOf(id){ return BOOKS[id]; }
function variantOf(b, vi){ return (b.variants && b.variants.length) ? b.variants[Math.min(vi||0, b.variants.length-1)] : null; }
function totalDays(v){ return v ? v.runs.reduce((m,r)=>Math.max(m, r.b), 0) : 0; }
function entryAt(v, day){
  if(!v) return null;
  for(const r of v.runs) if(day >= r.a && day <= r.b) return r;
  return null;
}
function roundsOf(v){
  const out = [];
  for(const r of v.runs){
    const label = (r.r || '') + (r.s ? ' / ' + r.s : '');
    if(!out.length || out[out.length-1].label !== label) out.push({label, a:r.a, b:r.b, runs:[r]});
    else { const g = out[out.length-1]; g.b = Math.max(g.b, r.b); g.runs.push(r); }
  }
  return out;
}
function bookMeta(id){
  for(const s of ROUTE.plan) for(const r of s.rows) if(r.id === id) return r;
  return null;
}

/* ---------- 表示ヘルパー ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtItem(s){ return String(s).replace(/ +　+/g, '\n').replace(/　/g, ' ').replace(/\n{2,}/g,'\n').trim(); }
function fmtDoc(s){
  return String(s)
    .replace(/\s*⸻\s*/g, '\n\n────────\n\n')
    .replace(/ *• */g, '\n・')
    .replace(/ +　+/g, '\n')
    .replace(/　/g, ' ')
    .replace(/ {2,}/g, '\n\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s、]+)/g, u => '<a class="link" href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
}
function shortTitle(t){ return String(t).replace(/（[^）]*）\s*$/, '').trim(); }
function tetsuName(t){ const m = String(t).match(/^.*?】/); return (m ? m[0] : String(t)).trim(); }
function spanOf(t){ const m = String(t).match(/（([^）]*)）\s*$/); return m ? m[1] : ''; }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('on'), 1800);
}

/* ---------- 画面 ---------- */
let tab = 'today';
function render(){
  const v = document.getElementById('view');
  if(tab === 'today') v.innerHTML = viewToday();
  else if(tab === 'route') v.innerHTML = viewRoute();
  else if(tab === 'tetsu') v.innerHTML = viewTetsu();
  else v.innerHTML = viewSet();
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  window.scrollTo(0, 0);
}

/* ===== 今日 ===== */
function viewToday(){
  const ids = S.order.filter(id => BOOKS[id]);
  let h = '';
  h += '<div class="sec-title">きょう やること</div>';
  if(!ids.length){
    h += '<div class="card"><div class="empty"><div class="big">🗺️</div><b>まだ問題集をえらんでいません</b>'
      + '<p>下の「ルート」から、いま進めている問題集をえらんで<br>「これを始める」を押してください。<br>その日にやる範囲がここに出ます。</p>'
      + '<div class="btnrow" style="margin-top:14px"><button class="btn primary" onclick="go(\'route\')">ルートを見る</button></div>'
      + '</div></div>';
  }else{
    ids.forEach(id => { h += todayCard(id); });
    h += '<div class="btnrow" style="margin-top:12px"><button class="btn ghost" onclick="copyReport()">今日の進み具合をコピー（勉強報告用）</button></div>';
  }
  h += '<div class="sec-title">わすれずに</div>';
  h += '<button class="notice" style="width:100%;text-align:left" onclick="openTetsu(\'overall\')">'
    + '<span class="ic">⚡️</span><span class="tx">全体鉄則【１０則】<span>すべての問題集に共通する、いちばん大事なルールです</span></span><span class="arrow">›</span></button>';
  return h;
}

function todayCard(id){
  const b = bookOf(id), st = S.active[id];
  const v = variantOf(b, st.v), tot = totalDays(v);
  const cls = SUBJ_CLASS[b.subject] || '';
  let h = '<div class="card todaycard">';
  h += '<div class="top"><span class="chip '+cls+'">'+esc(b.subject)+'</span><b>'+esc(shortTitle(b.title))+'</b></div>';
  if(b.variants.length > 1) h += '<div class="variant">'+esc(v.name)+'</div>';

  if(!v){
    h += '<div class="lead">この教材に日ごとの計画表はありません。鉄則にそって進めてください。</div>';
    h += '<div class="btnrow"><button class="btn" onclick="openTetsu(\''+b.tetsoku+'\')">鉄則を見る</button>'
      + '<button class="btn ghost small" onclick="stop(\''+id+'\')">はずす</button></div></div>';
    return h;
  }
  if(st.day > tot){
    h += '<div class="task" style="background:var(--done-soft)"><div class="dayno" style="color:var(--done)">ぜんぶ終わりました</div>'
      + '<div class="body">🎉 完走</div></div>';
    h += '<div class="meta"><span>全'+tot+'日</span><span>100%</span></div>';
    h += '<div class="btnrow"><button class="btn" onclick="back(\''+id+'\')">1日もどす</button>'
      + '<button class="btn done" onclick="stop(\''+id+'\')">今日からはずす</button></div></div>';
    return h;
  }
  const e = entryAt(v, st.day);
  const body = e ? e.t : '—';
  h += '<div class="task"><div class="dayno">'+st.day+'日目'+(e && e.r ? '　'+esc(e.r) : '')+(e && e.s ? '　'+esc(e.s) : '')+'</div>'
    + '<div class="body'+(body.length > 12 ? ' small' : '')+'">'+esc(body)+'</div></div>';
  const pct = Math.round((st.day - 1) / tot * 100);
  h += '<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="meta"><span class="num">'+st.day+' / '+tot+'日</span><span class="num">'+pct+'%</span></div>';
  h += '<div class="btnrow"><button class="btn primary" onclick="next(\''+id+'\')">できた ✓</button>'
    + '<button class="btn small" onclick="back(\''+id+'\')">もどす</button>'
    + '<button class="btn small" onclick="openBook(\''+id+'\')">計画表</button></div>';
  h += '<div class="btnrow" style="margin-top:8px"><button class="btn ghost" onclick="openTetsu(\''+b.tetsoku+'\')">'+esc(ROUTE.tetsoku[b.tetsoku] ? tetsuName(ROUTE.tetsoku[b.tetsoku].title) : '鉄則')+' を見る</button></div>';
  h += '</div>';
  return h;
}

function next(id){
  const b = bookOf(id), st = S.active[id], v = variantOf(b, st.v);
  const tot = totalDays(v);
  if(st.day <= tot){ st.day++; save(); render();
    toast(st.day > tot ? '完走です！おつかれさま 🎉' : (st.day) + '日目にすすみました'); }
}
function back(id){
  const st = S.active[id];
  if(st.day > 1){ st.day--; save(); render(); toast(st.day + '日目にもどしました'); }
  else toast('1日目です');
}
function stop(id){
  delete S.active[id]; S.order = S.order.filter(x => x !== id); save(); render(); toast('今日タブからはずしました');
}
function start(id, vi){
  if(!S.active[id]){ S.order.push(id); S.active[id] = { v: vi||0, day: 1 }; }
  else S.active[id].v = vi || 0;
  save(); closeSheet(); go('today'); toast('今日タブに追加しました');
}
function setDay(id, d){
  const b = bookOf(id); if(!S.active[id]) return;
  S.active[id].day = d; save(); renderSheetBook(id); render(); toast(d + '日目にしました');
}

function copyReport(){
  const lines = ['【今の進み具合】'];
  S.order.forEach(id => {
    const b = bookOf(id), st = S.active[id], v = variantOf(b, st.v);
    if(!v){ lines.push('・'+b.subject+'／'+shortTitle(b.title)); return; }
    const tot = totalDays(v), e = entryAt(v, Math.min(st.day, tot));
    const pct = Math.round((st.day - 1) / tot * 100);
    lines.push('・'+b.subject+'／'+shortTitle(b.title)+(b.variants.length>1 ? '（'+v.name+'）' : ''));
    lines.push('　'+st.day+'日目 / 全'+tot+'日（'+pct+'%）'+(e && e.r ? '　'+e.r : '') + (e ? '　'+e.t : ''));
  });
  lines.push('', '①今どこまで進んでいるか？', '②鉄則通りにできているか？', '③今の課題は何か？ではどうするか？');
  const txt = lines.join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('コピーしました'), ()=>fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーできませんでした'); }
  document.body.removeChild(ta);
}

/* ===== ルート ===== */
function viewRoute(){
  let h = '<div class="lead" style="margin-top:14px">高校ルートの全体計画です。問題集をタップすると、日ごとの計画表と鉄則が見られます。<br>いま進めているものは「これを始める」を押すと今日タブに出ます。</div>';
  ROUTE.plan.forEach(sec => {
    const cls = SUBJ_CLASS[sec.subject] || '';
    h += '<div class="sec-title"><span class="chip '+cls+'">'+esc(sec.subject)+'</span></div>';
    h += '<div class="card">';
    let grade = null;
    sec.rows.forEach((r, i) => {
      if(r.grade && r.grade !== grade){ grade = r.grade; h += '<div class="gradehead">▼ '+esc(grade)+'</div>'; }
      h += planRow(r, i);
    });
    h += '</div>';
  });
  h += '<div class="sec-title">そのほかの計画表</div>';
  h += '<div class="lead">全体計画には出ていませんが、スプレッドシートに計画表があるものです。</div><div class="card">';
  ['nyumon_ia','nyumon_iib','kichart_ia','kichart_iib'].forEach(id => {
    const b = bookOf(id); if(!b) return;
    h += '<button class="rowitem'+(S.active[id]?' running':'')+'" onclick="openBook(\''+id+'\')">'
      + '<span class="no">'+(SUBJ_CLASS[b.subject]==='math'?'数':'')+'</span>'
      + '<span class="tx"><b>'+(S.active[id]?'<span class="dot"></span>':'')+esc(shortTitle(b.title))+'</b>'
      + '<span>'+esc(spanOf(b.title))+'</span></span><span class="go">›</span></button>';
  });
  h += '</div>';
  return h;
}
function planRow(r, i){
  const b = r.id ? bookOf(r.id) : null;
  const memo = (r.memo || []).filter(x => x && x !== r.name).join('　/　');
  const sub = [r.month, r.span, r.rounds].filter(x => x && x !== 'ー').join('　・　');
  if(!b){
    return '<div class="rowitem plain"><span class="no">–</span><span class="tx"><b>'+esc(r.name)+'</b>'
      + (sub ? '<span>'+esc(sub)+'</span>' : '') + (memo ? '<em>'+esc(memo)+'</em>' : '') + '</span></div>';
  }
  return '<button class="rowitem'+(S.active[r.id]?' running':'')+'" onclick="openBook(\''+r.id+'\')">'
    + '<span class="no">'+(i+1)+'</span>'
    + '<span class="tx"><b>'+(S.active[r.id]?'<span class="dot"></span>':'')+esc(r.name)+'</b>'
    + (sub ? '<span>'+esc(sub)+'</span>' : '') + (memo ? '<em>'+esc(memo)+'</em>' : '') + '</span>'
    + '<span class="go">›</span></button>';
}

/* ===== 鉄則 ===== */
const TETSU_ORDER = [
  ['overall','すべての人が守るもの'],
  ['stock','英語'],['rank','英語'],['polaris','英語'],['dokkai','英語・国語'],
  ['kisomon','数学'],['kichart','数学'],['uchuichi','理科']
];
function viewTetsu(){
  let h = '<div class="lead" style="margin-top:14px">問題集ごとの「正しいやり方」です。ここからズレると、極まらない＝伸びなくなります。</div>';
  h += '<div class="sec-title">いちばん大事</div>';
  h += '<button class="notice" style="width:100%;text-align:left" onclick="openTetsu(\'overall\')">'
    + '<span class="ic">⚡️</span><span class="tx">'+esc(ROUTE.tetsoku.overall.title)+'<span>まずはこれを読んでください</span></span><span class="arrow">›</span></button>';
  h += '<div class="sec-title">問題集ごとの鉄則</div><div class="card tlist">';
  TETSU_ORDER.slice(1).forEach(([k, subj]) => {
    const t = ROUTE.tetsoku[k]; if(!t) return;
    h += '<button class="rowitem" onclick="openTetsu(\''+k+'\')"><span class="no">'+esc(subj[0])+'</span>'
      + '<span class="tx"><b>'+esc(tetsuName(t.title))+'</b><span>'+esc(subj)+'</span></span><span class="go">›</span></button>';
  });
  h += '</div>';
  h += '<div class="sec-title">つまずいたときの道具</div><div class="card tlist">';
  h += '<button class="rowitem" onclick="openDoc(\'prompt\')"><span class="no">数</span>'
    + '<span class="tx"><b>数学の【最強プロンプト】</b><span>解説を読んでもわからないときにAIへ投げる文</span></span><span class="go">›</span></button>';
  h += '<button class="rowitem" onclick="openDoc(\'pro\')"><span class="no">国</span>'
    + '<span class="tx"><b>プロの思考（国語読解の鉄則）</b><span>『システム中学国語 論理入門編』より</span></span><span class="go">›</span></button>';
  h += '</div>';
  return h;
}

/* ===== 設定 ===== */
function viewSet(){
  const th = S.theme === 'dark' ? 'ダーク' : S.theme === 'light' ? 'ライト' : '端末に合わせる';
  let h = '<div class="sec-title">設定</div><div class="card">';
  h += '<button class="setrow" onclick="cycleTheme()"><span class="tx"><b>見た目</b><span>明るさの切りかえ</span></span><span class="val">'+th+'</span></button>';
  h += '<button class="setrow" onclick="checkUpdate(true)"><span class="tx"><b>更新があるか調べる</b><span>いまのバージョン v'+VER+'</span></span><span class="val">調べる</span></button>';
  h += '<a class="setrow" href="https://docs.google.com/spreadsheets/d/17o7_aitaIZ9ufh5w5Ox7gxaqnwveaHVix4uHpL7BjmI/edit" target="_blank" rel="noopener" style="text-decoration:none"><span class="tx"><b>元のスプレッドシート</b><span>写真や図はこちらで見られます</span></span><span class="val">開く</span></a>';
  h += '<button class="setrow" onclick="resetAll()"><span class="tx"><b>進み具合をぜんぶ消す</b><span>えらんだ問題集と日数をリセットします</span></span><span class="val" style="color:var(--red)">消す</span></button>';
  h += '</div>';
  h += '<div class="sec-title">この アプリについて</div><div class="card"><div class="lead" style="padding:0">'
    + '高校ルート（全体計画・日ごとの計画表・鉄則）をそのままアプリにしたものです。<br>'
    + '進み具合はこの端末の中だけに保存されます。<br><br>'
    + '計画がうまくいかなくなったときは、すぐに修正するか、必ず相談してください。（全体鉄則③）</div></div>';
  return h;
}
function cycleTheme(){
  S.theme = S.theme === '' ? 'light' : S.theme === 'light' ? 'dark' : '';
  save(); applyTheme(); render();
}
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute('data-theme', S.theme);
  else document.documentElement.removeAttribute('data-theme');
}
function resetAll(){
  if(!confirm('えらんだ問題集と進み具合をぜんぶ消します。よろしいですか？')) return;
  S.active = {}; S.order = []; save(); render(); toast('消しました');
}

/* ===== シート ===== */
function openSheet(title, body){
  document.getElementById('sheetTitle').innerHTML = title;
  document.getElementById('sheetBody').innerHTML = body;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheetBody').scrollTop = 0;
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('mask').classList.remove('on');
}
function openBook(id){ renderSheetBook(id); document.getElementById('sheet').classList.add('on'); document.getElementById('mask').classList.add('on'); }

let sheetVar = {};
function renderSheetBook(id){
  const b = bookOf(id), meta = bookMeta(id);
  const vi = (S.active[id] ? S.active[id].v : (sheetVar[id] || 0));
  const v = variantOf(b, vi), tot = totalDays(v);
  const cls = SUBJ_CLASS[b.subject] || '';
  let h = '';
  h += '<div class="card" style="margin-bottom:12px">';
  h += '<div style="margin-bottom:8px"><span class="chip '+cls+'">'+esc(b.subject)+'</span>'
     + (spanOf(b.title) ? ' <span class="chip">'+esc(spanOf(b.title))+'</span>' : '')
     + (meta && meta.rounds && meta.rounds !== 'ー' ? ' <span class="chip round">'+esc(meta.rounds)+'</span>' : '') + '</div>';
  if(meta && meta.month && meta.month !== 'ー') h += '<div class="lead" style="padding:0 0 4px">やる時期：'+esc(meta.month)+(meta.grade?'（'+esc(meta.grade)+'）':'')+'</div>';
  if(meta && (meta.memo||[]).length) h += '<div class="lead" style="padding:0 0 4px">'+esc((meta.memo||[]).join('　/　'))+'</div>';
  (b.notes || []).forEach(n => { h += '<div class="notice" style="margin-top:8px"><span class="ic">📌</span><span class="tx">'+esc(fmtItem(n))+'</span></div>'; });
  if(b.variants.length > 1){
    h += '<div class="varrow" style="margin-top:12px">';
    b.variants.forEach((vv, i) => { h += '<button class="varbtn'+(i===vi?' on':'')+'" onclick="pickVar(\''+id+'\','+i+')">'+esc(vv.name)+'</button>'; });
    h += '</div>';
  }
  if(v){
    if(S.active[id]){
      const st = S.active[id];
      const pct = Math.round((st.day - 1) / tot * 100);
      h += '<div class="bar" style="margin-top:12px"><i style="width:'+pct+'%"></i></div>';
      h += '<div class="meta"><span class="num">いま '+st.day+'日目 / 全'+tot+'日</span><span class="num">'+pct+'%</span></div>';
      h += '<div class="btnrow"><button class="btn ghost" onclick="stop(\''+id+'\');closeSheet()">今日タブからはずす</button></div>';
    }else{
      h += '<div class="lead" style="padding:8px 0 0">全'+tot+'日の計画です。</div>';
      h += '<div class="btnrow"><button class="btn primary" onclick="start(\''+id+'\','+vi+')">これを始める</button></div>';
    }
  }else{
    h += '<div class="btnrow">' + (S.active[id]
      ? '<button class="btn ghost" onclick="stop(\''+id+'\');closeSheet()">今日タブからはずす</button>'
      : '<button class="btn primary" onclick="start(\''+id+'\',0)">今日タブに入れておく</button>') + '</div>';
  }
  h += '<div class="btnrow" style="margin-top:8px"><button class="btn" onclick="openTetsu(\''+b.tetsoku+'\')">'
    + esc(ROUTE.tetsoku[b.tetsoku] ? tetsuName(ROUTE.tetsoku[b.tetsoku].title) : '鉄則') + ' を見る</button></div>';
  h += '</div>';

  if(v){
    h += '<div class="sec-title" style="margin-top:6px">日ごとの計画表</div>';
    h += '<div class="lead">日づけではなく「1日目、2日目…」で進みます。できない日があってもズレません。'
      + (S.active[id] ? '<br>日をタップすると、その日にジャンプできます。' : '') + '</div>';
    const groups = roundsOf(v);
    const cur = S.active[id] ? S.active[id].day : 0;
    h += '<div class="card">';
    groups.forEach((g, gi) => {
      const open = (cur >= g.a && cur <= g.b) || (!cur && gi === 0);
      h += '<button class="roundhead" onclick="tg(this)"><span>'+esc(g.label || '計画')+'</span><span class="sp"></span>'
        + '<span class="cnt num">'+g.a+'〜'+g.b+'日目</span><span class="go" style="margin-left:8px">'+(open?'▾':'▸')+'</span></button>';
      h += '<div class="rgroup'+(open?'':' hidden')+'">';
      g.runs.forEach(r => {
        for(let d = r.a; d <= r.b; d++){
          const c = d === cur ? ' now' : (cur && d < cur ? ' past' : '');
          h += '<div class="dayline'+c+'"'+(S.active[id]?' onclick="setDay(\''+id+'\','+d+')"':'')+'>'
            + '<span class="d num">'+d+'日目</span><span class="t">'+esc(r.t)+'</span></div>';
        }
      });
      h += '</div>';
    });
    h += '</div>';
  }
  document.getElementById('sheetTitle').innerHTML = esc(shortTitle(b.title));
  document.getElementById('sheetBody').innerHTML = h;
  document.getElementById('sheetBody').scrollTop = 0;
}
function pickVar(id, i){
  if(S.active[id]){ S.active[id].v = i; S.active[id].day = 1; save(); render(); }
  else sheetVar[id] = i;
  renderSheetBook(id);
}
function tg(btn){
  const g = btn.nextElementSibling; const open = g.classList.toggle('hidden');
  btn.querySelector('.go').textContent = open ? '▸' : '▾';
}

function openTetsu(key){
  const t = ROUTE.tetsoku[key];
  if(!t){ toast('鉄則がありません'); return; }
  let h = '<div class="card">';
  t.items.forEach(it => {
    const s = fmtItem(it.t);
    if(/^[↓▼]/.test(s)){ h += '<div class="tetsu-head">'+esc(s.replace(/^[↓▼]\s*/, ''))+'</div>'; return; }
    h += '<div class="tetsu-item"><span class="tx">'+linkify(s)+'</span>'
      + (it.time ? '<span class="tm">'+esc(it.time.replace(/\s+/g,' '))+'</span>' : '') + '</div>';
  });
  h += '</div>';
  openSheet(esc(tetsuName(t.title)), h);
}
function openDoc(which){
  if(which === 'prompt'){
    const raw = ROUTE.extra.prompt;
    let h = '<div class="lead">解説を読んでもわからない問題は、問題と解説の写真をつけて、この文をAIに送ってください。</div>';
    h += '<div class="card"><div class="doc">'+linkify(fmtDoc(raw))+'</div>'
      + '<div class="btnrow"><button class="btn primary" onclick="copyText(ROUTE.extra.prompt)">この文をコピー</button></div></div>';
    openSheet('数学の【最強プロンプト】', h);
  }else{
    let h = '<div class="card"><div class="doc">'+linkify(fmtDoc(ROUTE.extra.pro_shikou))+'</div></div>';
    h += '<div class="sec-title">もとになったメモ</div>';
    h += '<div class="card"><div class="doc" style="color:var(--muted);font-size:13px">'+linkify(fmtDoc(ROUTE.extra.pro_shikou_src))+'</div></div>';
    openSheet('プロの思考（国語読解の鉄則）', h);
  }
}
function copyText(t){
  const s = fmtDoc(t);
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(()=>toast('コピーしました'), ()=>fallbackCopy(s));
  else fallbackCopy(s);
}

/* ---------- 更新チェック ---------- */
async function checkUpdate(manual){
  try{
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    const j = await r.json();
    if(j.v > VER){
      document.getElementById('updateBar').classList.remove('hidden');
      if(manual) toast('新しいバージョンがあります');
    }else if(manual) toast('いまのが最新です（v' + VER + '）');
  }catch(e){ if(manual) toast('調べられませんでした'); }
}
async function doUpdate(){
  try{
    if(navigator.serviceWorker){
      const rs = await navigator.serviceWorker.getRegistrations();
      for(const r of rs) await r.unregister();
    }
    if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); }
  }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
}

/* ---------- 起動 ---------- */
function go(t){ tab = t; render(); }
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if(b) go(b.dataset.tab);
});
document.getElementById('themeBtn').addEventListener('click', cycleTheme);
document.getElementById('mask').addEventListener('click', closeSheet);
document.getElementById('sheetX').addEventListener('click', closeSheet);
document.getElementById('updateBar').addEventListener('click', doUpdate);
document.getElementById('verLabel').textContent = 'v' + VER;
applyTheme();
render();
checkUpdate(false);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(false); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
