<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="../common/users.js?v=1" data-app="wake"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヒラボイス</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF6EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#2A2118; --muted:#6B5E50; --line:#EADFCF;
  --accent:#E8742A; --accent-soft:#FDEBDD; --accent-ink:#FFFFFF;
  --sun:#F2B33D; --ok:#2E9E6A; --ok-soft:#E2F4EA; --ng:#D9534A; --ng-soft:#FBE7E5;
  --chip:#F3ECE1; --shadow:0 1px 3px rgba(60,40,20,.08); --shadow-lg:0 8px 24px rgba(60,40,20,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130F; --card:#221C16; --ink:#F3EADF; --muted:#B3A595; --line:#3A3027;
    --accent:#F2934F; --accent-soft:#3D2A1C; --accent-ink:#1A120C;
    --sun:#F4C35E; --ok:#5CCB95; --ok-soft:#1D3528; --ng:#F08A80; --ng-soft:#3E2523;
    --chip:#2D251E; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink); }
body{ font-family:'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-weight:500; line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height:100vh; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
header{ display:flex; align-items:center; gap:8px; padding:14px 16px 6px; max-width:560px; margin:0 auto; }
header h1{ font-size:20px; font-weight:900; margin:0; flex:1; display:flex; align-items:center; gap:8px; }
header h1 small{ font-size:12px; color:var(--muted); font-weight:500; }
header h1 .logo{ width:28px; height:28px; border-radius:8px; }
main{ max-width:560px; margin:0 auto; padding:6px 16px 40px; }
.card{ background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin:12px 0; }
.card h2{ font-size:16px; margin:0 0 10px; font-weight:900; }
.muted{ color:var(--muted); font-size:13px; }
.big{ display:block; width:100%; padding:18px; border-radius:16px; background:var(--accent); color:var(--accent-ink);
  font-size:19px; font-weight:900; box-shadow:var(--shadow-lg); }
.sub{ display:block; width:100%; padding:13px; border-radius:14px; background:var(--chip); font-weight:700; margin-top:10px; }
.seg{ display:flex; gap:6px; background:var(--chip); padding:4px; border-radius:14px; }
.seg button{ flex:1; padding:10px 4px; border-radius:11px; font-weight:700; color:var(--muted); }
.seg button.on{ background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
.promise{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.promise div{ background:var(--accent-soft); border-radius:14px; padding:10px 4px; }
.promise b{ display:block; font-size:20px; font-weight:900; }
.promise span{ font-size:12px; color:var(--muted); }
.hist{ width:100%; border-collapse:collapse; font-size:14px; }
.hist td{ padding:7px 4px; border-top:1px solid var(--line); }
.tag{ display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; background:var(--chip); }
.tag.ok{ background:var(--ok-soft); color:var(--ok); } .tag.ng{ background:var(--ng-soft); color:var(--ng); }
ol.steps{ padding-left:22px; margin:6px 0; } ol.steps li{ margin:6px 0; }
.url{ display:flex; gap:8px; align-items:center; background:var(--chip); border-radius:12px; padding:8px 10px; font-size:13px; word-break:break-all; }
.url button{ flex:none; background:var(--accent); color:var(--accent-ink); border-radius:10px; padding:6px 12px; font-weight:700; }
details{ margin-top:8px; } summary{ font-weight:700; cursor:pointer; }

/* 朝の会話（全画面） */
#talk{ position:fixed; inset:0; background:var(--bg); z-index:50; display:none; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); overflow-y:auto; }
#talk.on{ display:flex; }
#talk .top{ display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:14px; max-width:560px; width:100%; margin:0 auto; }
#talk .stage{ flex:1; display:flex; flex-direction:column; justify-content:center; max-width:560px; width:100%; margin:0 auto; }
.clock{ text-align:center; font-size:64px; font-weight:900; letter-spacing:.02em; line-height:1.1; }
.date{ text-align:center; color:var(--muted); margin-bottom:28px; }
.sunbtn{ display:block; margin:0 auto; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #FFD27A, var(--sun) 60%, var(--accent));
  color:#2A1A08; font-size:30px; font-weight:900; box-shadow:0 10px 40px rgba(232,116,42,.45); animation:pulse 2.2s ease-in-out infinite; }
@keyframes pulse{ 50%{ transform:scale(1.05); } }
.who{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.who img{ width:44px; height:44px; border-radius:50%; background:var(--chip); }
.who b{ font-weight:900; }
.bubble{ background:var(--card); border-radius:4px 20px 20px 20px; padding:16px 18px; font-size:21px; font-weight:700; box-shadow:var(--shadow-lg); min-height:66px; }
.bubble.speaking{ outline:3px solid var(--accent-soft); }
.hint{ margin:12px 0 0; padding:10px 12px; border-radius:12px; background:var(--accent-soft); font-size:14px; }
.choices{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px; }
.choices.two{ grid-template-columns:1fr 1fr; } .choices.four{ grid-template-columns:repeat(4,1fr); }
.choices button{ background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px 2px; font-size:clamp(14px, 4.2vw, 17px); font-weight:900; white-space:nowrap; }
.choices button:active{ background:var(--accent-soft); border-color:var(--accent); }
.choices button.wide{ grid-column:1/-1; background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.dots{ display:flex; gap:6px; justify-content:center; margin-top:18px; }
.dots i{ width:8px; height:8px; border-radius:50%; background:var(--line); } .dots i.on{ background:var(--accent); }
.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:99; }
.toast.on{ opacity:1; }
header .help{ width:34px; height:34px; border-radius:50%; background:var(--chip); font-weight:900; font-size:17px; flex:none; }
.listen{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.listen button[data-g="H"]{ background:#3A0F0C; color:#FFB199; }
.big.dark, .choices button.wide.dark{ background:#1B1712; color:#F1DDA4; border-color:#1B1712; }
.goalcard{ background:linear-gradient(160deg,#1E1913,#0E0D0C); color:#F3EADF; border:1px solid rgba(224,192,106,.4); border-radius:16px; padding:14px 16px; margin-top:14px; }
.goalcard span{ display:block; font-size:12px; letter-spacing:.15em; color:#E0C06A; }
.goalcard b{ display:block; font-size:21px; font-weight:900; margin-top:4px; line-height:1.5; }
textarea#goalIn{ width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); resize:vertical; }
.sunbtn.eve{ background:radial-gradient(circle at 40% 35%, #FFC99A, #F08A4B 60%, #B4502A); }
.choices.two button.wide + button.wide{ margin-top:0; }
.row{ display:flex; gap:8px; } .row > *{ flex:1; margin-top:0 !important; }
.sub.ok{ background:var(--accent); color:var(--accent-ink); }
#hsBox .hs-code{ margin-top:4px; } #hsBox p.muted{ margin:10px 0 0; } #hsBox .big + .sub, #hsBox .sub + .sub{ margin-top:10px; }
.cd{ text-align:center; background:var(--accent-soft); border-radius:16px; padding:10px 12px; margin:14px 0 0; }
.cd span{ display:block; font-size:14px; color:var(--muted); font-weight:700; }
.cd b{ display:block; font-size:22px; font-weight:900; color:var(--ink); } .cd b em{ font-style:normal; font-size:40px; color:var(--accent); margin:0 4px; }
.cd small{ display:block; font-size:12px; color:var(--muted); }
.cd.big{ margin:0 0 4px; padding:14px; } .cd.big b em{ font-size:56px; }
.date + .cd.big{ margin:0 0 24px; }
.cdform{ display:flex; gap:8px; } .cdform input{ flex:1; min-width:0; font:inherit; font-size:16px; padding:10px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); }
.wk{ display:flex; align-items:center; gap:14px; }
.wkn b{ font-size:44px; font-weight:900; color:var(--ok); } .wkn span{ font-size:18px; font-weight:900; color:var(--muted); margin-left:2px; }
.wkd{ display:flex; gap:6px; flex:1; justify-content:space-between; }
.wkd i{ font-style:normal; font-size:11px; color:var(--muted); text-align:center; }
.wkd i u{ display:block; width:24px; height:24px; border-radius:50%; background:var(--chip); margin:0 auto 3px; }
.wkd i.ok u{ background:var(--ok); } .wkd i.half u{ background:#E8B93A; } .wkd i.ng u{ background:var(--ng); }
.shot{ display:block; width:100%; border-radius:12px; box-shadow:var(--shadow-lg); }
.chk{ display:flex; align-items:center; gap:8px; font-size:14px; padding:12px 2px 0; }
.chk input{ width:20px; height:20px; }
#printBox{ display:none; }
@media print{
  body > *:not(#printBox){ display:none !important; }
  #printBox{ display:block !important; } #printBox img{ width:100%; max-width:170mm; display:block; margin:0 auto; }
  body{ background:#fff !important; padding:0; }
}
.listen button{ padding:16px 6px; border-radius:16px; background:#1B1712; color:#F1DDA4; box-shadow:var(--shadow-lg); }
.listen button{ padding:12px 4px; } .listen button b{ display:block; font-size:19px; font-weight:900; white-space:nowrap; } .listen button span{ display:block; font-size:12px; opacity:.85; }
.listen button[data-g="G"]{ background:var(--accent); color:var(--accent-ink); }
.listen button:active{ transform:scale(.97); }
.said{ margin-top:10px; font-size:14px; color:var(--muted); min-height:24px; }
.said.on{ color:var(--ink); font-size:17px; font-weight:700; }
/* 更新があるときの帯（計画マップ・解き直しマップと同じ） */
.updwrap{ max-width:560px; margin:0 auto; padding:0 16px; }
.update{ width:100%; margin-top:6px; background:#E9640F; color:#fff; border-radius:16px; padding:13px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg); text-align:left; }
.update.hidden{ display:none; }
.update svg{ width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.update .t{ flex:1; line-height:1.3; } .update .t b{ display:block; font-size:15px; font-weight:900; } .update .t span{ font-size:11px; opacity:.9; font-weight:700; }
.update .go{ background:rgba(255,255,255,.22); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:900; flex:none; }
/* 使い方スライド */
.sheet-bg{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:80; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ background:var(--bg); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:14px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:92vh; overflow-y:auto; }
.sheet h2{ font-size:18px; font-weight:900; margin:4px 0 12px; text-align:center; }
.sl-track{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
.sl-track::-webkit-scrollbar{ display:none; }
.sl{ flex:0 0 100%; scroll-snap-align:start; background:linear-gradient(160deg,#1E1913,#0E0D0C); color:#F3EADF; border:1px solid rgba(224,192,106,.4); border-radius:18px; padding:18px; min-height:330px; }
.sl .no{ font-size:12px; letter-spacing:.2em; color:#E0C06A; }
.sl .pic{ font-size:40px; margin:10px 0 6px; }
.sl h4{ font-size:19px; margin:0 0 8px; font-weight:900; color:#F1DDA4; }
.sl p{ margin:0; font-size:15px; line-height:1.75; } .sl p b{ color:#F1DDA4; }
.sl .ex{ margin-top:12px; padding-top:10px; border-top:1px solid rgba(224,192,106,.22); font-size:13px; color:#B9AE9E; }
.sl-nav{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
.sl-nav button{ width:44px; height:44px; border-radius:50%; background:var(--chip); font-size:20px; font-weight:900; }
.sl-nav .dots{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; } .sl-nav .dots i{ width:7px; height:7px; border-radius:50%; background:var(--line); } .sl-nav .dots i.on{ background:var(--accent); }
.sheet .close{ display:block; width:100%; margin-top:12px; padding:14px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-weight:900; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1><img class="logo" src="icon-192.png" alt="">ヒラボイス <small id="ver"></small></h1>
  <button data-users-tag hidden></button>
  <button class="help" id="btnHelp" aria-label="使い方">?</button>
</header>
<div class="updwrap"><button class="update hidden" id="btnUpdate">
  <svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 19h14"/></svg>
  <span class="t"><b>更新があります</b><span id="updVer"></span></span>
  <span class="go">更新する</span>
</button></div>
<main id="home"></main>

<div id="talk">
  <div class="top"><span id="tStep"></span><button id="tClose">とじる ✕</button></div>
  <div class="stage" id="stage"></div>
</div>
<div class="toast" id="toast"></div>
<div id="printBox"></div>
<audio id="au" playsinline preload="auto"></audio>

<script src="lines.js?v=12"></script>
<script>
/* HSYNC BEGIN ─────────────────────────────────────────────
   同期（iPad・スマホ・パソコンで同じにする）。ヒラボイス v12（2026-10-25 ユウキ・ハルネコ「iPadでも使いたい」）。
   ※ 理科の一問一答の HSYNC をそのまま持ってきたもの（もとは高校ルート）。高校ルートとの違いは3つ：
     ① C.mergeKey … 1つのまとまりのキーでも、2台の中身を合わせられる（理科は問題ごとに合わせる）
     ② カードの最中に届いた記録は、終わってから「合わせて」入れる（とちゅうの記録を消さない）
     ③ 受けとって読みなおす間に、アプリが古い中身を書きもどさないようにする

   預け先は計画マップと同じ Google Apps Script（plan/gas/Sync.gs）。サーバー側は変えていない。
   ・同期コードは全アプリで1つ。計画マップのコードをそのまま入れればよい。
   ・サーバーには、そのコードから作った「アプリごとのコード」で預ける（アプリどうしが上書きし合わない）。
   ・預けるのは config.keys の localStorage だけ。写真（IndexedDB）や端末ごとの設定は預けない。
   ・lists に書いたキーは「id ごとに足し合わせる」。2台で別々に書いても、どちらも残る。
     消したものは「消したしるし（tomb）」で相手にも伝える。それ以外のキーは新しいほうが勝つ。
   ─────────────────────────────────────────────────────────── */
const HSync = (function(){
  const URL = 'https://script.google.com/macros/s/AKfycbztk0Zk4YnnAjKcOgsVU690-gAn_FfN5xGILx5u_YUj6syG5xk80sV6Biqa1WOce-uQ/exec';
  const SECRET = 'hiramap-2026';
  const CH = 'abcdefghjkmnpqrstuvwxyz23456789';      // 0/o/1/l/i は使わない（計画マップと同じ）
  const TOMB_DAYS = 90;

  let C = null;                 // 設定（init で受けとる）
  let M = null;                 // この端末の同期の記録 { code, mt, at, dirty, err }
  let T = {};                   // 消したしるし { key: { id: 時刻 } }
  let applying = false, reloading = false, busy = false, seq = 0, timer = null, pending = null;
  const ls = window.localStorage;
  const _set = Storage.prototype.setItem, _get = Storage.prototype.getItem, _rm = Storage.prototype.removeItem;

  /* ---------- 小道具 ---------- */
  const now = () => Date.now();
  const metaKey = () => 'hs.' + C.app, tombKey = () => 'hs.' + C.app + '.tomb';
  function loadMeta(){
    try{ M = JSON.parse(_get.call(ls, metaKey()) || 'null') || {}; }catch(e){ M = {}; }
    try{ T = JSON.parse(_get.call(ls, tombKey()) || 'null') || {}; }catch(e){ T = {}; }
  }
  function saveMeta(){ try{ _set.call(ls, metaKey(), JSON.stringify(M)); _set.call(ls, tombKey(), JSON.stringify(T)); }catch(e){} }
  function norm(v){
    const a = String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    return a.length === 8 ? a.slice(0, 4) + '-' + a.slice(4) : '';
  }
  /* コード X から、このアプリ用のコードを作る（どの端末でも同じになる） */
  function h32(s, seed){ let h = seed >>> 0; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function derive(master){
    let a = h32(master + '|' + C.app, 2166136261), b = h32(C.app + '|' + master, 0x9747b28c), s = '';
    for(let i = 0; i < 8; i++){
      if(i === 4) s += '-';
      if(i < 4){ s += CH[a % 31]; a = Math.floor(a / 31); } else { s += CH[b % 31]; b = Math.floor(b / 31); }
    }
    return s;
  }
  async function call(p){
    const r = await fetch(URL, { method:'POST', body: JSON.stringify(Object.assign({ secret:SECRET }, p)) });
    return r.json();
  }
  const say = (m) => { try{ C.toast && C.toast(m); }catch(e){} };
  /* 入力と確認。C.ask / C.yes があればアプリの画面で聞く（iPhoneのホーム画面アプリでは prompt/confirm が出ないことがあるため） */
  const ask = (msg) => C.ask ? C.ask(msg) : Promise.resolve(prompt(msg));
  const yes = (msg) => C.yes ? C.yes(msg) : Promise.resolve(confirm(msg));
  const fmt = (t) => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  /* ---------- 中身の出し入れ ---------- */
  function collect(){
    const keys = {};
    C.keys.forEach(k => { const v = _get.call(ls, k); if(v !== null) keys[k] = v; });
    pruneTomb();
    return { app: C.app, v: 1, keys, tomb: T };
  }
  function hasLocal(){ return C.hasData ? !!C.hasData() : C.keys.some(k => _get.call(ls, k) !== null); }
  function pruneTomb(){
    const lim = now() - TOMB_DAYS * 864e5;
    Object.keys(T).forEach(k => { Object.keys(T[k] || {}).forEach(id => { if(T[k][id] < lim) delete T[k][id]; }); });
  }
  const idOf = (spec, x) => (x && x[spec.id] !== undefined) ? String(x[spec.id]) : null;

  /* 消したものを覚える（lists のキーだけ） */
  function tombDiff(k, oldRaw, newRaw){
    const spec = C.lists && C.lists[k]; if(!spec) return;
    let a = [], b = [];
    try{ a = JSON.parse(oldRaw || '[]') || []; }catch(e){}
    try{ b = JSON.parse(newRaw || '[]') || []; }catch(e){}
    if(!Array.isArray(a) || !Array.isArray(b)) return;
    const keep = {}; b.forEach(x => { const id = idOf(spec, x); if(id) keep[id] = 1; });
    a.forEach(x => { const id = idOf(spec, x); if(id && !keep[id]){ (T[k] = T[k] || {})[id] = now(); } });
    b.forEach(x => { const id = idOf(spec, x); if(id && T[k] && T[k][id]) delete T[k][id]; });   // 戻したものは消さない
  }

  /* 2台の中身を合わせる。lists は id ごとに足し合わせ、ほかは新しいほうの値 */
  function merge(loc, rem, remNewer){
    const out = { app: C.app, v: 1, keys: {}, tomb: {} };
    const tb = {};
    [loc.tomb || {}, rem.tomb || {}].forEach(t => Object.keys(t).forEach(k => Object.keys(t[k] || {}).forEach(id => {
      tb[k] = tb[k] || {}; tb[k][id] = Math.max(tb[k][id] || 0, t[k][id]);
    })));
    out.tomb = tb;
    C.keys.forEach(k => {
      const lv = loc.keys[k], rv = rem.keys[k];
      const spec = C.lists && C.lists[k];
      if(!spec){
        let v;
        if(C.mergeKey && lv !== undefined && rv !== undefined && lv !== rv){ try{ v = C.mergeKey(k, lv, rv, remNewer); }catch(e){ v = undefined; } }
        if(v === undefined) v = remNewer ? (rv !== undefined ? rv : lv) : (lv !== undefined ? lv : rv);
        if(v !== undefined) out.keys[k] = v;
        return;
      }
      let la = [], ra = [];
      try{ la = JSON.parse(lv || '[]') || []; }catch(e){}
      try{ ra = JSON.parse(rv || '[]') || []; }catch(e){}
      const first = remNewer ? ra : la, second = remNewer ? la : ra;   // 同じ id は新しい側を優先
      const map = {}, order = [];
      first.concat(second).forEach(x => {
        const id = idOf(spec, x); if(!id) return;
        const cur = map[id];
        if(!cur){ map[id] = x; order.push(id); return; }
        if(spec.t && (Number(x[spec.t]) || 0) > (Number(cur[spec.t]) || 0)) map[id] = x;
      });
      const dead = tb[k] || {};
      let arr = order.filter(id => !(dead[id] && !(spec.t && (Number(map[id][spec.t]) || 0) > dead[id]))).map(id => map[id]);
      if(spec.sort) arr.sort(spec.sort);
      out.keys[k] = JSON.stringify(arr);
    });
    return out;
  }

  /* 預かっていた中身をこの端末に入れて、画面を読みなおす */
  function applyAndReload(obj, msg){
    if(isBusy()){
      if(!pending) setTimeout(retryPending, 5000);
      pending = { obj, msg, seq: pending ? pending.seq : seq };
      return;
    }
    applying = true;
    try{
      C.keys.forEach(k => {
        if(obj.keys && obj.keys[k] !== undefined) _set.call(ls, k, obj.keys[k]);
        else _rm.call(ls, k);
      });
      T = obj.tomb || {};
    }catch(e){}
    applying = false;
    saveMeta();
    try{ sessionStorage.setItem('hs.msg', msg || '同期しました'); }catch(e){}
    reloading = true;            // このあとアプリが閉じぎわに古い中身を保存しても、書きもどさない
    location.reload();
  }
  function retryPending(){
    if(!pending) return;
    if(isBusy()){ setTimeout(retryPending, 5000); return; }
    const p = pending; pending = null;
    // 待っている間にこの端末でも書いた → 2つを合わせて入れ、合わせたものを預けなおす
    if(seq !== p.seq){
      const merged = merge(collect(), p.obj, false);
      M.mt = Math.max(now(), (M.mt || 0) + 1); M.dirty = true; saveMeta();
      applyAndReload(merged, '2台の記録を合わせました');
      return;
    }
    applyAndReload(p.obj, p.msg);
  }
  function isBusy(){
    try{ if(C.busy && C.busy()) return true; }catch(e){}
    const a = document.activeElement;
    return !!(a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && /text|search|number|time|date/.test(a.type || 'text'))));
  }

  /* ---------- 変わったら送る ---------- */
  function touch(){
    if(!M.code) return;
    seq++;
    M.mt = Math.max(now(), (M.mt || 0) + 1);   // 端末の時計が多少ずれていても前に進む
    M.dirty = true; saveMeta();
    clearTimeout(timer);
    timer = setTimeout(push, C.delay || 3000);
  }
  /* localStorage への書きこみを見張る。アプリ側のコードは直さなくてよい */
  Storage.prototype.setItem = function(k, v){
    if(this === ls && C && !applying && C.keys.indexOf(k) >= 0){
      if(reloading) return;
      const old = _get.call(this, k);
      _set.call(this, k, v);
      if(old !== String(v)){ tombDiff(k, old, String(v)); touch(); }
      return;
    }
    return _set.call(this, k, v);
  };
  Storage.prototype.removeItem = function(k){
    if(this === ls && C && !applying && C.keys.indexOf(k) >= 0){
      if(reloading) return;
      const old = _get.call(this, k);
      _rm.call(this, k);
      if(old !== null){ tombDiff(k, old, '[]'); touch(); }
      return;
    }
    return _rm.call(this, k);
  };

  async function push(){
    if(!M.code) return;
    if(busy){ clearTimeout(timer); timer = setTimeout(push, 1500); return; }
    busy = true;
    const mySeq = seq;
    try{
      const r = await call({ action:'put', code:derive(M.code), mt:M.mt || 0, name:C.label, data:JSON.stringify(collect()) });
      if(r && r.ok && r.stale) await onRemote(r);
      else if(r && r.ok){ M.at = now(); M.err = ''; if(seq === mySeq) M.dirty = false; }
      else M.err = (r && r.err) || '送れませんでした';
    }catch(e){ M.err = 'つながりませんでした'; }
    busy = false; saveMeta(); render();
    if(M.err){ clearTimeout(timer); timer = setTimeout(push, 30000); }
    else if(M.dirty && seq !== mySeq){ clearTimeout(timer); timer = setTimeout(push, C.delay || 3000); }
  }
  /* 閉じるとき。書いた直後に閉じても届くように */
  function flush(){
    if(!M || !M.code || !M.dirty || reloading) return;
    const body = JSON.stringify({ secret:SECRET, action:'put', code:derive(M.code), mt:M.mt || 0, name:C.label, data:JSON.stringify(collect()) });
    if(body.length > 60000) return;            // keepalive で送れる大きさをこえたら、次に開いたときに送る
    try{ fetch(URL, { method:'POST', body, keepalive:true }); }catch(e){}
  }

  /* 預かりのほうが新しかったとき */
  async function onRemote(r){
    let rem = null; try{ rem = JSON.parse(r.data || 'null'); }catch(e){}
    if(!rem || rem.app !== C.app || !rem.keys){ M.err = 'このコードの中身が読めません'; return; }
    if(!M.dirty){
      M.mt = r.mt || M.mt; M.at = now(); M.err = ''; saveMeta();
      applyAndReload(rem, 'ほかの端末の記録を受けとりました');
      return;
    }
    // この端末にもまだ送っていない書きこみがある → 合わせて、合わせたものを預けなおす
    const merged = merge(collect(), rem, true);
    M.mt = Math.max(now(), (r.mt || 0) + 1); M.dirty = true; M.at = now(); M.err = ''; saveMeta();
    applyAndReload(merged, '2台の記録を合わせました');
  }

  async function pull(quiet){
    if(!M.code) return;
    if(busy) return;
    busy = true;
    try{
      const r = await call({ action:'get', code:derive(M.code) });
      busy = false;
      if(r && r.ok && r.found){
        if((r.mt || 0) > (M.mt || 0)){ await onRemote(r); }
        else if((r.mt || 0) < (M.mt || 0) || M.dirty){ await push(); return; }
        else { M.at = now(); M.err = ''; if(!quiet) say('同期ずみです'); }
      }else if(r && r.ok){ await push(); return; }
      else M.err = (r && r.err) || '受けとれませんでした';
    }catch(e){ busy = false; M.err = 'つながりませんでした'; }
    saveMeta(); render();
  }

  /* ---------- ボタン ---------- */
  async function start(){
    say('コードを作っています…');
    try{
      const r = await call({ action:'new' });
      if(!r || !r.ok){ say((r && r.err) || 'つながりませんでした'); return; }
      M = { code:r.code, mt:now(), dirty:true, at:0, err:'' }; saveMeta(); render();
      await push();
      say(M.err ? M.err : '同期をはじめました');
    }catch(e){ say('つながりませんでした'); }
  }
  async function join(){
    const v = await ask('同期コード（8文字）を入れてください。\n計画マップなど、ほかのアプリで使っているコードと同じでOKです。');
    if(v === null) return;
    const code = norm(v);
    if(!code){ say('コードは8文字です（例 abcd-2345）'); return; }
    try{
      const r = await call({ action:'get', code:derive(code) });
      if(r && r.ok && !r.found &&
         !(await yes('コード「' + code + '」の' + C.label + 'の記録は、まだ預けられていません。\nこの端末の記録を、このコードで預けはじめますか？\n\n計画マップなどで使っているコードなら、このままで大丈夫です。打ちまちがいがないかだけ確認してください。'))) return;
    }catch(e){}
    joinWith(code);
  }
  async function stop(){
    if(!(await yes('この端末の同期をやめます。記録はこの端末に残り、預けたぶんも消えません。よろしいですか？'))) return;
    M = {}; saveMeta(); render(); say('同期をやめました');
  }
  /* 同じサイトのほかのアプリが同期コードを持っていれば、それを使える（パソコン・Android。
     iPhoneのホーム画面アプリはアプリごとに保存場所が別なので、たいてい見つからない） */
  function siblingCode(){
    const tries = [];
    try{
      for(let i = 0; i < ls.length; i++){
        const k = ls.key(i); let o = null;
        if(/^planmap_(v1|p.+)$/.test(k)){ try{ o = JSON.parse(_get.call(ls, k) || '{}'); }catch(e){} if(o && o.syncCode) tries.push(['計画マップ', o.syncCode]); }
        else if(k === 'mn_sync'){ try{ o = JSON.parse(_get.call(ls, k) || '{}'); }catch(e){} if(o && o.code) tries.push(['ReNote', o.code]); }
        else if(/^hs\.[a-z]+$/.test(k) && k !== metaKey()){ try{ o = JSON.parse(_get.call(ls, k) || '{}'); }catch(e){} if(o && o.code) tries.push(['ほかのアプリ', o.code]); }
      }
    }catch(e){}
    for(const t of tries){ const c = norm(t[1]); if(c) return { from:t[0], code:c }; }
    return null;
  }
  async function joinWith(code){
    say('さがしています…');
    try{
      const r = await call({ action:'get', code:derive(code) });
      if(!r || !r.ok){ say((r && r.err) || 'つながりませんでした'); return; }
      if(r.found){
        let rem = null; try{ rem = JSON.parse(r.data || 'null'); }catch(e){}
        if(!rem || rem.app !== C.app || !rem.keys){ say('このコードの中身が読めません'); return; }
        if((C.lists || C.mergeKey) && hasLocal()){
          if(!(await yes('この端末の記録と、コード「' + code + '」に預けてある記録を合わせます。\nどちらの記録も残ります。よろしいですか？'))) return;
          const merged = merge(collect(), rem, true);
          M = { code, mt:Math.max(now(), (r.mt || 0) + 1), dirty:true, at:now(), err:'' }; saveMeta();
          applyAndReload(merged, '2台の記録を合わせました');
          return;
        }
        if(hasLocal() && !(await yes('この端末のいまの記録は、コード「' + code + '」の記録に入れかわります。よろしいですか？\n（この端末にだけある記録は消えます）'))) return;
        M = { code, mt:r.mt || 0, dirty:false, at:now(), err:'' }; saveMeta();
        applyAndReload(rem, '同じ記録になりました');
        return;
      }
      M = { code, mt:now(), dirty:true, at:0, err:'' }; saveMeta(); render();
      await push();
      say(M.err ? M.err : '同期をはじめました');
    }catch(e){ say('つながりませんでした'); }
  }
  async function copy(){
    try{ await navigator.clipboard.writeText(M.code); say('コピーしました'); }
    catch(e){ say('長押しでコピーしてください'); }
  }

  /* ---------- 画面 ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  function render(){
    const el = C && document.querySelector(C.mount); if(!el) return;
    const k = C.cls || {};
    if(!M.code){
      const sib = siblingCode();
      el.innerHTML =
        '<div class="hs-btns">' +
          (sib ? '<button class="' + (k.btn || '') + '" data-hs="sib" data-code="' + sib.code + '">' + sib.from + 'と同じコード（' + sib.code + '）で同期する</button>' : '') +
          '<button class="' + (sib ? (k.ghost || k.btn || '') : (k.btn || '')) + '" data-hs="start">同期をはじめる（この端末の記録をあずける）</button>' +
          '<button class="' + (k.ghost || k.btn || '') + '" data-hs="join">ほかの端末・アプリのコードを入れる</button>' +
        '</div>' +
        '<p class="' + (k.dim || '') + '">1台目で「同期をはじめる」を押すと、<b>同期コード</b>（8文字）が出ます。2台目でそのコードを入れると同じ記録になり、そのあとは<b>書くたびに自動で同期</b>します。<br>' +
        '<b>計画マップで同期している人は、そのコードをここに入れればOK</b>です（コードは全アプリ共通）。<br>' +
        (C.note ? C.note + '<br>' : '') +
        '記録は、ヒラのGoogleドライブに預けます。コードを知っている人は中身を見られるので、コードは人に見せないでください。</p>';
    }else{
      const st = M.err
        ? '<span class="hs-dot bad"></span>' + esc(M.err) + '。つながったら自動でもう一度送ります。'
        : '<span class="hs-dot"></span>さいごの同期：' + (M.at ? fmt(M.at) : 'まだ');
      el.innerHTML =
        '<div class="hs-code"><span>同期コード</span><b>' + esc(M.code) + '</b><button data-hs="copy">コピー</button></div>' +
        '<p class="' + (k.dim || '') + '">' + st + '<br>ほかの端末でも、このコードを入れてください。計画マップなど、ほかのアプリも同じコードで同期できます。' +
        (C.note ? '<br>' + C.note : '') + '</p>' +
        '<div class="hs-btns">' +
          '<button class="' + (k.btn || '') + '" data-hs="now">いま同期する</button>' +
          '<button class="' + (k.ghost || k.btn || '') + '" data-hs="stop">同期をやめる（この端末だけ）</button>' +
        '</div>';
    }
  }
  function onClick(e){
    const b = e.target.closest && e.target.closest('[data-hs]'); if(!b) return;
    const a = b.getAttribute('data-hs');
    if(a === 'start') start();
    else if(a === 'join') join();
    else if(a === 'stop') stop();
    else if(a === 'copy') copy();
    else if(a === 'sib') joinWith(b.getAttribute('data-code'));
    else if(a === 'now'){ say('同期しています…'); pull(false); }
  }

  function init(cfg){
    C = cfg;
    loadMeta();
    const st = document.createElement('style');
    st.textContent =
      '.hs-btns{display:flex;flex-direction:column;gap:0;margin:8px 0 0}' +
      '.hs-code{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin:8px 0;' +
        'background:' + (C.codeBg || 'rgba(127,127,127,.12)') + '}' +
      '.hs-code span{font-size:11px;opacity:.7;flex:none}' +
      '.hs-code b{flex:1;font-size:20px;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace;user-select:all;-webkit-user-select:all}' +
      '.hs-code button{flex:none;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;' +
        'border:1px solid currentColor;background:transparent;color:inherit;opacity:.85}' +
      '.hs-dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:#35b37e;margin-right:6px;vertical-align:middle}' +
      '.hs-dot.bad{background:#e0762a}';
    document.head.appendChild(st);
    document.addEventListener('click', onClick);
    render();
    try{ const m = sessionStorage.getItem('hs.msg'); if(m){ sessionStorage.removeItem('hs.msg'); setTimeout(() => say(m), 600); } }catch(e){}
    if(M.code){
      setTimeout(() => { if(M.dirty) push(); else pull(true); }, 1200);
    }
    let lastPull = 0;
    const wake = () => { if(M.code && !document.hidden && now() - lastPull > 20000){ lastPull = now(); pull(true); } };
    document.addEventListener('visibilitychange', () => { if(document.hidden) flush(); else { wake(); retryPending(); } });
    addEventListener('focus', wake);
    addEventListener('pagehide', flush);
  }
  return { init, render, pull, push, _derive: m => derive(m), _merge: merge, _collect: collect };
})();

/* ===================== 基本 ===================== */
const VER = 12;
const KEY = 'wake_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); const t = new Date(y, m-1, d+n); return ymd(t); };
const WD = ['日','月','火','水','木','金','土'];
const mdw = s => { const [y,m,d] = s.split('-').map(Number); return m+'/'+d+'（'+WD[new Date(y,m-1,d).getDay()]+'）'; };
const hm = d => d.getHours()+':'+pad(d.getMinutes());
const pick = a => a[Math.floor(Math.random() * a.length)];
const LINE = Object.fromEntries(LINES.map(l => [l.id, l]));
const SUBJ = ['英語','数学','国語','理科','社会','解き直し','その他'];
const HOURS = [0.5, 1, 1.5, 2, 3, 4, 5, 6];
const hLabel = h => h === 0.5 ? '30分' : h+'時間' + (h >= 6 ? '〜' : '');
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(()=>e.classList.remove('on'), 1800); }

/* ===================== データ =====================
   S.mode は v4 まで（喝・まぜる・励ましの設定）。v5 で朝の最後に選ぶ形にしたので使わない
   S.help: 使い方スライドを見たら true（はじめて開いたときだけ自動で出す）
   S.days['YYYY-MM-DD'] = { woke:'6:42', start:'19:00', hours:2, first:'数学', backlog:true|false, review:'できた'|'半分'|'できなかった' }
   review は「その日の約束」を次の朝にふり返った答え（その日の記録に入れる）
   word は最後に選んだ一言（'喝'・'本気の喝'・'励まし'・'喝（おまかせ）' など）。back は夕方に開いた時刻（woke の代わり）
   S.goal = { text:'ゴールの文', days:{ 'YYYY-MM-DD':true } }  ゴール宣言（v8・ユウキ・ハルネコの要望）
   S.test = { name:'期末テスト', date:'YYYY-MM-DD' }  次の大きなテストまでのカウントダウン（v10・こはるの要望） */
let S = load();
function load(){
  try{ const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if(j && j.days) return Object.assign({ mode:'mix', recent:[] }, j); }catch(e){}
  return { mode:'mix', days:{}, recent:[] };
}
function goal(){ if(!S.goal) S.goal = { text:'', days:{} }; return S.goal; }
/* 続いている日数（今日まだ宣言していなければ、昨日から数える） */
function streak(){
  const g = goal(); let d = g.days[today()] ? today() : addDays(today(), -1), n = 0;
  while(g.days[d]){ n++; d = addDays(d, -1); }
  return n;
}
/* カウントダウン：テストの日まであと何日（設定していなければ null） */
function daysLeft(){
  const t = S.test; if(!t || !t.date) return null;
  const [y,m,d] = t.date.split('-').map(Number), [a,b,c] = today().split('-').map(Number);
  return Math.round((new Date(y, m-1, d) - new Date(a, b-1, c)) / 86400000);
}
function cdHtml(cls){
  const n = daysLeft(); if(n === null) return '';
  const nm = esc(S.test.name || 'テスト');
  if(n < 0) return `<div class="cd ${cls||''}"><span>${nm}は終わりました</span><small>ホームで次のテストを設定してください</small></div>`;
  return `<div class="cd ${cls||''}"><span>${nm}まで</span><b>${n === 0 ? '今日が本番' : `あと<em>${n}</em>日`}</b></div>`;
}
/* 約束を守れた日：昨日までの7日間で、ふり返りが「できた」だった日（v10・こはるの要望）。半分は数えない */
function week7(){
  const out = [];
  for(let i = 7; i >= 1; i--){ const k = addDays(today(), -i), d = S.days[k]; out.push({ k, v: d && d.review || '' }); }
  return out;
}
function weekHtml(){
  const w = week7(), n = w.filter(x => x.v === 'できた').length;
  return `<div class="wk"><div class="wkn"><b>${n}</b><span>/ 7</span></div>
    <div class="wkd">${w.map(x => `<i class="${x.v === 'できた' ? 'ok' : x.v === '半分' ? 'half' : x.v === 'できなかった' ? 'ng' : ''}"><u></u>${WD[new Date(...x.k.split('-').map((v, i) => i === 1 ? v - 1 : +v)).getDay()]}</i>`).join('')}</div></div>
    <p class="muted" style="margin:6px 0 0">昨日までの7日間で、約束を守れた日です（緑＝できた・黄＝半分・赤＝できなかった）。</p>`;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('保存できませんでした'); } }

/* 同じ端末の 解き直しマップ・Essence の「今日の分」を数える（読めないときは null）。
   iPhone でホーム画面に置いたアプリは入れ物が別なので、読めないことが多い。そのときは本人に聞くだけ */
function backlogFromApps(){
  const t = today(); const out = [];
  try{
    const r = JSON.parse(localStorage.getItem('redo_v1') || 'null');
    if(r && Array.isArray(r.items)){ const n = r.items.filter(i => !i.done && i.due && i.due <= t).length; out.push({ name:'解き直しマップ', n }); }
  }catch(e){}
  try{
    const m = JSON.parse(localStorage.getItem('miss_v1') || 'null');
    if(m && Array.isArray(m.items)){ const n = m.items.filter(i => !i.done && i.due && i.due <= t).length; out.push({ name:'Essence', n }); }
  }catch(e){}
  return out.length ? out : null;
}

/* ===================== 声 =====================
   voice/<id>.m4a があれば ヒラ先生の録音を流す。なければ端末の読み上げ（録音が届くまでの代わり） */
const au = $('#au');
const missing = new Set();
let speakToken = 0;
function stopVoice(){ speakToken++; try{ au.pause(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }
function playOne(id, tok){
  return new Promise(res => {
    if(tok !== speakToken) return res();
    const l = LINE[id];
    const tts = () => {
      try{
        const u = new SpeechSynthesisUtterance(l.text.replace(/／/g, '。'));
        u.lang = 'ja-JP'; u.rate = 1.05; u.onend = u.onerror = () => res();
        speechSynthesis.speak(u);
        setTimeout(res, 1200 + l.text.length * 180);   // 読み上げが動かない端末でも先へ進む
      }catch(e){ res(); }
    };
    /* nt の言葉は録音が届くまで読み上げない（ヒラ先生の声に機械の声がまざると不自然なため） */
    const fallback = () => l.nt ? res() : tts();
    if(missing.has(id)) return fallback();
    const done = () => { au.onended = au.onerror = null; res(); };
    au.onended = done;
    au.onerror = () => { au.onended = au.onerror = null; missing.add(id); fallback(); };
    au.src = 'voice/' + id + '.m4a?v=' + VER;
    const p = au.play(); if(p && p.catch) p.catch(() => { au.onended = au.onerror = null; missing.add(id); fallback(); });
  });
}
/* 2文以上を流すときは、声を読みこんで前後の余白を削り、文と文の間を GAP 秒にそろえた1本の音にしてから流す
   （1本ずつ流すと、読みこみの待ち時間と余白が重なって間が長くなる。10-25 ヒラ「間が長すぎる」）。
   1本の中の長い間（LONG 秒以上）も GAP 秒に詰める。<audio> で流すのは、iPhone の消音スイッチで消えないため */
const GAP = 0.16, LONG = 0.22, SR = 48000;
const pcm = new Map();
let dctx = null;
function decode(id){
  if(pcm.has(id)) return pcm.get(id);
  const p = fetch('voice/' + id + '.m4a?v=' + VER).then(r => { if(!r.ok) throw 0; return r.arrayBuffer(); }).then(buf => new Promise((res, rej) => {
    dctx = dctx || new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, SR);
    dctx.decodeAudioData(buf, ab => res(tidy(ab.getChannelData(0), ab.sampleRate)), rej);
  })).catch(() => { pcm.delete(id); return null; });
  pcm.set(id, p); return p;
}
/* 頭と終わりの無音を削り、中の長い間を詰める（-40dB より静かな所を無音とみる） */
function tidy(x, sr){
  const win = Math.round(sr * 0.01), th = Math.pow(10, -40 / 20), n = Math.floor(x.length / win);
  const loud = new Array(n);
  for(let i = 0; i < n; i++){ let s = 0; for(let j = i * win; j < (i + 1) * win; j++) s += x[j] * x[j]; loud[i] = Math.sqrt(s / win) > th; }
  let a = loud.indexOf(true), z = loud.lastIndexOf(true); if(a < 0) return { x, sr };
  a = Math.max(0, a - 3); z = Math.min(n - 1, z + 6);   // 頭は0.03秒・終わりは0.06秒だけ残す
  const out = []; let i = a;
  while(i <= z){
    let j = i; while(j <= z && loud[j] === loud[i]) j++;
    let seg = x.subarray(i * win, j * win);
    if(!loud[i] && (j - i) * 0.01 > LONG){ const k = Math.round(GAP * sr / 2); seg = Float32Array.from([...seg.subarray(0, k), ...seg.subarray(seg.length - k)]); }
    out.push(seg); i = j;
  }
  const len = out.reduce((t, s) => t + s.length, 0), y = new Float32Array(len); let o = 0;
  for(const s of out){ y.set(s, o); o += s.length; }
  const f = Math.min(Math.round(sr * 0.008), y.length >> 1);
  for(let q = 0; q < f; q++){ y[q] *= q / f; y[y.length - 1 - q] *= q / f; }
  return { x:y, sr };
}
function wavUrl(parts){
  const sr = parts[0].sr, gap = Math.round(GAP * sr);
  const len = parts.reduce((t, p, i) => t + p.x.length + (i ? gap : 0), 0);
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const w = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, len * 2, true);
  let o = 44;
  parts.forEach((p, i) => {
    if(i) o += gap * 2;
    for(let k = 0; k < p.x.length; k++, o += 2){ const s = Math.max(-1, Math.min(1, p.x[k])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
  });
  return URL.createObjectURL(new Blob([buf], { type:'audio/wav' }));
}
let lastUrl = null;
/* iPhone は、最初に画面を押したときに音を鳴らしておかないと、読みこみを待ってから流す音を止めてしまう。
   最初の1回だけ、押した瞬間に無音を流しておく（あとの音はこの <audio> で流れる） */
const SILENT = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==';   // 0.05秒の無音
let unlocked = false;
function unlock(){
  if(unlocked) return; unlocked = true;
  try{ au.src = SILENT; const p = au.play(); if(p && p.catch) p.catch(() => { unlocked = false; }); }catch(e){ unlocked = false; }
}
['touchend', 'click'].forEach(ev => document.addEventListener(ev, unlock, { capture:true }));
/* 会話の言葉は先に読みこんでおく（待ち時間をなくす） */
function prefetch(){ LINES.forEach(l => { if(l.id !== 'alarm') decode(l.id); }); }
function playUrl(url, tok){
  return new Promise(res => {
    if(tok !== speakToken) return res(false);
    au.onended = () => { au.onended = au.onerror = null; res(true); };
    au.onerror = () => { au.onended = au.onerror = null; res(false); };
    au.src = url;
    const p = au.play(); if(p && p.catch) p.catch(() => { au.onended = au.onerror = null; res(false); });
  });
}
async function say(ids){
  stopVoice(); const tok = speakToken;
  const b = $('.bubble'); if(b) b.classList.add('speaking');
  let parts = null;
  try{ parts = await Promise.race([Promise.all(ids.map(decode)), new Promise(r => setTimeout(() => r(null), 2500))]); }catch(e){ parts = null; }
  if(tok !== speakToken) return;
  if(parts && parts.every(Boolean)){
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = wavUrl(parts);
    if(await playUrl(lastUrl, tok)){ if(b) b.classList.remove('speaking'); return; }
    if(tok !== speakToken) return;
  }
  // つなげなかったとき（古い端末など）は、今までどおり1本ずつ
  for(const id of ids){ await playOne(id, tok); if(tok !== speakToken) return; }
  if(b) b.classList.remove('speaking');
}
/* 同じ言葉が続かないように、最近つかった言葉をさける */
function choose(ids){
  const fresh = ids.filter(id => !S.recent.includes(id));
  const id = pick(fresh.length ? fresh : ids);
  S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 12);
  return id;
}
const ofGroup = (g, k) => LINES.filter(l => l.g === g && (k === undefined || l.k === k)).map(l => l.id);

/* ===================== 朝・夕方の会話 =====================
   昼すぎ（12時〜翌4時）に開いたら夕方版：あいさつが「おかえり」になる（v8・ユウキ・ハルネコの要望）。質問は同じ */
const isEve = () => { const h = new Date().getHours(); return h >= 12 || h < 4; };
const WORDG = { F:'喝', H:'本気の喝', G:'励まし' };
let T = null;   // 今朝の会話の状態
function openTalk(){
  prefetch();
  T = { rec:{}, step:0 };
  $('#talk').classList.add('on');
  document.body.style.overflow = 'hidden';
  renderWake();
}
function closeTalk(){
  stopVoice(); $('#talk').classList.remove('on'); document.body.style.overflow = ''; T = null; renderHome();
}
$('#tClose').onclick = closeTalk;

function renderWake(){
  const d = new Date();
  $('#tStep').textContent = '';
  $('#stage').innerHTML = `
    <div class="clock">${hm(d)}</div>
    <div class="date">${mdw(today())}</div>
    ${cdHtml('big')}
    <button class="sunbtn${isEve() ? ' eve' : ''}" id="sunBtn">${isEve() ? 'おかえり' : 'おはよう'}</button>
    <p class="muted" style="text-align:center;margin-top:22px">押すと、ヒラ先生の声がはじまります</p>`;
  $('#sunBtn').onclick = () => {
    const eve = isEve();
    T.rec[eve ? 'back' : 'woke'] = hm(new Date());
    buildFlow();
    next(choose(ofGroup(eve ? 'V' : 'B')));
  };
}

/* 質問の順番。昨日の約束があって、まだふり返っていなければ最初に聞く */
function buildFlow(){
  const y = S.days[addDays(today(), -1)];
  T.flow = [];
  if(y && y.hours && !y.review) T.flow.push('review');
  T.flow.push('start', 'hours', 'first', 'backlog', 'last', 'end');
}
async function next(lead){
  const kind = T.flow[T.step++];
  const pre = lead ? [lead] : [];
  const steps = T.flow.filter(k => k !== 'end').length;
  $('#tStep').textContent = kind === 'end' ? '' : (T.step)+' / '+steps;
  const q = { review:'c0', start:'d1', hours:'d2', first:'d3', backlog:'d4', last:'d5' }[kind];
  let choices = '', cls = '', hint = '';
  if(kind === 'review'){
    const y = S.days[addDays(today(), -1)];
    hint = `昨日の約束：${esc(y.start)}から ${esc(hLabel(y.hours))}`;
    choices = ['できた','半分','できなかった'].map(v => `<button data-v="${v}">${v}</button>`).join('');
  }else if(kind === 'start'){
    const h0 = new Date().getHours();
    const opts = ['今すぐ']; for(let h = Math.max(h0 + 1, 6); h <= 22; h++) opts.push(h+':00');
    choices = opts.map(v => `<button data-v="${v}">${v}</button>`).join('');
    cls = 'four';
  }else if(kind === 'hours'){
    choices = HOURS.map(h => `<button data-v="${h}">${hLabel(h)}</button>`).join(''); cls = 'four';
  }else if(kind === 'first'){
    choices = SUBJ.map(v => `<button data-v="${v}">${v}</button>`).join('');
  }else if(kind === 'backlog'){
    const apps = backlogFromApps();
    if(apps) hint = apps.map(a => `${a.name}：今日の分 ${a.n}問`).join('　');
    choices = `<button data-v="1">たまってる</button><button data-v="0">たまってない</button>`; cls = 'two';
  }else if(kind === 'last'){
    const g = omakase();
    hint = `おまかせ：今日は「${g === 'F' ? '喝' : g === 'G' ? '励まし' : '喝か励まし'}」${g === 'mix' ? '' : '（昨日の約束が「' + esc(yReview()) + '」だったので）'}`;
    choices = ['喝','本気の喝','励まし','おまかせ'].map(v => `<button data-v="${v}">${v}</button>`).join(''); cls = 'two';
  }
  const ids = [...pre, q];
  $('#stage').innerHTML = `
    <div class="who"><img src="icon-192.png" alt=""><b>ヒラ先生</b></div>
    <div class="bubble">${ids.map(id => esc(LINE[id].text)).join('<br>')}</div>
    ${hint ? `<div class="hint">${hint}</div>` : ''}
    <div class="choices ${cls}">${choices}</div>
    <div class="dots">${T.flow.filter(k => k !== 'end').map((k, i) => `<i class="${i < T.step ? 'on' : ''}"></i>`).join('')}</div>`;
  $('#stage').querySelectorAll('.choices button').forEach(b => b.onclick = () => answer(kind, b.dataset.v));
  say(ids);
}
function answer(kind, v){
  let reply;
  if(kind === 'review'){
    S.days[addDays(today(), -1)].review = v;
    reply = choose(ofGroup('C', v));
  }else if(kind === 'start'){
    T.rec.start = v === '今すぐ' ? hm(new Date()) : v;
    reply = choose(ofGroup('E', '何時から'));
  }else if(kind === 'hours'){
    const h = Number(v); T.rec.hours = h;
    reply = h <= 1 ? 'e2a' : h >= 4 ? 'e2c' : 'e2b';
  }else if(kind === 'first'){
    T.rec.first = v; reply = choose(ofGroup('E', '最初の教科'));
  }else if(kind === 'backlog'){
    T.rec.backlog = v === '1';
    reply = choose(ofGroup('E', v === '1' ? 'たまってる' : 'たまってない'));
  }else if(kind === 'last'){
    const g = v === '喝' ? 'F' : v === '本気の喝' ? 'H' : v === '励まし' ? 'G' : omakase();
    T.word = g === 'mix' ? pick(['F','G']) : g;
    T.rec.word = WORDG[T.word] + (v === 'おまかせ' ? '（おまかせ）' : '');
    save(); return finish(choose(ofGroup(T.word)));
  }
  save(); next(reply);
}
/* おまかせ：昨日のふり返りで決める（できた→励まし・できなかった→喝・半分やふり返りなし→どちらか）。ヒラの指示 10-25 */
function yReview(){ const y = S.days[addDays(today(), -1)]; return y && y.review || ''; }
function omakase(){ const r = yReview(); return r === 'できた' ? 'G' : r === 'できなかった' ? 'F' : 'mix'; }
function finish(last){
  T.step = T.flow.length;
  $('#tStep').textContent = '';
  S.days[today()] = Object.assign({}, S.days[today()] || {}, T.rec);
  save();
  const r = S.days[today()];
  const ids = [last];
  $('#stage').innerHTML = `
    <div class="who"><img src="icon-192.png" alt=""><b>ヒラ先生</b></div>
    <div class="bubble">${ids.map(id => esc(LINE[id].text)).join('<br>')}</div>
    <div class="card" style="margin-top:18px">
      <h2>今日の約束</h2>
      <div class="promise">
        <div><b>${esc(r.start)}</b><span>から</span></div>
        <div><b>${esc(hLabel(r.hours))}</b><span>やる</span></div>
        <div><b>${esc(r.first)}</b><span>から始める</span></div>
      </div>
      <p class="muted" style="margin:10px 0 0">明日、この約束をふり返ります。</p>
    </div>
    ${cdHtml()}
    <div class="choices two">
      ${goal().text && !goal().days[today()] ? `<button class="wide dark" id="goalNow">ゴール宣言もする</button>` : ''}
      <button class="wide" id="endBtn">${isEve() ? 'よし、始める' : 'よし、起きる'}</button></div>`;
  $('#endBtn').onclick = closeTalk;
  if($('#goalNow')) $('#goalNow').onclick = () => renderGoal(true);
  say(ids);
}

/* ===================== ゴール宣言（v8） =====================
   「ゴールは何？」→ 声に出して言う →「言った！」→ 応援の一言。宣言した日をためて、続いた日数を出す */
function openGoal(){

    $('#stage').innerHTML = `
      <div class="who"><img src="icon-192.png" alt=""><b>ヒラ先生</b></div>

      <div class="promise" style="margin-top:14px"><div><b>${n}日</b><span>続いている</span></div><div><b>${total}日</b><span>宣言した日</span></div><div><b>${mdw(today())}</b><span>今日</span></div></div>
      <div class="choices two"><button class="wide dark" id="gCard">宣言を画像にして出す・印刷する</button><button class="wide" id="gEnd">とじる</button></div>`;
    $('#gEnd').onclick = closeTalk;
    $('#gCard').onclick = openCardSheet;

  say([q]);

/* ===================== 宣言カード（v9・のぐの要望） =====================
   宣言したゴール＋今日の約束＋続いた日数を1枚の画像にする。計画マップと同じく「アプリをえらんで送る」で
   Discord の宣言の部屋へ。印刷用（白い背景）も選べる */
function wrapText(ctx, text, maxW){
  const out = []; let line = '';
  for(const ch of String(text)){
    if(ch === '\n'){ out.push(line); line = ''; continue; }
    if(ctx.measureText(line + ch).width > maxW && line){
      if('、。」）！？ー'.includes(ch)){ line += ch; out.push(line); line = ''; continue; }   // 行の頭に句読点を置かない
      out.push(line); line = ch;
    }else line += ch;
  }
  if(line) out.push(line); return out;
}
function drawCard(light){
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), g = goal(), r = S.days[today()] || {};
  const F = n => `900 ${n}px 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif`;
  const ink = light ? '#1a1a1a' : '#F3EADF', gold = light ? '#8A6A1E' : '#E0C06A', sub = light ? '#444' : '#B9AE9E';
  if(light){ c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); }
  else{ const gr = c.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#221C15'); gr.addColorStop(1, '#0B0A09'); c.fillStyle = gr; c.fillRect(0, 0, W, H); }
  c.strokeStyle = gold; c.lineWidth = 4; c.strokeRect(40, 40, W - 80, H - 80);
  c.lineWidth = 1.5; c.strokeRect(56, 56, W - 112, H - 112);
  c.textAlign = 'center'; c.fillStyle = gold; c.font = F(34); c.fillText('G O A L   D E C L A R A T I O N', W / 2, 150);
  c.fillStyle = ink; c.font = F(64); c.fillText('ゴール宣言', W / 2, 240);
  const dl = daysLeft();
  c.fillStyle = sub; c.font = F(34); c.fillText(mdw(today()) + (dl !== null && dl >= 0 ? `　${S.test.name || 'テスト'}まで ${dl === 0 ? '今日が本番' : 'あと' + dl + '日'}` : ''), W / 2, 300);
  // ゴール
  c.font = F(64); const gl = wrapText(c, g.text, W - 240).slice(0, 4);
  let y = 420;
  c.fillStyle = ink; gl.forEach((t, i) => c.fillText(t, W / 2, y + i * 86));
  y += (gl.length - 1) * 86 + 64;
  c.strokeStyle = gold; c.lineWidth = 2; c.beginPath(); c.moveTo(W / 2 - 120, y); c.lineTo(W / 2 + 120, y); c.stroke();
  // 今日の約束
  if(r.hours){
    c.fillStyle = gold; c.font = F(34); c.fillText('今日の約束', W / 2, y + 90);
    const cells = [[r.start, 'から'], [hLabel(r.hours), 'やる'], [r.first, 'から始める']];
    cells.forEach(([v, l], i) => {
      const x = W / 2 + (i - 1) * 310, yy = y + 125;
      c.strokeStyle = light ? '#bbb' : 'rgba(224,192,106,.45)'; c.lineWidth = 2;
      c.beginPath(); c.roundRect ? c.roundRect(x - 140, yy, 280, 160, 24) : c.rect(x - 140, yy, 280, 160); c.stroke();
      c.fillStyle = ink; c.font = F(50); c.fillText(String(v), x, yy + 84);
      c.fillStyle = sub; c.font = F(28); c.fillText(l, x, yy + 132);
    });
    y += 300;
  }
  // 続いた日数
  c.fillStyle = gold; c.font = F(40); c.fillText(`${streak()}日 続けて宣言中`, W / 2, Math.max(y + 110, 960));
  c.fillStyle = sub; c.font = F(30); c.fillText(`宣言した日 ${Object.keys(g.days).length}日`, W / 2, Math.max(y + 165, 1015));
  c.fillStyle = gold; c.font = F(30); c.fillText('ヒラボイス', W / 2, H - 100);
  return cv;
}
async function openCardSheet(){
  try{ await document.fonts.load("900 40px 'Zen Maru Gothic'"); }catch(e){}
  let light = false, cv = drawCard(false);
  const canShare = !!(navigator.canShare && navigator.share);
  const name = () => 'ゴール宣言_' + today() + '.png';
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><h2>宣言カード</h2>
    <img class="shot" id="cardImg" alt="宣言カード">
    <p class="muted" style="margin:8px 0 0">${canShare ? '「部屋に出す」を押して Discord をえらび、<b>宣言の部屋</b>に送ってください。' : '画像を保存して、Discord の<b>宣言の部屋</b>に送ってください。'}</p>
    ${canShare ? '<button class="close" id="cShare">部屋に出す（アプリをえらんで送る）</button>' : ''}
    <button class="sub" id="cSave">画像を保存する</button>
    <button class="sub" id="cPrint">印刷する</button>
    <label class="chk"><input type="checkbox" id="cLight">印刷用（白い背景にしてインクを節約）</label>
    <button class="sub" id="cClose">とじる</button></div>`;
  document.body.appendChild(bg);
  const img = bg.querySelector('#cardImg');
  const show = () => { img.src = cv.toDataURL('image/png'); };

  const blob = () => new Promise(res => cv.toBlob(res, 'image/png'));
  bg.querySelector('#cLight').onchange = e => { light = e.target.checked; cv = drawCard(light); show(); };
  if(canShare) bg.querySelector('#cShare').onclick = async () => {
    const f = new File([await blob()], name(), { type:'image/png' });
    if(!navigator.canShare({ files:[f] })) return toast('この端末では送れません');
    try{ await navigator.share({ files:[f] }); }catch(e){}
  };
  bg.querySelector('#cSave').onclick = async () => {
    const b = await blob(); if(!b) return;
    const f = new File([b], name(), { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[f] })){ try{ await navigator.share({ files:[f] }); return; }catch(e){ if(e && e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name(); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('保存しました');
  };
  bg.querySelector('#cPrint').onclick = () => {
    const box = document.getElementById('printBox'); box.innerHTML = `<img src="${cv.toDataURL('image/png')}" alt="">`;
    setTimeout(() => window.print(), 150);
  };
  const close = () => bg.remove();
  bg.querySelector('#cClose').onclick = close;
  bg.addEventListener('click', e => { if(e.target === bg) close(); });
}

function openHelp(){
  const SL = slides();
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><h2>ヒラボイスの使い方</h2>
    <div class="sl-track">${SL.map((sl, i) => `<div class="sl"><div class="no">${i+1} / ${SL.length}</div><div class="pic">${sl.pic}</div><h4>${sl.t}</h4><p>${sl.p}</p>${sl.ex ? `<div class="ex">${sl.ex}</div>` : ''}</div>`).join('')}</div>
    <div class="sl-nav"><button class="prev" aria-label="前へ">‹</button><span class="dots">${SL.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</span><button class="next" aria-label="次へ">›</button></div>
    <button class="close">閉じる</button></div>`;
  document.body.appendChild(bg);
  const track = bg.querySelector('.sl-track'), dots = bg.querySelectorAll('.dots i');
  let idx = 0, st = null;
  const step = () => track.children[0].offsetWidth + 10;
  const mark = () => dots.forEach((d, k) => d.classList.toggle('on', k === idx));
  const go = i => { idx = Math.max(0, Math.min(SL.length - 1, i)); mark(); track.scrollTo({ left:idx * step(), behavior:'smooth' }); };
  track.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => { idx = Math.round(track.scrollLeft / step()); mark(); }, 80); }, { passive:true });
  bg.querySelector('.prev').onclick = () => go(idx - 1);
  bg.querySelector('.next').onclick = () => go(idx + 1);
  const close = () => { bg.remove(); if(!S.help){ S.help = true; save(); } };
  bg.querySelector('.close').onclick = close;
  bg.addEventListener('click', e => { if(e.target === bg) close(); });
}
$('#btnHelp').onclick = openHelp;

/* ===================== 更新の確認（解き直しマップと同じ仕組み） ===================== */
async function checkUpdate(silent){
  try{
    const res = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw 0;
    const j = await res.json(), v = Number(j.v) || 0;
    if(v > VER){
      $('#updVer').textContent = 'v' + VER + ' → v' + v + (j.note ? '　' + j.note : '');
      $('#btnUpdate').classList.remove('hidden');
    }else{
      $('#btnUpdate').classList.add('hidden');
      if(!silent) toast('いまが最新です（v' + VER + '）');
    }
  }catch(e){ if(!silent) toast('調べられませんでした'); }
}
async function doUpdate(){
  toast('更新しています…');
  try{
    if('serviceWorker' in navigator){ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(x => x.unregister())); }
    if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
}
$('#btnUpdate').onclick = doUpdate;
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(true); });

/* 2台の記録を合わせる：日ごとの記録とゴール宣言した日は両方を残す。ほかは新しいほう */
function wakeMerge(k, lr, rr, remNewer){
  const a = JSON.parse(lr), b = JSON.parse(rr);
  const nw = remNewer ? b : a, od = remNewer ? a : b;
  const out = { ...od, ...nw };
  out.days = {};
  new Set([...Object.keys(od.days || {}), ...Object.keys(nw.days || {})]).forEach(d => { out.days[d] = { ...((od.days || {})[d] || {}), ...((nw.days || {})[d] || {}) }; });
  const og = od.goal || {}, ng = nw.goal || {};
  out.goal = { text: ng.text || og.text || '', days: { ...(og.days || {}), ...(ng.days || {}) } };
  out.test = nw.test || od.test;
  out.help = !!(nw.help || od.help);
  return JSON.stringify(out);
}
function sheet(html){
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet">${html}<button class="close">閉じる</button></div>`;
  document.body.appendChild(bg);
  bg.querySelector('.close').onclick = () => bg.remove();
  bg.addEventListener('click', e => { if(e.target === bg) bg.remove(); });
  return bg;
}
function hsAsk(msg){
  return new Promise(res => {
    const bg = sheet(`<h2>同期コード</h2><p class="muted" style="white-space:pre-line">${esc(msg)}</p>
      <input id="hsIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="abcd-2345"
        style="width:100%;box-sizing:border-box;padding:13px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace">
      <div class="row" style="margin-top:12px"><button class="sub" id="hsNo">やめる</button><button class="sub ok" id="hsOk">入れる</button></div>`);
    let fin = false;
    const done = v => { if(fin) return; fin = true; bg.remove(); res(v); };
    bg.querySelector('#hsOk').onclick = () => done(bg.querySelector('#hsIn').value);
    bg.querySelector('#hsNo').onclick = () => done(null);
    bg.querySelector('.close').onclick = () => done(null);
    bg.addEventListener('click', e => { if(e.target === bg) done(null); });
    setTimeout(() => { try{ bg.querySelector('#hsIn').focus(); }catch(e){} }, 80);
  });
}
function hsYes(msg){
  return new Promise(res => {
    const bg = sheet(`<h2>確認</h2><p class="muted" style="white-space:pre-line">${esc(msg)}</p>
      <div class="row" style="margin-top:12px"><button class="sub" id="hsNo">やめる</button><button class="sub ok" id="hsOk">はい</button></div>`);
    let fin = false;
    const done = v => { if(fin) return; fin = true; bg.remove(); res(v); };
    bg.querySelector('#hsOk').onclick = () => done(true);
    bg.querySelector('#hsNo').onclick = () => done(false);
    bg.querySelector('.close').onclick = () => done(false);
    bg.addEventListener('click', e => { if(e.target === bg) done(false); });
  });
}

renderHome();
HSync.init({
  app: 'wake', label: 'ヒラボイス',
  keys: [KEY],
  mergeKey: wakeMerge,
  hasData: () => Object.keys(S.days).length > 0 || !!(S.goal && S.goal.text) || !!S.test,
  busy: () => $('#talk').classList.contains('on') || !!document.querySelector('.sheet-bg'),   // 会話・宣言の最中やシートを開いているときは読みなおさない
  mount: '#hsBox', cls: { btn: 'sub ok', ghost: 'sub', dim: 'muted' },
  note: '約束・ふり返り・ゴール宣言・カウントダウンが同期されます。',
  delay: 3000,
  toast: toast, ask: hsAsk, yes: hsYes
});
checkUpdate(true);
const WAKE = new URLSearchParams(location.search).has('wake');
if(!S.help && !WAKE) openHelp();   // はじめて開いたときだけ（アラームから開いた朝は出さない）
if(new URLSearchParams(location.search).has('wake')){
  history.replaceState(null, '', location.pathname);   // 読みなおしで何度も開かないように
  openTalk();
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
