<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひらめきメモ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ひらめき">
<meta name="theme-color" content="#FBF6EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#FBF6EA; --card:#FFFFFF; --ink:#2A2418; --muted:#6E6352; --line:#E9DFC8;
  --accent:#F2A61D; --accent-deep:#B8740A; --accent-soft:#FDEFCF; --accent-ink:#2A1C00;
  --done:#2F9E6B; --done-soft:#E2F4EA; --del:#C9493E;
  --chip:#F3EBD8; --shadow:0 1px 3px rgba(80,60,20,.08); --shadow-lg:0 10px 28px rgba(80,60,20,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130D; --card:#221D14; --ink:#F2EBDD; --muted:#A99D86; --line:#3A3223;
    --accent:#F5B53A; --accent-deep:#F5B53A; --accent-soft:#3A2D12; --accent-ink:#1E1500;
    --done:#5BCB95; --done-soft:#17352A; --del:#EE8A80;
    --chip:#2C2519; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 10px 28px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#16130D; --card:#221D14; --ink:#F2EBDD; --muted:#A99D86; --line:#3A3223;
  --accent:#F5B53A; --accent-deep:#F5B53A; --accent-soft:#3A2D12; --accent-ink:#1E1500;
  --done:#5BCB95; --done-soft:#17352A; --del:#EE8A80;
  --chip:#2C2519; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 10px 28px rgba(0,0,0,.55);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  font-size:16px; line-height:1.65; min-height:100vh; font-weight:500;
}
.num{font-variant-numeric:tabular-nums;}
.wrap{max-width:560px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));}
button, input, textarea{font-family:inherit; color:inherit;}
button{background:none; border:none; cursor:pointer; touch-action:manipulation;}
button:active{transform:scale(.97);}
button:disabled{opacity:.4; pointer-events:none;}
.hidden{display:none !important;}
svg.i{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none;}

/* ヘッダ */
.head{display:flex; align-items:center; gap:10px; padding:4px 2px 12px;}
.logo{width:34px; height:34px; border-radius:10px; background:var(--accent); display:grid; place-items:center; flex:none;}
.logo svg{width:22px; height:22px; stroke:var(--accent-ink); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.head h1{font-size:20px; font-weight:900; letter-spacing:.02em; flex:1;}
.head .ver{font-size:11px; color:var(--muted);}

.update{width:100%; margin-bottom:12px; background:var(--accent); color:var(--accent-ink); border-radius:14px; padding:11px 14px; display:flex; align-items:center; gap:10px; text-align:left; font-weight:700;}
.update span{flex:1; font-size:14px;}
.update b{background:rgba(255,255,255,.35); border-radius:999px; padding:5px 12px; font-size:13px;}

/* 入力 */
.compose{background:var(--card); border-radius:20px; padding:14px; box-shadow:var(--shadow-lg); border:1px solid var(--line);}
.compose textarea{width:100%; border:none; outline:none; background:transparent; resize:none; font-size:17px; line-height:1.6; min-height:84px; max-height:40vh; font-weight:500;}
.compose textarea::placeholder{color:var(--muted); opacity:.8;}
.compose .row{display:flex; align-items:center; gap:10px; margin-top:6px;}
.compose .hint{flex:1; font-size:12px; color:var(--muted);}
.btnAdd{background:var(--accent); color:var(--accent-ink); font-weight:900; font-size:16px; border-radius:999px; padding:11px 22px; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow);}

/* タブ */
.tabs{display:flex; gap:6px; margin:22px 0 12px; background:var(--chip); border-radius:999px; padding:4px;}
.tabs button{flex:1; padding:9px 0; border-radius:999px; font-size:13px; white-space:nowrap; font-weight:700; color:var(--muted);}
.tabs button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
.tabs .cnt{display:inline-block; min-width:18px; margin-left:3px; font-size:12px; padding:0 6px; border-radius:999px; background:var(--accent-soft); color:var(--accent-deep);}

/* メモ一覧 */
.list{display:flex; flex-direction:column; gap:10px;}
.item{background:var(--card); border-radius:16px; padding:13px 12px 12px 16px; box-shadow:var(--shadow); border:1px solid var(--line); display:flex; gap:10px; align-items:flex-start; transition:opacity .3s, transform .3s;}
.item.leaving{opacity:0; transform:translateX(40px);}
.list .item{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
.item.pressing{transform:scale(.98); transition:transform .35s;}
.item.dragging{position:fixed; z-index:40; margin:0; transition:none; transform:scale(1.03); box-shadow:var(--shadow-lg); border-color:var(--accent); pointer-events:none;}
.ph{border:2px dashed var(--accent); border-radius:16px; background:var(--accent-soft); opacity:.6;}
.sortHint{font-size:12px; color:var(--muted); margin:-4px 4px 8px; text-align:right;}
body.nowDragging{-webkit-user-select:none; user-select:none; overscroll-behavior:none;}
.item .body{flex:1; min-width:0;}
.item .txt{white-space:pre-wrap; word-break:break-word; font-size:16px;}
.item .meta{font-size:12px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.item .wipe{font-size:12px; font-weight:700; color:var(--del); padding:2px 0;}
.item .clear{flex:none; display:flex; flex-direction:column; align-items:center; gap:1px; color:var(--done); background:var(--done-soft); border-radius:12px; padding:8px 10px; font-size:11px; font-weight:900;}
.item .clear svg{width:22px; height:22px; stroke-width:2.6;}

.empty{text-align:center; color:var(--muted); padding:36px 12px; font-size:14px;}
.empty svg{width:40px; height:40px; stroke:var(--line); stroke-width:1.6; margin-bottom:6px;}

.mode{display:flex; gap:6px; margin-bottom:8px;}
.mode button{font-size:13px; font-weight:700; border-radius:999px; padding:5px 12px; background:var(--chip); color:var(--muted); display:flex; align-items:center; gap:4px;}
.mode button svg{width:15px; height:15px;}
.mode button.on{background:var(--accent); color:var(--accent-ink);}
.keep .pin{flex:none; width:26px; height:26px; border-radius:50%; background:var(--accent-soft); display:grid; place-items:center; color:var(--accent-deep); margin-top:2px;}
.keep .pin svg{width:15px; height:15px;}

/* 記録 */
.recSum{font-size:13px; color:var(--muted); margin:0 2px 10px;}
.day{font-size:12px; font-weight:900; color:var(--muted); margin:14px 4px 6px;}
.day:first-child{margin-top:0;}
.rec{opacity:.92;}
.rec .txt{color:var(--ink);}
.rec .acts{display:flex; gap:6px; margin-top:8px;}
.rec .acts button{font-size:12px; font-weight:700; border-radius:999px; padding:4px 11px; background:var(--chip); color:var(--muted);}
.rec .acts .del{color:var(--del);}
.rec .badge{flex:none; width:26px; height:26px; border-radius:50%; background:var(--done-soft); display:grid; place-items:center; color:var(--done); margin-top:2px;}
.rec .badge svg{width:15px; height:15px; stroke-width:3;}

.tools{margin-top:28px; border-top:1px solid var(--line); padding-top:14px; display:flex; flex-wrap:wrap; gap:8px;}
.tools button{font-size:13px; font-weight:700; background:var(--chip); color:var(--muted); border-radius:999px; padding:7px 13px;}

/* 直すシート */
.sheet{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.sheet .box{background:var(--card); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
.sheet h2{font-size:16px; font-weight:900; margin-bottom:10px;}
.sheet textarea{width:100%; min-height:140px; border:1px solid var(--line); border-radius:14px; padding:12px; font-size:16px; background:var(--bg); outline:none; resize:vertical;}
.sheet .row{display:flex; gap:8px; margin-top:12px;}
.sheet .row button{flex:1; padding:12px; border-radius:999px; font-weight:900; font-size:15px; background:var(--chip);}
.sheet .row .ok{background:var(--accent); color:var(--accent-ink);}

/* 下のお知らせ（元に戻す） */
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); background:var(--ink); color:var(--bg); font-size:14px; font-weight:700; padding:8px 8px 8px 18px; border-radius:999px; z-index:100; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; width:max-content; max-width:calc(100vw - 32px); display:flex; align-items:center; gap:12px;}
.toast.on{opacity:1; pointer-events:auto; transform:translate(-50%, 0);}
.toast.plain{padding-right:18px;}
.toast button{background:var(--accent); color:var(--accent-ink); font-weight:900; font-size:13px; border-radius:999px; padding:6px 13px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></div>
    <h1>ひらめきメモ</h1>
    <span class="ver" id="verLabel"></span>
  </header>

  <button class="update hidden" id="btnUpdate"><span id="updText">新しいバージョンがあります</span><b>更新</b></button>

  <section class="compose">
    <div class="mode" id="mode">
      <button class="on" data-mode="idea"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>ひらめき</button>
      <button data-mode="keep"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>残すメモ</button>
    </div>
    <textarea id="inp" placeholder="ひらめいたことを、そのまま書く" rows="3"></textarea>
    <div class="row">
      <span class="hint" id="hint">済んだら「消す」で片づけるメモ</span>
      <button class="btnAdd" id="btnAdd" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>メモ</button>
    </div>
  </section>

  <nav class="tabs">
    <button class="on" data-tab="memo">ひらめき<span class="cnt num" id="cntMemo">0</span></button>
    <button data-tab="keep">残すメモ<span class="cnt num" id="cntKeep">0</span></button>
    <button data-tab="rec">消した記録<span class="cnt num" id="cntRec">0</span></button>
  </nav>

  <section id="tab-memo">
    <div class="sortHint hidden" id="hintMemo">長押しで並べ替え</div>
    <div class="list" id="memoList"></div>
  </section>

  <section id="tab-keep" class="hidden">
    <div class="sortHint hidden" id="hintKeep">長押しで並べ替え</div>
    <div class="list" id="keepList"></div>
  </section>

  <section id="tab-rec" class="hidden">
    <div id="recList"></div>
    <div class="tools">
      <button id="btnExport">控えを書き出す</button>
      <button id="btnImport">控えを読みこむ</button>
      <button id="btnCheckUpd">更新を確認</button>
      <input type="file" id="fileImport" accept="application/json,.json" class="hidden">
    </div>
  </section>
</div>

<div class="sheet hidden" id="editSheet">
  <div class="box">
    <h2>メモを直す</h2>
    <textarea id="editInp"></textarea>
    <div class="row">
      <button id="editCancel">やめる</button>
      <button class="ok" id="editOk">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" class="hidden">元に戻す</button></div>

<script>
const VER = 4;
const KEY = 'idea_v1', BAK = 'idea_backup';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON_CHECK = '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* データ: items = [{id, text, created(ms), cleared(ms|null)}] */
let S = { items:[] };
function load(){
  for(const k of [KEY, BAK]){
    try{ const j = JSON.parse(localStorage.getItem(k)); if(j && Array.isArray(j.items)){ S = j; return; } }catch(e){}
  }
}
function save(){
  const s = JSON.stringify(S);
  try{ localStorage.setItem(KEY, s); localStorage.setItem(BAK, s); }catch(e){ toast('保存できませんでした（容量がいっぱいかもしれません）'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function pad(n){ return String(n).padStart(2,'0'); }
function dayKey(ms){ const d = new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDay(ms){
  const d = new Date(ms), t = new Date(), y = new Date(Date.now()-864e5);
  if(dayKey(ms) === dayKey(t)) return '今日';
  if(dayKey(ms) === dayKey(y)) return '昨日';
  const w = '日月火水木金土'[d.getDay()];
  return (d.getFullYear() !== t.getFullYear() ? d.getFullYear()+'年' : '') + (d.getMonth()+1)+'月'+d.getDate()+'日（'+w+'）';
}
function fmtTime(ms){ const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtWhen(ms){ return fmtDay(ms)+' '+fmtTime(ms); }

/* 並び順: pos が小さいほど上。pos がない古いメモは新しい順 */
const posOf = x => (typeof x.pos === 'number') ? x.pos : -x.created;
const byPos = (a,b) => posOf(a) - posOf(b);

/* ===== 表示 ===== */
function render(){
  const memos = S.items.filter(x => x.kind !== 'keep' && !x.cleared).sort(byPos);
  const keeps = S.items.filter(x => x.kind === 'keep').sort(byPos);
  $('#hintMemo').classList.toggle('hidden', memos.length < 2);
  $('#hintKeep').classList.toggle('hidden', keeps.length < 2);
  const recs = S.items.filter(x => x.cleared).sort((a,b) => b.cleared - a.cleared);
  $('#cntMemo').textContent = memos.length;
  $('#cntRec').textContent = recs.length;
  $('#cntKeep').textContent = keeps.length;

  $('#keepList').innerHTML = keeps.length ? keeps.map(x => `
    <div class="item keep" data-id="${x.id}">
      <span class="pin"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span>
      <div class="body" data-edit="${x.id}">
        <div class="txt">${esc(x.text)}</div>
        <div class="meta">${fmtWhen(x.created)}<button class="wipe" data-wipe="${x.id}">丸ごと消す</button></div>
      </div>
    </div>`).join('')
    : '<div class="empty">まだありません。<br>上で「残すメモ」を選んで書くと、ここにずっと残ります。</div>';

  $('#memoList').innerHTML = memos.length ? memos.map(x => `
    <div class="item" data-id="${x.id}">
      <div class="body" data-edit="${x.id}">
        <div class="txt">${esc(x.text)}</div>
        <div class="meta">${fmtWhen(x.created)}<button class="wipe" data-wipe="${x.id}">丸ごと消す</button></div>
      </div>
      <button class="clear" data-clear="${x.id}" aria-label="消す">${ICON_CHECK}消す</button>
    </div>`).join('')
    : `<div class="empty"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><div>${recs.length ? 'いまのメモは、ぜんぶ消しました。' : 'ひらめいたら、上に書いて「メモ」。'}<br>消したメモは「消した記録」に残ります。</div></div>`;

  if(!recs.length){
    $('#recList').innerHTML = '<div class="empty">まだありません。<br>メモの「消す」を押すと、ここに残ります。</div>';
  }else{
    let html = `<div class="recSum">これまでに消したメモ <b class="num">${recs.length}</b> 件</div>`, last = '';
    for(const x of recs){
      const k = dayKey(x.cleared);
      if(k !== last){ html += `<div class="day">${fmtDay(x.cleared)}</div>`; last = k; }
      html += `
      <div class="item rec" style="margin-bottom:8px">
        <span class="badge">${ICON_CHECK}</span>
        <div class="body">
          <div class="txt">${esc(x.text)}</div>
          <div class="meta">メモ ${fmtWhen(x.created)} → 消した ${fmtTime(x.cleared)}</div>
          <div class="acts">
            <button data-restore="${x.id}">ひらめきに戻す</button>
            <button class="del" data-del="${x.id}">丸ごと消す</button>
          </div>
        </div>
      </div>`;
    }
    $('#recList').innerHTML = html;
  }
}

/* ===== メモする ===== */
const inp = $('#inp');
function syncBtn(){
  $('#btnAdd').disabled = !inp.value.trim();
  inp.style.height = 'auto'; inp.style.height = Math.max(84, inp.scrollHeight) + 'px';
}
inp.addEventListener('input', syncBtn);
inp.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); addMemo(); } });
function addMemo(){
  const text = inp.value.trim();
  if(!text) return;
  const same = S.items.filter(x => mode === 'keep' ? x.kind === 'keep' : (x.kind !== 'keep' && !x.cleared));
  const top = same.length ? Math.min(...same.map(posOf)) - 1 : 0;
  if(mode === 'keep') S.items.push({ id:uid(), kind:'keep', text, created:Date.now(), cleared:null, pos:top });
  else S.items.push({ id:uid(), text, created:Date.now(), cleared:null, pos:top });
  save();
  inp.value = ''; syncBtn();
  showTab(mode === 'keep' ? 'keep' : 'memo');
  render();
  toast(mode === 'keep' ? '残すメモに入れました' : 'メモしました');
}
$('#btnAdd').onclick = addMemo;

/* ひらめき／残すメモ の切りかえ（タブと連動） */
let mode = 'idea';
function setMode(m){
  mode = m;
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  inp.placeholder = m === 'keep' ? '残しておきたいことを書く' : 'ひらめいたことを、そのまま書く';
  $('#hint').textContent = m === 'keep' ? '消すまでずっと残るメモ' : '済んだら「消す」で片づけるメモ';
}
$('#mode').addEventListener('click', e => { const b = e.target.closest('button'); if(b){ setMode(b.dataset.mode); showTab(b.dataset.mode === 'keep' ? 'keep' : 'memo'); inp.focus(); } });

/* ===== 消す（記録は残る） ===== */
function find(id){ return S.items.find(x => x.id === id); }
$('#memoList').addEventListener('click', e => {
  const c = e.target.closest('[data-clear]');
  if(c){
    const x = find(c.dataset.clear); if(!x) return;
    const el = c.closest('.item');
    el.classList.add('leaving');
    x.cleared = Date.now(); save();
    setTimeout(render, 280);
    toast('消しました（記録に残っています）', () => { x.cleared = null; save(); render(); });
    return;
  }
  const w = e.target.closest('[data-wipe]');
  if(w){ wipe(w.dataset.wipe); return; }
  const ed = e.target.closest('[data-edit]');
  if(ed) openEdit(ed.dataset.edit);
});

$('#keepList').addEventListener('click', e => {
  const w = e.target.closest('[data-wipe]');
  if(w){ wipe(w.dataset.wipe); return; }
  const ed = e.target.closest('[data-edit]');
  if(ed) openEdit(ed.dataset.edit);
});

$('#recList').addEventListener('click', e => {
  const r = e.target.closest('[data-restore]');
  if(r){
    const x = find(r.dataset.restore); if(!x) return;
    const was = x.cleared;
    x.cleared = null; save(); render();
    toast('ひらめきに戻しました', () => { x.cleared = was; save(); render(); });
    return;
  }
  const d = e.target.closest('[data-del]');
  if(d) wipe(d.dataset.del);
});

/* ===== 丸ごと消す（記録にも残さない） ===== */
function wipe(id){
  const x = find(id); if(!x) return;
  if(!confirm('このメモを丸ごと消します。「消した記録」にも残りません。元に戻せません。よろしいですか？\n\n「' + x.text.slice(0,40) + (x.text.length > 40 ? '…' : '') + '」')) return;
  S.items = S.items.filter(y => y !== x); save(); render();
  toast('丸ごと消しました');
}

/* ===== 長押しで並べ替え ===== */
const drag = { timer:null, el:null, ph:null, list:null, sx:0, sy:0, dy0:0, y:0, raf:0, moved:false, pid:null };
let justDragged = false;
function dragCancelPress(){
  clearTimeout(drag.timer); drag.timer = null;
  if(drag.el && !drag.ph) drag.el.classList.remove('pressing');
  if(!drag.ph) drag.el = null;
}
function dragStart(){
  const el = drag.el, r = el.getBoundingClientRect();
  el.classList.remove('pressing');
  drag.ph = document.createElement('div');
  drag.ph.className = 'ph'; drag.ph.style.height = r.height + 'px';
  el.after(drag.ph);
  drag.dy0 = drag.sy - r.top;
  Object.assign(el.style, { left:r.left+'px', top:r.top+'px', width:r.width+'px' });
  el.classList.add('dragging');
  document.body.classList.add('nowDragging');
  try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
  drag.y = drag.sy;
  drag.raf = requestAnimationFrame(dragTick);
}
function dragPlace(){
  const others = [...drag.list.children].filter(c => c.classList.contains('item') && c !== drag.el);
  let before = null;
  for(const c of others){ const r = c.getBoundingClientRect(); if(drag.y < r.top + r.height/2){ before = c; break; } }
  const cur = drag.ph.nextElementSibling === drag.el ? drag.el.nextElementSibling : drag.ph.nextElementSibling;
  if(cur === before) return;
  /* 動くカードをなめらかに（FLIP） */
  const first = new Map(others.map(c => [c, c.getBoundingClientRect().top]));
  if(before) drag.list.insertBefore(drag.ph, before); else drag.list.appendChild(drag.ph);
  for(const c of others){
    const d = first.get(c) - c.getBoundingClientRect().top;
    if(!d) continue;
    c.style.transition = 'none'; c.style.transform = `translateY(${d}px)`;
    requestAnimationFrame(() => { c.style.transition = 'transform .18s'; c.style.transform = ''; });
  }
}
function dragTick(){
  if(!drag.ph) return;
  const h = window.innerHeight, edge = 70;
  let v = 0;
  if(drag.y < edge) v = -Math.ceil((edge - drag.y) / 6);
  else if(drag.y > h - edge) v = Math.ceil((drag.y - (h - edge)) / 6);
  if(v) window.scrollBy(0, v);
  drag.el.style.top = (drag.y - drag.dy0) + 'px';
  dragPlace();
  drag.raf = requestAnimationFrame(dragTick);
}
function dragEnd(){
  if(!drag.ph){ dragCancelPress(); return; }
  cancelAnimationFrame(drag.raf);
  const el = drag.el, list = drag.list;
  drag.ph.replaceWith(el);
  el.classList.remove('dragging');
  el.style.left = el.style.top = el.style.width = '';
  document.body.classList.remove('nowDragging');
  const ids = [...list.children].filter(c => c.dataset.id).map(c => c.dataset.id);
  ids.forEach((id, i) => { const x = find(id); if(x) x.pos = i; });
  save();
  drag.ph = null; drag.el = null;
  justDragged = true; setTimeout(() => { justDragged = false; }, 400);
  render();
}
for(const list of [$('#memoList'), $('#keepList')]){
  list.addEventListener('pointerdown', e => {
    if(e.button > 0 || drag.el) return;
    const el = e.target.closest('.item');
    if(!el || e.target.closest('button')) return;
    drag.el = el; drag.list = list; drag.sx = e.clientX; drag.sy = e.clientY; drag.pid = e.pointerId;
    el.classList.add('pressing');
    drag.timer = setTimeout(() => { drag.timer = null; dragStart(); }, 450);
  });
  list.addEventListener('contextmenu', e => { if(e.target.closest('.item')) e.preventDefault(); });
}
document.addEventListener('pointermove', e => {
  if(!drag.el || e.pointerId !== drag.pid) return;
  if(drag.ph){ drag.y = e.clientY; e.preventDefault(); drag.el.style.top = (drag.y - drag.dy0) + 'px'; dragPlace(); return; }
  if(Math.abs(e.clientX - drag.sx) > 10 || Math.abs(e.clientY - drag.sy) > 10) dragCancelPress();
}, { passive:false });
/* 並べ替え中は画面がスクロールしないようにする（iPhone） */
document.addEventListener('touchmove', e => { if(drag.ph) e.preventDefault(); }, { passive:false });
document.addEventListener('pointerup', e => { if(drag.el && e.pointerId === drag.pid) dragEnd(); });
document.addEventListener('pointercancel', e => { if(drag.el && e.pointerId === drag.pid){ if(drag.ph) dragEnd(); else dragCancelPress(); } });
/* 並べ替えた直後のタップ（直す画面が開く）を止める */
document.addEventListener('click', e => { if(justDragged){ e.stopPropagation(); e.preventDefault(); } }, true);

/* ===== 直す ===== */
let editId = null;
function openEdit(id){
  const x = find(id); if(!x) return;
  editId = id; $('#editInp').value = x.text;
  $('#editSheet').classList.remove('hidden');
  setTimeout(() => $('#editInp').focus(), 50);
}
function closeEdit(){ editId = null; $('#editSheet').classList.add('hidden'); }
$('#editCancel').onclick = closeEdit;
$('#editSheet').addEventListener('click', e => { if(e.target.id === 'editSheet') closeEdit(); });
$('#editOk').onclick = () => {
  const x = find(editId), t = $('#editInp').value.trim();
  if(x && t){ x.text = t; save(); render(); toast('直しました'); }
  closeEdit();
};

/* ===== タブ ===== */
function showTab(t){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#tab-memo').classList.toggle('hidden', t !== 'memo');
  $('#tab-keep').classList.toggle('hidden', t !== 'keep');
  $('#tab-rec').classList.toggle('hidden', t !== 'rec');
  if(t === 'keep') setMode('keep'); else if(t === 'memo') setMode('idea');
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(b) showTab(b.dataset.tab); });

/* ===== お知らせ ===== */
let toastT, undoFn = null;
function toast(msg, undo){
  $('#toastMsg').textContent = msg;
  undoFn = undo || null;
  $('#toastBtn').classList.toggle('hidden', !undo);
  $('#toast').classList.toggle('plain', !undo);
  $('#toast').classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toast').classList.remove('on'); undoFn = null; }, undo ? 5000 : 1800);
}
$('#toastBtn').onclick = () => { if(undoFn){ undoFn(); undoFn = null; } $('#toast').classList.remove('on'); };

/* ===== 控え ===== */
$('#btnExport').onclick = async () => {
  const name = 'ひらめきメモ_' + dayKey(Date.now()) + '.json';
  const blob = new Blob([JSON.stringify(S, null, 1)], { type:'application/json' });
  const file = new File([blob], name, { type:'application/json' });
  try{
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
  }catch(e){ if(e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try{
    const j = JSON.parse(await f.text());
    if(!j || !Array.isArray(j.items)) throw 0;
    let add = 0;
    for(const y of j.items){
      if(!y || !y.id || typeof y.text !== 'string') continue;
      const x = find(y.id);
      if(x) Object.assign(x, y); else { S.items.push(y); add++; }
    }
    save(); render(); toast('読みこみました（新しく ' + add + ' 件）');
  }catch(err){ toast('このファイルは読みこめませんでした'); }
};

/* ===== 更新の確認 ===== */
async function checkUpdate(silent){
  try{
    const res = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw 0;
    const j = await res.json(), v = Number(j.v) || 0;
    if(v > VER){
      $('#updText').textContent = '新しいバージョン v' + v + (j.note ? '：' + j.note : '');
      $('#btnUpdate').classList.remove('hidden');
    }else{
      $('#btnUpdate').classList.add('hidden');
      if(!silent) toast('いまが最新です（v' + VER + '）');
    }
  }catch(e){ if(!silent) toast('調べられませんでした'); }
}
$('#btnUpdate').onclick = async () => {
  save();
  try{
    if('serviceWorker' in navigator){ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(x => x.unregister())); }
    if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
};
$('#btnCheckUpd').onclick = () => checkUpdate(false);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ load(); render(); checkUpdate(true); } else save(); });

/* 起動 */
$('#verLabel').textContent = 'v' + VER;
load(); render(); syncBtn();
checkUpdate(true);
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
