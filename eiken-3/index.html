<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検3級 単熟語</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F6FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F6FA;        /* 白に近い青 */
  --card:#FFFFFF;
  --chip:#E4EAF2;
  --line:#D3DCE7;
  --ink:#16202C;
  --muted:#4F5B6B;
  --ai:#1F4E8C;        /* 青：主ボタン */
  --ai-soft:#E1EAF6;
  --shu:#D0413A;       /* 赤：誤答・見出し語 */
  --shu-soft:#FBE4E2;
  --ok:#2E7A57;
  --ok-soft:#DDF0E5;
  --gold:#B07D1C;
  --gold-soft:#F7EBCF;
  --mincho:'Lexend','BIZ UDPGothic',system-ui,sans-serif;   /* 見出し・英語（名前は古文単語版のまま） */
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'BIZ UDPGothic',system-ui,sans-serif;font-size:17px;line-height:1.6;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.dim{color:var(--muted);font-size:14px}
b{font-weight:700}

/* ヘッダ */
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-family:'BIZ UDPGothic',sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em;flex:1;white-space:nowrap;min-width:0}
@media (max-width:400px){header h1 small{display:none}header{gap:7px}.lvchip i{width:26px}.bookseg button{padding:5px 9px}header h1{font-size:18px}}
header h1 small{font-size:12px;color:var(--muted);font-family:'BIZ UDPGothic';font-weight:400;margin-left:6px}
.lvchip{display:flex;align-items:center;gap:6px;background:var(--gold-soft);color:#6B5020;border-radius:999px;padding:4px 10px 4px 8px;font-weight:700;font-size:14px}
.lvchip i{display:block;width:44px;height:6px;border-radius:3px;background:#E2D2A6;overflow:hidden;font-style:normal}
.lvchip i::after{content:'';display:block;height:100%;width:var(--p,0%);background:var(--gold)}
.band{display:block;width:100%;background:var(--shu);color:#fff;text-align:left;padding:9px 16px;font-size:14px;font-weight:700}

main{padding:14px 16px;max-width:680px;margin:0 auto}
section > h2{font-family:var(--mincho);font-size:19px;margin:22px 2px 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px}

/* 今日 */
.hero{background:var(--ai);color:#fff;border-radius:20px;padding:18px 18px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .lap{font-size:14px;opacity:.9}
.hero .big{font-family:var(--mincho);font-size:30px;font-weight:900;line-height:1.3;margin:2px 0}
.hero .range{font-size:15px;opacity:.95}
.hero .st{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16)}
.hero .st.late{background:#F2C4BA;color:#6E1D10}
.steps{display:grid;gap:8px;margin-top:14px;position:relative;z-index:1}
.step{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:11px 14px;text-align:left;color:#fff;width:100%}
.step .n{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ai);display:grid;place-items:center;font-weight:700;flex:none}
.step .t{flex:1;font-weight:700}
.step .t small{display:block;font-weight:400;font-size:13px;opacity:.85}
.step.main{background:#fff;color:var(--ai)}
.step.main .n{background:var(--ai);color:#fff}
.step.done .n{background:var(--ok);color:#fff}

.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;text-align:center;background:var(--ai);color:#fff}
.btn.sub{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.shu{background:var(--shu);color:#fff}
.btn.line{background:transparent;border:1.5px solid var(--ai);color:var(--ai)}
.btn + .btn{margin-top:8px}
.row{display:flex;gap:8px}
.row > *{flex:1}
.row .btn + .btn{margin-top:0}

.remind{display:flex;align-items:center;gap:12px}
.remind .num{font-family:var(--mincho);font-size:34px;font-weight:900;color:var(--shu);line-height:1}
.remind .num small{font-size:14px}

/* 8周×5日 の表 */
.grid{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:4px;font-size:12px}
.grid .h{color:var(--muted);text-align:center;font-size:11px}
.grid .l{color:var(--muted);display:flex;align-items:center;font-size:12px}
.grid.few .cell{aspect-ratio:auto;height:36px}
.grid.tight .cell{font-size:9.5px;letter-spacing:-.04em}
.cell{aspect-ratio:1;min-width:0;padding:0;letter-spacing:-.02em;border-radius:7px;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.cell.cur{outline:2px solid var(--ai);outline-offset:1px;background:var(--ai-soft);color:var(--ai)}
.cell.d{color:#fff}
.cell.late::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--shu)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* 単語一覧 */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;padding:7px 13px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:700;color:var(--muted)}
.chipb.on{background:var(--ai);color:#fff}
.wlist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.wrow:last-child{border-bottom:0}
.wrow .no{font-size:12px;color:var(--muted);width:30px;flex:none}
.wrow .wd{font-family:var(--mincho);font-weight:700;font-size:18px;min-width:0}
.wrow .wd small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.wrow .mn{flex:1;text-align:right;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.dot.ng{background:var(--shu)}
.dot.ok{background:var(--ok)}
.dot.mid{background:#D9A441}

/* 記録 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--mincho);font-size:24px;font-weight:900;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th{font-size:12px;color:var(--muted);font-weight:400;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.log td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.log td.r{text-align:right;white-space:nowrap}
.rate{font-weight:700}
.rate.hi{color:var(--ok)} .rate.lo{color:var(--shu)}

/* 設定 */
.set label{display:block;font-weight:700;margin:4px 0 6px}
.set input[type=date],.set select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ai);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;color:var(--muted);font-weight:700;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ai)}
#tabDot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--shu)}

/* 全画面（テスト・カード・解説） */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.ovbar{display:flex;align-items:center;gap:10px;min-height:44px}
.ovbar .x{width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:20px;display:grid;place-items:center;flex:none}
.ovbar .ttl{flex:1;font-weight:700;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovbar .tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ai);background:var(--ai-soft);padding:4px 10px;border-radius:999px;font-size:14px}
.pbar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:6px 0 10px}
.pbar i{display:block;height:100%;background:var(--ai);transition:width .25s}
.ovbody{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto}

/* テスト */
.q{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 0 18px;min-height:190px}
.q .p{font-size:13px;color:var(--muted);background:var(--chip);padding:2px 10px;border-radius:999px;margin-bottom:10px}
.q .w{font-family:var(--mincho);font-weight:600;font-size:40px;line-height:1.25;overflow-wrap:anywhere}
.q .w.long{font-size:30px}
.q .w.mean{font-family:'BIZ UDPGothic';font-weight:700;font-size:28px}
.q .k{font-size:15px;color:var(--muted);margin-top:4px;min-height:1em}
.choices{display:grid;gap:9px}
.choice{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;text-align:left;font-weight:700;font-size:17px;min-height:56px}
.choice.mi{font-family:var(--mincho);font-size:21px}
.choice.ok{background:var(--ok-soft);border-color:var(--ok);color:#154B33}
.choice.ng{background:var(--shu-soft);border-color:var(--shu);color:#7A2213}
.choice:disabled{cursor:default}
.idk{margin-top:10px;color:var(--muted);font-size:14px;padding:10px;text-decoration:underline}
.fb{margin-top:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--shu);border-radius:12px;padding:12px 14px;font-size:15px}
.fb .fw{font-family:var(--mincho);font-weight:900;font-size:20px}
.fb .fm{color:var(--shu);font-weight:700}

/* 結果 */
.res{text-align:center;padding:16px 0}
.res .pct{font-family:var(--mincho);font-weight:900;font-size:64px;line-height:1.1}
.res .pct small{font-size:24px}
.res .meta{display:flex;justify-content:center;gap:16px;color:var(--muted);font-size:14px;margin-top:6px}
.saved{display:inline-block;margin-top:10px;background:var(--ok-soft);color:#154B33;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
.wrongs{margin:14px 0}
.wrongs .wrow{background:var(--card)}

/* 単語カード */
.fc{flex:1;display:flex;flex-direction:column;justify-content:center;perspective:1200px;min-height:340px;margin:6px 0 14px}
.fc-in{position:relative;width:100%;min-height:340px;transition:transform .45s;transform-style:preserve-3d}
.fc-in.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(60,40,10,.07);overflow-y:auto}
.fc-face.front{align-items:center;justify-content:center;text-align:center}
.fc-face.back{transform:rotateY(180deg)}
.fc .no{position:absolute;top:14px;left:18px;font-size:12px;color:var(--muted)}
.fc .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
.fc .w{font-family:var(--mincho);font-weight:600;font-size:44px;line-height:1.25;overflow-wrap:anywhere}
.fc .w.long{font-size:30px}
.fc .k{color:var(--muted);margin-top:4px}
.fc .bw{font-family:var(--mincho);font-weight:900;font-size:24px}
.fc .bm{font-size:22px;font-weight:700;color:var(--shu);margin:6px 0 2px;line-height:1.4}
.fc .bs{font-size:15px;color:var(--muted)}
.fc .bx{margin-top:12px;font-size:15px;border-top:1px dashed var(--line);padding-top:10px}
.fc .bx .ex{font-family:var(--mincho);font-weight:700}
.fc .bt{margin-top:10px;font-size:14.5px;background:var(--gold-soft);border-radius:10px;padding:10px 12px}

/* 1分解説スライド（画像がないときは、この組版で代わりに見せる） */
.slide{container-type:inline-size;position:relative;width:100%;flex:none;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#F7FAFD;border:1px solid var(--line);box-shadow:0 4px 16px rgba(60,40,10,.08)}
.slide .sl{position:absolute;inset:0;padding:4.2cqw 5cqw 3.6cqw;display:flex;flex-direction:column;background:
  radial-gradient(circle at 92% 12%, rgba(31,78,140,.07) 0 14cqw, transparent 14.2cqw),
  linear-gradient(#FAFCFE,#EEF3F9)}
.sl-top{display:flex;gap:1.4cqw;align-items:center;font-size:1.9cqw;color:var(--muted)}
.sl-top .p{background:var(--ai);color:#fff;border-radius:99px;padding:.2cqw 1.6cqw;font-weight:700}
.sl-top .one{margin-left:auto;color:var(--shu);font-weight:700;border:.2cqw solid var(--shu);border-radius:.8cqw;padding:.1cqw 1.2cqw}
.sl-main{display:flex;gap:4cqw;align-items:center;margin-top:2.2cqw}
.sl-l{flex:1.15;min-width:0}
.sl-w{font-family:var(--mincho);font-weight:600;font-size:7.4cqw;line-height:1.15;white-space:nowrap}
.sl-k{font-family:var(--mincho);font-size:2.6cqw;color:var(--muted);margin-top:.6cqw}
.sl-r{flex:1;background:#fff;border:.35cqw solid var(--shu);border-radius:1.6cqw;padding:1.8cqw 2.2cqw}
.sl-m{font-size:3.5cqw;font-weight:700;color:var(--shu);line-height:1.3}
.sl-s{font-size:2.1cqw;color:var(--muted);margin-top:.6cqw;line-height:1.4}
.sl-tip{margin-top:2.2cqw;font-size:2.3cqw;line-height:1.55;background:rgba(154,118,48,.1);border-radius:1.4cqw;padding:1.6cqw 2.2cqw;flex:1;min-height:0;overflow:hidden}
.sl-tip b{color:var(--gold);margin-right:1cqw}
.sl-d{font-size:1.9cqw;color:var(--muted);margin-top:.5cqw;line-height:1.4}
.sl-ex{margin-top:1.8cqw;font-size:2.15cqw;line-height:1.45;color:var(--ink)}
.sl-ex .ex{font-family:var(--mincho);font-weight:700}
.sl-ex .tr{color:var(--muted)}
.slide .hl{transition:box-shadow .2s, background .2s}
.slide.speaking .hl{opacity:.45;transition:opacity .3s}
.slide.speaking .hl.now{opacity:1}

.lesson .ctrl{display:flex;align-items:center;gap:12px;margin-top:14px}
.lesson .playb{width:58px;height:58px;border-radius:50%;background:var(--ai);color:#fff;display:grid;place-items:center;flex:none}
.lesson .playb svg{width:26px;height:26px}
.lesson .lbar{flex:1}
.lesson .lbar .pbar{margin:0 0 4px}
.lesson .lbar span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson .cap{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;line-height:1.7;min-height:120px}
.lesson .cap > div + div{margin-top:8px}
.lesson .cap .cw{font-family:var(--mincho);font-weight:900;font-size:22px}
.lesson .nav{display:flex;gap:8px;margin-top:14px}

/* 下から出るシート */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(30,22,12,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-family:var(--mincho);font-size:20px;margin:4px 0 10px}
.sheet h3{font-size:15px;margin:14px 0 4px}
.sheet ol{padding-left:22px;margin:6px 0}
.sheet .close{display:block;width:100%;margin-top:14px;padding:13px;border-radius:14px;background:var(--chip);font-weight:700}
.note{background:var(--gold-soft);border-radius:12px;padding:11px 13px;font-size:14.5px}
.lvchip{transition:transform .2s}
.lvchip.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.lvchip i::after{transition:width .6s ease}
/* +XP の小さな表示 */
.xpop{position:fixed;right:18px;top:calc(var(--sbh0,0px) + 58px + env(safe-area-inset-top));z-index:96;background:var(--gold);color:#fff;font-weight:700;font-size:14px;padding:4px 10px;border-radius:999px;pointer-events:none;animation:xpop 1.3s ease-out forwards;box-shadow:0 2px 8px rgba(154,118,48,.35);white-space:nowrap}
.xpop small{font-weight:400;font-size:11px;margin-left:4px;opacity:.9}
@keyframes xpop{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.05)}70%{opacity:1;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-30px)}}
body.timing .xpop{top:calc(var(--sbh,52px) + 52px)}
/* レベルアップの演出（桜の花びら） */
.lvfx{position:fixed;inset:0;z-index:97;background:rgba(31,26,22,.55);display:grid;place-items:center;animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.lvfx .box{background:var(--card);border-radius:26px;padding:26px 24px 20px;width:min(86vw,360px);text-align:center;position:relative;z-index:2;animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.lvfx .k{font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.2em}
.lvfx .big{font-family:var(--mincho);font-weight:900;font-size:64px;line-height:1.1;color:var(--gold)}
.lvfx .rank{font-family:var(--mincho);font-weight:900;font-size:24px;margin-top:2px}
.lvfx .rank.new{color:var(--shu)}
.petal{position:fixed;top:-20px;z-index:1;width:10px;height:14px;background:#F2C14E;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.2}}
/* レベルのカード */
.lvcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.lvcard .lvb{width:64px;height:64px;border-radius:18px;background:var(--gold-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:#6B5020}

<script>
'use strict';
const VER = 2;
/* 単語（1000語）と熟語（300個）は、べつべつの記録で進める。右上の「単語／熟語」で切りかえ（ページを読みなおす）。
   レベル（XP）と使い方を見たかどうかは、2つで共通。 */
const BOOKKEY = 'eiken3_book';
let BOOK = 'w';
try{ BOOK = localStorage.getItem(BOOKKEY) === 'i' ? 'i' : 'w'; }catch(e){}
const IDIOM = BOOK === 'i';
const BNAME = IDIOM ? '熟語' : '単語';
const W = ((IDIOM ? window.EIKEN_IDIOMS : window.EIKEN_WORDS) || []).map((x, i) => ({ ...x, i, s: x.s || [], d: x.d || [] }));
const N = W.length;
const PER = IDIOM ? 50 : 200;            // 1日の数（単語200語・熟語50個）
const DAYS = Math.ceil(N / PER);         // 1周の日数（単語1000語なら5日・熟語300個なら6日）
let LAPS = 4, TOTAL = DAYS * 4;          // 周回数は設定で変えられる（setLaps）
const GAPS = [1, 3, 7];                  // リマインド：まちがえた翌日 → 3日後 → 7日後 → 卒業
const KEY = 'eiken3_' + BOOK + '_v3';   // v3：語数（1000語・300個）と並びを変えたので記録を分けた
const COMMON = 'eiken3_common';
const NO_W = IDIOM ? 3 : 4;              // 音声ファイルの番号の桁数
const AUD = 'audio/' + BOOK + '/';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad3 = n => String(n).padStart(3, '0');

/* ===================== 日付 ===================== */
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function today(){ return ymd(new Date()); }
function addDays(s, n){ const [y,m,d] = s.split('-').map(Number); return ymd(new Date(y, m-1, d+n)); }
function diffDays(a, b){ const p = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d); }; return Math.round((p(b) - p(a)) / 864e5); }
function md(s){ const [,m,d] = s.split('-').map(Number); return m + '/' + d; }
function wd(s){ const [y,m,d] = s.split('-').map(Number); return '日月火水木金土'[new Date(y,m-1,d).getDay()]; }
function fmtSec(t){ t = Math.round(t); const m = Math.floor(t/60), s = t%60; return m ? m + '分' + String(s).padStart(2,'0') + '秒' : s + '秒'; }
function clock(t){ t = Math.floor(t); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); }

/* ===================== 保存 ===================== */
let S;
function blank(){ return { v:1, start: today(), cfg:{ dir:'w2m', voice:true, rate:1, pitch:1.1, voiceName:'', voiceMode:'ai', aRate:1, studyMin: IDIOM ? 15 : 30, laps: 8, autoSpk:true }, w:{}, days:{}, tests:[], study:[], timer:null, xp:0, xpDay:{}, guideSeen:false }; }
function load(){
  try{ S = JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ S = blank(); }
  const b = blank();
  S.cfg = { ...b.cfg, ...(S.cfg||{}) };
  S.study = S.study || []; S.timer = S.timer || null;
  S.w = S.w || {}; S.days = S.days || {}; S.tests = S.tests || []; S.start = S.start || b.start;
  S.xpDay = S.xpDay || {};
  let c = null; try{ c = JSON.parse(localStorage.getItem(COMMON)); }catch(e){}
  if(c){ S.xp = c.xp || 0; S.xpDay = c.xpDay || {}; S.guideSeen = !!c.guideSeen; }
  if(S.xp == null) S.xp = 0;
  // まだ何も始めていないうちは、開始日を「今日」に合わせる（熟語は単語のあとに始めるので、はじめて取り組んだ日からの計画にする）
  if(!S.startSet && !S.tests.length && !S.study.length && !Object.keys(S.days).length) S.start = today();
  setLaps(S.cfg.laps);
}
/* 単語の進み具合（熟語の「今日」で、単語を完走したかを見る） */
function wordsProgress(){
  try{
    const w = JSON.parse(localStorage.getItem('eiken3_w_v3')) || {};
    const total = 5 * ((w.cfg && w.cfg.laps) || 8);
    return { done: Object.keys(w.days || {}).length, total };
  }catch(e){ return { done:0, total:40 }; }
}
function setLaps(n){ LAPS = Math.max(1, Math.min(10, +n || 4)); TOTAL = DAYS * LAPS; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(COMMON, JSON.stringify({ xp:S.xp, xpDay:S.xpDay, guideSeen:S.guideSeen })); }catch(e){} }
function ws(i){ return S.w[i] || (S.w[i] = { c:0, x:0, sk:0, st:0, due:'' }); }
load();

/* ===================== 計画（単語は1日200語×5日、熟語は1日50個×6日で1周。8周＝単語は40日・熟語は48日）
   単語を完走してから熟語に進む流れ。熟語の開始日は、はじめて熟語を開いた日（設定で変えられる）。 ===================== */
function plan(n){
  const lap = Math.floor(n / DAYS) + 1, d = n % DAYS + 1;
  const from = (d-1) * PER, to = Math.min(N, d * PER);
  return { n, lap, d, from, to, date: addDays(S.start, n), ids: range(from, to) };
}
function range(a, b){ const r = []; for(let i=a;i<b;i++) r.push(i); return r; }
function curN(){ for(let n=0;n<TOTAL;n++) if(!S.days[n]) return n; return TOTAL; }
function lagOf(n){ return diffDays(plan(n).date, today()); }   // +なら遅れ
function statusText(){
  const n = curN();
  if(n >= TOTAL) return { t: LAPS + '周 完走！', late:false };
  const lag = lagOf(n);
  if(lag > 0) return { t:'予定より ' + lag + '日 遅れ', late:true };
  if(lag === 0) return { t:'今日の分', late:false };
  if(lag === -1) return { t:'今日の分は完了', late:false };
  return { t: (-lag-1) + '日 先に進んでいます', late:false };
}

/* ===================== 単語の状態・レベル ===================== */
function isMastered(i){ const s = S.w[i]; return !!s && s.sk >= 2; }      // 2回つづけて正解＝定着
function isWeak(i){ const s = S.w[i]; return !!s && s.x > 0 && s.sk < 2; }
function masteredCount(){ let c = 0; for(let i=0;i<N;i++) if(isMastered(i)) c++; return c; }
function dueList(){ const t = today(); return W.filter(w => { const s = S.w[w.i]; return s && s.due && s.due <= t; }).map(w => w.i); }
function stateDot(i){
  const s = S.w[i];
  if(!s || (s.c + s.x) === 0) return '';
  if(s.due) return 'ng';
  if(s.sk >= 2) return 'ok';
  return 'mid';
}
/* ===================== レベル（XP） =====================
   覚える・解くなどの行動で XP がたまり、たまるとレベルが上がる。単語と熟語で共通。
   称号は英検の級（Starter → 5級 → … → 1級 → Master）。 */
const XP_RULES = [
  ['テストで1問正解', 2], ['リマインドテストで1問正解', 3], ['単語が「定着」した（2回つづけて正解）', 5],
  ['単語カードで「覚えた」を押す', 1], ['1分解説を最後まで聞く', 3], ['覚える時間 1分ごと', 1],
  ['その日のテストをはじめてクリア', 20], ['テストで全問正解（10問以上）', 10],
];
const RANKS = [[1,'Starter'],[2,'5級'],[4,'4級'],[7,'3級'],[10,'3級プラス'],[14,'準2級'],[18,'準2級プラス'],[23,'2級'],[29,'準1級'],[36,'Master']];
function needXP(lv){ return 100 + 20 * (lv - 1); }
function lvInfo(xp){ let lv = 1, rest = xp; while(rest >= needXP(lv)){ rest -= needXP(lv); lv++; } return { lv, cur: rest, need: needXP(lv) }; }
function rankOf(lv){ let r = RANKS[0][1]; for(const [m, t] of RANKS) if(lv >= m) r = t; return r; }
function nextRank(lv){ const r = RANKS.find(([m]) => m > lv); return r ? { lv: r[0], t: r[1] } : null; }
function todayXP(){ return S.xpDay[today()] || 0; }
let lvQueue = null;
function gainXP(n, why){
  if(!n) return;
  const before = lvInfo(S.xp).lv;
  S.xp += n; S.xpDay[today()] = todayXP() + n;
  if(T) T.xp = (T.xp || 0) + n;
  save();
  popXP(n, why); renderLv(true);
  const after = lvInfo(S.xp).lv;
  if(after > before){
    if(T) lvQueue = { from: lvQueue ? lvQueue.from : before, to: after };   // テスト中はじゃましない。結果画面で出す
    else celebrate(before, after);
  }
}
function popXP(n, why){
  const el = document.createElement('div'); el.className = 'xpop';
  el.innerHTML = '+' + n + ' XP' + (why ? '<small>' + esc(why) + '</small>' : '');
  el.style.marginTop = ($$('.xpop').length % 3) * 30 + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}
function renderLv(anim){
  const x = lvInfo(S.xp), chip = $('#lvChip');
  chip.innerHTML = 'Lv.' + x.lv + ' <i style="--p:' + (x.cur / x.need * 100) + '%"></i>';
  if(anim){ chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
}
function celebrate(from, to){
  const x = lvInfo(S.xp), newRank = rankOf(to) !== rankOf(from);
  const fx = document.createElement('div'); fx.className = 'lvfx';
  fx.innerHTML = `<div class="box"><div class="k">LEVEL UP</div><div class="big">Lv.${to}</div>
    <div class="rank ${newRank ? 'new' : ''}">${newRank ? '<small style="display:block;font-size:14px;font-family:\'BIZ UDPGothic\';font-weight:700">ランクが上がりました</small>' : ''}${rankOf(to)}</div>
    <div class="xpbar" style="margin-top:14px"><i style="width:0%"></i></div>
    <div class="dim">次のレベルまで あと ${x.need - x.cur} XP</div>
    <button class="btn" style="margin-top:14px">つづける</button></div>`;
  for(let k = 0; k < 26; k++){
    const p = document.createElement('i'); p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    p.style.animationDuration = (2.2 + Math.random() * 2) + 's';
    p.style.animationDelay = (Math.random() * .8) + 's';
    fx.appendChild(p);
  }
  document.body.appendChild(fx);
  setTimeout(() => { const b = fx.querySelector('.xpbar i'); if(b) b.style.width = (x.cur / x.need * 100) + '%'; }, 80);
  const close = () => fx.remove();
  fx.querySelector('.btn').onclick = close;
  fx.addEventListener('click', e => { if(e.target === fx) close(); });
}
function lvCardHTML(){
  const x = lvInfo(S.xp), nr = nextRank(x.lv);
  return `<button class="card lvcard" id="lvCard"><div class="lvb"><small>Lv.</small><b>${x.lv}</b></div>
    <div style="flex:1;min-width:0"><div class="rk">${rankOf(x.lv)}<span class="dim" style="font-family:'BIZ UDPGothic';font-weight:400;font-size:13px">　今日 +${todayXP()} XP</span></div>
      <div class="xpbar"><i style="width:${x.cur / x.need * 100}%"></i></div>
      <div class="dim" style="font-size:13px">次のレベルまで あと <b>${x.need - x.cur} XP</b>${nr ? `　・　Lv.${nr.lv}で「${nr.t}」` : ''}</div></div></button>`;

function openLevel(){
  const x = lvInfo(S.xp);
  sheet(`<h2>レベルと XP</h2>

      <div style="font-family:var(--mincho);font-weight:900;font-size:22px">${rankOf(x.lv)}</div>

    <p class="dim" style="margin:0 0 8px">レベルが上がると、ランクが英検の級で上がっていきます。単語と熟語の XP は合計です。</p>
    <div class="ranks">${RANKS.map(([m, t], k) => { const nx = RANKS[k+1]; const now = x.lv >= m && (!nx || x.lv < nx[0]); return `<span class="${now ? 'now' : x.lv >= m ? 'done' : ''}">Lv.${m} ${t}</span>`; }).join('')}</div>
    <p class="dim" style="margin-top:12px">定着した${BNAME}：${masteredCount()} / ${N}（2回つづけて正解したもの）</p>`);
}

  el.innerHTML = order + hero + lvCardHTML() + remind + `<h2>計画（1日${PER}${IDIOM ? '個' : '語'} × ${DAYS}日 × ${LAPS}周 ＝ ${TOTAL}日）</h2><div class="card">${gridHTML()}</div>`;

function rateColor(r){ return r >= .9 ? '#2E7A57' : r >= .7 ? '#6E9A5C' : r >= .5 ? '#C9953A' : '#B63E2B'; }
function gridHTML(){
  const cur = curN(), t = today();

function filteredIds(){
  const q = wf.q.trim().toLowerCase();
  return W.filter(w => {
    if(wf.d && Math.floor(w.i / PER) + 1 !== wf.d) return false;
    if(wf.st === 'ng' && !(S.w[w.i] && S.w[w.i].due)) return false;
    if(wf.st === 'weak' && !isWeak(w.i)) return false;
    if(wf.st === 'ok' && !isMastered(w.i)) return false;

    const tip = sl.querySelector('.sl-tip'), box = sl.querySelector('.sl');
    if(!tip) return;
    let fs = parseFloat((tip.getAttribute('style') || '').match(/font-size:([\d.]+)cqw/)?.[1] || 2.3);

function exText(w){ return w.ex.replace(/[\[\]]/g, ''); }
/* 例文の訳（ft）。[ ] は見出し語の訳（赤くする） */

/* ===================== 音声 =====================
   1分解説の音声は audio/w/NNNN.mp3（単語）・audio/i/NNN.mp3（熟語）。tools/eiken-audio.py で作る。
   英語はネイティブの声（Ava）、日本語は Nanami。区切りの開始秒は audio/?/index.json。
   区切りの1つ目（見出し語）だけを鳴らすと「発音」になる。
   ファイルがない・再生できないときだけ、端末の読み上げ（speechSynthesis）にする。 */
let AIDX = null;
fetch(AUD + 'index.json?v=' + VER).then(r => r.ok ? r.json() : null).then(j => { AIDX = j; }).catch(() => {});
const noOf = i => String(i + 1).padStart(NO_W, '0');
function audRec(i){ return AIDX && AIDX[noOf(i)]; }
let L = null;
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} }
const V_FEMALE = /Kyoko|O-?ren|Nanami|Ayumi|Haruka|Mizuki|Sayaka|Nana|Aoi|Shiori|Samantha|Ava|Allison|Susan|Victoria|Karen|Moira|Tessa|Serena|Zoe|Google 日本語|Google Japanese|Google US English|女性|Female/i;
const V_MALE = /Otoya|Hattori|Ichiro|Keita|Daichi|Naoki|Takumi|Kenji|Alex|Daniel|Fred|Tom|Aaron|Arthur|男性|Male/i;
const V_HQ = /Enhanced|Premium|拡張|高品質|プレミアム|Natural|Neural|Online/i;
function voicesOf(lang){ try{ return speechSynthesis.getVoices().filter(v => new RegExp('^' + lang, 'i').test(v.lang)); }catch(e){ return []; } }
function jaVoices(){ return voicesOf('ja'); }
function voiceScore(v){ return (V_FEMALE.test(v.name) ? 10 : 0) - (V_MALE.test(v.name) ? 30 : 0) + (V_HQ.test(v.name) ? 6 : 0) + (/O-?ren|Ava|Samantha/i.test(v.name) ? 2 : 0) + (/en-US/i.test(v.lang) ? 1 : 0); }
function bestVoice(lang){
  const vs = voicesOf(lang);
  if(lang === 'ja' && S.cfg.voiceName){ const v = vs.find(x => x.name === S.cfg.voiceName); if(v) return v; }
  return vs.slice().sort((a,b) => voiceScore(b) - voiceScore(a))[0] || null;
}
function voiceLabel(v){ return v.name + (V_FEMALE.test(v.name) ? '・女性' : V_MALE.test(v.name) ? '・男性' : '') + (V_HQ.test(v.name) ? '・高品質' : ''); }
function sayUtter(text, lang){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'en' ? 'en-US' : 'ja-JP'; u.rate = lang === 'en' ? Math.min(1, S.cfg.rate) * .95 : S.cfg.rate; u.pitch = S.cfg.pitch;
  const v = bestVoice(lang); if(v) u.voice = v;
  return u;
}
/* 見出し語の英語の読み（~ は something、~ing は doing） */
function enHead(w){ return w.w.replace(/~ing/g, 'doing').replace(/…/g, 'something').replace(/\s*~\s*$/, '').replace(/~/g, 'something').trim(); }
/* 発音（見出し語だけ）を鳴らす */
let SPK = null;
function stopSpk(){ if(SPK){ try{ SPK.a && SPK.a.pause(); }catch(e){} clearTimeout(SPK.t); SPK = null; } $$('.spk.on').forEach(b => b.classList.remove('on')); }
function speakWord(i, btn){
  stopSpk(); stopSpeech();
  if(btn) btn.classList.add('on');
  const done = () => { if(btn) btn.classList.remove('on'); };
  const rec = audRec(i);
  if(S.cfg.voice !== false && S.cfg.voiceMode !== 'device' && rec){
    const a = new Audio(AUD + noOf(i) + '.mp3?h=' + (rec.h || VER));
    const end = rec.t[1] || 2;
    SPK = { a, t: setTimeout(() => { try{ a.pause(); }catch(e){} done(); SPK = null; }, end * 1000 + 150) };
    a.play().catch(() => { stopSpk(); ttsWord(i, done); });
    return;
  }
  ttsWord(i, done);
}
function ttsWord(i, done){
  if(!('speechSynthesis' in window)){ done && done(); return; }
  const u = sayUtter(enHead(W[i]), 'en'); u.onend = u.onerror = () => done && done(); speechSynthesis.speak(u);
}
const SPK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function spkBtn(i, big){ return `<span class="spk${big ? ' big' : ''}" role="button" aria-label="発音を聞く" data-spk="${i}">${SPK_SVG}</span>`; }
function bindSpk(root){ root.querySelectorAll('[data-spk]').forEach(b => b.onclick = e => { e.stopPropagation(); speakWord(+b.dataset.spk, b); }); }

function setPlayIcon(){

/* 区切りは tools/eiken-audio.py の parts() と同じ順番：見出し語・意味・例文・訳・覚え方・もう一度 */
function lessonParts(i){
  const w = W[i], head = enHead(w);
  const subm = x => x.replace(/^(名|動|形|副|前|接)\s+/, (m, p) => (PN[p] || p) + 'で、');
  const ja = t => t.replace(/[〜～~]/g, 'なになに').replace(/[\[\]]/g, '');
  return [
    { sec:'w', lang:'en', text: head + '.', show: `<b class="cw">${esc(w.w)}</b>${w.ph ? '　<span class="ph">' + esc(w.ph) + '</span>' : ''}　<span class="dim">${esc(pname(w.p))}</span>` },
    { sec:'m', lang:'ja', text: ja((IDIOM ? '熟語。' : pname(w.p) + '。') + 'いちばん大事な意味は、' + w.m + '。' + (w.s.length ? 'ほかに、' + w.s.map(subm).join('、') + '。' : '')), show: `<b style="color:var(--shu)">${esc(w.m)}</b>${w.s.length ? '<br><span class="dim">ほかに：' + w.s.map(esc).join('／') + '</span>' : ''}` },
    { sec:'ex', lang:'en', text: exText(w), show: `<span class="cw" style="font-size:18px;font-weight:500">${exHTML(w)}</span>` },
    { sec:'ex', lang:'ja', text: ja('訳。' + ftText(w)), show: `<span class="cw" style="font-size:16px;font-weight:500">${exHTML(w)}</span><br>→ ${ftHTML(w)}`, openFt:true },
    { sec:'tip', lang:'ja', text: ja('覚え方。' + w.tip), show: '<b style="color:var(--gold)">覚え方</b>　' + esc(w.tip) + derHTML(w) },
    { sec:'w', lang:'en', text: head + '.', show: `<b class="cw">${esc(w.w)}</b>　＝　<b style="color:var(--shu)">${esc(w.m)}</b>` },
  ];
}
function lessonPlay(){
  const i = L.ids[L.k], parts = lessonParts(i), seq = ++L.seq, slide = $('.ov .slide'), no = noOf(i);
  L.playing = true; setPlayIcon(); slide.classList.add('speaking');
  const bar = $('.ov .pbar i'), lt = $('.ov .lt');
  const show = k => { const p = parts[Math.min(k, parts.length-1)]; if(p.openFt) setTimeout(() => { $$('.ov .ftw').forEach(f => f.classList.add('open')); fitSlide($('.ov')); }, 0); slide.querySelectorAll('.hl').forEach(h => h.classList.toggle('now', h.dataset.sec === p.sec)); const cap = $('.ov .cap'); if(cap) cap.innerHTML = p.show; };
  stopSpeech(); stopSpk(); clearInterval(L.timer);
  const rec = audRec(i);
  if(S.cfg.voice && S.cfg.voiceMode !== 'device' && rec){
    const a = L.audio = new Audio(AUD + no + '.mp3?h=' + (rec.h || VER));
    a.playbackRate = S.cfg.aRate; a.preservesPitch = true;
    let cur = -1;
    const total = rec.d / S.cfg.aRate;
    L.timer = setInterval(() => {
      if(seq !== L.seq) return;
      const t = a.currentTime; let k = 0;
      while(k + 1 < rec.t.length && t >= rec.t[k+1]) k++;
      if(k !== cur){ cur = k; show(k); }
      bar.style.width = Math.min(100, t / rec.d * 100) + '%';
      lt.textContent = clock(t / S.cfg.aRate) + ' / ' + clock(total);
    }, 150);
    a.onended = () => { if(seq === L.seq) lessonStop(true); };
    const fallback = () => { if(seq !== L.seq || !L.audio) return; L.audio = null; clearInterval(L.timer); ttsPlay(parts, seq, show, bar, lt); };
    a.onerror = fallback;
    show(0);
    const pr = a.play(); if(pr && pr.catch) pr.catch(fallback);
    return;
  }
  ttsPlay(parts, seq, show, bar, lt);
}
function ttsPlay(parts, seq, show, bar, lt){
  const t0 = Date.now();
  L.timer = setInterval(() => { const t = (Date.now() - t0) / 1000; bar.style.width = Math.min(100, t / 35 * 100) + '%'; lt.textContent = clock(t) + ' / 0:35'; }, 250);
  const hasTTS = 'speechSynthesis' in window && S.cfg.voice;
  let k = 0;
  const nextPart = () => {
    if(seq !== L.seq) return;
    if(k >= parts.length){ lessonStop(true); return; }
    const p = parts[k]; show(k); k++;
    if(hasTTS){
      const u = sayUtter(p.text, p.lang);
      u.onend = () => setTimeout(nextPart, 350);
      u.onerror = () => setTimeout(nextPart, 350);
      speechSynthesis.speak(u);
    }else setTimeout(nextPart, Math.max(2500, p.text.length * 180));
  };
  nextPart();
}
function lessonStop(ended){
  if(!L) return;

  L.seq++; L.playing = false; stopSpeech(); clearInterval(L.timer);
  if(L.audio){ try{ L.audio.pause(); }catch(e){} L.audio = null; }
  const slide = $('.ov .slide'); if(slide){ slide.classList.remove('speaking'); slide.querySelectorAll('.hl').forEach(h => h.classList.remove('now')); }
  setPlayIcon();
  if(ended && L.k < L.ids.length - 1) toast('次の単語へ ›（右下のボタン）');
}

let T = null;
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
/* その日のテストを、まだ覚えていないうちに始めようとしたら、先に「覚える時間」をすすめる。
   その日の記録に残るのは1回目の正答率なので、覚える前に解くと低いまま残ってしまう（古文単語の塾生の声から）。 */
function testOrStudy(n){
  const studied = S.study.some(x => x.n === n) || S.timer;
  if(studied || S.days[n]){ startDayTest(n); return; }
  const bg = sheet(`<h2>先に覚えましょう</h2>
    <p>このアプリは <b>① 覚える → ② テスト</b> の順番です。</p>

    <div style="margin-top:14px"><button class="btn" data-a="study">① 覚える時間へ</button>
    <button class="btn sub" data-a="test">覚えたので、テストする</button></div>`);
  bg.querySelector('[data-a=study]').onclick = () => { bg.remove(); openStudy(n); };
  bg.querySelector('[data-a=test]').onclick = () => { bg.remove(); startDayTest(n); };
}
function startDayTest(n){
  const p = plan(n);
  startTest({ ids: p.ids, type:'day', plan:n, label:`第${p.lap}周 Day${p.d}（${p.from+1}〜${p.to}）` });
}

function startTest(o){
  if(S.timer) endStudy(true);
  closeOv();
  const dir = S.cfg.dir === 'mix' ? null : S.cfg.dir;
  T = { ...o, order: shuffle(o.ids), k:0, ok:0, wrong:[], t0: Date.now(), dir, answered:false, timer:null, xp:0, xp0: S.xp };
  makeOv();
  T.timer = setInterval(() => { const e = $('.ov .tm'); if(e && T) e.textContent = clock((Date.now() - T.t0) / 1000); }, 500);
  drawQ();
}
function choicesFor(i, dir){
  const w = W[i];
  const fp = p => (p || '').split('・')[0];
  const same = W.filter(x => x.i !== i && fp(x.p) === fp(w.p) && x.m !== w.m);
  const pool = shuffle(same.length >= 3 ? same : W.filter(x => x.i !== i && x.m !== w.m));
  const picked = [], seen = new Set([dir === 'm2w' ? w.w : w.m]);
  for(const x of pool){ const key = dir === 'm2w' ? x.w : x.m; if(seen.has(key)) continue; seen.add(key); picked.push(x.i); if(picked.length === 3) break; }
  return shuffle([i, ...picked]);
}
/* ---- 書いて答える（意味→英語）・例文の穴埋め ----
   大文字・小文字、前後の空白、記号のちがいは気にしない。熟語の ~・A・B・do は書かなくてよい。
   one's は my / your / his などでも正解。 */
const POSS = /\b(my|your|his|her|its|our|their|one's)\b/g, REFL = /\b(myself|yourself|himself|herself|itself|ourselves|yourselves|themselves|oneself)\b/g;
function normEn(v){
  return (v || '').normalize('NFKC').toLowerCase().replace(/[’‘`]/g, "'").replace(POSS, "one's").replace(REFL, 'oneself')
    .replace(/[~…〜～]/g, ' ').replace(/[^a-z' -]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
}
function headVariants(w){
  const h = w.w;
  const noPh = h.replace(/~ing/g, ' ').replace(/[~…]/g, ' ').replace(/\b[AB]\b/g, ' ').replace(/\bdo\s*$/, ' ');
  return [h, noPh, h.replace(/[~…]/g, ' ')];
}
function blankParts(w){ return [...w.ex.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]); }
function answersFor(i, mode){
  const w = W[i], ok = new Set();
  if(mode === 'cloze') ok.add(normEn(blankParts(w).join(' ')));
  else headVariants(w).forEach(x => ok.add(normEn(x)));
  ok.delete('');
  return ok;
}
function perfectFor(i, mode){ const w = W[i]; return mode === 'cloze' ? blankParts(w).join(' … ') : w.w; }
/* 穴埋め：[ ] を空らんにして、1文字目だけヒントに出す（英検の書く問題と同じく、つづりまで覚えたか確かめる） */
function clozeHTML(w){
  return esc(w.ex).replace(/\[([^\]]+)\]/g, (m, x) => `<span class="blank hint1">${x.split(/\s+/).map(t => esc(t[0]) + '_'.repeat(Math.max(2, t.length - 1))).join(' ')}</span>`);
}

/* 正解・不正解の記録（4択も書く問題も共通） */
function recordAnswer(ok, i){
  const s = ws(i), t = today();
  if(ok){
    T.ok++; s.c++; s.sk++;
    gainXP(T.type === 'remind' ? 3 : 2, '正解');
    if(s.sk === 2) gainXP(5, '定着');
    if(T.type === 'remind' && s.due){ s.st++; if(s.st >= GAPS.length){ s.st = 0; s.due = ''; } else s.due = addDays(t, GAPS[s.st]); }
  }else{
    s.x++; s.sk = 0; s.st = 0; s.due = addDays(t, GAPS[0]);
    T.wrong.push(i);
  }
  save();
}
function wrongFB(w, pre){
  return `<div class="fb">${pre || ''}<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><span class="fw" style="font-weight:600">${esc(w.w)}</span> <span class="ph">${esc(w.ph || '')}</span>　<span class="fm">${esc(w.m)}</span></div>${spkBtn(w.i)}</div>${w.s.length ? `<div class="dim">ほかに：${w.s.map(esc).join('／')}</div>` : ''}<div style="margin-top:6px;font-family:Lexend,sans-serif;font-size:14.5px">${exHTML(w)}</div><div class="dim" style="font-size:14px">→ ${ftHTML(w)}</div><div style="margin-top:6px">${esc(w.tip)}</div></div>
      <button class="btn" style="margin-top:10px" id="btnNext">次へ</button>`;
}
function answer(c){
  if(T.answered) return;
  T.answered = true;
  const i = T.order[T.k], ok = c === i;
  $$('.ov .choice').forEach(b => { b.disabled = true; const v = +b.dataset.c; if(v === i) b.classList.add('ok'); else if(v === c) b.classList.add('ng'); });
  $('.ov [data-a=idk]').classList.add('hidden');
  recordAnswer(ok, i);
  if(ok) setTimeout(next, 450);
  else { $('#fb').innerHTML = wrongFB(W[i]); bindSpk($('#fb')); $('#btnNext').onclick = next; }
}
function answerTyped(val){
  if(T.answered) return;
  const i = T.order[T.k], w = W[i], mode = T.curDir;
  const v = val == null ? '' : normEn(val);
  const ok = !!v && answersFor(i, mode).has(v);
  const perfect = perfectFor(i, mode);
  T.answered = true;
  recordAnswer(ok, i);
  if(ok){
    T.lastOK = `○ 正解　<b style="font-family:Lexend,sans-serif">${esc(perfect)}</b>${mode === 'cloze' && normEn(perfect) !== normEn(w.w) ? `（${esc(w.w)}）` : ''}`;
    next();   // すぐ次へ（iPhone でキーボードを閉じないように、押した流れのまま次の問題を出す）
    return;
  }

  const pre = `<div class="dim" style="margin-bottom:4px">${val == null ? 'わからない' : 'あなたの答え：' + esc(val)}　→　正解は <b style="color:var(--ink);font-family:Lexend,sans-serif">${esc(perfect)}</b></div>`;

}

  };
}

/* ===================== 覚える時間（自分で決めたタイマー。のこり時間は画面の上） ===================== */
let tick = null, AC = null;
function openStudy(n){
  if(S.timer){ openTimerMenu(); return; }
  const p = plan(n);
  let min = S.cfg.studyMin;
  const bg = sheet(`<h2>覚える時間</h2>
    <p class="dim">第${p.lap}周 Day${p.d}（No.${p.from+1}〜${p.to}）を、時間を決めて覚えます。のこり時間は画面のいちばん上に出ます。</p>
    <h3>時間</h3>
    <div class="chips" id="smin">${[3,5,10,15,20,30].map(m => `<button class="chipb" data-m="${m}">${m}分</button>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:8px"><span class="dim">自分で決める</span><input type="number" class="minin" id="sminIn" min="1" max="180" inputmode="numeric"><span>分</span></div>
    <h3>何で覚える？（あとから切りかえられます）</h3>
    <button class="btn" data-go="cards">⏱ カードで覚える（発音つき）</button>
    <button class="btn sub" data-go="list">⏱ 一覧で覚える（意味をかくせる）</button>
    <button class="btn sub" data-go="lesson">⏱ 1分解説で覚える</button>`);
  const paint = keepInput => {
    bg.querySelectorAll('#smin button').forEach(b => b.classList.toggle('on', +b.dataset.m === min));
    if(!keepInput) bg.querySelector('#sminIn').value = min;
  };
  bg.querySelectorAll('#smin button').forEach(b => b.onclick = () => { min = +b.dataset.m; paint(); });
  bg.querySelector('#sminIn').oninput = e => { const v = Math.round(+e.target.value); if(v >= 1 && v <= 180){ min = v; paint(true); } };
  bg.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    S.cfg.studyMin = min; save(); bg.remove();
    startTimer(n, min); goStudy(b.dataset.go, n);
  });
  paint();
}
function goStudy(kind, n){
  const p = plan(n);
  if(kind === 'cards') openCards(p.ids, `Day${p.d} のカード`, null, () => startDayTest(n));
  else if(kind === 'list') openList(p.ids, `Day${p.d} の一覧`);
  else openLessonPicker(p.ids, `Day${p.d} の1分解説`);
}
function openTimerMenu(){
  const t = S.timer; if(!t) return;
  const bg = sheet(`<h2>覚える時間　のこり ${clock(Math.ceil(leftSec()))}</h2>
    ${t.n != null ? `<button class="btn" data-go="cards">カードで覚える</button><button class="btn sub" data-go="list">一覧で覚える</button><button class="btn sub" data-go="lesson">1分解説で覚える</button>` : ''}
    <div class="row" style="margin-top:12px"><button class="btn sub" data-a="plus">＋3分</button><button class="btn shu" data-a="end">ここで終わる</button></div>
    ${t.n != null ? '<button class="btn line" data-a="test" style="margin-top:8px">終わってテストへ</button>' : ''}`);
  bg.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { bg.remove(); goStudy(b.dataset.go, t.n); });
  bg.querySelector('[data-a=plus]').onclick = () => { addTime(180); bg.remove(); toast('3分ふやしました'); };
  bg.querySelector('[data-a=end]').onclick = () => { bg.remove(); endStudy(); };
  if(bg.querySelector('[data-a=test]')) bg.querySelector('[data-a=test]').onclick = () => { bg.remove(); const n = t.n; startDayTest(n); };
}
function unlockAudio(){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(); g.gain.value = 0; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + .05);
  }catch(e){}
}
function chime(){
  try{
    if(AC){
      AC.resume();
      [784, 988, 1319].forEach((f, k) => {
        const d = AC.currentTime + k * .22, o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, d); g.gain.linearRampToValueAtTime(.3, d + .02); g.gain.exponentialRampToValueAtTime(.001, d + .7);
        o.connect(g); g.connect(AC.destination); o.start(d); o.stop(d + .75);
      });
    }
    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }catch(e){}
}
function startTimer(n, min){
  unlockAudio();
  S.timer = { n, total: min * 60, end: Date.now() + min * 60000, left: null };
  save(); showBar(); renderAll();
}
function leftSec(){ const t = S.timer; if(!t) return 0; return t.left != null ? t.left : Math.max(0, (t.end - Date.now()) / 1000); }
function addTime(sec){ const t = S.timer; if(!t) return; t.total += sec; if(t.left != null) t.left += sec; else t.end += sec * 1000; save(); updBar(); }
function showBar(){
  let b = $('#stBar');
  clearInterval(tick);
  if(!S.timer){ if(b) b.remove(); document.body.classList.remove('timing'); return; }
  if(!b){
    b = document.createElement('div'); b.id = 'stBar';
    b.innerHTML = `<button class="sb-l" data-a="menu"><span class="sb-t"></span><small></small></button><button class="sb-b" data-a="pause"></button><button class="sb-b" data-a="end">終わる</button><i class="sb-p"></i>`;
    document.body.appendChild(b);
    b.querySelector('[data-a=menu]').onclick = openTimerMenu;
    b.querySelector('[data-a=pause]').onclick = () => {
      const t = S.timer; if(!t) return;
      if(t.left == null){ t.left = leftSec(); } else { t.end = Date.now() + t.left * 1000; t.left = null; }
      save(); updBar();
    };
    b.querySelector('[data-a=end]').onclick = () => endStudy();
  }
  const t = S.timer, p = t.n != null && t.n < TOTAL ? plan(t.n) : null;
  b.querySelector('small').textContent = '覚える時間' + (p ? `　第${p.lap}周 Day${p.d}` : '') + '　（押すとメニュー）';
  document.body.classList.add('timing');
  document.documentElement.style.setProperty('--sbh', b.offsetHeight + 'px');
  tick = setInterval(updBar, 250);
  updBar();
}
function updBar(){
  const b = $('#stBar'), t = S.timer; if(!b || !t) return;
  const l = leftSec();
  b.querySelector('.sb-t').textContent = clock(Math.ceil(l));
  b.querySelector('.sb-p').style.width = Math.min(100, (1 - l / t.total) * 100) + '%';
  b.classList.toggle('low', l <= 60);
  b.classList.toggle('paused', t.left != null);
  b.querySelector('[data-a=pause]').textContent = t.left != null ? '再開' : '一時停止';
  if(l <= 0 && t.left == null) timeUp();
}
function recordStudy(secs){
  const t = S.timer, p = t.n != null && t.n < TOTAL ? plan(t.n) : null;
  if(secs >= 60) gainXP(Math.floor(secs / 60), '覚える時間');
  if(secs >= 5) S.study.push({ at: new Date().toISOString(), d: today(), n: t.n, label: p ? `第${p.lap}周 Day${p.d}（${p.from+1}〜${p.to}）` : '', secs: Math.round(secs) });
}
function endStudy(quiet){
  const t = S.timer; if(!t) return;
  const used = t.total - leftSec();
  recordStudy(used);
  S.timer = null; save(); showBar(); renderAll();
  if(!quiet) toast('覚える時間 ' + fmtSec(used) + ' を記録しました');
}
function timeUp(){
  const t = S.timer; if(!t) return;
  recordStudy(t.total);
  const n = t.n, total = t.total;
  S.timer = null; save(); showBar(); renderAll();
  chime();
  if(L && L.playing) lessonStop();
  const bg = sheet(`<div class="lvup"><div class="dim">覚える時間</div><div class="big" style="color:var(--shu)">時間です</div><p>${fmtSec(total)} 覚えました（記録ずみ）。</p></div>
    ${n != null && n < TOTAL ? '<button class="btn" data-a="test">テストへ進む</button>' : ''}
    <button class="btn sub" data-a="more">あと3分 覚える</button>`);
  if(bg.querySelector('[data-a=test]')) bg.querySelector('[data-a=test]').onclick = () => { bg.remove(); startDayTest(n); };
  bg.querySelector('[data-a=more]').onclick = () => { bg.remove(); startTimer(n, 3); };
}

/* タイマーを使わずに カード・一覧・1分解説 で覚えた時間も記録する（古文単語の塾生の声：一覧で覚えた時間が入らない）。
   画面をとじたり、アプリを裏にしたりしたら止まる。1回のまとまりは最大30分まで数える。 */
const KIND = { cards:'カード', list:'一覧', lesson:'1分解説' };
let SESS = null;
function sessStart(kind, ids){
  sessEnd();
  if(S.timer) return;   // タイマー中はタイマーのほうで数える
  const cur = curN(); let n = null;
  if(cur < TOTAL){ const p = plan(cur); if(ids.length && ids.every(i => i >= p.from && i < p.to)) n = cur; }
  SESS = { kind, n, t0: Date.now(), secs: 0 };
}
function sessPause(){ if(SESS && SESS.t0){ SESS.secs += Math.min(1800, (Date.now() - SESS.t0) / 1000); SESS.t0 = 0; } }
function sessResume(){ if(SESS && !SESS.t0 && $('.ov')) SESS.t0 = Date.now(); }
function sessEnd(){
  if(!SESS) return;
  sessPause();
  const x = SESS; SESS = null;
  if(x.secs < 10) return;
  const p = x.n != null ? plan(x.n) : null;
  S.study.push({ at: new Date().toISOString(), d: today(), n: x.n, kind: x.kind, label: p ? `第${p.lap}周 Day${p.d}（${p.from+1}〜${p.to}）` : '', secs: Math.round(x.secs) });
  save();
  if(x.secs >= 60) gainXP(Math.floor(x.secs / 60), '覚えた時間');
}

/* 一覧で覚える（意味をかくして、押すと見える） */

        <p class="dim" style="margin:0 2px 8px">${hide ? '意味を思い出してから、行を押して答えを見る。もう一度押すと、またかくれます。開いたものは、ほかの画面に行っても残ります。' : '行を押すと、覚え方と例文が見られます。'}右の ▶ で1分解説。</p>

    ov.querySelectorAll('.lrow').forEach(r => r.onclick = () => {
      const i = +r.dataset.i;
      // 「意味をかくす」のときは、押すたびに 見える ⇔ かくれる（保存される）。「意味を見せる」のときは詳しい画面へ。
      if(hide){ if(S.listOpen[i]) delete S.listOpen[i]; else S.listOpen[i] = true; save(); draw(); }
      else openWord(i, ids);
    });
  };
  draw();
  if(scrollTo) ov.scrollTop = scrollTo;
}

function openGuide(start){
  const G = guideSlides();
  const el = document.createElement('div'); el.className = 'guide';
  el.innerHTML = `<button class="gskip" data-a="skip">スキップ</button>
    <div class="gtrack">${G.map((g, k) => `<section class="gslide"><div class="num">${k+1} / ${G.length}</div><h2>${g.t}</h2><div class="gvis">${g.v}</div>${g.p.map(x => `<p>${x}</p>`).join('')}</section>`).join('')}</div>
    <div class="gdots">${G.map(() => '<i></i>').join('')}</div>
    <div class="gnav"><button class="btn sub" data-a="prev" style="flex:1">もどる</button><button class="btn" data-a="next" style="flex:2">次へ</button></div>`;
  document.body.appendChild(el);
  const tr = el.querySelector('.gtrack'), dots = el.querySelectorAll('.gdots i');
  const cur = () => Math.round(tr.scrollLeft / tr.clientWidth);
  const paint = () => {
    const k = cur();
    dots.forEach((d, j) => d.classList.toggle('on', j === k));
    el.querySelector('[data-a=prev]').style.visibility = k ? 'visible' : 'hidden';
    el.querySelector('[data-a=next]').textContent = k === G.length - 1 ? 'はじめる' : '次へ';
  };
  const close = () => { S.guideSeen = true; save(); el.remove(); };
  tr.addEventListener('scroll', () => requestAnimationFrame(paint));
  el.querySelector('[data-a=next]').onclick = () => { const k = cur(); if(k >= G.length - 1) close(); else tr.scrollTo({ left: (k + 1) * tr.clientWidth, behavior:'smooth' }); };
  el.querySelector('[data-a=prev]').onclick = () => tr.scrollTo({ left: Math.max(0, cur() - 1) * tr.clientWidth, behavior:'smooth' });
  el.querySelector('[data-a=skip]').onclick = close;
  if(start) requestAnimationFrame(() => { tr.scrollLeft = start * tr.clientWidth; paint(); });
  paint();
}
$('#btnHelp').onclick = () => openGuide(0);

function sheet(html){
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><div class="grab"></div>${html}<button class="close">閉じる</button></div>`;
  document.body.appendChild(bg);
  bg.querySelector('.close').onclick = () => bg.remove();
  bg.addEventListener('click', e => { if(e.target === bg) bg.remove(); });
  return bg;
}
let toastT;
function toast(msg){ $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }
async function copyText(s, msg){
  try{ await navigator.clipboard.writeText(s); toast(msg || 'コピーしました'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(msg || 'コピーしました'); }catch(e2){ toast('コピーできませんでした'); } ta.remove(); }
}

/* ===================== 更新の確認（他のアプリと同じ仕組み） ===================== */
let newVer = 0;
async function checkUpdate(silent){
  try{
    const res = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw 0;
    const j = await res.json(), v = Number(j.v) || 0;
    if(v > VER){ newVer = v; $('#tabDot').classList.remove('hidden'); if(curTab() === 'set') renderSet(); }
    else{ $('#tabDot').classList.add('hidden'); if(!silent) toast('いまが最新です（v' + VER + '）'); }
  }catch(e){ if(!silent) toast('調べられませんでした'); }
}
async function doUpdate(){
  save(); toast('更新しています…');
  try{
    if('serviceWorker' in navigator){ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(x => x.unregister())); }
    if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
}
document.addEventListener('visibilitychange', () => { if(!document.hidden){ checkUpdate(true); checkDayChange(); if(S.timer) updBar(); sessResume(); } else { sessPause(); save(); stopSpk(); if(L && L.playing) lessonStop(); } });
window.addEventListener('pagehide', save);

/* 起動 */

renderToday();
checkInstall();
checkUpdate(true);
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
