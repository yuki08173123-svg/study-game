<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Theater</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c0f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Theater">
<style>
:root{
  --bg:#0b0c0f; --surf:#15171c; --surf2:#1c1f26; --surf3:#242830;
  --line:#22252c; --line2:#2f333c;
  --ink:#edeff3; --ink2:#a3a8b3; --ink3:#6d727d;
  --acc:#d9b26a; --acc-soft:#2a2317; --acc-ink:#12130f;
  --ok:#4bb98a;
  --r:14px;
  --tabh:60px;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt" 1;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:1rem}
button{cursor:pointer;border:none;background:none;color:inherit;padding:0;
  -webkit-user-select:none;user-select:none}
input,textarea{background:var(--surf2);border:1px solid var(--line2);border-radius:10px;
  padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.hidden{display:none!important}
svg{display:block;flex:none}
img{display:block}

/* ---------- 骨格 ---------- */
#top{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 70%,rgba(11,12,15,0));
  padding-top:env(safe-area-inset-top)}
.tbar{max-width:680px;margin:0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:8px 16px}
.tbar .ttl{font-size:1.34rem;font-weight:700;letter-spacing:.06em;flex:1}
.tbtn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);background:var(--surf);border:1px solid var(--line)}
.tbtn:active{opacity:.55}
main{max-width:680px;margin:0 auto;
  padding:2px 16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom))}

/* ---------- 見出し ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 11px}
.sec h2{font-size:.96rem;font-weight:700;letter-spacing:.04em;margin:0}
.sec .more{font-size:.78rem;font-weight:700;color:var(--ink3);padding:4px}
.sec .more:active{opacity:.5}
.lead{color:var(--ink2);font-size:.86rem;margin:2px 2px 0}

/* ---------- 動画カード（横並び） ---------- */
.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{position:relative;display:flex;width:100%;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:10px;transition:transform .12s}
.vcard:active{transform:scale(.988)}
.vmain{flex:1;min-width:0;display:flex;gap:13px;text-align:left}
.vmain:active{opacity:.7}
/* 見終わりの丸ボタン。押すたびに1回ずつ増える */
.ctr{position:absolute;right:9px;bottom:9px;display:flex;align-items:center;gap:6px}
.seenbtn{width:40px;height:40px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink3);border-radius:12px;
  border:1px solid var(--line2);background:var(--surf2)}
/* 押し間違えたら すぐ1つ減らせるように、数字の左に置く */
.minusbtn{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:10px;border:1px solid var(--line2);background:var(--surf2);color:var(--ink2)}
.minusbtn:active{transform:scale(.9);background:var(--surf3)}
.seenbtn:active{transform:scale(.9)}
.seenbtn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seenbtn .cnt{font-size:1rem;font-weight:800;font-variant-numeric:tabular-nums}
/* 見た動画は サムネに金のふちを付ける（タイトル画像を隠さないように） */
.thumb.on::after{content:'';position:absolute;inset:0;border-radius:10px;
  box-shadow:inset 0 0 0 2px var(--acc);pointer-events:none}
/* 見た回数のつぶ。反復するほど増えていく */
.dots{display:inline-flex;align-items:center;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);display:block}
.dots b{font-size:.7rem;font-weight:800;color:var(--acc);margin-left:1px}
.thumb{position:relative;width:152px;flex:none;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:var(--surf3)}
@media (max-width:359px){ .thumb{width:126px} }
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .lm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;background:linear-gradient(140deg,#2b2f3a,#171a20);color:var(--acc)}
.thumb .lm b{font-size:.6rem;font-weight:800;letter-spacing:.14em;color:var(--ink3)}
.thumb .dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.78);color:#fff;
  font-size:.66rem;font-weight:700;padding:1px 5px;border-radius:5px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.thumb .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22)}
.thumb .pbar i{display:block;height:100%;background:var(--acc)}
.vmeta{flex:1;min-width:0;padding:2px 2px 0 0;display:flex;flex-direction:column}
.vt{font-size:1rem;font-weight:700;line-height:1.45;letter-spacing:.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vs{margin-top:auto;font-size:.72rem;color:var(--ink3);font-weight:600;letter-spacing:.03em;
  display:flex;align-items:center;gap:6px;padding-top:5px;padding-right:46px;min-height:22px}
.vcard.n .vs{padding-right:92px}
.tag{color:var(--acc);background:var(--acc-soft);border-radius:20px;padding:2px 8px;font-size:.68rem;
  font-weight:700;letter-spacing:.04em;white-space:nowrap}

/* ---------- 続きから（大きいカード） ---------- */
.big{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.big:active{transform:scale(.993)}
.big .thumb{width:100%;border-radius:0}
.big .thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;background:rgba(11,12,15,.72);
  display:flex;align-items:center;justify-content:center;color:#fff;backdrop-filter:blur(4px)}
.big .bt{padding:12px 14px 14px}
.big .bt .vt{-webkit-line-clamp:2}
.big .bt .vs{padding-top:7px}

/* ---------- 区分タイル（ホーム） ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:16px;
  padding:15px 15px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;
  min-height:100px;transition:transform .12s}
.tile:active{transform:scale(.985);background:var(--surf2)}
.tile .tn{font-size:1.02rem;font-weight:700;letter-spacing:.02em;line-height:1.35}
.tile .tc{font-size:.74rem;color:var(--ink3);font-weight:700;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;margin-top:auto}
.bar{height:5px;border-radius:3px;background:var(--surf3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}

/* ---------- 区分の中（ジャンル見出し） ---------- */
.chead{margin:4px 2px 0}
.chead h1{font-size:1.46rem;font-weight:700;letter-spacing:.03em;margin:0 0 7px;line-height:1.3}
.chead .st{font-size:.79rem;color:var(--ink3);font-weight:700;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.chead .bar{margin-top:11px}
.gsec{display:flex;align-items:center;gap:10px;margin:26px 2px 11px;
  font-size:.85rem;font-weight:800;color:var(--acc);letter-spacing:.06em}
.gsec::after{content:'';flex:1;height:1px;background:var(--line)}
.gsec .n{color:var(--ink3);font-weight:700;font-size:.72rem}

/* ---------- チップ ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 2px;margin:0 -16px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);
  font-size:.83rem;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip:active{opacity:.6}

/* ---------- 空・注意 ---------- */
.empty{text-align:center;color:var(--ink3);font-size:.88rem;padding:56px 20px;line-height:2}
.note{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;color:var(--ink2);font-size:.85rem;line-height:1.85}

/* ---------- 行 ---------- */
.group{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 15px;min-height:54px;width:100%;
  text-align:left;position:relative}
.item + .item::before{content:'';position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line)}
.item:active{background:var(--surf2)}
.item .nm{flex:1;font-size:.93rem;font-weight:600}
.item .ct{font-size:.82rem;color:var(--ink3)}
.item .chev{color:var(--ink3);opacity:.6}
.sw{width:46px;height:28px;border-radius:20px;background:var(--surf3);position:relative;flex:none;
  transition:background .18s}
.sw i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .18s}
.sw.on{background:var(--acc)}
.sw.on i{transform:translateX(18px)}

/* ---------- ボタン ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:48px;
  border-radius:12px;background:var(--surf2);border:1px solid var(--line2);
  font-size:.93rem;font-weight:700;letter-spacing:.02em}
.btn:active{opacity:.6}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{height:40px;font-size:.85rem}

/* ---------- タブバー ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(11,12,15,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:680px;margin:0 auto;height:var(--tabh);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink3);font-size:.66rem;font-weight:700;letter-spacing:.04em}
.tab.on{color:var(--acc)}
.tab:active{opacity:.6}

/* ---------- 再生画面 ---------- */
#pv{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;
  overscroll-behavior:contain}
.pvtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--bg)}
.pvtop .nm{flex:1;font-size:.82rem;font-weight:700;color:var(--ink2);letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{background:#000}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;margin:0 auto;background:#000;overflow:hidden}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Loom はプレーヤーを差し替えられないので、Loom自身の画面をそのまま使う。
   おすすめ動画に流されるつくりではないので、これで問題ない */
#loomfr{z-index:3}
/* iframe への直接タップを止め、YouTubeへ飛ばさない */
.catch{position:absolute;inset:0;z-index:2}
.catch.off{pointer-events:none}
.poster{position:absolute;inset:0;z-index:4;background:#000;display:flex;
  align-items:center;justify-content:center}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.bigplay{position:relative;width:68px;height:68px;border-radius:50%;background:var(--acc);
  color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.bigplay:active{transform:scale(.94)}
.phint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#cfd3da;
  font-size:.76rem;font-weight:600;text-shadow:0 1px 6px #000}
.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:26px 10px 8px;
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.82));transition:opacity .22s}
.ctrl.fade{opacity:0;pointer-events:none}
.seekrow{display:flex;align-items:center;gap:9px;padding:0 4px}
.tm{font-size:.7rem;font-weight:700;color:#dfe2e8;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seek{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:none;padding:0;border:0}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:3px;
  background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.3)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--acc);margin-top:-4.5px}
.seek::-moz-range-track{height:4px;border-radius:3px;background:rgba(255,255,255,.3)}
.seek::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--acc)}
.btnrow{display:flex;align-items:center;gap:4px;padding:2px 2px 0}
.pb{height:40px;min-width:40px;padding:0 8px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;gap:3px;color:#fff;font-size:.72rem;font-weight:700}
.pb:active{background:rgba(255,255,255,.14)}
.pb.main{background:rgba(255,255,255,.14)}
.pb .n{font-size:.6rem;font-weight:800;letter-spacing:0}
.sp{flex:1}
.endcard{position:absolute;inset:0;z-index:5;background:rgba(6,7,9,.93);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center}
.endcard .ttl{font-size:.94rem;font-weight:700}
.endcard .row{display:flex;gap:9px;width:100%;max-width:340px}
.pvbody{max-width:680px;margin:0 auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
.pvbody h1{font-size:1.06rem;font-weight:700;line-height:1.55;margin:0 0 8px;letter-spacing:.01em}
.pvbody .desc{color:var(--ink2);font-size:.88rem;line-height:1.9;white-space:pre-wrap;margin-top:12px}
.acts{display:flex;gap:9px;margin-top:14px}
.acts .btn{flex:1}
#pv.exp{overflow:hidden}
#pv.exp .stage{position:fixed;inset:0;z-index:80;background:#000;display:flex;
  align-items:center;justify-content:center}
/* flexの中で縮まないように flex:none を付ける（付けないと動画が小さくなる） */
#pv.exp .vwrap{flex:none;width:min(100vw,177.78vh)}
#pv.exp.rot .vwrap{flex:none;width:min(100vh,177.78vw);transform:rotate(90deg)}

/* ---------- 下から出るシート ---------- */
#sheet{position:fixed;inset:0;z-index:95;background:rgba(4,5,7,.66);
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sh{width:100%;max-width:680px;background:var(--surf);border:1px solid var(--line);
  border-bottom:0;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:78vh;overflow-y:auto}
.sh .grip{width:40px;height:4px;border-radius:3px;background:var(--surf3);margin:0 auto 12px}
.sh h3{font-size:1.02rem;font-weight:700;margin:2px 2px 12px;letter-spacing:.02em}
.frow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 12px;
  border-radius:12px;background:var(--surf2);border:1px solid var(--line2);margin-bottom:9px}
.frow:active{opacity:.7}
.frow.on{border-color:var(--acc);background:var(--acc-soft)}
.frow .fn{flex:1;font-size:.96rem;font-weight:700}
.frow .fc{font-size:.76rem;color:var(--ink3);font-weight:700}
.frow .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--acc-ink)}
.frow.on .bx{background:var(--acc);border-color:var(--acc)}

/* ---------- 使い方スライド（小中学生でも読めるよう 大きめの文字） ---------- */
#guide{position:fixed;inset:0;z-index:98;background:var(--bg);display:flex;flex-direction:column}
.gtop{display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;min-height:46px}
.gskip{color:var(--ink3);font-size:.92rem;font-weight:700;padding:10px 12px}
.gbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:10px 24px;gap:24px}
.gic{width:108px;height:108px;border-radius:50%;background:var(--acc-soft);color:var(--acc);
  display:flex;align-items:center;justify-content:center;flex:none}
.gt{font-size:1.66rem;font-weight:800;line-height:1.45;letter-spacing:.02em}
.gd{font-size:1.1rem;line-height:2;color:var(--ink2);font-weight:600;max-width:430px}
.gd b{color:var(--ink);font-weight:800}
.gfoot{padding:0 20px calc(26px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:18px}
.gdots{display:flex;gap:7px}
.gdots i{width:9px;height:9px;border-radius:50%;background:var(--surf3);display:block;transition:width .2s}
.gdots i.on{background:var(--acc);width:24px;border-radius:5px}
.gbtns{display:flex;gap:10px;width:100%;max-width:430px}
.gbtns .btn{height:58px;font-size:1.06rem;font-weight:800}

/* ---------- そのほか ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 26px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:90;background:var(--surf3);border:1px solid var(--line2);
  color:var(--ink);padding:10px 18px;border-radius:24px;font-size:.85rem;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:86vw;
  display:flex;align-items:center;gap:14px}
.toast.act{pointer-events:auto;padding-right:8px;padding-left:20px;max-width:94vw}
.toast.act span{white-space:nowrap}
.toast .undo{color:var(--acc);font-weight:800;font-size:.85rem;padding:6px 12px;
  border-radius:16px;background:var(--acc-soft);flex:none}
.toast .undo:active{opacity:.6}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ver{text-align:center;color:var(--ink3);font-size:.72rem;letter-spacing:.06em;
  margin:26px 0 4px;font-weight:600}
.fld{margin-top:14px}
.fld label{display:block;font-size:.76rem;font-weight:700;color:var(--ink3);
  letter-spacing:.05em;margin-bottom:6px}
textarea{min-height:96px;resize:vertical;line-height:1.7;font-size:.88rem}
select{background:var(--surf2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;
  width:100%;outline:none;-webkit-appearance:none;appearance:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem;line-height:1.6}
</style>
</head>
<body>
<div id="top"><div class="tbar" id="tbar"></div></div>
<main id="main"></main>
<nav id="tabs"><div class="in" id="tabin"></div></nav>
<div class="toast" id="toast"></div>
<div id="sheet" class="hidden"><div class="sh" id="shin"></div></div>
<div id="guide" class="hidden"></div>

<div id="pv" class="hidden">
  <div class="pvtop">
    <button class="tbtn" id="pvback" aria-label="もどる"></button>
    <div class="nm" id="pvnm"></div>
  </div>
  <div class="stage" id="stage">
    <div class="vwrap" id="vwrap">
      <div id="yt"></div>
      <iframe id="loomfr" class="hidden" allowfullscreen></iframe>
      <div class="catch" id="catch"></div>
      <div class="ctrl fade" id="ctrl"></div>
      <div class="poster" id="poster"><img id="posterimg" alt=""><button class="bigplay" id="bigplay"></button><div class="phint hidden" id="phint"></div></div>
      <div class="endcard hidden" id="endcard"></div>
    </div>
  </div>
  <div class="pvbody" id="pvbody"></div>
</div>

<script>
'use strict';
/* ===================== 定数 ===================== */
const VER = 12;
const K_PROG='th_prog', K_FAV='th_fav', K_CFG='th_cfg', K_CACHE='th_cache', K_ADM='th_adm',
      K_FOLD='th_folders';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const now = () => Date.now();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>

let prog = {};            /* {動画id: {t:秒, d:全体の秒, done:1, last:時刻}} */
let favs = [];
let folders = [];       /* 生徒が自分で作るフォルダ [{id, name, ids:[]}] */
let cfg  = { speed:1, autonext:true };
let view = { name:'home' };
let admin = null;         /* 管理画面のしたがき */

function load(){
  try{ prog = JSON.parse(localStorage.getItem(K_PROG) || '{}'); }catch(e){ prog = {}; }
  try{ favs = JSON.parse(localStorage.getItem(K_FAV)  || '[]'); }catch(e){ favs = []; }
  try{ folders = JSON.parse(localStorage.getItem(K_FOLD) || '[]'); }catch(e){ folders = []; }
  if(!Array.isArray(folders)) folders = [];
  try{ Object.assign(cfg, JSON.parse(localStorage.getItem(K_CFG) || '{}')); }catch(e){}
}
const saveProg = () => localStorage.setItem(K_PROG, JSON.stringify(prog));
const saveFav  = () => localStorage.setItem(K_FAV,  JSON.stringify(favs));
const saveFold = () => localStorage.setItem(K_FOLD, JSON.stringify(folders));
const foldOf   = fid => folders.find(f => f.id === fid);
const foldCount = id => folders.filter(f => f.ids.includes(id)).length;
const inFold   = (fid, id) => { const f = foldOf(fid); return !!(f && f.ids.includes(id)); };
function toggleFold(fid, id){
  const f = foldOf(fid); if(!f) return;
  if(f.ids.includes(id)) f.ids = f.ids.filter(x => x !== id);
  else f.ids.unshift(id);
  saveFold();
}
function newFolder(name){
  const f = { id:'f' + now() + Math.floor(Math.random()*1000), name:name.trim().slice(0,24), ids:[] };
  folders.push(f); saveFold(); return f;
}
const saveCfg  = () => localStorage.setItem(K_CFG,  JSON.stringify(cfg));

/* ===================== 小道具 ===================== */
function toast(msg, action){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  t.classList.toggle('act', !!action);
  if(action){
    const b = document.createElement('button');
    b.className = 'undo'; b.textContent = action.label;
    b.onclick = () => { t.classList.remove('on'); action.fn(); };
    t.appendChild(b);
  }
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), action ? 5000 : 2000);
}
function hhmm(sec){
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
}
function ymd(d){
  if(!d) return '';
  const m = String(d).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? `${+m[2]}/${+m[3]}` : String(d);
}
const vid = id => DATA.videos.find(v => v.id === id);
/* videos は新しい順で持っている。asc のカテゴリだけ ひっくり返して古い順にする */
const catAsc = c => !!(DATA.cats.find(x => x.id === c) || {}).asc;
const catOf  = c => DATA.cats.find(x => x.id === c) || {};
/* その区分に出てくるジャンルを、videos.json の genreOrder の順に並べて返す */
function genresIn(c){
  const gs = [...new Set(inCat(c).map(v => v.g).filter(Boolean))];
  const o = DATA.genreOrder || [];
  return gs.sort((a,b) => (o.indexOf(a) + 1 || 99) - (o.indexOf(b) + 1 || 99));
}
/* タイトルの中の数字（【マインド動画５７】→ 57）。範囲チップの見出しに使う */
function numOf(v){
  const t = String(v.t).replace(/[０-９]/g, c => '０１２３４５６７８９'.indexOf(c));
  const m = t.match(/(\d+)/);
  return m ? m[1] : null;
}
const inCat  = c => {
  let l = DATA.videos.filter(v => v.cat === c);
  if(catAsc(c)) l = l.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'') || a._i - b._i);
  /* pin を付けた動画（実績動画についてなど）は、いつも先頭に置く */
  const pinned = l.filter(v => v.pin);
  return pinned.length ? pinned.concat(l.filter(v => !v.pin)) : l;
};
const catName = c => (DATA.cats.find(x => x.id === c) || {}).name || '';
/* Loom のサムネイルは外から取れないので、代わりの絵を描く */
const thumbHTML = id => isLoom(id)
  ? `<span class="lm">${ICO.play({s:20})}<b>Loom</b></span>`
  : `<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy">`;
/* 動画の長さは videos.json に書かなくてよい。再生したときに覚える */
const durOf = v => (prog[v.id] && prog[v.id].d) || v.sec || 0;
const ratio = v => { const p = prog[v.id]; const d = durOf(v);
  return (p && d) ? Math.min(1, p.t / d) : 0; };
/* 見た回数。反復視聴するほど増える。
   古い記録（done だけ持っている）は 1回として読む */
function seenN(id){
  const p = prog[id];
  if(!p) return 0;
  return p.n != null ? p.n : (p.done ? 1 : 0);
}
function addSeen(id, delta){
  const p = prog[id] || (prog[id] = { t:0, d:0 });
  const n = Math.max(0, seenN(id) + delta);
  p.n = n; p.done = n > 0 ? 1 : 0; p.last = now();
  saveProg();
  return n;
}
/* 連打で数が跳ね上がらないようにする。
   同じ動画を 1.5秒以内にもう一度押しても数えない。
   押したあとは「もどす」を出して、すぐ取り消せるようにする。 */
let lastBump = { id:'', at:0 };
function bumpSeen(id, after){
  const t = now();
  if(lastBump.id === id && t - lastBump.at < 1500){
    lastBump.at = t;
    toast(`${seenN(id)}回のまま（続けて押しても数えません）`);
    return;
  }
  lastBump = { id, at:t };
  const n = addSeen(id, 1);
  if(after) after();
  toast(n === 1 ? '見終わりにしました' : `${n}回目にしました`);
}
function clearSeen(id){
  const p = prog[id]; if(!p) return;
  p.n = 0; p.done = 0; p.last = now(); saveProg();
}
const isDone = v => seenN(v.id) > 0;
/* 倍速は動画ごとに覚える。まだ決めていない動画は 設定の「はじめの速さ」を使う */
const SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
const speedOf = id => (prog[id] && prog[id].sp) || cfg.speed || 1;
function setSpeed(id, sp){
  const p = prog[id] || (prog[id] = { t:0, d:0 });
  p.sp = sp; saveProg();
  try{ player && playerReady && player.setPlaybackRate(sp); }catch(e){}
}
const isFav  = id => favs.includes(id);

/* YouTube・Loom のURLやIDのどんな形からでも、扱えるIDを取り出す。
   Loom は 'loom:' を付けた32桁で持つ（プレミア動画がLoomのため） */
function ytId(s){
  s = String(s || '').trim();
  const l = s.match(/^loom:([0-9a-f]{32})$/) || s.match(/loom\.com\/(?:share|embed)\/([0-9a-f]{32})/);
  if(l) return 'loom:' + l[1];
  if(/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|\/embed\/|youtu\.be\/|\/live\/|\/shorts\/|\/v\/)([\w-]{11})/);
  return m ? m[1] : '';
}
const isLoom = id => String(id).startsWith('loom:');

/* ===================== 動画リストの取りこみ ===================== */
async function fetchData(){
  try{
    const r = await fetch('videos.json?t=' + now(), { cache:'no-store' });
    const j = await r.json();
    if(!j || !Array.isArray(j.videos)) throw 0;
    DATA = normalize(j);
    localStorage.setItem(K_CACHE, JSON.stringify(j));   /* 圏外でも一覧が出るように控える */
  }catch(e){
    try{ DATA = normalize(JSON.parse(localStorage.getItem(K_CACHE) || 'null') || {}); }
    catch(e2){ DATA = { cats:[], videos:[] }; }
  }
}
function normalize(j){
  const cats = Array.isArray(j.cats) ? j.cats.slice() : [];
  const videos = (Array.isArray(j.videos) ? j.videos : [])
    .map(v => ({ id:ytId(v.id || v.url || ''), t:v.t || v.title || '(無題)',
                 cat:v.cat || '', g:v.g || '', d:v.d || v.desc || '', date:v.date || '',
                 sec:+v.sec || 0, pin:v.pin ? 1 : 0 }))
    .filter(v => v.id);
  /* 元の並び順を覚えておく。同じ日に何本も投稿されたとき、
     古い順に並べ直しても 1・2・3・4 の順が崩れないようにするため */
  videos.forEach((v,i) => v._i = i);
  /* 新しいものが上。日付がなければ書いた順を保つ */
  videos.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  return { cats, videos, genreOrder: Array.isArray(j.genreOrder) ? j.genreOrder : [] };
}

/* ---------- カードの部品 ---------- */
function card(v, opt){
  const r = ratio(v), d = durOf(v), n = seenN(v.id);
  return `<div class="vcard ${n ? 'n' : ''}">
    <button class="vmain" data-go="${v.id}">
      <div class="thumb ${n ? 'on' : ''}">
        ${thumbHTML(v.id)}
        ${d ? `<span class="dur">${hhmm(d)}</span>` : ''}
        ${(r > .01 && !n) ? `<span class="pbar"><i style="width:${Math.round(r*100)}%"></i></span>` : ''}
      </div>
      <div class="vmeta">
        <div class="vt">${esc(v.t)}</div>
        <div class="vs">${((opt && opt.tag === false) || n) ? '' :
            `<span class="tag">${esc(v.g || catName(v.cat))}</span>`}
          ${v.date ? `<span>${ymd(v.date)}</span>` : ''}</div>
      </div>
    </button>
    <div class="ctr">
      ${n ? `<button class="minusbtn" data-minus="${v.id}" aria-label="1回へらす">${ICO.minus({s:20})}</button>` : ''}
      <button class="seenbtn ${n ? 'on' : ''}" data-seen="${v.id}" aria-label="1回ふやす">
        ${n ? `<span class="cnt">${n}</span>` : ICO.check({s:20})}
      </button>
    </div>
  </div>`;
}
function bigCard(v){
  const r = ratio(v), d = durOf(v);
  return `<button class="big" data-go="${v.id}">
    <div class="thumb">
      ${thumbHTML(v.id)}
      <span class="play">${ICO.play({s:22})}</span>
      ${d ? `<span class="dur">のこり ${hhmm(d - (prog[v.id]||{}).t)}</span>` : ''}
      <span class="pbar"><i style="width:${Math.round(r*100)}%"></i></span>
    </div>
    <div class="bt">
      <div class="vt">${esc(v.t)}</div>
      <div class="vs"><span class="tag">${esc(v.g || catName(v.cat))}</span>
        <span>つづきから見る</span></div>
    </div>
  </button>`;
}
const emptyBox = msg => `<div class="empty">${msg}</div>`;
/* 見た回数を丸で見せる。5回までは丸が増えていき、6回からは数字にする */
function dots(n){
  if(!n) return '';
  if(n <= 5) return `<span class="dots">${'<i></i>'.repeat(n)}</span>`;
  return `<span class="dots"><i></i><b>×${n}</b></span>`;
}

/* ---------- ホーム ---------- */
function vHome(){
  $('#tbar').innerHTML = `<div class="ttl">Theater</div>`;
  if(!DATA.videos.length){
    $('#main').innerHTML = emptyBox('動画がまだ登録されていません。<br>登録されるとここに並びます。');
    return;
  }
  /* つづき = 少し見て、まだ見終わっていないもの。いちばん最近のもの1本 */
  const cont = DATA.videos
    .filter(v => !isDone(v) && ratio(v) > .02 && ratio(v) < .95 && prog[v.id])
    .sort((a,b) => (prog[b.id].last||0) - (prog[a.id].last||0))[0];

  let h = '';
  if(cont) h += `<div class="sec"><h2>つづきから</h2></div>${bigCard(cont)}`;

  /* 区分をタイルで見せる。中に入ってから探す形にして、ホームを短く保つ */
  const cats = DATA.cats.filter(c => DATA.videos.some(v => v.cat === c.id));
  h += `<div class="sec"><h2>どれを見る？</h2></div>
    <div class="tiles">${cats.map(c => {
      const list = inCat(c.id), done = list.filter(isDone).length;
      const tot = list.reduce((a,v) => a + seenN(v.id), 0);
      const pct = list.length ? Math.round(done / list.length * 100) : 0;
      return `<button class="tile" data-tile="${esc(c.id)}">
        <div class="tn">${esc(c.name)}</div>
        <div class="tc">${list.length}本${done ? ` ・ ${done}本見た` : ''}${tot > done ? `（のべ${tot}）` : ''}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </button>`;
    }).join('')}</div>`;

  /* 最近ふえたもの */
  const recent = DATA.videos.filter(v => v.date).slice(0, 4);
  if(recent.length){
    h += `<div class="sec"><h2>最近ふえた動画</h2></div>
      <div class="vlist">${recent.map(v => card(v)).join('')}</div>`;
  }
  $('#main').innerHTML = h;
}

/* ---------- 区分の中 ---------- */
let catG = 'all';       /* 選んでいるジャンル、または 範囲チップの番号 */
function vCat(){
  const c = catOf(view.p);
  if(!c.id) return go('home');
  $('#tbar').innerHTML = `<button class="tbtn" id="cback">${ICO.back({s:20})}</button>
    <div class="ttl"></div>
    <button class="tbtn" id="cfind">${ICO.search({s:19})}</button>`;
  $('#cback').onclick = () => go('home');
  $('#cfind').onclick = () => { findCat = c.id; findQ = ''; go('find'); };

  const all = inCat(c.id);
  const done = all.filter(isDone).length;
  const total = all.reduce((a,v) => a + seenN(v.id), 0);   /* のべ視聴回数 */
  const pct = all.length ? Math.round(done / all.length * 100) : 0;
  const gs = c.genres ? genresIn(c.id) : [];
  /* ジャンルがない区分で本数が多いときは、番号の範囲でとべるようにする */
  const ranges = (!gs.length && all.length > 40) ? chunkRanges(all, 20) : [];

  let chips = '';
  if(gs.length){
    chips = `<div class="chips" style="margin-top:14px">
      <button class="chip ${catG==='all'?'on':''}" data-g="all">すべて（${all.length}）</button>
      ${gs.map(g => `<button class="chip ${catG===g?'on':''}" data-g="${esc(g)}">${esc(g)}（${all.filter(v=>v.g===g).length}）</button>`).join('')}
    </div>`;
  }else if(ranges.length){
    chips = `<div class="chips" style="margin-top:14px">
      <button class="chip ${catG==='all'?'on':''}" data-g="all">すべて</button>
      ${ranges.map((r,i) => `<button class="chip ${catG===('r'+i)?'on':''}" data-g="r${i}">${esc(r.label)}</button>`).join('')}
    </div>`;
  }

  let body = '';
  if(gs.length && catG === 'all'){
    /* ジャンルごとに見出しをつけて並べる */
    body = gs.map(g => {
      const l = all.filter(v => v.g === g);
      return `<div class="gsec">${esc(g)}<span class="n">${l.length}</span></div>
        <div class="vlist">${l.map(v => card(v, {tag:false})).join('')}</div>`;
    }).join('');
  }else{
    let l = all;
    if(gs.length && catG !== 'all') l = all.filter(v => v.g === catG);
    if(ranges.length && catG !== 'all'){
      const r = ranges[+String(catG).slice(1)];
      if(r) l = all.slice(r.s, r.e);
    }
    body = `<div class="vlist" style="margin-top:16px">
      ${l.length ? l.map(v => card(v, {tag:false})).join('') : emptyBox('ありません')}</div>`;
  }

  $('#main').innerHTML = `
    <div class="chead">
      <h1>${esc(c.name)}</h1>
      <div class="st">${all.length}本${done ? ` ・ ${done}本 見終わり` : ''}${total > done ? ` ・ のべ${total}回` : ''}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    ${chips}
    ${body}`;
  $$('#main .chip').forEach(b => b.onclick = () => { catG = b.dataset.g; vCat(); window.scrollTo(0,0); });
}
/* 20本ずつの範囲を作る。見出しはタイトルの中の数字を使う（【マインド動画５７】→ 57） */
function chunkRanges(list, size){
  const out = [];
  for(let s = 0; s < list.length; s += size){
    const e = Math.min(s + size, list.length);
    const a = numOf(list[s]), b = numOf(list[e-1]);
    const lbl = (a !== null && b !== null) ? (a === b ? `${a}` : `${a}〜${b}`) : `${s+1}〜${e}`;
    out.push({ s, e, label: lbl });
  }
  return out;
}

/* ---------- さがす ---------- */
let findQ = '', findCat = 'all', composing = false;

/* 入力のたびに画面ぜんぶを作り直すと、日本語の変換中の文字が壊れる
   （「こ」と打つと「kお」になる）。入力欄はそのまま置いておき、
   結果の部分だけ書きかえる。変換中（composing）は何もしない。 */
function findList(){
  let list = DATA.videos.filter(v => {
    if(findCat === '__un'){ if(isDone(v)) return false; }
    else if(findCat !== 'all' && v.cat !== findCat) return false;
    if(!findQ) return true;
    const q = findQ.trim().toLowerCase();
    if(!q) return true;
    return (v.t + ' ' + v.g + ' ' + v.d).toLowerCase().includes(q);
  });
  if(catAsc(findCat)) list = list.sort((a,b) => (a.date||'').localeCompare(b.date||'') || a._i - b._i);
  return list;
}
function drawFind(){
  const list = findList();
  $('#fres').innerHTML = `
    <div class="lead">${list.length}本</div>
    <div class="vlist" style="margin-top:8px">
      ${list.length ? list.map(v => card(v)).join('') : emptyBox('見つかりませんでした')}
    </div>`;
}
function vFind(){

async function checkUpd(quiet){
  const st = $('#updState');
  if(!quiet && st) st.textContent = '確認中…';
  try{
    const r = await fetch('version.json?t=' + now(), { cache:'no-store' });
    const j = await r.json();
    if(+j.v > VER){
      askYes({ title:'新しいバージョンがあります', msg:`v${j.v}${j.note ? '（' + esc(j.note) + '）' : ''}`, ok:'更新する' },
        doUpd);
      if(st) st.textContent = `v${j.v} あり`;
    }else if(st && !quiet) st.textContent = `最新（v${VER}）`;
  }catch(e){ if(st && !quiet) st.textContent = '確認できません'; }
}
async function doUpd(){
  try{
    if(window.caches) for(const k of await caches.keys()) await caches.delete(k);
    if(navigator.serviceWorker)
      for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  }catch(e){}
  location.replace(location.pathname + '?v=' + now());
}

/* ===================== 再生 ===================== */
let player = null, playerReady = false, curId = '', tick = null, seeking = false, started = false;

/* YouTube の再生部品を読みこむ（1回だけ） */
let ytLoading = null;
function loadYT(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(ytLoading) return ytLoading;
  ytLoading = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytLoading;
}
async function makePlayer(){
  await loadYT();
  if(player) return;
  await new Promise(res => {
    player = new YT.Player('yt', {
      host: 'https://www.youtube-nocookie.com',
      videoId: curId,
      playerVars: {
        /* YouTube の画面を出さない。関連動画・ロゴ・キーボード操作もふさぐ */
        controls:0, rel:0, modestbranding:1, playsinline:1, disablekb:1,
        iv_load_policy:3, fs:0, cc_load_policy:0, origin:location.origin
      },
      events: {
        onReady: () => { playerReady = true; res(); },
        onStateChange: onState,
        onError: () => { $('#phint').classList.remove('hidden');
          $('#phint').textContent = 'この動画は再生できませんでした（限定公開の設定をご確認ください）'; }
      }
    });
  });
}

function openPlay(id, push){
  const v = vid(id); if(!v) return;
  curId = id; started = false;
  history_push(push);
  $('#pv').classList.remove('hidden');
  $('#pv').classList.remove('exp','rot');
  $('#pv').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  $('#pvnm').textContent = catName(v.cat) || 'Theater';
  if(isLoom(id)) $('#posterimg').removeAttribute('src');
  else $('#posterimg').src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  $('#poster').classList.remove('hidden');
  $('#phint').classList.add('hidden');
  $('#endcard').classList.add('hidden');
  $('#ctrl').classList.add('fade');
  drawCtrl(); drawBody();

  if(isLoom(id)){
    /* Loom: 自作の操作パネルは使えないので、Loomのプレーヤーをそのまま出す */
    try{ player && playerReady && player.pauseVideo(); }catch(e){}
    stopTick();
    $('#poster').classList.add('hidden');
    $('#catch').classList.add('hidden');
    $('#ctrl').classList.add('hidden');
    $('#loomfr').classList.remove('hidden');
    $('#loomfr').src = `https://www.loom.com/embed/${id.slice(5)}?hide_owner=true&hide_share=true&hide_title=true&hideEmbedTopBar=true`;
    return;
  }
  $('#loomfr').classList.add('hidden');
  $('#loomfr').removeAttribute('src');
  $('#catch').classList.remove('hidden');
  $('#ctrl').classList.remove('hidden');
  const start = startSecOf(v);
  if(player && playerReady){
    /* すでに用意ができていれば、タップと同じ流れで再生に入る（iPhone対策） */
    try{ player.loadVideoById({ videoId:id, startSeconds:start }); }catch(e){}
    setTimeout(() => { if(!started) $('#phint').classList.remove('hidden'); }, 1600);
    $('#phint').textContent = 'もう一度 再生ボタンを押してください';
  }else{
    makePlayer().then(() => {
      if(curId !== id) return;
      try{ player.seekTo(start, true); player.playVideo(); }catch(e){}
    });
  }
}
function startSecOf(v){
  const p = prog[v.id];
  if(!p || !p.t) return 0;
  if(seenN(v.id) || (p.d && p.t / p.d > .97)) return 0;   /* 見終わったものは最初から */
  return Math.max(0, p.t - 3);                        /* 少し戻して再開すると分かりやすい */
}
function closePlay(){
  saveNow();
  stopTick();
  $('#loomfr').classList.add('hidden');
  $('#loomfr').removeAttribute('src');   /* これを消さないと裏で音が鳴り続ける */
  try{ player && player.pauseVideo(); }catch(e){}
  $('#pv').classList.add('hidden');
  $('#pv').classList.remove('exp','rot');
  document.body.style.overflow = '';
  curId = '';
  render();
}

function onState(e){
  const S = YT.PlayerState;
  if(e.data === S.PLAYING){
    started = true;
    $('#poster').classList.add('hidden');
    $('#endcard').classList.add('hidden');
    try{ player.setPlaybackRate(speedOf(curId)); }catch(err){}
    startTick(); showCtrl(); drawCtrl();
  }else if(e.data === S.PAUSED){
    saveNow(); stopTick(); showCtrl(true); drawCtrl();
  }else if(e.data === S.ENDED){
    stopTick();
    const id = curId;
    bumpSeen(id, () => { const p = prog[id]; if(p){ p.t = 0; saveProg(); } });
    onEnded();
  }
}
function onEnded(){
  const nx = nextVideo();
  if(cfg.autonext && nx){ openPlay(nx.id); toast('次の動画へ'); return; }
  $('#endcard').innerHTML = `<div class="ttl">見終わりました</div>
    <div class="row">
      <button class="btn sm" id="again">もう一度</button>
      ${nx ? `<button class="btn sm pri" id="next">次の動画</button>` : ''}
    </div>`;
  $('#endcard').classList.remove('hidden');
  $('#again').onclick = () => { $('#endcard').classList.add('hidden');
    try{ player.seekTo(0,true); player.playVideo(); }catch(e){} };
  if(nx) $('#next').onclick = () => openPlay(nx.id);
}
/* 次の動画 = 同じカテゴリの、ひとつ下（古い方）。なければ全体のつぎ */
function nextVideo(){
  const v = vid(curId); if(!v) return null;
  const same = inCat(v.cat);
  const i = same.findIndex(x => x.id === curId);
  if(i >= 0 && same[i+1]) return same[i+1];
  const j = DATA.videos.findIndex(x => x.id === curId);
  return DATA.videos[j+1] || null;
}

function startTick(){ stopTick(); tick = setInterval(onTick, 250); }
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }
let saveCount = 0;
function onTick(){
  if(!player || !playerReady) return;
  const t = player.getCurrentTime() || 0, d = player.getDuration() || 0;
  if(!seeking) drawTime(t, d);
  if(++saveCount % 20 === 0) saveNow();   /* 5秒に1回だけ書きこむ */
}
function saveNow(){
  /* まだ一度も再生していないときは書きこまない。
     （iPhoneで自動再生されずに閉じたとき、つづきの位置が0で消えてしまうため） */
  if(!curId || !player || !playerReady || !started) return;
  try{
    const t = player.getCurrentTime() || 0, d = player.getDuration() || 0;
    if(!d) return;
    const p = prog[curId] || (prog[curId] = {});
    p.t = t; p.d = d; p.last = now();
    saveProg();
  }catch(e){}
}

/* ---------- 再生の操作パネル ---------- */
function drawCtrl(){
  $('#ctrl').innerHTML = `
    <div class="seekrow">
      <span class="tm" id="tmNow">0:00</span>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0">
      <span class="tm" id="tmAll">0:00</span>
    </div>
    <div class="btnrow">
      <button class="pb" id="b10">${ICO.b10({s:21})}<span class="n">10</span></button>
      <button class="pb main" id="pp">${ICO.play({s:20})}</button>
      <button class="pb" id="f10">${ICO.f10({s:21})}<span class="n">10</span></button>
      <span class="sp"></span>
      <button class="pb" id="spd">${speedOf(curId)}x</button>
      <button class="pb" id="exp">${ICO.exp({s:19})}</button>
    </div>`;
  const seek = $('#seek');
  const grab = () => { seeking = true; };
  const move = () => {
    const d = (player && playerReady && player.getDuration()) || 0;
    drawTime(d * seek.value / 1000, d, true);
  };
  const drop = () => {
    const d = (player && playerReady && player.getDuration()) || 0;
    if(d) try{ player.seekTo(d * seek.value / 1000, true); }catch(e){}
    seeking = false; showCtrl();
  };
  seek.addEventListener('pointerdown', grab);
  seek.addEventListener('input', move);
  seek.addEventListener('change', drop);
  seek.addEventListener('pointerup', drop);
  $('#pp').onclick  = togglePlay;
  $('#b10').onclick = () => jump(-10);
  $('#f10').onclick = () => jump(10);
  $('#spd').onclick = () => {
    const now = speedOf(curId);
    const i = SPEEDS.indexOf(now);
    const next = SPEEDS[(i < 0 ? SPEEDS.indexOf(1) : i) + 1 >= SPEEDS.length ? 0 : (i < 0 ? SPEEDS.indexOf(1) : i) + 1];
    setSpeed(curId, next);
    $('#spd').textContent = next + 'x';
    toast(`この動画は ${next}倍速`);
    showCtrl();
  };
  $('#exp').onclick = toggleExp;
  drawTime((player && playerReady && player.getCurrentTime()) || 0,
           (player && playerReady && player.getDuration()) || 0);
}
function drawTime(t, d, force){
  const s = $('#seek'); if(!s) return;
  const r = d ? Math.min(1, t/d) : 0;
  if(!seeking || force){ s.value = Math.round(r*1000); s.style.setProperty('--p', (r*100) + '%'); }
  $('#tmNow').textContent = hhmm(t);
  $('#tmAll').textContent = hhmm(d);
  const pp = $('#pp');
  if(pp && player && playerReady)
    pp.innerHTML = (player.getPlayerState() === 1) ? ICO.pause({s:20}) : ICO.play({s:20});
}
function togglePlay(){
  if(!player || !playerReady) return;
  try{
    if(player.getPlayerState() === 1){ player.pauseVideo(); }
    else{ player.playVideo(); }
  }catch(e){}
  showCtrl();
}
function jump(sec){
  if(!player || !playerReady) return;
  try{ player.seekTo(Math.max(0, (player.getCurrentTime()||0) + sec), true); }catch(e){}
  showCtrl();
}
function toggleExp(){
  const pv = $('#pv');
  const on = !pv.classList.contains('exp');
  pv.classList.toggle('exp', on);
  /* 縦持ちのスマホは横向きに回して大きく見せる */
  pv.classList.toggle('rot', on && innerHeight > innerWidth && innerWidth < 700);
  const eb = $('#exp'); if(eb) eb.innerHTML = on ? ICO.shr({s:19}) : ICO.exp({s:19});
  showCtrl();
}
let ctrlTimer = null;
function showCtrl(keep){
  $('#ctrl').classList.remove('fade');
  clearTimeout(ctrlTimer);
  if(!keep) ctrlTimer = setTimeout(() => {
    if(player && playerReady && player.getPlayerState() === 1) $('#ctrl').classList.add('fade');
  }, 3200);
}

/* ---------- 再生画面の下（タイトル・説明） ---------- */
function drawBody(){
  const v = vid(curId); if(!v) return;
  $('#pvbody').innerHTML = `
    <h1>${esc(v.t)}</h1>
    <div class="vs"><span class="tag">${esc(catName(v.cat))}</span>
      ${v.g ? `<span class="tag">${esc(v.g)}</span>` : ''}
      ${v.date ? `<span>${ymd(v.date)}</span>` : ''}</div>
    <div class="acts">
      <button class="btn sm" id="fav">${isFav(v.id) ? ICO.starF({s:18}) : ICO.star({s:18})}
        <span>${isFav(v.id) ? '保存ずみ' : '保存'}</span></button>
      <button class="btn sm" id="fold">${ICO.folder({s:18})}
        <span>フォルダ${foldCount(v.id) ? `（${foldCount(v.id)}）` : ''}</span></button>
    </div>
    <div class="acts" style="margin-top:9px">
      ${seenN(v.id) ? `<button class="btn sm" id="minus" style="flex:0 0 58px">${ICO.minus({s:20})}</button>` : ''}
      <button class="btn sm ${seenN(v.id)?'pri':''}" id="done">${ICO.check({s:18})}
        <span>${seenN(v.id) ? `見た ${seenN(v.id)}回` : '見終わりにする'}</span></button>
      ${seenN(v.id) ? `<button class="btn sm" id="undo" style="flex:0 0 58px">${ICO.loop({s:18})}</button>` : ''}
    </div>
    ${v.d ? `<div class="desc">${esc(v.d)}</div>` : ''}
    ${nextVideo() ? `<div class="sec"><h2>次の動画</h2></div>
      <div class="vlist">${card(nextVideo())}</div>` : ''}`;
  $('#fav').onclick = () => {
    if(isFav(v.id)) favs = favs.filter(x => x !== v.id); else favs.unshift(v.id);
    saveFav(); drawBody(); toast(isFav(v.id) ? '保存しました' : '保存をはずしました');
  };
  $('#fold').onclick = () => pickFolder(v.id, drawBody);
  if($('#minus')) $('#minus').onclick = () => {
    const n = addSeen(v.id, -1); lastBump = { id:'', at:0 };
    drawBody(); toast(n ? `${n}回にしました` : '0回にもどしました');
  };
  $('#done').onclick = () => bumpSeen(v.id, drawBody);
  if($('#undo')) $('#undo').onclick = () => askYes(
    { title:'見た回数を0にもどしますか？', msg:`この動画は いま ${seenN(v.id)}回です。`, ok:'0にもどす' },
    () => { clearSeen(v.id); drawBody(); toast('0回にもどしました'); });
}

/* ===================== 管理（動画を追加する） ===================== */
function loadAdmin(){
  if(admin) return;
  try{ admin = JSON.parse(localStorage.getItem(K_ADM) || 'null'); }catch(e){}
  if(!admin) admin = JSON.parse(JSON.stringify({ cats:DATA.cats, videos:DATA.videos }));
}
const saveAdmin = () => localStorage.setItem(K_ADM, JSON.stringify(admin));

function vAdmin(){
  loadAdmin();
  $('#tbar').innerHTML = `<button class="tbtn" id="back">${ICO.back({s:20})}</button>
    <div class="ttl" style="font-size:1.06rem;letter-spacing:.02em">動画の管理</div>`;
  $('#back').onclick = () => go('set');

  $('#main').innerHTML = `
    <div class="note">ここで動画のリストを作り、最後に「JSONをコピー」を押して
      平山さんが <b>videos.json</b> に貼りかえると、生徒の画面に反映されます。<br>
      YouTube は<b>限定公開</b>のままで大丈夫です。</div>

    <div class="sec"><h2>動画を追加</h2></div>
    <div class="fld"><label>YouTubeのURL</label>
      <input id="aUrl" placeholder="https://youtu.be/xxxxxxxxxxx"></div>
    <div class="fld"><label>タイトル</label><input id="aTtl" placeholder="例）朝のマインドセット #12"></div>
    <div class="fld"><label>区分</label>
      <select id="aCat">${admin.cats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>公開日（省略可）</label><input id="aDate" type="date"></div>
    <div class="fld"><label>説明（省略可）</label><textarea id="aDesc"></textarea></div>
    <button class="btn pri" id="aAdd" style="margin-top:14px">${ICO.plus({s:19})}<span>リストに追加</span></button>

    <div class="sec"><h2>いまのリスト（${admin.videos.length}本）</h2></div>
    <div class="vlist" id="alist">
      ${admin.videos.length ? admin.videos.map((v,i) => `
        <div class="vcard" style="align-items:center">
          <div class="thumb" style="width:96px">${thumbHTML(v.id)}</div>
          <div class="vmeta"><div class="vt">${esc(v.t)}</div>
            <div class="vs"><span class="tag">${esc(catName2(v.cat))}</span>${v.date ? `<span>${ymd(v.date)}</span>` : ''}</div></div>
          <button class="tbtn" data-del="${i}" style="align-self:center">${ICO.trash({s:18})}</button>
        </div>`).join('') : emptyBox('まだ1本もありません')}
    </div>

    <div class="sec"><h2>書き出す</h2></div>
    <button class="btn" id="aCopy">JSONをコピー</button>
    <button class="btn" id="aReload" style="margin-top:9px">公開中のリストを読み直す</button>
    <div class="lead" style="margin-top:10px">「読み直す」を押すと、いま公開されている videos.json の内容に戻します。</div>
    <div class="ver">&nbsp;</div>`;

  $('#aAdd').onclick = () => {
    const id = ytId($('#aUrl').value);
    if(!id) return alert('YouTubeのURLを正しく貼りつけてください。');
    if(!$('#aTtl').value.trim()) return alert('タイトルを入れてください。');
    if(admin.videos.some(v => v.id === id)) return alert('この動画はもうリストにあります。');
    admin.videos.unshift({ id, t:$('#aTtl').value.trim(), cat:$('#aCat').value,
      d:$('#aDesc').value.trim(), date:$('#aDate').value || '' });
    saveAdmin(); vAdmin(); toast('追加しました');
  };
  $$('#alist [data-del]').forEach(b => b.onclick = () => askYes(
    { title:'リストから外しますか？', ok:'外す', danger:true },
    () => { admin.videos.splice(+b.dataset.del, 1); saveAdmin(); vAdmin(); }));
  $('#aCopy').onclick = async () => {
    const out = JSON.stringify({ updated:new Date().toISOString().slice(0,10),
      cats:admin.cats, videos:admin.videos }, null, 2);
    try{ await navigator.clipboard.writeText(out); toast('コピーしました'); }
    catch(e){ prompt('コピーしてください', out); }
  };
  $('#aReload').onclick = () => askYes(
    { title:'公開中のリストに戻しますか？', msg:'ここでの編集は消えます。', ok:'戻す', danger:true },
    () => { admin = JSON.parse(JSON.stringify({ cats:DATA.cats, videos:DATA.videos }));
            saveAdmin(); vAdmin(); });
}
const catName2 = c => (admin.cats.find(x => x.id === c) || {}).name || 'そのほか';

/* ===================== もどる（端末の戻る操作） ===================== */
function history_push(push){
  if(push === false) return;
  try{ history.pushState({ pv:1 }, ''); }catch(e){}
}
addEventListener('popstate', () => {
  if(!$('#pv').classList.contains('hidden')){
    if($('#pv').classList.contains('exp')){ toggleExp(); history_push(); return; }
    closePlay();
  }
});

/* ===================== 起動 ===================== */
async function boot(){
  load();
  $('#tabin').innerHTML = TABS.map(t =>
    `<button class="tab" data-tab="${t.id}">${t.ic({s:21,w:1.9})}<span>${t.lbl}</span></button>`).join('');
  $$('#tabin .tab').forEach(b => b.onclick = () => go(b.dataset.tab));
  $('#pvback').innerHTML = ICO.back({ s:20 });
  $('#bigplay').innerHTML = ICO.play({ s:26 });
  $('#pvback').onclick = () => { closePlay(); try{ history.back(); }catch(e){} };

  /* 動画の上をタップ = 操作パネルの出し入れ。YouTubeへは絶対に飛ばさない */
  $('#catch').onclick = () => {
    if($('#ctrl').classList.contains('fade')) showCtrl();
    else togglePlay();
  };
  $('#bigplay').onclick = async () => {
    $('#phint').classList.add('hidden');
    await makePlayer();
    try{
      if(player.getVideoData && player.getVideoData().video_id !== curId){
        player.loadVideoById({ videoId:curId, startSeconds:startSecOf(vid(curId)) });
      }else{
        player.playVideo();
      }
    }catch(e){}
  };

  /* 見終わりの丸ボタン。長押しは 0 にもどす */
  let holdT = null, held = false;
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-seen]');
    if(!b) return;
    held = false;
    holdT = setTimeout(() => {
      held = true;
      const tid = b.dataset.seen, cur = seenN(tid);
      if(cur) askYes({ title:'見た回数を0にもどしますか？', msg:`この動画は いま ${cur}回です。`, ok:'0にもどす' },
        () => { clearSeen(tid);
                if(view.name === 'find') drawFind(); else render();
                toast('0回にもどしました'); });
    }, 600);
  });
  document.addEventListener('pointerup',     () => clearTimeout(holdT));
  document.addEventListener('pointercancel', () => clearTimeout(holdT));

  /* 一覧のカードから再生をひらく */
  document.addEventListener('click', e => {
    const mb = e.target.closest('[data-minus]');
    if(mb){
      const n = addSeen(mb.dataset.minus, -1);
      lastBump = { id:'', at:0 };            /* 減らした直後は 連打ガードを解く */
      toast(n ? `${n}回にしました` : '0回にもどしました');
      if(view.name === 'find') drawFind(); else render();
      return;
    }
    const sb = e.target.closest('[data-seen]');
    if(sb){
      clearTimeout(holdT);
      if(held){ held = false; return; }        /* 長押しで処理ずみ */
      bumpSeen(sb.dataset.seen, () => { if(view.name === 'find') drawFind(); else render(); });
      return;
    }
    const c = e.target.closest('[data-go]');
    if(c){ openPlay(c.dataset.go); return; }
    const t = e.target.closest('[data-tile]');
    if(t){ catG = 'all'; go('cat', t.dataset.tile); }
  });

  render();
  await fetchData();
  render();
  if(!cfg.guided) showGuide(0);   /* はじめて開いた人に 使い方を見せる */
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(() => checkUpd(true), 2500);
  addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if(document.hidden) saveNow(); });
}
boot();
</script>
