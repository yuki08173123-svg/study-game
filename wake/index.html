<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="../common/users.js?v=1" data-app="wake"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヒラボイス</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF6EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#2A2118; --muted:#6B5E50; --line:#EADFCF;
  --accent:#E8742A; --accent-soft:#FDEBDD; --accent-ink:#FFFFFF;
  --sun:#F2B33D; --ok:#2E9E6A; --ok-soft:#E2F4EA; --ng:#D9534A; --ng-soft:#FBE7E5;
  --chip:#F3ECE1; --shadow:0 1px 3px rgba(60,40,20,.08); --shadow-lg:0 8px 24px rgba(60,40,20,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130F; --card:#221C16; --ink:#F3EADF; --muted:#B3A595; --line:#3A3027;
    --accent:#F2934F; --accent-soft:#3D2A1C; --accent-ink:#1A120C;
    --sun:#F4C35E; --ok:#5CCB95; --ok-soft:#1D3528; --ng:#F08A80; --ng-soft:#3E2523;
    --chip:#2D251E; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink); }
body{ font-family:'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-weight:500; line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height:100vh; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
header{ display:flex; align-items:center; gap:8px; padding:14px 16px 6px; max-width:560px; margin:0 auto; }
header h1{ font-size:20px; font-weight:900; margin:0; flex:1; display:flex; align-items:center; gap:8px; }
header h1 small{ font-size:12px; color:var(--muted); font-weight:500; }
header h1 .logo{ width:28px; height:28px; border-radius:8px; }
main{ max-width:560px; margin:0 auto; padding:6px 16px 40px; }
.card{ background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin:12px 0; }
.card h2{ font-size:16px; margin:0 0 10px; font-weight:900; }
.muted{ color:var(--muted); font-size:13px; }
.big{ display:block; width:100%; padding:18px; border-radius:16px; background:var(--accent); color:var(--accent-ink);
  font-size:19px; font-weight:900; box-shadow:var(--shadow-lg); }
.sub{ display:block; width:100%; padding:13px; border-radius:14px; background:var(--chip); font-weight:700; margin-top:10px; }
.seg{ display:flex; gap:6px; background:var(--chip); padding:4px; border-radius:14px; }
.seg button{ flex:1; padding:10px 4px; border-radius:11px; font-weight:700; color:var(--muted); }
.seg button.on{ background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
.promise{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.promise div{ background:var(--accent-soft); border-radius:14px; padding:10px 4px; }
.promise b{ display:block; font-size:20px; font-weight:900; }
.promise span{ font-size:12px; color:var(--muted); }
.hist{ width:100%; border-collapse:collapse; font-size:14px; }
.hist td{ padding:7px 4px; border-top:1px solid var(--line); }
.tag{ display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; background:var(--chip); }
.tag.ok{ background:var(--ok-soft); color:var(--ok); } .tag.ng{ background:var(--ng-soft); color:var(--ng); }
ol.steps{ padding-left:22px; margin:6px 0; } ol.steps li{ margin:6px 0; }
.url{ display:flex; gap:8px; align-items:center; background:var(--chip); border-radius:12px; padding:8px 10px; font-size:13px; word-break:break-all; }
.url button{ flex:none; background:var(--accent); color:var(--accent-ink); border-radius:10px; padding:6px 12px; font-weight:700; }
details{ margin-top:8px; } summary{ font-weight:700; cursor:pointer; }

/* 朝の会話（全画面） */
#talk{ position:fixed; inset:0; background:var(--bg); z-index:50; display:none; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); overflow-y:auto; }
#talk.on{ display:flex; }
#talk .top{ display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:14px; max-width:560px; width:100%; margin:0 auto; }
#talk .stage{ flex:1; display:flex; flex-direction:column; justify-content:center; max-width:560px; width:100%; margin:0 auto; }
.clock{ text-align:center; font-size:64px; font-weight:900; letter-spacing:.02em; line-height:1.1; }
.date{ text-align:center; color:var(--muted); margin-bottom:28px; }
.sunbtn{ display:block; margin:0 auto; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #FFD27A, var(--sun) 60%, var(--accent));
  color:#2A1A08; font-size:30px; font-weight:900; box-shadow:0 10px 40px rgba(232,116,42,.45); animation:pulse 2.2s ease-in-out infinite; }
@keyframes pulse{ 50%{ transform:scale(1.05); } }
.who{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.who img{ width:44px; height:44px; border-radius:50%; background:var(--chip); }
.who b{ font-weight:900; }
.bubble{ background:var(--card); border-radius:4px 20px 20px 20px; padding:16px 18px; font-size:21px; font-weight:700; box-shadow:var(--shadow-lg); min-height:66px; }
.bubble.speaking{ outline:3px solid var(--accent-soft); }
.hint{ margin:12px 0 0; padding:10px 12px; border-radius:12px; background:var(--accent-soft); font-size:14px; }
.choices{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px; }
.choices.two{ grid-template-columns:1fr 1fr; } .choices.four{ grid-template-columns:repeat(4,1fr); }
.choices button{ background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px 2px; font-size:clamp(14px, 4.2vw, 17px); font-weight:900; white-space:nowrap; }
.choices button:active{ background:var(--accent-soft); border-color:var(--accent); }
.choices button.wide{ grid-column:1/-1; background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.dots{ display:flex; gap:6px; justify-content:center; margin-top:18px; }
.dots i{ width:8px; height:8px; border-radius:50%; background:var(--line); } .dots i.on{ background:var(--accent); }
.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:99; }
.toast.on{ opacity:1; }
header .help{ width:34px; height:34px; border-radius:50%; background:var(--chip); font-weight:900; font-size:17px; flex:none; }
.listen{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.listen button[data-g="H"]{ background:#3A0F0C; color:#FFB199; }
.big.dark, .choices button.wide.dark{ background:#1B1712; color:#F1DDA4; border-color:#1B1712; }
.goalcard{ background:linear-gradient(160deg,#1E1913,#0E0D0C); color:#F3EADF; border:1px solid rgba(224,192,106,.4); border-radius:16px; padding:14px 16px; margin-top:14px; }
.goalcard span{ display:block; font-size:12px; letter-spacing:.15em; color:#E0C06A; }
.goalcard b{ display:block; font-size:21px; font-weight:900; margin-top:4px; line-height:1.5; }
textarea#goalIn{ width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); resize:vertical; }
.sunbtn.eve{ background:radial-gradient(circle at 40% 35%, #FFC99A, #F08A4B 60%, #B4502A); }
.choices.two button.wide + button.wide{ margin-top:0; }
.shot{ display:block; width:100%; border-radius:12px; box-shadow:var(--shadow-lg); }
.chk{ display:flex; align-items:center; gap:8px; font-size:14px; padding:12px 2px 0; }
.chk input{ width:20px; height:20px; }
#printBox{ display:none; }
@media print{
  body > *:not(#printBox){ display:none !important; }
  #printBox{ display:block !important; } #printBox img{ width:100%; max-width:170mm; display:block; margin:0 auto; }
  body{ background:#fff !important; padding:0; }
}
.listen button{ padding:16px 6px; border-radius:16px; background:#1B1712; color:#F1DDA4; box-shadow:var(--shadow-lg); }
.listen button{ padding:12px 4px; } .listen button b{ display:block; font-size:19px; font-weight:900; white-space:nowrap; } .listen button span{ display:block; font-size:12px; opacity:.85; }
.listen button[data-g="G"]{ background:var(--accent); color:var(--accent-ink); }
.listen button:active{ transform:scale(.97); }
.said{ margin-top:10px; font-size:14px; color:var(--muted); min-height:24px; }
.said.on{ color:var(--ink); font-size:17px; font-weight:700; }
/* 更新があるときの帯（計画マップ・解き直しマップと同じ） */
.updwrap{ max-width:560px; margin:0 auto; padding:0 16px; }
.update{ width:100%; margin-top:6px; background:#E9640F; color:#fff; border-radius:16px; padding:13px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg); text-align:left; }
.update.hidden{ display:none; }
.update svg{ width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.update .t{ flex:1; line-height:1.3; } .update .t b{ display:block; font-size:15px; font-weight:900; } .update .t span{ font-size:11px; opacity:.9; font-weight:700; }
.update .go{ background:rgba(255,255,255,.22); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:900; flex:none; }
/* 使い方スライド */
.sheet-bg{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:80; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ background:var(--bg); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:14px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:92vh; overflow-y:auto; }
.sheet h2{ font-size:18px; font-weight:900; margin:4px 0 12px; text-align:center; }
.sl-track{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
.sl-track::-webkit-scrollbar{ display:none; }
.sl{ flex:0 0 100%; scroll-snap-align:start; background:linear-gradient(160deg,#1E1913,#0E0D0C); color:#F3EADF; border:1px solid rgba(224,192,106,.4); border-radius:18px; padding:18px; min-height:330px; }
.sl .no{ font-size:12px; letter-spacing:.2em; color:#E0C06A; }
.sl .pic{ font-size:40px; margin:10px 0 6px; }
.sl h4{ font-size:19px; margin:0 0 8px; font-weight:900; color:#F1DDA4; }
.sl p{ margin:0; font-size:15px; line-height:1.75; } .sl p b{ color:#F1DDA4; }
.sl .ex{ margin-top:12px; padding-top:10px; border-top:1px solid rgba(224,192,106,.22); font-size:13px; color:#B9AE9E; }
.sl-nav{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
.sl-nav button{ width:44px; height:44px; border-radius:50%; background:var(--chip); font-size:20px; font-weight:900; }
.sl-nav .dots{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; } .sl-nav .dots i{ width:7px; height:7px; border-radius:50%; background:var(--line); } .sl-nav .dots i.on{ background:var(--accent); }
.sheet .close{ display:block; width:100%; margin-top:12px; padding:14px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-weight:900; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1><img class="logo" src="icon-192.png" alt="">ヒラボイス <small id="ver"></small></h1>
  <button data-users-tag hidden></button>
  <button class="help" id="btnHelp" aria-label="使い方">?</button>
</header>
<div class="updwrap"><button class="update hidden" id="btnUpdate">
  <svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 19h14"/></svg>
  <span class="t"><b>更新があります</b><span id="updVer"></span></span>
  <span class="go">更新する</span>
</button></div>
<main id="home"></main>

<div id="talk">
  <div class="top"><span id="tStep"></span><button id="tClose">とじる ✕</button></div>
  <div class="stage" id="stage"></div>
</div>
<div class="toast" id="toast"></div>
<div id="printBox"></div>
<audio id="au" playsinline preload="auto"></audio>

<script src="lines.js?v=9"></script>
<script>
/* ===================== 基本 ===================== */
const VER = 9;
const KEY = 'wake_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); const t = new Date(y, m-1, d+n); return ymd(t); };
const WD = ['日','月','火','水','木','金','土'];
const mdw = s => { const [y,m,d] = s.split('-').map(Number); return m+'/'+d+'（'+WD[new Date(y,m-1,d).getDay()]+'）'; };
const hm = d => d.getHours()+':'+pad(d.getMinutes());
const pick = a => a[Math.floor(Math.random() * a.length)];
const LINE = Object.fromEntries(LINES.map(l => [l.id, l]));
const SUBJ = ['英語','数学','国語','理科','社会','解き直し','その他'];
const HOURS = [0.5, 1, 1.5, 2, 3, 4, 5, 6];
const hLabel = h => h === 0.5 ? '30分' : h+'時間' + (h >= 6 ? '〜' : '');
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(()=>e.classList.remove('on'), 1800); }

/* ===================== データ =====================
   S.mode は v4 まで（喝・まぜる・励ましの設定）。v5 で朝の最後に選ぶ形にしたので使わない
   S.help: 使い方スライドを見たら true（はじめて開いたときだけ自動で出す）
   S.days['YYYY-MM-DD'] = { woke:'6:42', start:'19:00', hours:2, first:'数学', backlog:true|false, review:'できた'|'半分'|'できなかった' }
   review は「その日の約束」を次の朝にふり返った答え（その日の記録に入れる）
   word は最後に選んだ一言（'喝'・'本気の喝'・'励まし'・'喝（おまかせ）' など）。back は夕方に開いた時刻（woke の代わり）
   S.goal = { text:'ゴールの文', days:{ 'YYYY-MM-DD':true } }  ゴール宣言（v8・ユウキ・ハルネコの要望） */
let S = load();
function load(){
  try{ const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if(j && j.days) return Object.assign({ mode:'mix', recent:[] }, j); }catch(e){}
  return { mode:'mix', days:{}, recent:[] };
}
function goal(){ if(!S.goal) S.goal = { text:'', days:{} }; return S.goal; }
/* 続いている日数（今日まだ宣言していなければ、昨日から数える） */
function streak(){
  const g = goal(); let d = g.days[today()] ? today() : addDays(today(), -1), n = 0;
  while(g.days[d]){ n++; d = addDays(d, -1); }
  return n;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('保存できませんでした'); } }

/* 同じ端末の 解き直しマップ・Essence の「今日の分」を数える（読めないときは null）。
   iPhone でホーム画面に置いたアプリは入れ物が別なので、読めないことが多い。そのときは本人に聞くだけ */
function backlogFromApps(){
  const t = today(); const out = [];
  try{
    const r = JSON.parse(localStorage.getItem('redo_v1') || 'null');
    if(r && Array.isArray(r.items)){ const n = r.items.filter(i => !i.done && i.due && i.due <= t).length; out.push({ name:'解き直しマップ', n }); }
  }catch(e){}
  try{
    const m = JSON.parse(localStorage.getItem('miss_v1') || 'null');
    if(m && Array.isArray(m.items)){ const n = m.items.filter(i => !i.done && i.due && i.due <= t).length; out.push({ name:'Essence', n }); }
  }catch(e){}
  return out.length ? out : null;
}

/* ===================== 声 =====================
   voice/<id>.m4a があれば ヒラ先生の録音を流す。なければ端末の読み上げ（録音が届くまでの代わり） */
const au = $('#au');
const missing = new Set();
let speakToken = 0;
function stopVoice(){ speakToken++; try{ au.pause(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }
function playOne(id, tok){
  return new Promise(res => {
    if(tok !== speakToken) return res();
    const l = LINE[id];
    const tts = () => {
      try{
        const u = new SpeechSynthesisUtterance(l.text.replace(/／/g, '。'));
        u.lang = 'ja-JP'; u.rate = 1.05; u.onend = u.onerror = () => res();
        speechSynthesis.speak(u);
        setTimeout(res, 1200 + l.text.length * 180);   // 読み上げが動かない端末でも先へ進む
      }catch(e){ res(); }
    };
    /* nt の言葉は録音が届くまで読み上げない（ヒラ先生の声に機械の声がまざると不自然なため） */
    const fallback = () => l.nt ? res() : tts();
    if(missing.has(id)) return fallback();
    const done = () => { au.onended = au.onerror = null; res(); };
    au.onended = done;
    au.onerror = () => { au.onended = au.onerror = null; missing.add(id); fallback(); };
    au.src = 'voice/' + id + '.m4a?v=' + VER;
    const p = au.play(); if(p && p.catch) p.catch(() => { au.onended = au.onerror = null; missing.add(id); fallback(); });
  });
}
async function say(ids){
  stopVoice(); const tok = speakToken;
  const b = $('.bubble'); if(b) b.classList.add('speaking');
  for(const id of ids){ await playOne(id, tok); if(tok !== speakToken) return; }
  if(b) b.classList.remove('speaking');
}
/* 同じ言葉が続かないように、最近つかった言葉をさける */
function choose(ids){
  const fresh = ids.filter(id => !S.recent.includes(id));
  const id = pick(fresh.length ? fresh : ids);
  S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 12);
  return id;
}
const ofGroup = (g, k) => LINES.filter(l => l.g === g && (k === undefined || l.k === k)).map(l => l.id);

/* ===================== 朝・夕方の会話 =====================
   昼すぎ（12時〜翌4時）に開いたら夕方版：あいさつが「おかえり」になる（v8・ユウキ・ハルネコの要望）。質問は同じ */
const isEve = () => { const h = new Date().getHours(); return h >= 12 || h < 4; };
const WORDG = { F:'喝', H:'本気の喝', G:'励まし' };
let T = null;   // 今朝の会話の状態
function openTalk(){
  T = { rec:{}, step:0 };
  $('#talk').classList.add('on');
  document.body.style.overflow = 'hidden';
  renderWake();
}
function closeTalk(){
  stopVoice(); $('#talk').classList.remove('on'); document.body.style.overflow = ''; T = null; renderHome();
}
$('#tClose').onclick = closeTalk;

function renderWake(){
  const d = new Date();
  $('#tStep').textContent = '';
  $('#stage').innerHTML = `
    <div class="clock">${hm(d)}</div>
    <div class="date">${mdw(today())}</div>
    <button class="sunbtn${isEve() ? ' eve' : ''}" id="sunBtn">${isEve() ? 'おかえり' : 'おはよう'}</button>
    <p class="muted" style="text-align:center;margin-top:22px">押すと、ヒラ先生の声がはじまります</p>`;
  $('#sunBtn').onclick = () => {
    const eve = isEve();
    T.rec[eve ? 'back' : 'woke'] = hm(new Date());
    buildFlow();
    next(choose(ofGroup(eve ? 'V' : 'B')));
  };
}

/* 質問の順番。昨日の約束があって、まだふり返っていなければ最初に聞く */
function buildFlow(){
  const y = S.days[addDays(today(), -1)];
  T.flow = [];
  if(y && y.hours && !y.review) T.flow.push('review');
  T.flow.push('start', 'hours', 'first', 'backlog', 'last', 'end');
}
async function next(lead){
  const kind = T.flow[T.step++];
  const pre = lead ? [lead] : [];
  const steps = T.flow.filter(k => k !== 'end').length;
  $('#tStep').textContent = kind === 'end' ? '' : (T.step)+' / '+steps;
  const q = { review:'c0', start:'d1', hours:'d2', first:'d3', backlog:'d4', last:'d5' }[kind];
  let choices = '', cls = '', hint = '';
  if(kind === 'review'){
    const y = S.days[addDays(today(), -1)];
    hint = `昨日の約束：${esc(y.start)}から ${esc(hLabel(y.hours))}`;
    choices = ['できた','半分','できなかった'].map(v => `<button data-v="${v}">${v}</button>`).join('');
  }else if(kind === 'start'){
    const h0 = new Date().getHours();
    const opts = ['今すぐ']; for(let h = Math.max(h0 + 1, 6); h <= 22; h++) opts.push(h+':00');
    choices = opts.map(v => `<button data-v="${v}">${v}</button>`).join('');
    cls = 'four';
  }else if(kind === 'hours'){
    choices = HOURS.map(h => `<button data-v="${h}">${hLabel(h)}</button>`).join(''); cls = 'four';
  }else if(kind === 'first'){
    choices = SUBJ.map(v => `<button data-v="${v}">${v}</button>`).join('');
  }else if(kind === 'backlog'){
    const apps = backlogFromApps();
    if(apps) hint = apps.map(a => `${a.name}：今日の分 ${a.n}問`).join('　');
    choices = `<button data-v="1">たまってる</button><button data-v="0">たまってない</button>`; cls = 'two';
  }else if(kind === 'last'){
    const g = omakase();
    hint = `おまかせ：今日は「${g === 'F' ? '喝' : g === 'G' ? '励まし' : '喝か励まし'}」${g === 'mix' ? '' : '（昨日の約束が「' + esc(yReview()) + '」だったので）'}`;
    choices = ['喝','本気の喝','励まし','おまかせ'].map(v => `<button data-v="${v}">${v}</button>`).join(''); cls = 'two';
  }
  const ids = [...pre, q];
  $('#stage').innerHTML = `
    <div class="who"><img src="icon-192.png" alt=""><b>ヒラ先生</b></div>
    <div class="bubble">${ids.map(id => esc(LINE[id].text)).join('<br>')}</div>
    ${hint ? `<div class="hint">${hint}</div>` : ''}
    <div class="choices ${cls}">${choices}</div>
    <div class="dots">${T.flow.filter(k => k !== 'end').map((k, i) => `<i class="${i < T.step ? 'on' : ''}"></i>`).join('')}</div>`;
  $('#stage').querySelectorAll('.choices button').forEach(b => b.onclick = () => answer(kind, b.dataset.v));
  say(ids);
}
function answer(kind, v){
  let reply;
  if(kind === 'review'){
    S.days[addDays(today(), -1)].review = v;
    reply = choose(ofGroup('C', v));
  }else if(kind === 'start'){
    T.rec.start = v === '今すぐ' ? hm(new Date()) : v;
    reply = choose(ofGroup('E', '何時から'));
  }else if(kind === 'hours'){
    const h = Number(v); T.rec.hours = h;
    reply = h <= 1 ? 'e2a' : h >= 4 ? 'e2c' : 'e2b';
  }else if(kind === 'first'){
    T.rec.first = v; reply = choose(ofGroup('E', '最初の教科'));
  }else if(kind === 'backlog'){
    T.rec.backlog = v === '1';
    reply = choose(ofGroup('E', v === '1' ? 'たまってる' : 'たまってない'));
  }else if(kind === 'last'){
    const g = v === '喝' ? 'F' : v === '本気の喝' ? 'H' : v === '励まし' ? 'G' : omakase();
    T.word = g === 'mix' ? pick(['F','G']) : g;
    T.rec.word = WORDG[T.word] + (v === 'おまかせ' ? '（おまかせ）' : '');
    save(); return finish(choose(ofGroup(T.word)));
  }
  save(); next(reply);
}
/* おまかせ：昨日のふり返りで決める（できた→励まし・できなかった→喝・半分やふり返りなし→どちらか）。ヒラの指示 10-25 */
function yReview(){ const y = S.days[addDays(today(), -1)]; return y && y.review || ''; }
function omakase(){ const r = yReview(); return r === 'できた' ? 'G' : r === 'できなかった' ? 'F' : 'mix'; }

/* ===================== 宣言カード（v9・のぐの要望） =====================
   宣言したゴール＋今日の約束＋続いた日数を1枚の画像にする。計画マップと同じく「アプリをえらんで送る」で
   Discord の宣言の部屋へ。印刷用（白い背景）も選べる */
function wrapText(ctx, text, maxW){
  const out = []; let line = '';
  for(const ch of String(text)){
    if(ch === '\n'){ out.push(line); line = ''; continue; }
    if(ctx.measureText(line + ch).width > maxW && line){
      if('、。」）！？ー'.includes(ch)){ line += ch; out.push(line); line = ''; continue; }   // 行の頭に句読点を置かない
      out.push(line); line = ch;
    }else line += ch;
  }
  if(line) out.push(line); return out;
}
function drawCard(light){
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), g = goal(), r = S.days[today()] || {};
  const F = n => `900 ${n}px 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif`;
  const ink = light ? '#1a1a1a' : '#F3EADF', gold = light ? '#8A6A1E' : '#E0C06A', sub = light ? '#444' : '#B9AE9E';
  if(light){ c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); }
  else{ const gr = c.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#221C15'); gr.addColorStop(1, '#0B0A09'); c.fillStyle = gr; c.fillRect(0, 0, W, H); }
  c.strokeStyle = gold; c.lineWidth = 4; c.strokeRect(40, 40, W - 80, H - 80);
  c.lineWidth = 1.5; c.strokeRect(56, 56, W - 112, H - 112);
  c.textAlign = 'center'; c.fillStyle = gold; c.font = F(34); c.fillText('G O A L   D E C L A R A T I O N', W / 2, 150);
  c.fillStyle = ink; c.font = F(64); c.fillText('ゴール宣言', W / 2, 240);
  c.fillStyle = sub; c.font = F(34); c.fillText(mdw(today()), W / 2, 300);
  // ゴール
  c.font = F(64); const gl = wrapText(c, g.text, W - 240).slice(0, 4);
  let y = 420;
  c.fillStyle = ink; gl.forEach((t, i) => c.fillText(t, W / 2, y + i * 86));
  y += (gl.length - 1) * 86 + 64;
  c.strokeStyle = gold; c.lineWidth = 2; c.beginPath(); c.moveTo(W / 2 - 120, y); c.lineTo(W / 2 + 120, y); c.stroke();
  // 今日の約束
  if(r.hours){
    c.fillStyle = gold; c.font = F(34); c.fillText('今日の約束', W / 2, y + 90);
    const cells = [[r.start, 'から'], [hLabel(r.hours), 'やる'], [r.first, 'から始める']];
    cells.forEach(([v, l], i) => {
      const x = W / 2 + (i - 1) * 310, yy = y + 125;
      c.strokeStyle = light ? '#bbb' : 'rgba(224,192,106,.45)'; c.lineWidth = 2;
      c.beginPath(); c.roundRect ? c.roundRect(x - 140, yy, 280, 160, 24) : c.rect(x - 140, yy, 280, 160); c.stroke();
      c.fillStyle = ink; c.font = F(50); c.fillText(String(v), x, yy + 84);
      c.fillStyle = sub; c.font = F(28); c.fillText(l, x, yy + 132);
    });
    y += 300;
  }
  // 続いた日数
  c.fillStyle = gold; c.font = F(40); c.fillText(`${streak()}日 続けて宣言中`, W / 2, Math.max(y + 110, 960));
  c.fillStyle = sub; c.font = F(30); c.fillText(`宣言した日 ${Object.keys(g.days).length}日`, W / 2, Math.max(y + 165, 1015));
  c.fillStyle = gold; c.font = F(30); c.fillText('ヒラボイス', W / 2, H - 100);
  return cv;
}
async function openCardSheet(){
  try{ await document.fonts.load("900 40px 'Zen Maru Gothic'"); }catch(e){}
  let light = false, cv = drawCard(false);
  const canShare = !!(navigator.canShare && navigator.share);
  const name = () => 'ゴール宣言_' + today() + '.png';
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><h2>宣言カード</h2>
    <img class="shot" id="cardImg" alt="宣言カード">
    <p class="muted" style="margin:8px 0 0">${canShare ? '「部屋に出す」を押して Discord をえらび、<b>宣言の部屋</b>に送ってください。' : '画像を保存して、Discord の<b>宣言の部屋</b>に送ってください。'}</p>
    ${canShare ? '<button class="close" id="cShare">部屋に出す（アプリをえらんで送る）</button>' : ''}
    <button class="sub" id="cSave">画像を保存する</button>
    <button class="sub" id="cPrint">印刷する</button>
    <label class="chk"><input type="checkbox" id="cLight">印刷用（白い背景にしてインクを節約）</label>
    <button class="sub" id="cClose">とじる</button></div>`;
  document.body.appendChild(bg);
  const img = bg.querySelector('#cardImg');
  const show = () => { img.src = cv.toDataURL('image/png'); };
  show();
  const blob = () => new Promise(res => cv.toBlob(res, 'image/png'));
  bg.querySelector('#cLight').onchange = e => { light = e.target.checked; cv = drawCard(light); show(); };
  if(canShare) bg.querySelector('#cShare').onclick = async () => {
    const f = new File([await blob()], name(), { type:'image/png' });
    if(!navigator.canShare({ files:[f] })) return toast('この端末では送れません');
    try{ await navigator.share({ files:[f] }); }catch(e){}
  };
  bg.querySelector('#cSave').onclick = async () => {
    const b = await blob(); if(!b) return;
    const f = new File([b], name(), { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[f] })){ try{ await navigator.share({ files:[f] }); return; }catch(e){ if(e && e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name(); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('保存しました');
  };
  bg.querySelector('#cPrint').onclick = () => {
    const box = document.getElementById('printBox'); box.innerHTML = `<img src="${cv.toDataURL('image/png')}" alt="">`;
    setTimeout(() => window.print(), 150);
  };
  const close = () => bg.remove();
  bg.querySelector('#cClose').onclick = close;
  bg.addEventListener('click', e => { if(e.target === bg) close(); });
}

/* ===================== 使い方（スライド） =====================

function openHelp(){
  const SL = slides();
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><h2>ヒラボイスの使い方</h2>
    <div class="sl-track">${SL.map((sl, i) => `<div class="sl"><div class="no">${i+1} / ${SL.length}</div><div class="pic">${sl.pic}</div><h4>${sl.t}</h4><p>${sl.p}</p>${sl.ex ? `<div class="ex">${sl.ex}</div>` : ''}</div>`).join('')}</div>
    <div class="sl-nav"><button class="prev" aria-label="前へ">‹</button><span class="dots">${SL.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</span><button class="next" aria-label="次へ">›</button></div>
    <button class="close">閉じる</button></div>`;
  document.body.appendChild(bg);
  const track = bg.querySelector('.sl-track'), dots = bg.querySelectorAll('.dots i');
  let idx = 0, st = null;
  const step = () => track.children[0].offsetWidth + 10;
  const mark = () => dots.forEach((d, k) => d.classList.toggle('on', k === idx));
  const go = i => { idx = Math.max(0, Math.min(SL.length - 1, i)); mark(); track.scrollTo({ left:idx * step(), behavior:'smooth' }); };
  track.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => { idx = Math.round(track.scrollLeft / step()); mark(); }, 80); }, { passive:true });
  bg.querySelector('.prev').onclick = () => go(idx - 1);
  bg.querySelector('.next').onclick = () => go(idx + 1);
  const close = () => { bg.remove(); if(!S.help){ S.help = true; save(); } };
  bg.querySelector('.close').onclick = close;
  bg.addEventListener('click', e => { if(e.target === bg) close(); });
}
$('#btnHelp').onclick = openHelp;

/* ===================== 更新の確認（解き直しマップと同じ仕組み） ===================== */
async function checkUpdate(silent){
  try{
    const res = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw 0;
    const j = await res.json(), v = Number(j.v) || 0;
    if(v > VER){
      $('#updVer').textContent = 'v' + VER + ' → v' + v + (j.note ? '　' + j.note : '');
      $('#btnUpdate').classList.remove('hidden');
    }else{
      $('#btnUpdate').classList.add('hidden');
      if(!silent) toast('いまが最新です（v' + VER + '）');
    }
  }catch(e){ if(!silent) toast('調べられませんでした'); }
}
async function doUpdate(){
  toast('更新しています…');
  try{
    if('serviceWorker' in navigator){ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(x => x.unregister())); }
    if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
}
$('#btnUpdate').onclick = doUpdate;
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(true); });

renderHome();
checkUpdate(true);
const WAKE = new URLSearchParams(location.search).has('wake');
if(!S.help && !WAKE) openHelp();   // はじめて開いたときだけ（アラームから開いた朝は出さない）
if(new URLSearchParams(location.search).has('wake')){
  history.replaceState(null, '', location.pathname);   // 読みなおしで何度も開かないように
  openTalk();
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
