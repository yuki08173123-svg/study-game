<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高校ルート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-v1.png">
<link rel="icon" href="icon-192-v1.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F7FB">
<style>
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#141C28; --muted:#455468; --line:#D3DCE7;
  --accent:#1F5FD0; --accent-soft:#E4EDFC; --accent-ink:#FFFFFF;
  --gold:#8A6512; --gold-soft:#FBF1D9;
  --chip:#E7ECF3; --shadow:0 1px 3px rgba(20,40,70,.09); --shadow-lg:0 8px 24px rgba(20,40,70,.16);
  --new:#C9500A; --red:#C13A3A;
  --eng:#1F5FD0; --eng-soft:#E4EDFC;
  --math:#0A6E6E; --math-soft:#D8EFEF;
  --jpn:#A0402A; --jpn-soft:#FAE4DD;
  --sci:#5F3FB0; --sci-soft:#EAE3FA;
  --navy1:#101B2E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151E; --card:#1A212D; --ink:#F0F4FA; --muted:#AEBCCD; --line:#303B4D;
    --accent:#7FB0F8; --accent-soft:#22314A; --accent-ink:#0C1219;
    --gold:#EDC673; --gold-soft:#3A2E17;
    --chip:#242E3D; --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-lg:0 8px 24px rgba(0,0,0,.55);
    --new:#FF9C57; --red:#F49189;
    --eng:#7FB0F8; --eng-soft:#22314A;
    --math:#5FCFCF; --math-soft:#173434;
    --jpn:#F2A992; --jpn-soft:#3B241D;
    --sci:#BCA6F5; --sci-soft:#2A2340;
  }
}
:root[data-theme="dark"]{
  --bg:#10151E; --card:#1A212D; --ink:#F0F4FA; --muted:#AEBCCD; --line:#303B4D;
  --accent:#7FB0F8; --accent-soft:#22314A; --accent-ink:#0C1219;
  --gold:#EDC673; --gold-soft:#3A2E17;
  --chip:#242E3D; --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-lg:0 8px 24px rgba(0,0,0,.55);
  --new:#FF9C57; --red:#F49189;
  --eng:#7FB0F8; --eng-soft:#22314A;
  --math:#5FCFCF; --math-soft:#173434;
  --jpn:#F2A992; --jpn-soft:#3B241D;
  --sci:#BCA6F5; --sci-soft:#2A2340;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
    "Noto Sans JP", "Yu Gothic Medium", "Yu Gothic", Meiryo, "Segoe UI", sans-serif;
  font-size:17px; line-height:1.7; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;}
.wrap{max-width:600px; margin:0 auto; padding:0 14px calc(104px + env(safe-area-inset-bottom));}
button, input, textarea, select{font-family:inherit; color:inherit;}
button{background:none; border:none; cursor:pointer; touch-action:manipulation;}
button:active{opacity:.7;}
.hidden{display:none !important;}

header.app{position:sticky; top:0; z-index:30; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 2px 8px;}
.title-row{display:flex; align-items:center; gap:9px; padding:0 2px;}
.title-row h1{font-size:21px; font-weight:700; letter-spacing:.01em;}
.title-row .ver{font-size:12.5px; color:var(--muted); font-weight:600;}
.title-row .spacer{flex:1;}
.icon-btn{width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; box-shadow:var(--shadow);}
.icon-btn svg{width:21px; height:21px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

.update{width:100%; margin-top:10px; background:var(--new); color:#fff; border-radius:14px; padding:13px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); text-align:left;}
.update svg{width:23px; height:23px; stroke:#fff; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex:none;}
.update .t{flex:1; line-height:1.4;}
.update .t b{display:block; font-size:15.5px; font-weight:700;}
.update .t span{font-size:12.5px; opacity:.95; font-weight:500;}
.update .go{background:rgba(255,255,255,.24); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; flex:none;}

.card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px;}
.card + .card{margin-top:12px;}
.sec-title{font-size:15px; font-weight:700; color:var(--ink); margin:24px 2px 8px;}
.sec-title:first-child{margin-top:14px;}
.lead{font-size:14.5px; color:var(--muted); line-height:1.75; padding:0 4px 8px;}

.chip{display:inline-block; font-size:13px; font-weight:700; border-radius:8px; padding:4px 11px; background:var(--chip); color:var(--muted);}
.chip.eng{background:var(--eng-soft); color:var(--eng);}
.chip.math{background:var(--math-soft); color:var(--math);}
.chip.jpn{background:var(--jpn-soft); color:var(--jpn);}
.chip.sci{background:var(--sci-soft); color:var(--sci);}
.chip.round{background:var(--gold-soft); color:var(--gold);}

.notice{background:var(--gold-soft); border-radius:14px; padding:13px 14px; display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;}
.notice .ic{font-size:19px; line-height:1.3;}
.notice .tx{flex:1; font-size:15px; font-weight:700; color:var(--ink); line-height:1.6;}
.notice .tx span{display:block; color:var(--muted); font-weight:500; font-size:13.5px; margin-top:2px;}
.notice .arrow{font-size:18px; color:var(--muted); font-weight:700;}

/* ==== 計画表えらび ==== */
.pickrow{margin:2px 0 9px;}
.pickrow:not(:first-child){margin-top:18px;}
.picks{display:flex; flex-wrap:wrap; gap:8px;}
.pick{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:9px 13px; line-height:1.35; text-align:left; color:var(--ink);}
.pick b{display:block; font-size:15px; font-weight:700;}
.pick span{display:block; font-size:12.5px; font-weight:500; color:var(--muted); margin-top:1px;}

/* 表示する問題集をえらぶ */
.pickhead{display:flex; align-items:center; gap:10px; padding-bottom:12px; margin-bottom:4px; border-bottom:1px solid var(--line);}
.pickhead .cnt{flex:1; font-size:14px; font-weight:500; color:var(--muted); line-height:1.5;}
.pickhead .cnt b{font-weight:700; color:var(--accent);}
.mini{flex:none; font-size:13.5px; font-weight:700; color:var(--accent); background:var(--accent-soft);
  border-radius:10px; padding:9px 13px; line-height:1.3; text-align:center;}
.chk{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 2px; border-bottom:1px solid var(--line);}
.chk:last-child{border-bottom:none;}
.chk .box{flex:none; width:25px; height:25px; border-radius:7px; border:2px solid var(--line);
  display:grid; place-items:center; font-size:14px; font-weight:700; color:transparent;}
.chk.on .box{background:var(--accent); border-color:var(--accent); color:#fff;}
.chk .tx{flex:1; font-size:15.5px; font-weight:700; line-height:1.45;}
.chk .tx span{display:block; font-size:13px; font-weight:500; color:var(--muted);}
.chk:not(.on) .tx{color:var(--muted); font-weight:500;}

/* 周目へジャンプ */
.jump{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;}
.jump button{border:1px solid var(--line); background:var(--card); border-radius:9px;
  padding:8px 13px; font-size:14px; font-weight:700; color:var(--accent); box-shadow:var(--shadow);}

/* ==== 表（スプレッドシート風） ==== */
.tscroll{overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--card); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow); margin-bottom:12px;}
table.plan{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:15px;}
table.plan th, table.plan td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:9px 11px; text-align:center; white-space:nowrap;}
table.plan tr > *:last-child{border-right:none;}
table.plan tbody tr:last-child > *{border-bottom:none;}
table.plan th{background:var(--chip); font-weight:700; font-size:13.5px; color:var(--muted);}
table.plan th.rnd{background:var(--accent-soft); color:var(--accent); font-size:15px; text-align:left; padding-left:13px;}
table.plan th.rnd.solo{position:sticky; left:0;}
table.plan td.d{color:var(--muted); font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; background:var(--bg);}
table.plan td.t{font-weight:600;}
table.plan td.ft, table.plan th.ft{color:var(--muted); font-size:13px; font-weight:700; background:var(--bg);}
.tcap{font-size:13.5px; font-weight:700; color:var(--muted); margin:2px 4px 7px;}

/* 全体計画の表 */
table.plan.ovw td, table.plan.ovw th{text-align:left;}
table.plan.ovw .nm{position:sticky; left:0; z-index:1; background:var(--card); font-weight:700; font-size:15px;
  box-shadow:1px 0 0 var(--line); white-space:normal; min-width:132px; max-width:158px; line-height:1.45;}
table.plan.ovw th.nm{background:var(--chip); z-index:3; font-size:13.5px;}
table.plan.ovw .nm i{font-style:normal; margin-left:6px; font-weight:700; font-size:12px; white-space:nowrap;
  color:var(--accent); background:var(--accent-soft); border-radius:6px; padding:2px 7px; display:inline-block; vertical-align:2px;}
table.plan.ovw td:nth-child(2){white-space:normal; min-width:104px; max-width:140px; line-height:1.5;}
table.plan.ovw .memo{white-space:normal; min-width:190px; max-width:250px; font-size:13.5px; color:var(--muted); font-weight:500; line-height:1.6;}
table.plan.ovw tr.grade td{background:var(--bg); font-size:13.5px; font-weight:700; color:var(--muted); position:static; box-shadow:none;}
table.plan.ovw tr.tap{cursor:pointer;}
table.plan.ovw tr.tap:active td{background:var(--accent-soft);}
table.plan.ovw tr.plain td, table.plan.ovw tr.plain .nm{color:var(--muted);}

/* ==== 鉄則 ==== */
.rowitem{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:13px 4px; border-bottom:1px solid var(--line);}
.rowitem:last-child{border-bottom:none;}
.rowitem .no{width:30px; height:30px; border-radius:8px; background:var(--chip); color:var(--muted); font-size:14px; font-weight:700; display:grid; place-items:center; flex:none;}
.rowitem .tx{flex:1; min-width:0;}
.rowitem .tx b{display:block; font-size:15.5px; font-weight:700; line-height:1.45;}
.rowitem .tx span{display:block; font-size:13.5px; color:var(--muted); font-weight:500; margin-top:1px;}
.rowitem .go{font-size:18px; color:var(--muted); font-weight:700; flex:none;}

.doc{font-size:15.5px; line-height:1.9; white-space:pre-wrap; word-break:break-word;}
.tetsu-item{display:flex; flex-direction:column; gap:9px; padding:13px 2px; border-bottom:1px solid var(--line);}
.tetsu-item:last-child{border-bottom:none;}
.tetsu-item .tx{font-size:15.5px; line-height:1.85; white-space:pre-wrap; word-break:break-word;}
.tetsu-item .tm{align-self:flex-start; max-width:100%; font-size:13.5px; font-weight:700; color:var(--accent);
  background:var(--accent-soft); border-radius:8px; padding:5px 11px; line-height:1.55;}
.tetsu-item .tm::before{content:"目安 "; opacity:.72;}
.tetsu-head{font-size:15px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:9px; padding:9px 12px; margin:14px 0 2px; white-space:pre-wrap; line-height:1.6;}
.tetsu-head:first-child{margin-top:0;}

/* ==== シート ==== */
.mask{position:fixed; inset:0; background:rgba(10,18,32,.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s;}
.mask.on{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--bg); border-radius:20px 20px 0 0;
  max-height:92vh; display:flex; flex-direction:column; transform:translateY(101%); transition:transform .22s cubic-bezier(.2,.7,.3,1);}
.sheet.on{transform:translateY(0);}
.sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:9px auto 4px; flex:none;}
.sheet .shead{display:flex; align-items:center; gap:10px; padding:4px 16px 10px; flex:none;}
.sheet .shead b{flex:1; font-size:18px; font-weight:700; line-height:1.4;}
.sheet .sbody{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px calc(24px + env(safe-area-inset-bottom));}
.x{width:36px; height:36px; border-radius:10px; background:var(--chip); display:grid; place-items:center; font-size:17px; font-weight:700; color:var(--muted); flex:none;}

.btnrow{display:flex; gap:8px; margin-top:12px;}
.btn{flex:1; border-radius:11px; padding:13px 10px; font-size:15.5px; font-weight:700; text-align:center; border:1px solid var(--line); background:var(--card); color:var(--ink);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.varrow{display:flex; gap:8px; margin:12px 0 4px; flex-wrap:wrap;}
.varbtn{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 13px; font-size:14.5px; font-weight:700;}
.varbtn.on{background:var(--accent); color:var(--accent-ink); border-color:transparent;}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0; border-radius:12px; color:var(--muted);}
.tabbar button.on{color:var(--accent);}
.tabbar svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.tabbar span{font-size:12px; font-weight:700;}

.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
  background:var(--navy1); color:#fff; font-size:14.5px; font-weight:600; padding:12px 20px; border-radius:12px; z-index:80;
  opacity:0; pointer-events:none; transition:.2s; box-shadow:var(--shadow-lg); max-width:88vw; text-align:center;}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

/* ==== 使い方スライド ==== */
.slides{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  gap:12px; padding-bottom:4px; scrollbar-width:none;}
.slides::-webkit-scrollbar{display:none;}
.slide{flex:0 0 100%; scroll-snap-align:center; background:var(--card); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column;}
.slide .step{font-size:13px; font-weight:700; color:var(--accent); background:var(--accent-soft);
  border-radius:999px; padding:3px 11px; align-self:flex-start; margin-bottom:9px;}
.slide h3{font-size:19px; font-weight:700; line-height:1.45; margin-bottom:12px;}
.slide .art{background:var(--bg); border-radius:12px; padding:10px; margin-bottom:13px;}
.slide .art svg{display:block; width:100%; height:auto;}
.slide p{font-size:15px; line-height:1.8; color:var(--ink);}
.slide p + p{margin-top:9px;}
.slide .sub{color:var(--muted); font-size:14px;}
.slide b.hl{color:var(--accent);}
.snav{display:flex; align-items:center; gap:10px; margin-top:14px;}
.sdots{flex:1; display:flex; gap:6px; justify-content:center; flex-wrap:wrap;}
.sdots i{width:8px; height:8px; border-radius:50%; background:var(--line); display:block;}
.sdots i.on{background:var(--accent); width:20px; border-radius:999px;}
.snav .nb{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 15px;
  font-size:15px; font-weight:700; flex:none;}
.snav .nb.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.snav .nb[disabled]{opacity:.35;}

.setrow{display:flex; align-items:center; gap:10px; padding:14px 2px; border-bottom:1px solid var(--line); width:100%; text-align:left; text-decoration:none; color:inherit;}
.setrow:last-child{border-bottom:none;}
.setrow .tx{flex:1;}
.setrow .tx b{display:block; font-size:16px; font-weight:700;}
.setrow .tx span{display:block; font-size:13.5px; color:var(--muted); font-weight:500;}
.setrow .val{font-size:14.5px; font-weight:700; color:var(--accent);}
.link{color:var(--accent); font-weight:700; text-decoration:underline;}
</style>
</head>
<body>

<div class="wrap">
  <header class="app">
    <div class="title-row">
      <h1>高校ルート</h1><span class="ver" id="verLabel"></span>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" aria-label="表示を切りかえる">
        <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </div>
    <button class="update hidden" id="updateBar">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span class="t"><b>新しい高校ルートがあります</b><span>タップすると最新にします</span></span>
      <span class="go">更新</span>
    </button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="route" class="on"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19h5a4 4 0 0 0 0-8h-3a4 4 0 0 1 0-8h5"/></svg><span>ルート</span></button>
  <button data-tab="tetsu"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8 7.5h7M8 11h5"/></svg><span>鉄則</span></button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-2.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4z"/></svg><span>設定</span></button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shead"><b id="sheetTitle"></b><button class="x" id="sheetX">✕</button></div>
  <div class="sbody" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const VER = 8;
const KEY = 'route.v1';
const SUBJ_CLASS = {'英語':'eng','数学':'math','国語':'jpn','理科':'sci'};
const EXTRA_MATH = ['nyumon_ia','nyumon_iib','kichart_ia','kichart_iib'];

let S = load();
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY) || '{}');
    return { theme: o.theme || '', hidden: o.hidden || {} };
  }catch(e){ return { theme:'', hidden:{} }; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ theme: S.theme, hidden: S.hidden })); }catch(e){} }

/* ---------- データ ---------- */
const BOOKS = {}; ROUTE.books.forEach(b => BOOKS[b.id] = b);
function bookOf(id){ return BOOKS[id]; }
function variantOf(b, vi){ return (b.variants && b.variants.length) ? b.variants[Math.min(vi||0, b.variants.length-1)] : null; }
function totalDays(v){
  if(!v) return 0;
  if(v._max) return v._max;
  let max = 0;
  v.secs.forEach(s => s.rows.forEach(row => row.forEach(c => { if(c && c[0] > max) max = c[0]; })));
  v._max = max;
  return max;
}
function bookMeta(id){
  for(const s of ROUTE.plan) for(const r of s.rows) if(r.id === id) return r;
  return null;
}

/* ---------- 表示ヘルパー ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtItem(s){ return String(s).replace(/ +　+/g, '\n').replace(/　/g, ' ').replace(/\n{2,}/g,'\n').trim(); }
function fmtDoc(s){
  return String(s)
    .replace(/\s*⸻\s*/g, '\n\n────────\n\n')
    .replace(/ *• */g, '\n・')
    .replace(/ +　+/g, '\n')
    .replace(/　/g, ' ')
    .replace(/ {2,}/g, '\n\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s、]+)/g, u => '<a class="link" href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
}
function shortTitle(t){ return String(t).replace(/（[^）]*）\s*$/, '').trim(); }
function spanOf(t){ const m = String(t).match(/（([^）]*)）\s*$/); return m ? m[1] : ''; }
function tetsuName(t){ const m = String(t).match(/^.*?】/); return (m ? m[0] : String(t)).trim(); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 1800);
}

/* ---------- 画面 ---------- */
let tab = 'route';
function render(){
  const v = document.getElementById('view');
  v.innerHTML = tab === 'route' ? viewRoute() : tab === 'tetsu' ? viewTetsu() : viewSet();
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  window.scrollTo(0, 0);
}
function go(t){ tab = t; render(); }

/* ===== ルート ===== */
/* 計画表がある問題集を、教科ごとにまとめて返す */
function pickGroups(){
  const out = [];
  ROUTE.plan.forEach(sec => {
    const ids = [];
    sec.rows.forEach(r => { if(r.id && bookOf(r.id) && bookOf(r.id).variants.length) ids.push(r.id); });
    if(sec.subject === '数学') EXTRA_MATH.forEach(x => ids.push(x));
    if(ids.length) out.push({ subject: sec.subject, cls: SUBJ_CLASS[sec.subject] || '', ids });
  });
  return out;
}

function viewRoute(){
  const groups = pickGroups();
  const total = groups.reduce((n, g) => n + g.ids.length, 0);
  const shown = groups.reduce((n, g) => n + g.ids.filter(id => !S.hidden[id]).length, 0);

  let h = '<div class="sec-title" style="margin-top:14px">日ごとの計画表</div>';
  h += '<div class="lead">見たい問題集を押すと、その問題集の「何日目に何をやるか」の表がひらきます。</div>';
  h += '<div class="card">';
  h += '<div class="pickhead"><span class="cnt">'
    + (shown === total ? '全'+total+'冊' : '<b>'+shown+'</b> / '+total+'冊を表示中')
    + '</span><button class="mini" onclick="openChooser()">表示する問題集をえらぶ</button></div>';
  if(!shown){
    h += '<div class="lead" style="padding:4px 2px 0">表示する問題集が1つもえらばれていません。上のボタンからえらんでください。</div>';
  }
  groups.forEach(g => {
    const ids = g.ids.filter(id => !S.hidden[id]);
    if(!ids.length) return;
    h += '<div class="pickrow"><span class="chip '+g.cls+'">'+esc(g.subject)+'</span></div><div class="picks">';
    ids.forEach(id => {
      const b = bookOf(id), sp = spanOf(b.title);
      h += '<button class="pick" onclick="openBook(\''+id+'\')"><b>'+esc(shortTitle(b.title))+'</b>'
        + (sp ? '<span>'+esc(sp)+'</span>' : '') + '</button>';
    });
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="sec-title">全体計画</div>';
  h += '<div class="lead">いつ・どの問題集を・何周するかの全体像です。行を押すと、その問題集の計画表と鉄則が見られます。<br>表は横にスワイプすると続き（期間・周回数・メモ）が見られます。</div>';
  ROUTE.plan.forEach(sec => {
    const cls = SUBJ_CLASS[sec.subject] || '';
    h += '<div style="margin:16px 2px 8px"><span class="chip '+cls+'">'+esc(sec.subject)+'</span></div>';
    h += '<div class="tscroll"><table class="plan ovw"><thead><tr>'
      + '<th class="nm">使用問題集</th><th>月</th><th>期間</th><th>周回数</th><th class="memo">メモ</th>'
      + '</tr></thead><tbody>';
    let grade = null;
    sec.rows.forEach(r => {
      if(r.grade && r.grade !== grade){
        grade = r.grade;
        h += '<tr class="grade"><td class="nm" colspan="5">▼ '+esc(grade)+'</td></tr>';
      }
      h += planRow(r);
    });
    h += '</tbody></table></div>';
  });

  h += '<div class="sec-title">そのほかの計画表</div>';
  h += '<div class="lead">全体計画には出ていませんが、スプレッドシートに計画表があるものです。</div>';
  h += '<div class="tscroll"><table class="plan ovw"><thead><tr>'
    + '<th class="nm">使用問題集</th><th>期間</th></tr></thead><tbody>';
  EXTRA_MATH.forEach(id => {
    const b = bookOf(id); if(!b) return;
    h += '<tr class="tap" onclick="openBook(\''+id+'\')"><td class="nm">'
      + esc(shortTitle(b.title)) + '<i>計画表 ›</i></td>'
      + '<td>'+esc(spanOf(b.title))+'</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}
function planRow(r){
  const memo = (r.memo || []).filter(x => x && x !== r.name).join('　/　');
  const cel = x => '<td>'+esc(x && x !== 'ー' ? x : '')+'</td>';
  return '<tr class="'+(r.id ? 'tap' : 'plain')+'"'+(r.id ? ' onclick="openBook(\''+r.id+'\')"' : '')+'>'
    + '<td class="nm">'+esc(r.name)+(r.id ? '<i>計画表 ›</i>' : '')+'</td>'
    + cel(r.month) + cel(r.span) + cel(r.rounds)
    + '<td class="memo">'+esc(memo)+'</td></tr>';
}

function cycleTheme(){
  S.theme = S.theme === '' ? 'light' : S.theme === 'light' ? 'dark' : '';
  save(); applyTheme(); render();
}
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute('data-theme', S.theme);
  else document.documentElement.removeAttribute('data-theme');
}

/* ===== シート ===== */
function openSheet(title, body){
  document.getElementById('sheetTitle').innerHTML = title;
  document.getElementById('sheetBody').innerHTML = body;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheetBody').scrollTop = 0;
}

  document.getElementById('sheet').classList.remove('on');

/* ===== 表示する問題集をえらぶ ===== */
function openChooser(){
  renderChooser();
  document.getElementById('sheet').classList.add('on');
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheetBody').scrollTop = 0;
}
function renderChooser(){
  const groups = pickGroups();
  let h = '<div class="lead">チェックを外した問題集は、「日ごとの計画表」のボタンに出なくなります。いつでも戻せます。<br>下の「全体計画」の表からは消えません。</div>';
  h += '<div class="btnrow" style="margin:0 0 4px"><button class="btn" onclick="chooseAll(true)">すべて表示</button>'
    + '<button class="btn" onclick="chooseAll(false)">すべて外す</button></div>';
  groups.forEach(g => {
    h += '<div style="margin:18px 2px 8px"><span class="chip '+g.cls+'">'+esc(g.subject)+'</span></div><div class="card">';
    g.ids.forEach(id => {
      const b = bookOf(id), on = !S.hidden[id], sp = spanOf(b.title);
      h += '<button class="chk'+(on ? ' on' : '')+'" onclick="toggleBook(\''+id+'\')">'
        + '<span class="box">✓</span><span class="tx">'+esc(shortTitle(b.title))
        + (sp ? '<span>'+esc(sp)+'</span>' : '') + '</span></button>';
    });
    h += '</div>';
  });
  document.getElementById('sheetTitle').textContent = '表示する問題集';
  document.getElementById('sheetBody').innerHTML = h;
}
function toggleBook(id){
  if(S.hidden[id]) delete S.hidden[id]; else S.hidden[id] = 1;
  save(); renderChooser(); render();
}
function chooseAll(on){
  pickGroups().forEach(g => g.ids.forEach(id => { if(on) delete S.hidden[id]; else S.hidden[id] = 1; }));
  save(); renderChooser(); render();
  toast(on ? 'すべて表示にしました' : 'すべて外しました');
}

let sheetVar = {};
function openBook(id){ renderSheetBook(id); document.getElementById('sheet').classList.add('on'); document.getElementById('mask').classList.add('on'); }
function renderSheetBook(id){
  const b = bookOf(id), meta = bookMeta(id);
  const vi = sheetVar[id] || 0;
  const v = variantOf(b, vi), tot = totalDays(v);
  const cls = SUBJ_CLASS[b.subject] || '';
  let h = '<div class="card" style="margin-bottom:12px">';
  h += '<div style="margin-bottom:9px"><span class="chip '+cls+'">'+esc(b.subject)+'</span>'
     + (spanOf(b.title) ? ' <span class="chip">'+esc(spanOf(b.title))+'</span>' : '')
     + (meta && meta.rounds && meta.rounds !== 'ー' ? ' <span class="chip round">'+esc(meta.rounds)+'</span>' : '') + '</div>';
  if(meta && meta.month && meta.month !== 'ー') h += '<div class="lead" style="padding:0 0 4px">やる時期：'+esc(meta.month)+(meta.grade ? '（'+esc(meta.grade)+'）' : '')+'</div>';
  if(meta && (meta.memo || []).length) h += '<div class="lead" style="padding:0 0 4px">'+esc((meta.memo || []).join('　/　'))+'</div>';
  (b.notes || []).forEach(n => { h += '<div class="notice" style="margin-top:9px"><span class="ic">📌</span><span class="tx" style="font-weight:500">'+esc(fmtItem(n))+'</span></div>'; });
  if(b.variants.length > 1){
    h += '<div class="lead" style="padding:12px 0 0">計画は2とおりあります。</div><div class="varrow">';
    b.variants.forEach((vv, i) => { h += '<button class="varbtn'+(i === vi ? ' on' : '')+'" onclick="pickVar(\''+id+'\','+i+')">'+esc(vv.name)+'</button>'; });
    h += '</div>';
  }
  if(v) h += '<div class="lead" style="padding:10px 0 0">全'+tot+'日の計画です。</div>';
  const tt = b.tetsoku && ROUTE.tetsoku[b.tetsoku];
  if(tt) h += '<div class="btnrow"><button class="btn primary" onclick="openTetsu(\''+b.tetsoku+'\')">'
    + esc(tetsuName(tt.title)) + ' を見る</button></div>';
  h += '</div>';

  if(v){
    h += '<div class="sec-title" style="margin-top:6px">日ごとの計画表</div>';
    h += '<div class="lead">日づけではなく「1日目、2日目…」で進みます。できない日があってもズレません。<br>表は横にスワイプすると続きが見られます。</div>';
    if(v.secs.length >= 3){
      h += '<div class="jump">';
      v.secs.forEach((sec, i) => { h += '<button onclick="jumpSec('+i+')">'+esc(secLabel(sec, i))+'</button>'; });
      h += '</div>';
    }
    h += planTables(v);
  }
  document.getElementById('sheetTitle').innerHTML = esc(shortTitle(b.title));
  document.getElementById('sheetBody').innerHTML = h;
  document.getElementById('sheetBody').scrollTop = 0;
}
function pickVar(id, i){ sheetVar[id] = i; renderSheetBook(id); }

/* 元のスプレッドシートと同じ「表」で計画を描く */
function secLabel(sec, i){
  const l = (sec.heads[0] && sec.heads[0].l) || '';
  return l.replace(/（[^）]*）/g, '').trim() || ('計画' + (i + 1));
}
function jumpSec(i){
  const el = document.getElementById('sec' + i); if(!el) return;
  const box = document.getElementById('sheetBody');
  box.scrollTo({ top: el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 14, behavior:'smooth' });
}
function planTables(v){
  let h = '';
  v.secs.forEach((s, si) => {
    if(s.cap) h += '<div class="tcap">'+esc(s.cap)+'</div>';
    h += '<div class="tscroll" id="sec'+si+'"><table class="plan"><thead><tr>';
    const solo = s.heads.length === 1 ? ' solo' : '';
    if(s.heads.length) s.heads.forEach(hd => { h += '<th colspan="'+(hd.n*2)+'" class="rnd'+solo+'">'+esc(hd.l)+'</th>'; });
    else h += '<th colspan="'+(s.cols*2)+'" class="rnd solo">計画</th>';
    if(s.foots) h += '<th class="ft"></th>';
    h += '</tr><tr class="sub">';
    for(let i = 0; i < s.cols; i++) h += '<th>日</th><th>やる範囲</th>';
    if(s.foots) h += '<th></th>';
    h += '</tr></thead><tbody>';
    s.rows.forEach((row, ri) => {
      h += '<tr>';
      row.forEach(c => {
        if(!c){ h += '<td class="d"></td><td class="t"></td>'; return; }
        h += '<td class="d">'+c[0]+'</td><td class="t">'+esc(c[1])+'</td>';
      });
      if(s.foots) h += '<td class="ft">'+esc(s.foots[ri] || '')+'</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  });
  return h;
}

function openHelp(){
  let h = '<div class="slides" id="slideBox">';
  SLIDES.forEach(s => {
    h += '<div class="slide"><span class="step">'+s.step+'</span><h3>'+s.t+'</h3>'
      + '<div class="art">'+s.art+'</div>' + s.b + '</div>';
  });
  h += '</div>';
  h += '<div class="snav"><button class="nb" id="sPrev" onclick="slideGo(-1)">‹ もどる</button>'
    + '<span class="sdots" id="sDots"></span>'
    + '<button class="nb primary" id="sNext" onclick="slideGo(1)">つぎへ ›</button></div>';
  openSheet('高校ルートの使い方', h);
  const box = document.getElementById('slideBox');
  box.addEventListener('scroll', () => { clearTimeout(box._t); box._t = setTimeout(slideSync, 60); });
  slideSync();
}
function slideIndex(){
  const box = document.getElementById('slideBox');
  return Math.round(box.scrollLeft / (box.clientWidth + 12));
}
function slideSync(){
  const box = document.getElementById('slideBox'); if(!box) return;
  const i = slideIndex();
  let d = '';
  SLIDES.forEach((_, k) => { d += '<i class="'+(k === i ? 'on' : '')+'"></i>'; });
  document.getElementById('sDots').innerHTML = d;
  document.getElementById('sPrev').disabled = i <= 0;
  const nx = document.getElementById('sNext');
  nx.textContent = i >= SLIDES.length - 1 ? 'とじる' : 'つぎへ ›';
}
function slideGo(dir){
  const box = document.getElementById('slideBox');
  const i = slideIndex();
  if(dir > 0 && i >= SLIDES.length - 1){ closeSheet(); return; }
  box.scrollTo({ left: Math.max(0, i + dir) * (box.clientWidth + 12), behavior:'smooth' });
  setTimeout(slideSync, 320);
}

function openTetsu(key){
  const t = ROUTE.tetsoku[key];
  if(!t){ toast('鉄則がありません'); return; }
  let h = '<div class="card">';
  t.items.forEach(it => {
    const s = fmtItem(it.t);
    if(/^[↓▼]/.test(s)){ h += '<div class="tetsu-head">'+esc(s.replace(/^[↓▼]\s*/, ''))+'</div>'; return; }
    h += '<div class="tetsu-item"><span class="tx">'+linkify(s)+'</span>'
      + (it.time ? '<span class="tm">'+esc(it.time.replace(/\s+/g,' '))+'</span>' : '') + '</div>';
  });
  h += '</div>';
  openSheet(esc(tetsuName(t.title)), h);
}
function openDoc(which){
  if(which === 'prompt'){
    let h = '<div class="lead">解説を読んでもわからない問題は、問題と解説の写真をつけて、この文をAIに送ってください。</div>';
    h += '<div class="card"><div class="doc">'+linkify(fmtDoc(ROUTE.extra.prompt))+'</div>'
      + '<div class="btnrow"><button class="btn primary" onclick="copyText(ROUTE.extra.prompt)">この文をコピー</button></div></div>';
    openSheet('数学の【最強プロンプト】', h);
  }else{
    let h = '<div class="card"><div class="doc">'+linkify(fmtDoc(ROUTE.extra.pro_shikou))+'</div></div>';
    h += '<div class="sec-title">もとになったメモ</div>';
    h += '<div class="card"><div class="doc" style="font-size:14.5px; color:var(--muted)">'+linkify(fmtDoc(ROUTE.extra.pro_shikou_src))+'</div></div>';
    openSheet('プロの思考（国語読解の鉄則）', h);
  }
}
function copyText(t){
  const s = fmtDoc(t);
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(() => toast('コピーしました'), () => fallbackCopy(s));
  else fallbackCopy(s);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーできませんでした'); }
  document.body.removeChild(ta);
}

/* ---------- 更新チェック ---------- */
async function checkUpdate(manual){
  try{
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    const j = await r.json();
    if(j.v > VER){
      document.getElementById('updateBar').classList.remove('hidden');
      if(manual) toast('新しいバージョンがあります');
    }else if(manual) toast('いまのが最新です（v' + VER + '）');
  }catch(e){ if(manual) toast('調べられませんでした'); }
}
async function doUpdate(){
  try{
    if(navigator.serviceWorker){
      const rs = await navigator.serviceWorker.getRegistrations();
      for(const r of rs) await r.unregister();
    }
    if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); }
  }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
}

/* ---------- 起動 ---------- */
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if(b) go(b.dataset.tab);
});
document.getElementById('themeBtn').addEventListener('click', cycleTheme);
document.getElementById('mask').addEventListener('click', closeSheet);
document.getElementById('sheetX').addEventListener('click', closeSheet);
document.getElementById('updateBar').addEventListener('click', doUpdate);
document.getElementById('verLabel').textContent = 'v' + VER;
applyTheme();
render();
checkUpdate(false);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(false); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
