<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Theater</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c0f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Theater">
<style>
:root{
  --bg:#0b0c0f; --surf:#15171c; --surf2:#1c1f26; --surf3:#242830;
  --line:#22252c; --line2:#2f333c;
  --ink:#edeff3; --ink2:#a3a8b3; --ink3:#6d727d;
  --acc:#d9b26a; --acc-soft:#2a2317; --acc-ink:#12130f;
  --ok:#4bb98a;
  --r:14px;
  --tabh:60px;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
}
/* 2回タップで拡大されないようにする（iPhoneの標準動作を止める）。
   指2本のピンチでの拡大と、ふつうのスクロールはそのまま使える。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* シークバーだけは、つまんで動かしている間に画面が動かないようにする */
.seek{touch-action:none}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt" 1;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:1rem}
button{cursor:pointer;border:none;background:none;color:inherit;padding:0;
  -webkit-user-select:none;user-select:none}
input,textarea{background:var(--surf2);border:1px solid var(--line2);border-radius:10px;
  padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.hidden{display:none!important}
svg{display:block;flex:none}
img{display:block}

/* ---------- 骨格 ---------- */
#top{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 70%,rgba(11,12,15,0));
  padding-top:env(safe-area-inset-top)}
.tbar{max-width:680px;margin:0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:8px 16px}
.tbar .ttl{font-size:1.34rem;font-weight:700;letter-spacing:.06em;flex:1}
/* ホームのタイトルだけ 真ん中に大きく */
.tbar .ttl.home{font-size:2rem;font-weight:800;letter-spacing:.16em;text-align:center;
  padding:10px 0 6px;line-height:1.2}
.tbtn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);background:var(--surf);border:1px solid var(--line)}
.tbtn:active{opacity:.55}
main{max-width:680px;margin:0 auto;
  padding:2px 16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom))}

/* ---------- 見出し ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 11px}
.sec h2{font-size:.96rem;font-weight:700;letter-spacing:.04em;margin:0}
.sec .more{font-size:.78rem;font-weight:700;color:var(--ink3);padding:4px}
.sec .more:active{opacity:.5}
.lead{color:var(--ink2);font-size:.86rem;margin:2px 2px 0}

/* ---------- 動画カード（横並び） ---------- */
.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{position:relative;display:flex;width:100%;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:10px;transition:transform .12s}
.vcard:active{transform:scale(.988)}
.vmain{flex:1;min-width:0;display:flex;gap:13px;text-align:left}
.vmain:active{opacity:.7}
/* 見た回数。手では増やせないので ボタンではなく ただの表示 */
.cnt2{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:3px;
  background:var(--acc);color:var(--acc-ink);border-radius:20px;padding:3px 9px 3px 7px;
  font-size:.74rem;font-weight:800;font-variant-numeric:tabular-nums}
/* 見た動画は サムネに金のふちを付ける（タイトル画像を隠さないように） */
.thumb.on::after{content:'';position:absolute;inset:0;border-radius:10px;
  box-shadow:inset 0 0 0 2px var(--acc);pointer-events:none}
/* 見た回数のつぶ。反復するほど増えていく */
.dots{display:inline-flex;align-items:center;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);display:block}
.dots b{font-size:.7rem;font-weight:800;color:var(--acc);margin-left:1px}
.thumb{position:relative;width:152px;flex:none;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:var(--surf3)}
@media (max-width:359px){ .thumb{width:126px} }
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .lm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;background:linear-gradient(140deg,#2b2f3a,#171a20);color:var(--acc)}
.thumb .lm b{font-size:.6rem;font-weight:800;letter-spacing:.14em;color:var(--ink3)}
.thumb .newb{position:absolute;left:5px;top:5px;background:#e0483f;color:#fff;
  font-size:.6rem;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:5px;
  box-shadow:0 1px 6px rgba(0,0,0,.5)}
.thumb .dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.78);color:#fff;
  font-size:.66rem;font-weight:700;padding:1px 5px;border-radius:5px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.thumb .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22)}
.thumb .pbar i{display:block;height:100%;background:var(--acc)}
.vmeta{flex:1;min-width:0;padding:2px 2px 0 0;display:flex;flex-direction:column}
.vt{font-size:1rem;font-weight:700;line-height:1.45;letter-spacing:.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vs{margin-top:auto;font-size:.72rem;color:var(--ink3);font-weight:600;letter-spacing:.03em;
  display:flex;align-items:center;gap:6px;padding-top:5px;min-height:22px}
.vcard.n .vs{padding-right:62px}
.tag{color:var(--acc);background:var(--acc-soft);border-radius:20px;padding:2px 8px;font-size:.68rem;
  font-weight:700;letter-spacing:.04em;white-space:nowrap}

/* ---------- 続きから（大きいカード） ---------- */
.big{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.big:active{transform:scale(.993)}
.big .thumb{width:100%;border-radius:0}
.big .thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;background:rgba(11,12,15,.72);
  display:flex;align-items:center;justify-content:center;color:#fff;backdrop-filter:blur(4px)}
.big .bt{padding:12px 14px 14px}
.big .bt .vt{-webkit-line-clamp:2}
.big .bt .vs{padding-top:7px}

/* ---------- レベル（ホームのいちばん上。スクショを撮る前提で作る） ---------- */
.lvcard{display:block;width:100%;text-align:left;border-radius:18px;padding:20px 20px 18px;
  background:linear-gradient(150deg,#221c10,#14161b 60%);border:1px solid #3b3222;
  position:relative;overflow:hidden}
.lvcard:active{transform:scale(.995)}
.lvcard .nm2{font-size:.76rem;font-weight:800;color:var(--acc);letter-spacing:.1em}
.lvcard .lvrow{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.lvcard .lvl{font-size:.8rem;font-weight:800;color:var(--ink3);letter-spacing:.14em;padding-bottom:9px}
.lvcard .lvn{font-size:3.6rem;font-weight:800;line-height:.95;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--acc)}
.lvcard .ttlj{font-family:var(--serif);font-size:1.16rem;font-weight:600;letter-spacing:.08em;
  color:var(--ink);padding-bottom:10px;margin-left:auto}
.lvcard .bar{margin-top:14px;height:7px}
.lvcard .exp{margin-top:7px;font-size:.74rem;color:var(--ink3);font-weight:700;
  font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.lvcard .st3{display:flex;gap:0;margin-top:15px;border-top:1px solid #2c2619;padding-top:13px}
.lvcard .st3 div{flex:1;text-align:center}
.lvcard .st3 b{display:block;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.lvcard .st3 span{font-size:.68rem;color:var(--ink3);font-weight:700;letter-spacing:.04em}
.lvcard .dt{margin-top:12px;font-size:.68rem;color:var(--ink3);font-weight:600;text-align:right}

/* ---------- 区分タイル（ホーム） ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:16px;
  padding:15px 15px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;
  min-height:100px;transition:transform .12s}
.tile:active{transform:scale(.985);background:var(--surf2)}
.tile .tn{font-size:1.02rem;font-weight:700;letter-spacing:.02em;line-height:1.35}
.tile .tnew{display:inline-block;background:#e0483f;color:#fff;font-size:.62rem;font-weight:800;
  border-radius:20px;padding:1px 7px;margin-left:7px;vertical-align:middle}
.tile .tc{font-size:.74rem;color:var(--ink3);font-weight:700;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;margin-top:auto}
.bar{height:5px;border-radius:3px;background:var(--surf3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}

/* ---------- 区分の中（ジャンル見出し） ---------- */
.chead{margin:4px 2px 0}
.chead h1{font-size:1.46rem;font-weight:700;letter-spacing:.03em;margin:0 0 7px;line-height:1.3}
.chead .st{font-size:.79rem;color:var(--ink3);font-weight:700;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.chead .bar{margin-top:11px}
.gsec{display:flex;align-items:center;gap:10px;margin:26px 2px 11px;
  font-size:.85rem;font-weight:800;color:var(--acc);letter-spacing:.06em}
.gsec::after{content:'';flex:1;height:1px;background:var(--line)}
.gsec .n{color:var(--ink3);font-weight:700;font-size:.72rem}

/* ---------- チップ ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 2px;margin:0 -16px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--line);
  font-size:.83rem;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip:active{opacity:.6}

/* ---------- 空・注意 ---------- */
.empty{text-align:center;color:var(--ink3);font-size:.88rem;padding:56px 20px;line-height:2}
.note{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;color:var(--ink2);font-size:.85rem;line-height:1.85}

/* ---------- 行 ---------- */
.group{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 15px;min-height:54px;width:100%;
  text-align:left;position:relative}
.item + .item::before{content:'';position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line)}
.item:active{background:var(--surf2)}
.item .nm{flex:1;font-size:.93rem;font-weight:600}
.item .ct{font-size:.82rem;color:var(--ink3)}
.item .chev{color:var(--ink3);opacity:.6}
.sw{width:46px;height:28px;border-radius:20px;background:var(--surf3);position:relative;flex:none;
  transition:background .18s}
.sw i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .18s}
.sw.on{background:var(--acc)}
.sw.on i{transform:translateX(18px)}

/* ---------- ボタン ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:48px;
  border-radius:12px;background:var(--surf2);border:1px solid var(--line2);
  font-size:.93rem;font-weight:700;letter-spacing:.02em}
.btn:active{opacity:.6}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{height:40px;font-size:.85rem}

/* ---------- タブバー ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(11,12,15,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:680px;margin:0 auto;height:var(--tabh);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink3);font-size:.66rem;font-weight:700;letter-spacing:.04em}
.tab.on{color:var(--acc)}
.tab:active{opacity:.6}

/* ---------- 再生画面 ---------- */
#pv{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;
  overscroll-behavior:contain}
.pvtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--bg)}
.pvtop .nm{flex:1;font-size:.82rem;font-weight:700;color:var(--ink2);letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{background:#000}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;margin:0 auto;background:#000;overflow:hidden}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Loom はプレーヤーを差し替えられないので、Loom自身の画面をそのまま使う。
   おすすめ動画に流されるつくりではないので、これで問題ない */
#loomfr{z-index:3}
/* iframe への直接タップを止め、YouTubeへ飛ばさない */
.catch{position:absolute;inset:0;z-index:2}
/* 一時停止するとYouTubeがタイトルとロゴを出すので、自前の幕でかぶせる。
   タップは下の .catch に通すので pointer-events:none にしておく */
.scrim{position:absolute;inset:0;z-index:2;background:#000;pointer-events:none;
  display:flex;align-items:center;justify-content:center}
.scrim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4}
.scrim .pb2{position:relative;width:64px;height:64px;border-radius:50%;
  background:rgba(217,178,106,.94);color:var(--acc-ink);
  display:flex;align-items:center;justify-content:center}
.catch.off{pointer-events:none}
.poster{position:absolute;inset:0;z-index:4;background:#000;display:flex;
  align-items:center;justify-content:center}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.bigplay{position:relative;width:68px;height:68px;border-radius:50%;background:var(--acc);
  color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.bigplay:active{transform:scale(.94)}
.phint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#cfd3da;
  font-size:.76rem;font-weight:600;text-shadow:0 1px 6px #000}
.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:26px 10px 8px;
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.82));transition:opacity .22s}
.ctrl.fade{opacity:0;pointer-events:none}
.seekrow{display:flex;align-items:center;gap:9px;padding:0 4px}
.tm{font-size:.7rem;font-weight:700;color:#dfe2e8;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seek{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:none;padding:0;border:0}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:3px;
  background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.3)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--acc);margin-top:-4.5px}
.seek::-moz-range-track{height:4px;border-radius:3px;background:rgba(255,255,255,.3)}
.seek::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--acc)}
.btnrow{display:flex;align-items:center;gap:4px;padding:2px 2px 0}
.pb{height:40px;min-width:40px;padding:0 8px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;gap:3px;color:#fff;font-size:.72rem;font-weight:700}
.pb:active{background:rgba(255,255,255,.14)}
.pb.main{background:rgba(255,255,255,.14)}
.pb.on{color:var(--acc);background:rgba(217,178,106,.18)}
.pb .n{font-size:.6rem;font-weight:800;letter-spacing:0}
.sp{flex:1}
.endcard{position:absolute;inset:0;z-index:5;background:rgba(6,7,9,.93);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center}
.endcard .ttl{font-size:.94rem;font-weight:700}
.endcard .row{display:flex;gap:9px;width:100%;max-width:340px}
.endcard .nxt{color:var(--ink2);font-size:.8rem;max-width:300px;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvbody{max-width:680px;margin:0 auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
.pvbody h1{font-size:1.06rem;font-weight:700;line-height:1.55;margin:0 0 8px;letter-spacing:.01em}
.pvbody .desc{color:var(--ink2);font-size:.88rem;line-height:1.9;white-space:pre-wrap;margin-top:12px}
.acts{display:flex;gap:9px;margin-top:14px}
.acts .btn{flex:1}
#pv.exp{overflow:hidden}
#pv.exp .stage{position:fixed;inset:0;z-index:80;background:#000;display:flex;
  align-items:center;justify-content:center}
/* flexの中で縮まないように flex:none を付ける（付けないと動画が小さくなる） */
#pv.exp .vwrap{flex:none;width:min(100vw,177.78vh)}
#pv.exp.rot .vwrap{flex:none;width:min(100vh,177.78vw);transform:rotate(90deg)}

/* ---------- 使用マニュアル ----------
   8つの区分（金＋カード）とは別の見え方にする。
   落ち着いた藍色＋明朝の見出しで「手引き」らしくした。 */
:root{ --mn:#8fb8d9; --mn-soft:#151d26; --mn-line:#22323f; }
.mban{display:block;width:100%;text-align:left;border-radius:16px;padding:16px 17px;
  background:linear-gradient(135deg,#182430,#121a22);border:1px solid var(--mn-line);
  transition:transform .12s}
.mban:active{transform:scale(.99)}
.mban .mt{font-family:var(--serif);font-size:1.2rem;font-weight:600;letter-spacing:.05em;
  color:var(--mn);display:flex;align-items:center;gap:9px}
.mban .ms{font-size:.8rem;color:var(--ink3);font-weight:600;margin-top:5px;letter-spacing:.02em}
#main.man{background:transparent}
.mhead{margin:6px 2px 0}
.mhead h1{font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:.07em;
  color:var(--mn);margin:0 0 8px}
.mhead .ms{font-size:.86rem;color:var(--ink2);line-height:1.85}
.mtabs{display:flex;gap:9px;margin-top:16px}
.mtab{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--mn-line);
  background:var(--mn-soft);text-align:center}
.mtab .n{font-family:var(--serif);font-size:1rem;font-weight:600;letter-spacing:.04em;color:var(--ink2)}
.mtab .c{font-size:.68rem;color:var(--ink3);font-weight:700;margin-top:3px}
.mtab.on{background:var(--mn);border-color:var(--mn)}
.mtab.on .n,.mtab.on .c{color:#0d151c}
.mlist{margin-top:18px;border-top:1px solid var(--mn-line)}
.msec{border-bottom:1px solid var(--mn-line)}
.mq{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 4px}
.mq:active{opacity:.6}
.mq .qh{flex:1;font-family:var(--serif);font-size:1.06rem;font-weight:600;letter-spacing:.03em;
  line-height:1.5}
.mq .qn{font-size:.7rem;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums}
.mq .qi{color:var(--mn);transition:transform .2s}
.msec.open .qi{transform:rotate(90deg)}
.mv{display:flex;flex-direction:column;gap:1px;padding:0 0 12px}
.mrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 8px;
  border-radius:9px}
.mrow:active{background:var(--mn-soft)}
.mrow .mi{width:22px;flex:none;color:var(--mn);opacity:.8}
.mrow .mx{flex:1;font-size:.93rem;line-height:1.55;font-weight:600;color:var(--ink2)}
.mrow.seen .mx{color:var(--ink3)}
.mrow .mk{flex:none;color:var(--acc);font-size:.72rem;font-weight:800}

/* ---------- レベルのルール ---------- */
.rule{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 15px;margin-top:2px}

<script>
'use strict';
/* ===================== 定数 ===================== */
const VER = 30;
const K_PROG='th_prog', K_FAV='th_fav', K_CFG='th_cfg', K_CACHE='th_cache', K_ADM='th_adm',
      K_FOLD='th_folders', K_OUT='th_out', K_CHAP='th_chap', K_MAN='th_man',
      K_TOK='th_tok', K_OKAT='th_okat', K_AT='th_at';

/* 塾生かどうかをたしかめる入口。中身（動画リスト）は公開の場所には置いていない。
   ここに毎回聞きにいって、Discordのサーバーに「いま」いる人にだけ渡してもらう。 */
const API = 'https://theater-auth.yuki08173123.workers.dev';
/* ネットにつながらないとき、前に読みこんだ控えで動かしてよい期間 */
const GRACE = 3 * 24 * 60 * 60 * 1000;
/* アプリに戻ってきたとき、前の確認からこれだけ経っていたら もう一度たしかめる */
const RECHECK = 60 * 1000;
/* 記録を送るまでの待ち時間。押すたびに送ると回線とサーバーの無駄なので少しためる */
const PUSH_WAIT = 12 * 1000;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const now = () => Date.now();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const svg = (p,o) => `<svg width="${(o&&o.s)||22}" height="${(o&&o.s)||22}" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="${(o&&o.w)||1.8}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const fill = (p,o) => `<svg width="${(o&&o.s)||22}" height="${(o&&o.s)||22}" viewBox="0 0 24 24"
  fill="currentColor">${p}</svg>`;
const ICO = {
  home:  o => svg('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/>',o),
  search:o => svg('<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.4-4.4"/>',o),
  star:  o => svg('<path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/>',o),
  starF: o => fill('<path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/>',o),
  gear:  o => svg('<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',o),
  play:  o => fill('<path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/>',o),
  pause: o => fill('<rect x="6.5" y="4.5" width="4" height="15" rx="1.2"/><rect x="13.5" y="4.5" width="4" height="15" rx="1.2"/>',o),
  back:  o => svg('<path d="m15 18-6-6 6-6"/>',o),
  down:  o => svg('<path d="m6 9 6 6 6-6"/>',o),
  up:    o => svg('<path d="m6 15 6-6 6 6"/>',o),
  check: o => svg('<path d="m4.5 12.5 5 5 10-11"/>',{s:(o&&o.s)||22,w:2.2}),
  exp:   o => svg('<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>',o),
  shr:   o => svg('<path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/>',o),
  b10:   o => svg('<path d="M11 4a8 8 0 1 1-8 8"/><path d="M3 4v5h5"/>',o),
  f10:   o => svg('<path d="M13 4a8 8 0 1 0 8 8"/><path d="M21 4v5h-5"/>',o),
  plus:  o => svg('<path d="M12 5v14M5 12h14"/>',o),
  trash: o => svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',o),
  x:     o => svg('<path d="M18 6 6 18M6 6l12 12"/>',o),
  chev:  o => svg('<path d="m9 18 6-6-6-6"/>',o),
  loop:  o => svg('<path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',o),
  minus: o => svg('<path d="M5 12h14"/>',{s:(o&&o.s)||22,w:2.4}),
  folder: o => svg('<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',o),
  book:  o => svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',o),
  pencil: o => svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',o),
};

/* ===================== 状態 ===================== */
let DATA = { cats:[], videos:[] };
let CHAP = {};          /* 動画ID → [[秒, 見出し], ...] 目次 */
let MAN = null;         /* 使用マニュアル（どんなときに何を見るか） */
let prog = {};            /* {動画id: {t:秒, d:全体の秒, done:1, last:時刻}} */
let favs = [];
let folders = [];       /* 生徒が自分で作るフォルダ [{id, name, ids:[]}] */
let outs = {};          /* アウトプット {動画id: [{at:時刻, t:本文}]} */
let cfg  = { speed:1, autonext:true, loop:false, cc:false };
let view = { name:'home' };
let admin = null;         /* 管理画面のしたがき */

function load(){
  try{ prog = JSON.parse(localStorage.getItem(K_PROG) || '{}'); }catch(e){ prog = {}; }
  try{ favs = JSON.parse(localStorage.getItem(K_FAV)  || '[]'); }catch(e){ favs = []; }
  try{ folders = JSON.parse(localStorage.getItem(K_FOLD) || '[]'); }catch(e){ folders = []; }
  if(!Array.isArray(folders)) folders = [];
  try{ outs = JSON.parse(localStorage.getItem(K_OUT) || '{}'); }catch(e){ outs = {}; }
  if(!outs || typeof outs !== 'object') outs = {};
  try{ Object.assign(cfg, JSON.parse(localStorage.getItem(K_CFG) || '{}')); }catch(e){}
}
/* 記録を保存したら、少しあとに預け先にも送る（schedulePush は下の方で定義） */
const saveProg = () => { localStorage.setItem(K_PROG, JSON.stringify(prog)); schedulePush(); };
const saveFav  = () => { localStorage.setItem(K_FAV,  JSON.stringify(favs));   schedulePush(); };
const saveFold = () => { localStorage.setItem(K_FOLD, JSON.stringify(folders)); schedulePush(); };
const saveOut  = () => { localStorage.setItem(K_OUT,  JSON.stringify(outs));   schedulePush(); };
/* ---------- アウトプットに貼る写真 ----------
   写真は大きいので、ほかの記録とは別のところ（IndexedDB）にしまう。
   **この端末の中だけに残る。** ほかの端末には送っていない（通信量と保管量の都合）。
   機種変更のときは 設定 →「記録を書き出す」に写真も入るので、それで持っていける。 */
let _idb = null;
function idb(){
  if(_idb) return _idb;
  _idb = new Promise((res, rej) => {
    const q = indexedDB.open('theater', 1);
    q.onupgradeneeded = () => { try{ q.result.createObjectStore('img'); }catch(e){} };
    q.onsuccess = () => res(q.result);
    q.onerror  = () => rej(q.error);
  });
  return _idb;
}
async function imgPut(k, blob){
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction('img','readwrite');
    t.objectStore('img').put(blob, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function imgGet(k){
  try{
    const d = await idb();
    return await new Promise(res => { const t = d.transaction('img','readonly');
      const q = t.objectStore('img').get(k);
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
  }catch(e){ return null; }
}
async function imgDel(k){
  try{
    const d = await idb();
    await new Promise(res => { const t = d.transaction('img','readwrite');
      t.objectStore('img').delete(k); t.oncomplete = res; t.onerror = res; });

/* 写真は そのままだと大きすぎるので、長辺1400pxのJPEGに直してからしまう */
function shrinkImg(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1400 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k));
      c.height = Math.max(1, Math.round(im.height * k));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error('bad')), 'image/jpeg', 0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad')); };
    im.src = u;
  });
}

/* 見た回数。反復視聴するほど増える。

function seenN(id){

function addSeen(id, delta){

/* 見た回数は 手では増やせない。
   「本当に最後まで見たときだけ1つ増える」ようにする（保護者からの要望）。
   実際に流れた分だけ w に足していき、動画の長さの85%に届いたら1回と数える。
   早送りやシークでは増えない（とんだ分は足さないため）。 */
const FULL = 0.85;
function watched(id){ const p = prog[id]; return (p && p.w) || 0; }
function countView(id){

  const p = prog[id]; if(p){ p.w = 0; saveProg(); }

/* 終わりと見なす位置。ここまで来ていないと、まだ数えない。
   （0.85 だけで数えると、18分の動画で 残り2分半のところで数えてしまい
     「まだ見終わっていないのに増えた」と感じさせてしまう） */
const endZone = d => Math.max(0, d - Math.min(60, d * 0.1));
/* いま見ている動画が 1回ぶんに届いたか調べる */
function checkFull(atEnd){
  if(!curId || isLoom(curId)) return;
  const p = prog[curId]; if(!p || !p.d) return;
  const need = p.d * (atEnd ? 0.6 : FULL);
  if((p.w || 0) < need) return;
  /* 実際に終わりのほうまで来ているかも見る。
     とばして終わりに行っても w が増えないので、ごまかしにはならない */
  if(!atEnd && (p.t || 0) < endZone(p.d)) return;
  countView(curId);
}
/* いまの周回が どこまで進んでいるか（0〜1） */
function fullPct(id){
  const p = prog[id];
  if(!p || !p.d) return 0;
  const byWatch = (p.w || 0) / (p.d * FULL);
  const byPos   = (p.t || 0) / endZone(p.d);
  return Math.min(1, Math.min(byWatch, byPos));
}
function fullMsg(id){

  const left = Math.max(0, p.d * FULL - (p.w || 0));
  const rest = Math.max(0, endZone(p.d) - (p.t || 0));
  if(left > 1) return `あと ${hhmm(left)} 見ると 1回 ふえます`;
  if(rest > 1) return '最後まで見ると 1回 ふえます';
  return 'もう少しで 1回 ふえます';
}
/* 付箋（動画の中の「ここ」を覚えておく）。prog の中に [[秒, ひとこと], ...] で持つ */
const marksOf = id => ((prog[id] && prog[id].mk) || []);

}

const EXP_VIEW = 10, EXP_OUT = 15;

const TITLES = [[1,'はじめの一歩'],[3,'見習い'],[5,'挑戦者'],[8,'努力家'],[12,'習慣の人'],
  [16,'継続者'],[21,'実行者'],[27,'分析家'],[34,'極める人'],[42,'一流'],[51,'達人'],[65,'仙人']];
function titleOf(lv){

function levelOf(exp){
  let lv = 1, need = 40, acc = 0;
  while(exp >= acc + need && lv < 9999){ acc += need; lv++; need = 40 + 20 * (lv - 1); }
  return { lv, cur: exp - acc, need, next: acc + need };

/* ===================== 記録の同期（端末をまたいで同じレベルにする） =====================
   スマホとiPadなど、複数の端末で使っても記録がそろうようにする。
   合体のしかたが肝：**見た回数は多い方を採る**ので、どちらの端末の分も消えない。 */

/* この端末の記録をひとまとめにする。速さやループは端末ごとの好みなので送らない */
const myRec = () => ({ prog, favs, folders, outs, name: cfg.name || '', at: stampAt() });

function applyRec(r){
  prog = r.prog || {}; favs = Array.isArray(r.favs) ? r.favs : [];
  folders = Array.isArray(r.folders) ? r.folders : [];
  outs = (r.outs && typeof r.outs === 'object') ? r.outs : {};

  saveProg(); saveFav(); saveFold(); saveOut();

/* 2つの記録を合体する。どちらかを捨てない、が原則 */
function mergeRec(a, b){
  if(!b) return a;
  if(!a) return b;
  const out = { prog:{}, favs:[], folders:[], outs:{},
                at: Math.max(a.at || 0, b.at || 0) };

  /* 動画ごとの記録：回数と視聴ぶんは多い方、位置や速さは新しい方 */
  const nOf = p => (p && p.n != null) ? p.n : ((p && p.done) ? 1 : 0);
  const ids = {};
  Object.keys(a.prog || {}).forEach(k => ids[k] = 1);
  Object.keys(b.prog || {}).forEach(k => ids[k] = 1);
  Object.keys(ids).forEach(id => {
    const x = (a.prog || {})[id], y = (b.prog || {})[id];
    if(!x){ out.prog[id] = y; return; }
    if(!y){ out.prog[id] = x; return; }
    const newer = (x.last || 0) >= (y.last || 0) ? x : y;
    const n = Math.max(nOf(x), nOf(y));
    /* 付箋は両方を残す（同じ秒のものは1つに） */
    const mk = {};
    (x.mk || []).concat(y.mk || []).forEach(m => {
      if(!mk[m[0]] || !mk[m[0]][1]) mk[m[0]] = m; });
    const mkList = Object.keys(mk).map(k => mk[k]).sort((a, b) => a[0] - b[0]);
    out.prog[id] = Object.assign({}, newer, {
      n, done: n > 0 ? 1 : 0,
      w: Math.max(x.w || 0, y.w || 0),
      d: x.d || y.d || 0,
      last: Math.max(x.last || 0, y.last || 0) });
    if(mkList.length) out.prog[id].mk = mkList; else delete out.prog[id].mk;
  });

  /* アウトプットは書いたものなので、両方を残す（同じ時刻のものは1つに） */
  const oids = {};
  Object.keys(a.outs || {}).forEach(k => oids[k] = 1);
  Object.keys(b.outs || {}).forEach(k => oids[k] = 1);
  Object.keys(oids).forEach(id => {
    const seen = {}, list = [];
    ((a.outs || {})[id] || []).concat((b.outs || {})[id] || []).forEach(e => {
      const k = String(e.at) + '|' + String(e.t || '').slice(0, 40);
      if(seen[k]) return; seen[k] = 1; list.push(e);
    });
    list.sort((x, y) => (y.at || 0) - (x.at || 0));
    if(list.length) out.outs[id] = list;
  });

  /* 保存とフォルダは「外した」も残したいので、新しい方の状態をそのまま使う */
  const newer = (a.at || 0) >= (b.at || 0) ? a : b;
  out.favs = Array.isArray(newer.favs) ? newer.favs : [];
  out.folders = Array.isArray(newer.folders) ? newer.folders : [];
  out.name = newer.name || a.name || b.name || '';
  return out;
}

/* 起動したとき：預けてある記録を取ってきて、この端末のものと合体する */
async function pullSync(){
  const t = tokGet(); if(!t) return;
  try{
    const r = await fetch(API + '/sync?t=' + encodeURIComponent(t) + '&_=' + now(),
      { cache:'no-store' });
    const j = await r.json();
    if(!j || !j.ok) return;
    if(j.rec){
      const merged = mergeRec(myRec(), j.rec);
      applyRec(merged);
    }
    await pushSync();      /* 合体した結果を預けなおす */
  }catch(e){}
}

/* 記録の「中身」の指紋。再生位置だけの変化では送らないようにするため。
   （再生中は5秒ごとに位置を保存しているので、それで毎回送ると通信の無駄になる） */
function sigOf(){
  return JSON.stringify({
    p: Object.keys(prog).sort().map(k => k + ':' + seenN(k) + ':' + marksOf(k).length),
    o: Object.keys(outs).sort().map(k => k + ':' + (outs[k] || []).length),
    f: favs.slice().sort(),
    d: folders.map(f => f.id + ':' + (f.ids || []).length),
    n: cfg.name || '' });
}
let lastSig = null;

/* 記録が変わったとき：少しためてから預ける */
function schedulePush(){
  const g = sigOf();
  if(g === lastSig) return;      /* 位置が動いただけ。閉じるときにまとめて送る */
  lastSig = g;
  stamp();
  if(pushT) clearTimeout(pushT);
  pushT = setTimeout(() => { pushT = null; pushSync(); }, PUSH_WAIT);
}

async function pushSync(){
  if(!tokGet()) return;
  lastSig = sigOf();
  if(pushT){ clearTimeout(pushT); pushT = null; }
  const L = levelOf(totalExp());
  const body = JSON.stringify({ rec: myRec(), stat: {
    lv:L.lv, exp:totalExp(), views:totalViews(),
    seen:DATA.videos.filter(v => seenN(v.id) > 0).length, outs:expOuts() } });
  const u = API + '/sync?t=' + encodeURIComponent(tokGet());
  try{
    await fetch(u, { method:'POST', headers:{ 'content-type':'application/json' }, body });
  }catch(e){}
}

/* 閉じるときは、届けきれるように sendBeacon を使う */
function pushBeacon(){
  if(!tokGet() || !navigator.sendBeacon) return;
  lastSig = sigOf();
  try{
    const L = levelOf(totalExp());
    const body = JSON.stringify({ rec: myRec(), stat: {
      lv:L.lv, exp:totalExp(), views:totalViews(),
      seen:DATA.videos.filter(v => seenN(v.id) > 0).length, outs:expOuts() } });
    navigator.sendBeacon(API + '/sync?t=' + encodeURIComponent(tokGet()),
      new Blob([body], { type:'application/json' }));
  }catch(e){}
}

  try{ CHAP = JSON.parse(localStorage.getItem(K_CHAP) || '{}'); }catch(e){ CHAP = {}; }
  try{ MAN  = JSON.parse(localStorage.getItem(K_MAN)  || 'null'); }catch(e){ MAN = null; }
  return !!(DATA.videos && DATA.videos.length);
}
function normalize(j){
  const cats = Array.isArray(j.cats) ? j.cats.slice() : [];
  const videos = (Array.isArray(j.videos) ? j.videos : [])
    .map(v => ({ id:ytId(v.id || v.url || ''), t:v.t || v.title || '(無題)',
                 cat:v.cat || '', g:v.g || '', d:v.d || v.desc || '', date:v.date || '',
                 sec:+v.sec || 0, pin:v.pin ? 1 : 0 }))
    .filter(v => v.id);
  /* 元の並び順を覚えておく。同じ日に何本も投稿されたとき、
     古い順に並べ直しても 1・2・3・4 の順が崩れないようにするため */
  videos.forEach((v,i) => v._i = i);
  /* 新しいものが上。日付がなければ書いた順を保つ */
  videos.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  return { cats, videos, genreOrder: Array.isArray(j.genreOrder) ? j.genreOrder : [] };
}

function vCat(){
  const c = catOf(view.p);
  if(!c.id) return go('home');
  $('#tbar').innerHTML = `<button class="tbtn" id="cback">${ICO.back({s:20})}</button>

  $('#cfind').onclick = () => { findCat = c.id; findQ = ''; go('find'); };

  const done = all.filter(isDone).length;
  const total = all.reduce((a,v) => a + seenN(v.id), 0);   /* のべ視聴回数 */
  const pct = all.length ? Math.round(done / all.length * 100) : 0;
  const gs = c.genres ? genresIn(c.id) : [];
  /* ジャンルがない区分で本数が多いときは、番号の範囲でとべるようにする */
  const ranges = (!gs.length && all.length > 40) ? chunkRanges(all, 20) : [];

  let chips = '';
  if(gs.length){
    chips = `<div class="chips" style="margin-top:14px">
      <button class="chip ${catG==='all'?'on':''}" data-g="all">すべて（${all.length}）</button>
      ${gs.map(g => `<button class="chip ${catG===g?'on':''}" data-g="${esc(g)}">${esc(g)}（${all.filter(v=>v.g===g).length}）</button>`).join('')}
    </div>`;
  }else if(ranges.length){
    chips = `<div class="chips" style="margin-top:14px">
      <button class="chip ${catG==='all'?'on':''}" data-g="all">すべて</button>
      ${ranges.map((r,i) => `<button class="chip ${catG===('r'+i)?'on':''}" data-g="r${i}">${esc(r.label)}</button>`).join('')}
    </div>`;
  }

  let body = '';
  if(gs.length && catG === 'all'){
    /* ジャンルごとに見出しをつけて並べる */
    body = gs.map(g => {
      const l = all.filter(v => v.g === g);
      return `<div class="gsec">${esc(g)}<span class="n">${l.length}</span></div>
        <div class="vlist">${l.map(v => card(v, {tag:false})).join('')}</div>`;
    }).join('');
  }else{
    let l = all;
    if(gs.length && catG !== 'all') l = all.filter(v => v.g === catG);
    if(ranges.length && catG !== 'all'){
      const r = ranges[+String(catG).slice(1)];
      if(r) l = all.slice(r.s, r.e);
    }
    body = `<div class="vlist" style="margin-top:16px">
      ${l.length ? l.map(v => card(v, {tag:false})).join('') : emptyBox('ありません')}</div>`;
  }

  $('#main').innerHTML = `
    <div class="chead">
      <h1>${esc(c.name)}</h1>
      <div class="st">${all.length}本${done ? ` ・ ${done}本 見終わり` : ''}${total > done ? ` ・ のべ${total}回` : ''}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    ${chips}
    ${body}`;
  $$('#main .chip').forEach(b => b.onclick = () => { catG = b.dataset.g; vCat(); window.scrollTo(0,0); });
}
/* 20本ずつの範囲を作る。見出しはタイトルの中の数字を使う（【マインド動画５７】→ 57） */
function chunkRanges(list, size){
  const out = [];
  for(let s = 0; s < list.length; s += size){
    const e = Math.min(s + size, list.length);
    const a = numOf(list[s]), b = numOf(list[e-1]);
    const lbl = (a !== null && b !== null) ? (a === b ? `${a}` : `${a}〜${b}`) : `${s+1}〜${e}`;
    out.push({ s, e, label: lbl });
  }
  return out;
}

/* 入力のたびに画面ぜんぶを作り直すと、日本語の変換中の文字が壊れる
   （「こ」と打つと「kお」になる）。入力欄はそのまま置いておき、
   結果の部分だけ書きかえる。変換中（composing）は何もしない。 */
function findList(){
  let list = DATA.videos.filter(v => {
    if(findCat === '__un'){ if(isDone(v)) return false; }
    else if(findCat !== 'all' && v.cat !== findCat) return false;
    if(!findQ) return true;
    const q = findQ.trim().toLowerCase();
    if(!q) return true;
    /* タイトル・ジャンル・説明に加えて、動画の中の目次からも探す */
    return (v.t + ' ' + v.g + ' ' + v.d).toLowerCase().includes(q) || chapText(v.id).includes(q);
  });
  if(catAsc(findCat)) list = list.sort((a,b) => (a.date||'').localeCompare(b.date||'') || a._i - b._i);
  return list;
}

/* ===================== 記録の持ち出し ===================== */
/* 機種変更で記録が消えるのを防ぐ。見た回数・フォルダ・保存・設定をまとめて出し入れする */
function backupData(){
  return { app:'Theater', v:VER, at:new Date().toISOString(),
           prog, favs, folders, cfg, outs };
}
/* 機種変更で写真も持っていけるように、書き出しには写真も入れる */
const blobToURL = b => new Promise(res => {
  const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => res(''); r.readAsDataURL(b); });
function urlToBlob(u){
  const [h, b] = String(u).split(',');
  const mime = (h.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(b || ''); const a = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type:mime });
}
async function backupFull(){
  const j = backupData();
  const keys = [];
  Object.keys(outs).forEach(id => (outs[id] || []).forEach(o => { if(o.im) keys.push(o.im); }));
  const imgs = {};
  for(const k of keys){
    const b = await imgGet(k);
    if(b){ const u = await blobToURL(b); if(u) imgs[k] = u; }
  }
  if(Object.keys(imgs).length) j.imgs = imgs;
  return j;
}
function backupName(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `theater-kiroku-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
}
async function doExport(){
  toast('まとめています…');
  const txt = JSON.stringify(await backupFull());
  openSheet(`
    <h3>記録を書き出す</h3>
    <div class="lead" style="margin:-4px 2px 10px;line-height:1.9">
      見た回数・フォルダ・保存・アウトプット（写真もふくむ）を1つのファイルにまとめます。<br>
      スマホを買いかえる前に書き出して、新しい端末で読みこんでください。</div>
    <button class="btn pri" id="exDl">ファイルに保存する</button>
    <button class="btn" id="exCp" style="margin-top:9px">文字でコピーする</button>
    <button class="btn" id="exNo" style="margin-top:9px">とじる</button>
    <div class="lead" style="margin-top:12px">
      見た回数 ${DATA.videos.filter(isDone).length}本 ・ フォルダ ${folders.length}個 ・ 保存 ${favs.length}本</div>`,
  () => {
    $('#exDl').onclick = () => {
      try{
        const b = new Blob([txt], { type:'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = backupName();
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast('書き出しました');
      }catch(e){ toast('保存できませんでした。文字でコピーをお試しください'); }
    };
    $('#exCp').onclick = async () => {
      try{ await navigator.clipboard.writeText(txt); closeSheet(); toast('コピーしました'); }
      catch(e){
        openSheet(`<h3>この文字をコピーしてください</h3>
          <textarea id="exTa" style="min-height:180px" class="mono"></textarea>
          <button class="btn" id="exNo2" style="margin-top:10px">とじる</button>`,
          () => { $('#exTa').value = txt; $('#exTa').select(); $('#exNo2').onclick = closeSheet; });
      }
    };
    $('#exNo').onclick = closeSheet;
  });
}
async function applyBackup(j){
  if(!j || typeof j !== 'object' || !j.prog) throw new Error('形式が違います');
  if(j.imgs && typeof j.imgs === 'object'){
    for(const k of Object.keys(j.imgs)){
      try{ await imgPut(k, urlToBlob(j.imgs[k])); }catch(e){}
    }
  }
  prog = j.prog || {};
  favs = Array.isArray(j.favs) ? j.favs : [];
  folders = Array.isArray(j.folders) ? j.folders : [];
  if(j.cfg && typeof j.cfg === 'object') Object.assign(cfg, j.cfg);
  outs = (j.outs && typeof j.outs === 'object') ? j.outs : {};
  saveProg(); saveFav(); saveFold(); saveCfg(); saveOut();
}
function doImport(){
  openSheet(`
    <h3>記録を読みこむ</h3>
    <div class="lead" style="margin:-4px 2px 10px;line-height:1.9">
      書き出したファイルを選ぶか、コピーした文字を貼りつけてください。<br>
      <b>いまの記録は上書きされます。</b></div>
    <input type="file" id="imF" accept=".json,application/json" style="padding:10px">
    <div class="lead" style="margin:12px 2px 6px">または 文字を貼りつける</div>
    <textarea id="imT" class="mono" placeholder="ここに貼りつけ"></textarea>
    <div class="acts" style="margin-top:12px">
      <button class="btn" id="imNo">やめる</button>
      <button class="btn pri" id="imOk">読みこむ</button>
    </div>`,
  () => {
    const load = async txt => {
      try{
        await applyBackup(JSON.parse(txt));
        closeSheet(); render(); toast('読みこみました');
      }catch(e){ toast('読みこめませんでした（ファイルを確認してください）'); }
    };
    $('#imF').onchange = e => {
      const f = e.target.files && e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => load(String(r.result));
      r.onerror = () => toast('ファイルを読めませんでした');
      r.readAsText(f);

    $('#imOk').onclick = () => { const t = $('#imT').value.trim(); if(t) load(t); };
    $('#imNo').onclick = closeSheet;

/* ===================== 更新の確認 ===================== */
async function checkUpd(quiet){
  const st = $('#updState');
  if(!quiet && st) st.textContent = '確認中…';
  try{
    const r = await fetch('version.json?t=' + now(), { cache:'no-store' });
    const j = await r.json();
    if(+j.v > VER){
      askYes({ title:'新しいバージョンがあります', msg:`v${j.v}${j.note ? '（' + esc(j.note) + '）' : ''}`, ok:'更新する' },
        doUpd);
      if(st) st.textContent = `v${j.v} あり`;
    }else if(st && !quiet) st.textContent = `最新（v${VER}）`;
  }catch(e){ if(st && !quiet) st.textContent = '確認できません'; }
}
async function doUpd(){
  try{
    if(window.caches) for(const k of await caches.keys()) await caches.delete(k);
    if(navigator.serviceWorker)
      for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  }catch(e){}
  location.replace(location.pathname + '?v=' + now());
}

/* ===================== 再生 ===================== */
let player = null, playerReady = false, curId = '', tick = null, seeking = false, started = false;

/* YouTube の再生部品を読みこむ（1回だけ） */
let ytLoading = null;
function loadYT(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(ytLoading) return ytLoading;
  ytLoading = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytLoading;
}
async function makePlayer(){
  await loadYT();
  if(player) return;
  await new Promise(res => {
    player = new YT.Player('yt', {
      host: 'https://www.youtube-nocookie.com',
      videoId: curId,
      playerVars: {
        /* YouTube の画面を出さない。関連動画・ロゴ・キーボード操作もふさぐ */
        controls:0, rel:0, modestbranding:1, playsinline:1, disablekb:1,
        iv_load_policy:3, fs:0, origin:location.origin,
        cc_load_policy: cfg.cc ? 1 : 0, cc_lang_pref:'ja'
      },
      events: {
        onReady: () => { playerReady = true; applyCC(); res(); },
        onStateChange: onState,
        onError: () => { $('#phint').classList.remove('hidden');
          $('#phint').textContent = 'この動画は再生できませんでした（限定公開の設定をご確認ください）'; }
      }
    });
  });
}

/* 字幕の出し入れ。YouTube側の呼び名が2通りあるので、両方に声をかける。
   もともと字幕のない動画では何も起きない（それが正しい） */
function applyCC(){
  if(!player || !playerReady) return;
  try{
    if(cfg.cc){
      player.loadModule('captions'); player.loadModule('cc');
      player.setOption('captions', 'track', { languageCode:'ja' });
      player.setOption('cc', 'track', { languageCode:'ja' });
    }else{
      player.setOption('captions', 'track', {});
      player.setOption('cc', 'track', {});
      player.unloadModule('captions'); player.unloadModule('cc');
    }
  }catch(e){}
}

function openPlay(id, push){
  const v = vid(id); if(!v) return;
  if(NEWIDS.delete(id)){ /* 一度開いたらNEWを外す */ }
  curId = id; started = false;
  history_push(push);
  $('#pv').classList.remove('hidden');
  $('#pv').classList.remove('exp','rot');
  $('#pv').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  $('#pvnm').textContent = catName(v.cat) || 'Theater';
  if(isLoom(id)) $('#posterimg').removeAttribute('src');
  else $('#posterimg').src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  $('#poster').classList.remove('hidden');
  $('#scrim').classList.add('hidden');
  $('#scrimimg').src = isLoom(id) ? '' : `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  $('#phint').classList.add('hidden');
  stopCount();
  $('#endcard').classList.add('hidden');
  $('#ctrl').classList.add('fade');
  drawCtrl(); drawBody();

  if(isLoom(id)){
    /* Loom: 自作の操作パネルは使えないので、Loomのプレーヤーをそのまま出す */
    try{ player && playerReady && player.pauseVideo(); }catch(e){}
    stopTick();
    $('#poster').classList.add('hidden');
    $('#catch').classList.add('hidden');
    $('#ctrl').classList.add('hidden');
    $('#loomfr').classList.remove('hidden');
    $('#loomfr').src = `https://www.loom.com/embed/${id.slice(5)}?hide_owner=true&hide_share=true&hide_title=true&hideEmbedTopBar=true`;
    return;
  }
  $('#loomfr').classList.add('hidden');
  $('#loomfr').removeAttribute('src');
  $('#catch').classList.remove('hidden');
  $('#ctrl').classList.remove('hidden');
  const start = startSecOf(v);
  if(player && playerReady){
    /* すでに用意ができていれば、タップと同じ流れで再生に入る（iPhone対策） */
    try{ player.loadVideoById({ videoId:id, startSeconds:start }); }catch(e){}
    setTimeout(() => { if(!started) $('#phint').classList.remove('hidden'); }, 1600);
    $('#phint').textContent = 'もう一度 再生ボタンを押してください';
  }else{
    makePlayer().then(() => {
      if(curId !== id) return;
      try{ player.seekTo(start, true); player.playVideo(); }catch(e){}
    });
  }
}
function startSecOf(v){
  const p = prog[v.id];
  if(!p || !p.t) return 0;
  if(seenN(v.id) || (p.d && p.t / p.d > .97)) return 0;   /* 見終わったものは最初から */
  return Math.max(0, p.t - 3);                        /* 少し戻して再開すると分かりやすい */
}
function closePlay(){
  saveNow();
  stopTick();
  $('#loomfr').classList.add('hidden');
  $('#loomfr').removeAttribute('src');   /* これを消さないと裏で音が鳴り続ける */
  try{ player && player.pauseVideo(); }catch(e){}
  $('#pv').classList.add('hidden');
  $('#pv').classList.remove('exp','rot');
  document.body.style.overflow = '';
  curId = '';
  render();
}

function onState(e){
  const S = YT.PlayerState;
  if(e.data === S.PLAYING){
    started = true;
    $('#poster').classList.add('hidden');
    $('#scrim').classList.add('hidden');
    $('#endcard').classList.add('hidden');
    try{ player.setPlaybackRate(speedOf(curId)); }catch(err){}
    startTick(); showCtrl(); drawCtrl();
  }else if(e.data === S.PAUSED){
    /* 止めた瞬間にYouTubeの画面が出るので、すぐ幕をかける */
    if(!isLoom(curId)) $('#scrim').classList.remove('hidden');
    saveNow(); stopTick(); showCtrl(true); drawCtrl();
  }else if(e.data === S.ENDED){
    stopTick();
    checkFull(true);                       /* 最後まで来たので もう一度みる */
    const p = prog[curId]; if(p){ p.t = 0; saveProg(); }
    onEnded();
  }
}
function onEnded(){
  /* ループ再生が入っていれば、次へは行かず 同じ動画をもう一度。
     反復した回数はそのたびに1つ増える（それが目的なので） */
  if(cfg.loop){
    try{ player.seekTo(0, true); player.playVideo(); }catch(e){}
    toast('もう一度 くり返します');
    return;
  }
  const nx = nextVideo();
  /* すぐ次に飛ばさない。数えてから進むので、止める間ができる */
  const auto = !!(cfg.autonext && nx);
  $('#endcard').innerHTML = `<div class="ttl">見終わりました</div>
    ${nx ? `<div class="nxt">つぎ：${esc(nx.t)}</div>` : ''}
    <div class="row">
      <button class="btn sm" id="again">もう一度</button>
      ${nx ? `<button class="btn sm pri" id="next">次の動画${auto ? '（<span id="cd">5</span>）' : ''}</button>` : ''}
    </div>
    ${auto ? `<button class="btn sm" id="stopauto" style="margin-top:9px">自動で進むのをやめる</button>` : ''}`;
  $('#endcard').classList.remove('hidden');
  $('#again').onclick = () => { stopCount(); $('#endcard').classList.add('hidden');
    try{ player.seekTo(0,true); player.playVideo(); }catch(e){} };
  if(nx) $('#next').onclick = () => { stopCount(); openPlay(nx.id); };
  if(auto){
    let left = 5;
    stopCount();
    nextT = setInterval(() => {
      left--;
      const el = $('#cd'); if(el) el.textContent = left;
      if(left <= 0){ stopCount(); openPlay(nx.id); }
    }, 1000);
    $('#stopauto').onclick = () => {
      stopCount(); cfg.autonext = false; saveCfg(); onEnded();
      toast('自動で進むのをやめました（設定で戻せます）');
    };
  }
}
let nextT = null;
function stopCount(){ if(nextT){ clearInterval(nextT); nextT = null; } }
/* 次の動画 = 同じカテゴリの、ひとつ下（古い方）。なければ全体のつぎ */
function nextVideo(){
  const v = vid(curId); if(!v) return null;
  const same = inCat(v.cat);
  const i = same.findIndex(x => x.id === curId);
  if(i >= 0 && same[i+1]) return same[i+1];
  const j = DATA.videos.findIndex(x => x.id === curId);
  return DATA.videos[j+1] || null;
}

function startTick(){ stopTick(); lastT = -1; tick = setInterval(onTick, 250); }
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }
let saveCount = 0, lastT = -1;
function onTick(){
  if(!player || !playerReady) return;
  const t = player.getCurrentTime() || 0, d = player.getDuration() || 0;
  if(!seeking) drawTime(t, d);
  /* 実際に流れた分だけ足す。とんだ分（シーク・早送り）は足さないので、
     最後まで飛ばした人は1回にならない。倍速でも中身は流れているので数える。 */
  if(lastT >= 0 && t > lastT && t - lastT < 2 && d){
    const p = prog[curId] || (prog[curId] = { t:0, d:0 });
    p.d = d; p.w = (p.w || 0) + (t - lastT);
    checkFull(false);
  }
  lastT = t;
  if(++saveCount % 20 === 0) saveNow();   /* 5秒に1回だけ書きこむ */
}
function saveNow(){
  /* まだ一度も再生していないときは書きこまない。
     （iPhoneで自動再生されずに閉じたとき、つづきの位置が0で消えてしまうため） */
  if(!curId || !player || !playerReady || !started) return;
  try{
    const t = player.getCurrentTime() || 0, d = player.getDuration() || 0;
    if(!d) return;
    const p = prog[curId] || (prog[curId] = {});
    p.t = t; p.d = d; p.last = now();
    saveProg();
  }catch(e){}
}

/* 付箋のひとことを書く */
function askMemo(id, sec){
  const m = marksOf(id).find(x => x[0] === sec);
  askText({ title:`${hhmm(sec)} の付箋`, value:(m && m[1]) || '', max:60,
            ph:'例）ここの話をやってみる', ok:'決定' },
    v => { setMarkMemo(id, sec, v); drawBody(); });
}

/* 長い動画の飛び先。目次があるときは目次にまかせる。
   20分以上のときだけ、5分ごと（30分以上なら10分ごと）に区切る */
function jumpPoints(id){
  if(isLoom(id) || chapOf(id).length) return [];
  const d = (prog[id] && prog[id].d) || 0;
  if(d < 20 * 60) return [];
  const step = d >= 30 * 60 ? 600 : 300;
  const out = [];
  for(let t = 0; t < d - 60; t += step) out.push(t);
  return out;
}

/* 速さを一覧から選ぶ。1回ずつ送るより、2倍速にすぐ行けるように */
function pickSpeed(cur, done){
  openSheet(`
    <h3>再生の速さ</h3>
    <div class="lead" style="margin:-4px 2px 10px">速さは動画ごとに覚えます。</div>
    <div class="spds">${SPEEDS.map(v =>
      `<button class="spd1 ${v === cur ? 'on' : ''}" data-v="${v}">${v}倍</button>`).join('')}</div>
    <button class="btn" id="spNo" style="margin-top:12px">とじる</button>`,
  () => {
    $$('#shin .spd1').forEach(b => b.onclick = () => {
      closeSheet(); done(+b.dataset.v);
    });
    $('#spNo').onclick = closeSheet;
  });
}

/* ---------- 再生の操作パネル ---------- */
function drawCtrl(){
  $('#ctrl').innerHTML = `
    <div class="seekrow">
      <span class="tm" id="tmNow">0:00</span>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0">
      <span class="tm" id="tmAll">0:00</span>
    </div>
    <div class="btnrow">
      <button class="pb" id="b10">${ICO.b10({s:21})}<span class="n">10</span></button>
      <button class="pb main" id="pp">${ICO.play({s:20})}</button>
      <button class="pb" id="f10">${ICO.f10({s:21})}<span class="n">10</span></button>
      <span class="sp"></span>
      <button class="pb ${cfg.loop ? 'on' : ''}" id="loop">${ICO.loop({s:19})}</button>
      <button class="pb" id="spd">${speedOf(curId)}x</button>
      <button class="pb" id="exp">${ICO.exp({s:19})}</button>
    </div>`;
  const seek = $('#seek');
  const grab = () => { seeking = true; };
  const move = () => {
    const d = (player && playerReady && player.getDuration()) || 0;
    drawTime(d * seek.value / 1000, d, true);
  };
  const drop = () => {
    const d = (player && playerReady && player.getDuration()) || 0;
    if(d) try{ player.seekTo(d * seek.value / 1000, true); }catch(e){}
    seeking = false; showCtrl();
  };
  seek.addEventListener('pointerdown', grab);
  seek.addEventListener('input', move);
  seek.addEventListener('change', drop);
  seek.addEventListener('pointerup', drop);
  $('#pp').onclick  = togglePlay;
  $('#b10').onclick = () => jump(-10);
  $('#f10').onclick = () => jump(10);
  $('#spd').onclick = () => pickSpeed(speedOf(curId), v => {
    setSpeed(curId, v);
    $('#spd').textContent = v + 'x';
    toast(`この動画は ${v}倍速`);
    showCtrl();
  });
  $('#loop').onclick = () => {
    cfg.loop = !cfg.loop; saveCfg();
    $('#loop').classList.toggle('on', cfg.loop);
    toast(cfg.loop ? 'くり返し再生：オン' : 'くり返し再生：オフ');
    showCtrl();
  };
  $('#exp').onclick = toggleExp;
  drawTime((player && playerReady && player.getCurrentTime()) || 0,
           (player && playerReady && player.getDuration()) || 0);
}
function drawTime(t, d, force){
  const s = $('#seek'); if(!s) return;
  const r = d ? Math.min(1, t/d) : 0;
  if(!seeking || force){ s.value = Math.round(r*1000); s.style.setProperty('--p', (r*100) + '%'); }
  $('#tmNow').textContent = hhmm(t);
  $('#tmAll').textContent = hhmm(d);
  const pp = $('#pp');
  if(pp && player && playerReady)
    pp.innerHTML = (player.getPlayerState() === 1) ? ICO.pause({s:20}) : ICO.play({s:20});
}
function togglePlay(){
  if(!player || !playerReady) return;
  try{
    if(player.getPlayerState() === 1){ player.pauseVideo(); }
    else{ player.playVideo(); }
  }catch(e){}
  showCtrl();
}
function jump(sec){
  if(!player || !playerReady) return;
  try{ player.seekTo(Math.max(0, (player.getCurrentTime()||0) + sec), true); }catch(e){}
  showCtrl();
}
function toggleExp(){
  const pv = $('#pv');
  const on = !pv.classList.contains('exp');
  pv.classList.toggle('exp', on);
  /* 縦持ちのスマホは横向きに回して大きく見せる */
  pv.classList.toggle('rot', on && innerHeight > innerWidth && innerWidth < 700);
  const eb = $('#exp'); if(eb) eb.innerHTML = on ? ICO.shr({s:19}) : ICO.exp({s:19});
  showCtrl();
}
let ctrlTimer = null;
function showCtrl(keep){
  $('#ctrl').classList.remove('fade');
  clearTimeout(ctrlTimer);
  if(!keep) ctrlTimer = setTimeout(() => {
    if(player && playerReady && player.getPlayerState() === 1) $('#ctrl').classList.add('fade');
  }, 3200);
}

    ${v.d ? `<div class="desc">${esc(v.d)}</div>` : ''}
    ${jumpPoints(v.id).length ? `<div class="sec"><h2>どこから見る？</h2></div>

    ${chapOf(v.id).length ? `<div class="sec"><h2>目次（押すとそこへ飛びます）</h2></div>

let why = '';   /* うまくいかなかったときの理由。画面の下に小さく出す */
const tokGet = () => { try{ return localStorage.getItem(K_TOK) || ''; }catch(e){ return ''; } };
const tokSet = t => { try{ localStorage.setItem(K_TOK, t); }catch(e){} };

/* 退塾・BAN のとき。動画の中身と通行証をこの端末から消す。
   自分で書いたアウトプットや記録は本人のものなので残す。 */
function wipeContent(){
  [K_CACHE, K_CHAP, K_MAN, K_TOK, K_OKAT, K_ADM, K_AT].forEach(k => {
    try{ localStorage.removeItem(k); }catch(e){}
  });
  DATA = { cats:[], videos:[] }; CHAP = {}; MAN = null; admin = null;
}

/* ログインから戻ってきたときに # についてくる合図を受けとる */
function readAuthHash(){
  const h = (location.hash || '').replace(/^#/, '');
  if(!h || h.indexOf('auth=') < 0){ if(h) why = 'hash:' + h.slice(0,24); return null; }
  const q = new URLSearchParams(h);
  const a = q.get('auth');
  const t = q.get('t') || '';
  try{ history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
  if(a === 'ok' && t){ tokSet(t); why = ''; return { ok:true, t }; }
  why = 'callback:' + (a || '?') + (a === 'ok' && !t ? ' (合言葉が届いていません)' : '');
  return { ok:false, why:a || 'failed' };
}

/* 入口に聞きにいく。ここが毎回はしるので、BANされた瞬間から中身は渡らない */
async function pull(){
  const t = tokGet();
  if(!t) return { st:'need_login' };
  let r;
  try{
    r = await fetch(API + '/data?t=' + encodeURIComponent(t) + '&_=' + now(), { cache:'no-store' });
  }catch(e){ why = 'network:' + (e && e.message ? e.message : '?'); return { st:'offline' }; }
  let j = null;
  try{ j = await r.json(); }catch(e){}
  if(!j){ why = 'bad-json:' + r.status; return { st:'offline' }; }
  if(j.ok){ if(j.t) tokSet(j.t); why = ''; return { st:'ok', j }; }
  why = 'data:' + (j.error || '?') + '/' + (j.why || '?') + ' (' + r.status + ')';
  return { st:j.error || 'need_login' };
}

const loginUrl = () => API + '/login?back=' +

const standalone = () =>

/* 起動と、アプリに戻ってきたときの確認 */
async function startAuth(){
  showGate('wait');
  const r = await pull();

  if(r.st === 'ok'){
    applyData(r.j);
    await pullSync();          /* 別の端末でつけた記録があれば合体する */
    /* iPhoneでホーム画面のアプリに移す人のために、ログイン直後に合言葉を見せる */
    if(justLoggedIn && !standalone()){ justLoggedIn = false; return showGate('code', tokGet()); }
    justLoggedIn = false;
    hideGate(); startData(); return;
  }
  if(r.st === 'not_member' || r.st === 'no_role'){ wipeContent(); return showGate('member'); }
  if(r.st === 'need_login'){ wipeContent(); return showGate('login'); }

  /* こんでいる・つながらない。ここで通行証を消すと ふつうの塾生が締め出されるので消さない。
     少し前に確認できていれば、控えで開く */
  const okat = +(localStorage.getItem(K_OKAT) || 0);
  if(now() - okat < GRACE && loadCached()){
    hideGate(); startData();
    toast(r.st === 'busy' ? 'こんでいるので、前に読みこんだ内容で開いています'
                          : 'つながらないので、前に読みこんだ内容で開いています');
    return;
  }
  showGate(r.st === 'busy' ? 'busy' : 'offline');
}

/* 中身がそろったあとの、ふつうの起動 */
let opened = false;
function startData(){
  markNew();
  render();
  if(!opened){
    opened = true;
    if(!cfg.guided) showGuide(0);
    setTimeout(() => checkUpd(true), 2500);
  }
}

/* アプリに戻ってきたら、もう一度たしかめる（BANがすぐ効くように） */
let justLoggedIn = false;
async function recheck(){
  if(!tokGet()) return;
  if(now() - (+(localStorage.getItem(K_OKAT) || 0)) < RECHECK) return;
  const r = await pull();
  if(r.st === 'ok'){ applyData(r.j); if(!$('#gate').classList.contains('hidden')){ hideGate(); startData(); } return; }
  if(r.st === 'not_member' || r.st === 'no_role'){ wipeContent(); showGate('member'); }
  else if(r.st === 'need_login'){ wipeContent(); showGate('login'); }
  /* busy・圏外のときは、そのまま使わせる。次にひらいたときに また確かめる */
}

  $('#tabin').innerHTML = TABS.map(t =>
    `<button class="tab" data-tab="${t.id}">${t.ic({s:21,w:1.9})}<span>${t.lbl}</span></button>`).join('');
  $$('#tabin .tab').forEach(b => b.onclick = () => go(b.dataset.tab));
  $('#pvback').innerHTML = ICO.back({ s:20 });
  $('#bigplay').innerHTML = ICO.play({ s:26 });
  $('#scrim').querySelector('.pb2').innerHTML = ICO.play({ s:24 });
  $('#pvback').onclick = () => { closePlay(); try{ history.back(); }catch(e){} };

  /* 動画の上をタップ = 操作パネルの出し入れ。YouTubeへは絶対に飛ばさない */
  $('#catch').onclick = () => {
    if($('#ctrl').classList.contains('fade')) showCtrl();
    else togglePlay();
  };
  $('#bigplay').onclick = async () => {
    $('#phint').classList.add('hidden');
    await makePlayer();
    try{
      if(player.getVideoData && player.getVideoData().video_id !== curId){
        player.loadVideoById({ videoId:curId, startSeconds:startSecOf(vid(curId)) });
      }else{
        player.playVideo();
      }
    }catch(e){}
  };

  /* 一覧のカードから再生をひらく */
  document.addEventListener('click', e => {
    const c = e.target.closest('[data-go]');
    if(c){ openPlay(c.dataset.go); return; }
    const t = e.target.closest('[data-tile]');
    if(t){ catG = 'all'; go('cat', t.dataset.tile); return; }
    if(e.target.closest('[data-man]')){ go('man'); return; }
    if(e.target.closest('[data-lv]')){ go('lv'); }
  });

  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  addEventListener('pagehide', () => { saveNow(); pushBeacon(); });
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ saveNow(); pushBeacon(); }
    else recheck();          /* 戻ってきたら 塾生かどうかをもう一度たしかめる */
  });

  /* ログインから戻ってきたか */
  const a = readAuthHash();
  if(a && a.ok) justLoggedIn = true;
  if(a && !a.ok){
    if(a.why === 'not_member' || a.why === 'no_role'){ wipeContent(); return showGate('member'); }
    wipeContent(); return showGate('failed');
  }
  if(!tokGet()) return showGate('login');
  await startAuth();
}
boot();
</script>
</body>
</html>
