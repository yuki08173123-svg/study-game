<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高校ルート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-v1.png">
<link rel="icon" href="icon-192-v1.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F7FB">
<style>
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#141C28; --muted:#455468; --line:#D3DCE7;
  --accent:#1F5FD0; --accent-soft:#E4EDFC; --accent-ink:#FFFFFF;
  --gold:#8A6512; --gold-soft:#FBF1D9;
  --chip:#E7ECF3; --shadow:0 1px 3px rgba(20,40,70,.09); --shadow-lg:0 8px 24px rgba(20,40,70,.16);
  --new:#C9500A; --red:#C13A3A;
  --eng:#1F5FD0; --eng-soft:#E4EDFC;
  --math:#0A6E6E; --math-soft:#D8EFEF;
  --jpn:#A0402A; --jpn-soft:#FAE4DD;
  --sci:#5F3FB0; --sci-soft:#EAE3FA;
  --navy1:#101B2E;
  --rS:#B98A0E; --rA:#1F5FD0; --rB:#0A8F8F; --rC:#2C9A52; --rD:#C98A0A; --rE:#D0561A; --rF:#7A8798; --rink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151E; --card:#1A212D; --ink:#F0F4FA; --muted:#AEBCCD; --line:#303B4D;
    --accent:#7FB0F8; --accent-soft:#22314A; --accent-ink:#0C1219;
    --gold:#EDC673; --gold-soft:#3A2E17;
    --chip:#242E3D; --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-lg:0 8px 24px rgba(0,0,0,.55);
    --new:#FF9C57; --red:#F49189;
    --eng:#7FB0F8; --eng-soft:#22314A;
    --math:#5FCFCF; --math-soft:#173434;
    --jpn:#F2A992; --jpn-soft:#3B241D;
    --sci:#BCA6F5; --sci-soft:#2A2340;
    --rS:#E4BC5A; --rA:#7FB0F8; --rB:#5FCFCF; --rC:#6BD08E; --rD:#E8B24A; --rE:#F58A55; --rF:#8E9BAB; --rink:#0C1219;
  }
}
:root[data-theme="dark"]{
  --bg:#10151E; --card:#1A212D; --ink:#F0F4FA; --muted:#AEBCCD; --line:#303B4D;
  --accent:#7FB0F8; --accent-soft:#22314A; --accent-ink:#0C1219;
  --gold:#EDC673; --gold-soft:#3A2E17;
  --chip:#242E3D; --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-lg:0 8px 24px rgba(0,0,0,.55);
  --new:#FF9C57; --red:#F49189;
  --eng:#7FB0F8; --eng-soft:#22314A;
  --math:#5FCFCF; --math-soft:#173434;
  --jpn:#F2A992; --jpn-soft:#3B241D;
  --sci:#BCA6F5; --sci-soft:#2A2340;
  --rS:#E4BC5A; --rA:#7FB0F8; --rB:#5FCFCF; --rC:#6BD08E; --rD:#E8B24A; --rE:#F58A55; --rF:#8E9BAB; --rink:#0C1219;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
    "Noto Sans JP", "Yu Gothic Medium", "Yu Gothic", Meiryo, "Segoe UI", sans-serif;
  font-size:17px; line-height:1.7; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;}
.wrap{max-width:600px; margin:0 auto; padding:0 14px calc(104px + env(safe-area-inset-bottom));}
button, input, textarea, select{font-family:inherit; color:inherit;}
button{background:none; border:none; cursor:pointer; touch-action:manipulation;}
button:active{opacity:.7;}
.hidden{display:none !important;}

header.app{position:sticky; top:0; z-index:30; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 2px 8px;}
.title-row{display:flex; align-items:center; gap:9px; padding:0 2px;}
.title-row h1{font-size:21px; font-weight:700; letter-spacing:.01em;}
.title-row .ver{font-size:12.5px; color:var(--muted); font-weight:600;}
.title-row .spacer{flex:1;}
.icon-btn{width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; box-shadow:var(--shadow);}
.icon-btn svg{width:21px; height:21px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

.update{width:100%; margin-top:10px; background:var(--new); color:#fff; border-radius:14px; padding:13px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); text-align:left;}
.update svg{width:23px; height:23px; stroke:#fff; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex:none;}
.update .t{flex:1; line-height:1.4;}
.update .t b{display:block; font-size:15.5px; font-weight:700;}
.update .t span{font-size:12.5px; opacity:.95; font-weight:500;}
.update .go{background:rgba(255,255,255,.24); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; flex:none;}

.card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px;}
.card + .card{margin-top:12px;}
.sec-title{font-size:15px; font-weight:700; color:var(--ink); margin:24px 2px 8px;}
.sec-title:first-child{margin-top:14px;}
.lead{font-size:14.5px; color:var(--muted); line-height:1.75; padding:0 4px 8px;}

.chip{display:inline-block; font-size:13px; font-weight:700; border-radius:8px; padding:4px 11px; background:var(--chip); color:var(--muted);}
.chip.eng{background:var(--eng-soft); color:var(--eng);}
.chip.math{background:var(--math-soft); color:var(--math);}
.chip.jpn{background:var(--jpn-soft); color:var(--jpn);}
.chip.sci{background:var(--sci-soft); color:var(--sci);}
.chip.round{background:var(--gold-soft); color:var(--gold);}

.notice{background:var(--gold-soft); border-radius:14px; padding:13px 14px; display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;}
.notice .ic{font-size:19px; line-height:1.3;}
.notice .tx{flex:1; font-size:15px; font-weight:700; color:var(--ink); line-height:1.6;}
.notice .tx span{display:block; color:var(--muted); font-weight:500; font-size:13.5px; margin-top:2px;}
.notice .arrow{font-size:18px; color:var(--muted); font-weight:700;}

/* ==== 計画表えらび ==== */
.pickrow{margin:2px 0 9px;}
.pickrow:not(:first-child){margin-top:18px;}
.picks{display:flex; flex-wrap:wrap; gap:8px;}
.pick{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:9px 13px; line-height:1.35; text-align:left; color:var(--ink);}
.pick b{display:block; font-size:15px; font-weight:700;}
.pick span{display:block; font-size:12.5px; font-weight:500; color:var(--muted); margin-top:1px;}

/* 表示する問題集をえらぶ */
.pickhead{display:flex; align-items:center; gap:10px; padding-bottom:12px; margin-bottom:4px; border-bottom:1px solid var(--line);}
.pickhead .cnt{flex:1; font-size:14px; font-weight:500; color:var(--muted); line-height:1.5;}
.pickhead .cnt b{font-weight:700; color:var(--accent);}
.mini{flex:none; font-size:13.5px; font-weight:700; color:var(--accent); background:var(--accent-soft);
  border-radius:10px; padding:9px 13px; line-height:1.3; text-align:center;}
.chk{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 2px; border-bottom:1px solid var(--line);}
.chk:last-child{border-bottom:none;}
.chk .box{flex:none; width:25px; height:25px; border-radius:7px; border:2px solid var(--line);
  display:grid; place-items:center; font-size:14px; font-weight:700; color:transparent;}
.chk.on .box{background:var(--accent); border-color:var(--accent); color:#fff;}
.chk .tx{flex:1; font-size:15.5px; font-weight:700; line-height:1.45;}
.chk .tx span{display:block; font-size:13px; font-weight:500; color:var(--muted);}
.chk:not(.on) .tx{color:var(--muted); font-weight:500;}

/* 周目へジャンプ */
.jump{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;}
.jump button{border:1px solid var(--line); background:var(--card); border-radius:9px;
  padding:8px 13px; font-size:14px; font-weight:700; color:var(--accent); box-shadow:var(--shadow);}

/* ==== すごろく ==== */
.sg{padding:14px 14px 12px;}
.sghead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.sgtag{font-size:12.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 10px;}
.sgtag.off{color:var(--muted); background:var(--chip);}
.sghead b{font-size:30px; font-weight:700; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums;}
.sghead b small{font-size:14px; font-weight:700; margin-left:2px;}
.sgsub{font-size:13.5px; color:var(--muted); line-height:1.5; flex:1; min-width:120px;}
.sgbar{height:8px; border-radius:999px; background:var(--chip); overflow:hidden; margin:2px 0 12px;}
.sgbar i{display:block; height:100%; background:var(--accent); border-radius:999px;}
.sgrow{display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-top:1px solid var(--line);}
.sgrow:first-of-type{border-top:none;}
.sglabel{flex:none; width:60px; font-size:12px; font-weight:700; color:var(--muted); line-height:1.35; padding-top:2px;}
.sgcells{flex:1; display:flex; flex-wrap:wrap; gap:4px;}
.sq{width:17px; height:17px; border-radius:4px; background:var(--chip); border:1px solid var(--line); padding:0;}
.sq.done{background:var(--accent); border-color:var(--accent); opacity:.55;}
.sq.now{background:var(--accent); border-color:var(--accent); opacity:1; position:relative; transform:scale(1.35); z-index:1;
  box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--accent);}
.sq.now::after{content:""; position:absolute; inset:4px; border-radius:50%; background:#fff;}
.pick.marked{border-color:var(--accent); background:var(--accent-soft);}
.pick .mk{color:var(--accent); font-weight:700;}
table.plan td.now{background:var(--accent) !important; color:var(--accent-ink); font-weight:700;}
table.plan td.past{color:var(--muted); opacity:.6;}
table.plan td[data-d]{cursor:pointer;}

/* ==== スコア ==== */
.scorecard{padding:18px 16px 14px;}
.rankwrap{display:flex; align-items:center; gap:16px; margin-bottom:12px;}
.rankbig{width:80px; height:80px; border-radius:20px; display:grid; place-items:center; font-size:46px; font-weight:800; color:var(--rink); flex:none; letter-spacing:-.02em;}
.scoremain{display:flex; flex-direction:column; line-height:1.25; min-width:0;}
.scoremain .lbl{font-size:13.5px; font-weight:700; color:var(--muted);}
.scoremain b{font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
.scoremain b small{font-size:16px; margin-left:3px;}
.scoremain .sub{font-size:13.5px; color:var(--muted); margin-top:5px;}
.scoremain .sub b{font-size:14px; color:var(--ink);}
.sgbar.big{height:12px; margin:0 0 10px;}
.rankscale{display:flex; justify-content:space-between; padding:0 2px;}
.rankscale span{font-size:13px; font-weight:700; color:var(--muted); width:28px; height:28px; border-radius:8px; display:grid; place-items:center;}
.rankscale span.on{color:var(--rink);}
.subjrow{display:flex; align-items:center; gap:11px; padding:12px 2px; border-bottom:1px solid var(--line);}
.subjrow:last-child{border-bottom:none;}
.subjrow .chip{flex:none; min-width:48px; text-align:center;}
.subjmid{flex:1; min-width:0;}
.subjmid .sgbar{margin:0 0 4px;}
.subjmid .sub{font-size:12.5px; color:var(--muted);}
.subjrow b{font-size:22px; font-weight:800; min-width:58px; text-align:right; flex:none;}
.subjrow b small{font-size:12px; margin-left:1px;}
.rk{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:var(--rink); font-weight:800; font-size:15px; flex:none;}
.bookrow{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line);}
.bookrow:last-child{border-bottom:none;}
.bkmain{flex:1; min-width:0; text-align:left; display:flex; flex-direction:column; gap:5px;}
.bkmain b{font-size:15px; font-weight:700; line-height:1.4;}
.bkmain .sgbar{margin:0; height:7px;}
.bkmain .sub{font-size:12.5px; color:var(--muted);}
.bookrow.done .bkmain b{color:var(--muted);}
.bookrow.done .bkmain .sgbar i{opacity:.6;}
.donebadge{width:34px; height:34px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:800; flex:none;}
.ranktable{display:grid; grid-template-columns:1fr 1fr; gap:7px 14px; margin-top:12px;}
.ranktable div{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600;}
.rS, .sgbar i.rS{background:var(--rS);} .rA, .sgbar i.rA{background:var(--rA);} .rB, .sgbar i.rB{background:var(--rB);}
.rC, .sgbar i.rC{background:var(--rC);} .rD, .sgbar i.rD{background:var(--rD);} .rE, .sgbar i.rE{background:var(--rE);}
.rF, .sgbar i.rF{background:var(--rF);}

/* ==== AIに相談 ==== */
.fld{margin-bottom:12px;} .fld:last-child{margin-bottom:0;}
.fld label{display:block; font-size:13.5px; font-weight:700; color:var(--muted); margin-bottom:5px;}
.fld input, .fld select, .fld textarea{width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); line-height:1.5;}
.fld textarea{resize:vertical;}
.fld.two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.calc{margin:12px 0 4px; display:flex; flex-direction:column; gap:6px; font-size:15px; line-height:1.7;}
.calc .k{font-size:13px; font-weight:700; color:var(--accent); margin-bottom:2px;}
.calc .ok{color:var(--accent); font-weight:700;}
.calc .warn{color:var(--red); font-weight:700;}

/* ==== 表（スプレッドシート風） ==== */
.tscroll{overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--card); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow); margin-bottom:12px;}
table.plan{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:15px;}
table.plan th, table.plan td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:9px 11px; text-align:center; white-space:nowrap;}
table.plan tr > *:last-child{border-right:none;}
table.plan tbody tr:last-child > *{border-bottom:none;}
table.plan th{background:var(--chip); font-weight:700; font-size:13.5px; color:var(--muted);}
table.plan th.rnd{background:var(--accent-soft); color:var(--accent); font-size:15px; text-align:left; padding-left:13px;}
table.plan th.rnd.solo{position:sticky; left:0;}
table.plan td.d{color:var(--muted); font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; background:var(--bg);}
table.plan td.t{font-weight:600;}
table.plan td.ft, table.plan th.ft{color:var(--muted); font-size:13px; font-weight:700; background:var(--bg);}
.tcap{font-size:13.5px; font-weight:700; color:var(--muted); margin:2px 4px 7px;}

/* 全体計画の表 */
table.plan.ovw td, table.plan.ovw th{text-align:left;}
table.plan.ovw .nm{position:sticky; left:0; z-index:1; background:var(--card); font-weight:700; font-size:15px;
  box-shadow:1px 0 0 var(--line); white-space:normal; min-width:132px; max-width:158px; line-height:1.45;}
table.plan.ovw th.nm{background:var(--chip); z-index:3; font-size:13.5px;}
table.plan.ovw .nm i{font-style:normal; margin-left:6px; font-weight:700; font-size:12px; white-space:nowrap;
  color:var(--accent); background:var(--accent-soft); border-radius:6px; padding:2px 7px; display:inline-block; vertical-align:2px;}
table.plan.ovw td:nth-child(2){white-space:normal; min-width:104px; max-width:140px; line-height:1.5;}
table.plan.ovw .memo{white-space:normal; min-width:190px; max-width:250px; font-size:13.5px; color:var(--muted); font-weight:500; line-height:1.6;}
table.plan.ovw tr.grade td{background:var(--bg); font-size:13.5px; font-weight:700; color:var(--muted); position:static; box-shadow:none;}
table.plan.ovw tr.tap{cursor:pointer;}
table.plan.ovw tr.tap:active td{background:var(--accent-soft);}
table.plan.ovw tr.plain td, table.plan.ovw tr.plain .nm{color:var(--muted);}

/* ==== 鉄則 ==== */
.rowitem{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:13px 4px; border-bottom:1px solid var(--line);}
.rowitem:last-child{border-bottom:none;}
.rowitem .no{width:30px; height:30px; border-radius:8px; background:var(--chip); color:var(--muted); font-size:14px; font-weight:700; display:grid; place-items:center; flex:none;}
.rowitem .tx{flex:1; min-width:0;}
.rowitem .tx b{display:block; font-size:15.5px; font-weight:700; line-height:1.45;}
.rowitem .tx span{display:block; font-size:13.5px; color:var(--muted); font-weight:500; margin-top:1px;}
.rowitem .go{font-size:18px; color:var(--muted); font-weight:700; flex:none;}

.doc{font-size:15.5px; line-height:1.9; white-space:pre-wrap; word-break:break-word;}
.tetsu-item{display:flex; flex-direction:column; gap:9px; padding:13px 2px; border-bottom:1px solid var(--line);}
.tetsu-item:last-child{border-bottom:none;}
.tetsu-item .tx{font-size:15.5px; line-height:1.85; white-space:pre-wrap; word-break:break-word;}
.tetsu-item .tm{align-self:flex-start; max-width:100%; font-size:13.5px; font-weight:700; color:var(--accent);
  background:var(--accent-soft); border-radius:8px; padding:5px 11px; line-height:1.55;}
.tetsu-item .tm::before{content:"目安 "; opacity:.72;}
.tetsu-head{font-size:15px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:9px; padding:9px 12px; margin:14px 0 2px; white-space:pre-wrap; line-height:1.6;}
.tetsu-head:first-child{margin-top:0;}

/* ==== シート ==== */
.mask{position:fixed; inset:0; background:rgba(10,18,32,.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s;}
.mask.on{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--bg); border-radius:20px 20px 0 0;
  max-height:92vh; display:flex; flex-direction:column; transform:translateY(101%); transition:transform .22s cubic-bezier(.2,.7,.3,1);}
.sheet.on{transform:translateY(0);}
.sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:9px auto 4px; flex:none;}
.sheet .shead{display:flex; align-items:center; gap:10px; padding:4px 16px 10px; flex:none;}
.sheet .shead b{flex:1; font-size:18px; font-weight:700; line-height:1.4;}
.sheet .sbody{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px calc(24px + env(safe-area-inset-bottom));}
.x{width:36px; height:36px; border-radius:10px; background:var(--chip); display:grid; place-items:center; font-size:17px; font-weight:700; color:var(--muted); flex:none;}

.btnrow{display:flex; gap:8px; margin-top:12px;}
#hsBox .hs-btns{gap:8px} #hsBox .lead{padding:10px 2px 0} #hsBox .hs-code{margin-top:0}
.btn{flex:1; border-radius:11px; padding:13px 10px; font-size:15.5px; font-weight:700; text-align:center; border:1px solid var(--line); background:var(--card); color:var(--ink);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.varrow{display:flex; gap:8px; margin:12px 0 4px; flex-wrap:wrap;}
.varbtn{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 13px; font-size:14.5px; font-weight:700;}
.varbtn.on{background:var(--accent); color:var(--accent-ink); border-color:transparent;}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0; border-radius:12px; color:var(--muted);}
.tabbar button.on{color:var(--accent);}
.tabbar svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.tabbar span{font-size:12px; font-weight:700;}

.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);

/* ==== 使い方スライド ==== */
.slides{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  gap:12px; padding-bottom:4px; scrollbar-width:none;}
.slides::-webkit-scrollbar{display:none;}
.slide{flex:0 0 100%; scroll-snap-align:center; background:var(--card); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column;}
.slide .step{font-size:13px; font-weight:700; color:var(--accent); background:var(--accent-soft);
  border-radius:999px; padding:3px 11px; align-self:flex-start; margin-bottom:9px;}
.slide h3{font-size:19px; font-weight:700; line-height:1.45; margin-bottom:12px;}
.slide .art{background:var(--bg); border-radius:12px; padding:10px; margin-bottom:13px;}
.slide .art svg{display:block; width:100%; height:auto;}
.slide p{font-size:15px; line-height:1.8; color:var(--ink);}
.slide p + p{margin-top:9px;}
.slide .sub{color:var(--muted); font-size:14px;}
.slide b.hl{color:var(--accent);}
.snav{display:flex; align-items:center; gap:10px; margin-top:14px;}

.snav .nb{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 15px;
  font-size:15px; font-weight:700; flex:none;}
.snav .nb.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
.snav .nb[disabled]{opacity:.35;}

.setrow{display:flex; align-items:center; gap:10px; padding:14px 2px; border-bottom:1px solid var(--line); width:100%; text-align:left; text-decoration:none; color:inherit;}
.setrow:last-child{border-bottom:none;}
.setrow .tx{flex:1;}
.setrow .tx b{display:block; font-size:16px; font-weight:700;}
.setrow .tx span{display:block; font-size:13.5px; color:var(--muted); font-weight:500;}
.setrow .val{font-size:14.5px; font-weight:700; color:var(--accent);}
.link{color:var(--accent); font-weight:700; text-decoration:underline;}
</style>

<script src="data.js"></script>
<script>
/* HSYNC BEGIN ─────────────────────────────────────────────
   同期（スマホとパソコンで同じにする）。Takutoさんの要望（2026-09-11）。
   ※ Mindrest の HSYNC をそのまま持ってきたもの。違いは ask/yes（アプリの画面で聞く）だけ。

   預け先は計画マップと同じ Google Apps Script（plan/gas/Sync.gs）。サーバー側は変えていない。
   ・同期コードは全アプリで1つ。計画マップのコードをそのまま入れればよい。
   ・サーバーには、そのコードから作った「アプリごとのコード」で預ける（アプリどうしが上書きし合わない）。
   ・預けるのは config.keys の localStorage だけ。写真（IndexedDB）や端末ごとの設定は預けない。
   ・lists に書いたキーは「id ごとに足し合わせる」。2台で別々に書いても、どちらも残る。
     消したものは「消したしるし（tomb）」で相手にも伝える。それ以外のキーは新しいほうが勝つ。
   ─────────────────────────────────────────────────────────── */
const HSync = (function(){
  const URL = 'https://script.google.com/macros/s/AKfycbztk0Zk4YnnAjKcOgsVU690-gAn_FfN5xGILx5u_YUj6syG5xk80sV6Biqa1WOce-uQ/exec';
  const SECRET = 'hiramap-2026';
  const CH = 'abcdefghjkmnpqrstuvwxyz23456789';      // 0/o/1/l/i は使わない（計画マップと同じ）
  const TOMB_DAYS = 90;

  let C = null;                 // 設定（init で受けとる）
  let M = null;                 // この端末の同期の記録 { code, mt, at, dirty, err }
  let T = {};                   // 消したしるし { key: { id: 時刻 } }
  let applying = false, busy = false, seq = 0, timer = null, pending = null;
  const ls = window.localStorage;
  const _set = Storage.prototype.setItem, _get = Storage.prototype.getItem, _rm = Storage.prototype.removeItem;

  /* ---------- 小道具 ---------- */
  const now = () => Date.now();
  const metaKey = () => 'hs.' + C.app, tombKey = () => 'hs.' + C.app + '.tomb';
  function loadMeta(){
    try{ M = JSON.parse(_get.call(ls, metaKey()) || 'null') || {}; }catch(e){ M = {}; }
    try{ T = JSON.parse(_get.call(ls, tombKey()) || 'null') || {}; }catch(e){ T = {}; }
  }
  function saveMeta(){ try{ _set.call(ls, metaKey(), JSON.stringify(M)); _set.call(ls, tombKey(), JSON.stringify(T)); }catch(e){} }
  function norm(v){
    const a = String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    return a.length === 8 ? a.slice(0, 4) + '-' + a.slice(4) : '';
  }
  /* コード X から、このアプリ用のコードを作る（どの端末でも同じになる） */
  function h32(s, seed){ let h = seed >>> 0; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function derive(master){
    let a = h32(master + '|' + C.app, 2166136261), b = h32(C.app + '|' + master, 0x9747b28c), s = '';
    for(let i = 0; i < 8; i++){
      if(i === 4) s += '-';
      if(i < 4){ s += CH[a % 31]; a = Math.floor(a / 31); } else { s += CH[b % 31]; b = Math.floor(b / 31); }
    }
    return s;
  }
  async function call(p){
    const r = await fetch(URL, { method:'POST', body: JSON.stringify(Object.assign({ secret:SECRET }, p)) });
    return r.json();
  }
  const say = (m) => { try{ C.toast && C.toast(m); }catch(e){} };
  /* 入力と確認。C.ask / C.yes があればアプリの画面で聞く（iPhoneのホーム画面アプリでは prompt/confirm が出ないことがあるため） */
  const ask = (msg) => C.ask ? C.ask(msg) : Promise.resolve(prompt(msg));
  const yes = (msg) => C.yes ? C.yes(msg) : Promise.resolve(confirm(msg));
  const fmt = (t) => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  /* ---------- 中身の出し入れ ---------- */
  function collect(){
    const keys = {};
    C.keys.forEach(k => { const v = _get.call(ls, k); if(v !== null) keys[k] = v; });
    pruneTomb();
    return { app: C.app, v: 1, keys, tomb: T };
  }
  function hasLocal(){ return C.hasData ? !!C.hasData() : C.keys.some(k => _get.call(ls, k) !== null); }
  function pruneTomb(){
    const lim = now() - TOMB_DAYS * 864e5;
    Object.keys(T).forEach(k => { Object.keys(T[k] || {}).forEach(id => { if(T[k][id] < lim) delete T[k][id]; }); });
  }
  const idOf = (spec, x) => (x && x[spec.id] !== undefined) ? String(x[spec.id]) : null;

  /* 消したものを覚える（lists のキーだけ） */
  function tombDiff(k, oldRaw, newRaw){
    const spec = C.lists && C.lists[k]; if(!spec) return;
    let a = [], b = [];
    try{ a = JSON.parse(oldRaw || '[]') || []; }catch(e){}
    try{ b = JSON.parse(newRaw || '[]') || []; }catch(e){}
    if(!Array.isArray(a) || !Array.isArray(b)) return;
    const keep = {}; b.forEach(x => { const id = idOf(spec, x); if(id) keep[id] = 1; });
    a.forEach(x => { const id = idOf(spec, x); if(id && !keep[id]){ (T[k] = T[k] || {})[id] = now(); } });
    b.forEach(x => { const id = idOf(spec, x); if(id && T[k] && T[k][id]) delete T[k][id]; });   // 戻したものは消さない
  }

  /* 2台の中身を合わせる。lists は id ごとに足し合わせ、ほかは新しいほうの値 */
  function merge(loc, rem, remNewer){
    const out = { app: C.app, v: 1, keys: {}, tomb: {} };
    const tb = {};
    [loc.tomb || {}, rem.tomb || {}].forEach(t => Object.keys(t).forEach(k => Object.keys(t[k] || {}).forEach(id => {
      tb[k] = tb[k] || {}; tb[k][id] = Math.max(tb[k][id] || 0, t[k][id]);
    })));
    out.tomb = tb;
    C.keys.forEach(k => {
      const lv = loc.keys[k], rv = rem.keys[k];
      const spec = C.lists && C.lists[k];
      if(!spec){
        const v = remNewer ? (rv !== undefined ? rv : lv) : (lv !== undefined ? lv : rv);
        if(v !== undefined) out.keys[k] = v;
        return;
      }
      let la = [], ra = [];
      try{ la = JSON.parse(lv || '[]') || []; }catch(e){}
      try{ ra = JSON.parse(rv || '[]') || []; }catch(e){}
      const first = remNewer ? ra : la, second = remNewer ? la : ra;   // 同じ id は新しい側を優先
      const map = {}, order = [];
      first.concat(second).forEach(x => {
        const id = idOf(spec, x); if(!id) return;
        const cur = map[id];
        if(!cur){ map[id] = x; order.push(id); return; }
        if(spec.t && (Number(x[spec.t]) || 0) > (Number(cur[spec.t]) || 0)) map[id] = x;
      });
      const dead = tb[k] || {};
      let arr = order.filter(id => !(dead[id] && !(spec.t && (Number(map[id][spec.t]) || 0) > dead[id]))).map(id => map[id]);
      if(spec.sort) arr.sort(spec.sort);
      out.keys[k] = JSON.stringify(arr);
    });
    return out;
  }

  /* 預かっていた中身をこの端末に入れて、画面を読みなおす */
  function applyAndReload(obj, msg){
    if(isBusy()){ pending = { obj, msg }; setTimeout(retryPending, 5000); return; }
    applying = true;
    try{
      C.keys.forEach(k => {
        if(obj.keys && obj.keys[k] !== undefined) _set.call(ls, k, obj.keys[k]);
        else _rm.call(ls, k);
      });
      T = obj.tomb || {};
    }catch(e){}
    applying = false;
    saveMeta();
    try{ sessionStorage.setItem('hs.msg', msg || '同期しました'); }catch(e){}
    location.reload();
  }
  function retryPending(){ if(!pending) return; const p = pending; pending = null; applyAndReload(p.obj, p.msg); }
  function isBusy(){
    try{ if(C.busy && C.busy()) return true; }catch(e){}
    const a = document.activeElement;
    return !!(a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && /text|search|number|time|date/.test(a.type || 'text'))));
  }

  /* ---------- 変わったら送る ---------- */
  function touch(){
    if(!M.code) return;
    seq++;
    M.mt = Math.max(now(), (M.mt || 0) + 1);   // 端末の時計が多少ずれていても前に進む
    M.dirty = true; saveMeta();
    clearTimeout(timer);
    timer = setTimeout(push, C.delay || 3000);
  }
  /* localStorage への書きこみを見張る。アプリ側のコードは直さなくてよい */
  Storage.prototype.setItem = function(k, v){
    if(this === ls && C && !applying && C.keys.indexOf(k) >= 0){
      const old = _get.call(this, k);
      _set.call(this, k, v);
      if(old !== String(v)){ tombDiff(k, old, String(v)); touch(); }
      return;
    }
    return _set.call(this, k, v);
  };
  Storage.prototype.removeItem = function(k){
    if(this === ls && C && !applying && C.keys.indexOf(k) >= 0){
      const old = _get.call(this, k);
      _rm.call(this, k);
      if(old !== null){ tombDiff(k, old, '[]'); touch(); }
      return;
    }
    return _rm.call(this, k);
  };

  async function push(){
    if(!M.code) return;
    if(busy){ clearTimeout(timer); timer = setTimeout(push, 1500); return; }
    busy = true;
    const mySeq = seq;
    try{
      const r = await call({ action:'put', code:derive(M.code), mt:M.mt || 0, name:C.label, data:JSON.stringify(collect()) });
      if(r && r.ok && r.stale) await onRemote(r);
      else if(r && r.ok){ M.at = now(); M.err = ''; if(seq === mySeq) M.dirty = false; }
      else M.err = (r && r.err) || '送れませんでした';
    }catch(e){ M.err = 'つながりませんでした'; }
    busy = false; saveMeta(); render();
    if(M.err){ clearTimeout(timer); timer = setTimeout(push, 30000); }
    else if(M.dirty && seq !== mySeq){ clearTimeout(timer); timer = setTimeout(push, C.delay || 3000); }
  }
  /* 閉じるとき。書いた直後に閉じても届くように */
  function flush(){
    if(!M || !M.code || !M.dirty) return;
    const body = JSON.stringify({ secret:SECRET, action:'put', code:derive(M.code), mt:M.mt || 0, name:C.label, data:JSON.stringify(collect()) });
    if(body.length > 60000) return;            // keepalive で送れる大きさをこえたら、次に開いたときに送る
    try{ fetch(URL, { method:'POST', body, keepalive:true }); }catch(e){}
  }

  /* 預かりのほうが新しかったとき */
  async function onRemote(r){
    let rem = null; try{ rem = JSON.parse(r.data || 'null'); }catch(e){}
    if(!rem || rem.app !== C.app || !rem.keys){ M.err = 'このコードの中身が読めません'; return; }
    if(!M.dirty){
      M.mt = r.mt || M.mt; M.at = now(); M.err = ''; saveMeta();
      applyAndReload(rem, 'ほかの端末の記録を受けとりました');
      return;
    }
    // この端末にもまだ送っていない書きこみがある → 合わせて、合わせたものを預けなおす
    const merged = merge(collect(), rem, true);
    M.mt = Math.max(now(), (r.mt || 0) + 1); M.dirty = true; M.at = now(); M.err = ''; saveMeta();
    applyAndReload(merged, '2台の記録を合わせました');
  }

  async function pull(quiet){
    if(!M.code) return;
    if(busy) return;
    busy = true;
    try{
      const r = await call({ action:'get', code:derive(M.code) });
      busy = false;
      if(r && r.ok && r.found){
        if((r.mt || 0) > (M.mt || 0)){ await onRemote(r); }
        else if((r.mt || 0) < (M.mt || 0) || M.dirty){ await push(); return; }
        else { M.at = now(); M.err = ''; if(!quiet) say('同期ずみです'); }
      }else if(r && r.ok){ await push(); return; }
      else M.err = (r && r.err) || '受けとれませんでした';
    }catch(e){ busy = false; M.err = 'つながりませんでした'; }
    saveMeta(); render();
  }

  /* ---------- ボタン ---------- */
  async function start(){
    say('コードを作っています…');
    try{
      const r = await call({ action:'new' });
      if(!r || !r.ok){ say((r && r.err) || 'つながりませんでした'); return; }
      M = { code:r.code, mt:now(), dirty:true, at:0, err:'' }; saveMeta(); render();
      await push();
      say(M.err ? M.err : '同期をはじめました');
    }catch(e){ say('つながりませんでした'); }
  }
  async function join(){
    const v = await ask('同期コード（8文字）を入れてください。\n計画マップなど、ほかのアプリで使っているコードと同じでOKです。');
    if(v === null) return;
    const code = norm(v);
    if(!code){ say('コードは8文字です（例 abcd-2345）'); return; }
    try{
      const r = await call({ action:'get', code:derive(code) });
      if(r && r.ok && !r.found &&
         !(await yes('コード「' + code + '」の' + C.label + 'の記録は、まだ預けられていません。\nこの端末の記録を、このコードで預けはじめますか？\n\n計画マップなどで使っているコードなら、このままで大丈夫です。打ちまちがいがないかだけ確認してください。'))) return;
    }catch(e){}
    joinWith(code);
  }
  async function stop(){
    if(!(await yes('この端末の同期をやめます。記録はこの端末に残り、預けたぶんも消えません。よろしいですか？'))) return;
    M = {}; saveMeta(); render(); say('同期をやめました');
  }
  /* 同じサイトのほかのアプリが同期コードを持っていれば、それを使える（パソコン・Android。
     iPhoneのホーム画面アプリはアプリごとに保存場所が別なので、たいてい見つからない） */
  function siblingCode(){
    const tries = [];
    try{
      for(let i = 0; i < ls.length; i++){
        const k = ls.key(i); let o = null;
        if(/^planmap_(v1|p.+)$/.test(k)){ try{ o = JSON.parse(_get.call(ls, k) || '{}'); }catch(e){} if(o && o.syncCode) tries.push(['計画マップ', o.syncCode]); }
        else if(k === 'mn_sync'){ try{ o = JSON.parse(_get.call(ls, k) || '{}'); }catch(e){} if(o && o.code) tries.push(['ReNote', o.code]); }
        else if(/^hs\.[a-z]+$/.test(k) && k !== metaKey()){ try{ o = JSON.parse(_get.call(ls, k) || '{}'); }catch(e){} if(o && o.code) tries.push(['ほかのアプリ', o.code]); }
      }
    }catch(e){}
    for(const t of tries){ const c = norm(t[1]); if(c) return { from:t[0], code:c }; }
    return null;
  }
  async function joinWith(code){
    say('さがしています…');
    try{
      const r = await call({ action:'get', code:derive(code) });
      if(!r || !r.ok){ say((r && r.err) || 'つながりませんでした'); return; }
      if(r.found){
        let rem = null; try{ rem = JSON.parse(r.data || 'null'); }catch(e){}
        if(!rem || rem.app !== C.app || !rem.keys){ say('このコードの中身が読めません'); return; }
        if(C.lists && hasLocal()){
          if(!(await yes('この端末の記録と、コード「' + code + '」に預けてある記録を合わせます。\nどちらの記録も残ります。よろしいですか？'))) return;
          const merged = merge(collect(), rem, true);
          M = { code, mt:Math.max(now(), (r.mt || 0) + 1), dirty:true, at:now(), err:'' }; saveMeta();
          applyAndReload(merged, '2台の記録を合わせました');
          return;
        }
        if(hasLocal() && !(await yes('この端末のいまの記録は、コード「' + code + '」の記録に入れかわります。よろしいですか？\n（この端末にだけある記録は消えます）'))) return;
        M = { code, mt:r.mt || 0, dirty:false, at:now(), err:'' }; saveMeta();
        applyAndReload(rem, '同じ記録になりました');
        return;
      }
      M = { code, mt:now(), dirty:true, at:0, err:'' }; saveMeta(); render();
      await push();
      say(M.err ? M.err : '同期をはじめました');
    }catch(e){ say('つながりませんでした'); }
  }
  async function copy(){
    try{ await navigator.clipboard.writeText(M.code); say('コピーしました'); }

             consult: Object.assign({ pace:'1', notes:'', ask:'', goal:{}, target:{} }, o.consult || {}) };

function variantOf(b, vi){ return (b.variants && b.variants.length) ? b.variants[Math.min(vi||0, b.variants.length-1)] : null; }
function totalDays(v){
  if(!v) return 0;
  if(v._max) return v._max;
  let max = 0;
  v.secs.forEach(s => s.rows.forEach(row => row.forEach(c => { if(c && c[0] > max) max = c[0]; })));
  v._max = max;
  return max;
}

  for(const s of ROUTE.plan) for(const r of s.rows) if(r.id === id) return r;
  return null;
}

/* ===== スコア（100点満点・S〜Fランク） ===== */
const RANKS = [['S',90],['A',75],['B',60],['C',45],['D',30],['E',15],['F',0]];   // [ランク, この点以上]
const SCORE_SUBJECTS = ['英語','数学','国語'];
const ALT = { kichart_ia_s:'kichart_ia', kichart_iib_s:'kichart_iib' };          // 4〜5ヶ月版 ↔ 7ヶ月版
function rankOf(score){ for(const [r, min] of RANKS) if(score >= min) return r; return 'F'; }
function nextRank(score){ for(let i = RANKS.length - 1; i >= 0; i--) if(score < RANKS[i][1]) return RANKS[i]; return null; }
function bookRatio(id){
  const b = bookOf(id); if(!b) return 0;
  const v = variantOf(b, S.vari[id] || 0); if(!v) return 0;
  const tot = totalDays(v), m = Math.min(S.mark[id] || 0, tot);
  return tot ? m / tot : 0;
}
function scoreBooks(){
  const out = [];
  ROUTE.plan.forEach(sec => {
    if(!SCORE_SUBJECTS.includes(sec.subject)) return;
    sec.rows.forEach(r => { if(r.id && bookOf(r.id) && bookOf(r.id).variants.length) out.push({ subject:sec.subject, id:r.id, alt: ALT[r.id] || null }); });
  });
  return out;
}
function calcScore(){
  const per = {}; SCORE_SUBJECTS.forEach(k => per[k] = { done:0, total:0, books:[] });
  scoreBooks().forEach(x => {
    const b = bookOf(x.id), tot = totalDays(variantOf(b, S.vari[x.id] || 0));
    let ratio = bookRatio(x.id), useId = x.id;
    if(x.alt){ const r2 = bookRatio(x.alt); if(r2 > ratio){ ratio = r2; useId = x.alt; } }
    per[x.subject].done += ratio * tot; per[x.subject].total += tot;
    per[x.subject].books.push({ id:x.id, useId, ratio, tot, name: shortTitle(b.title) });
  });
  const subj = SCORE_SUBJECTS.map(k => ({ subject:k, score: per[k].total ? per[k].done / per[k].total * 100 : 0, done:per[k].done, total:per[k].total, books:per[k].books }));
  return { total: subj.reduce((a, x) => a + x.score, 0) / subj.length, subj };
}

  });
  h += '</div>';

  h += '<div class="sec-title">問題集ごとの進み具合</div>';
  h += '<div class="lead">行を押すと計画表がひらき、「いまここ」を置けます。すでに終わった問題集は「終わった」を押してください。</div>';

    x.books.forEach(bk => {
      const pc = Math.round(bk.ratio * 100), dd = Math.round(bk.ratio * bk.tot);
      h += '<div class="bookrow'+(pc >= 100 ? ' done' : '')+'">'
        + '<button class="bkmain" onclick="openBook(\''+bk.useId+'\')"><b>'+esc(bk.name)+'</b>'

        + '<span class="sub">'+(pc >= 100 ? '完了 ✓' : pc ? pc+'%（'+dd+' / '+bk.tot+'日）' : 'まだ（全'+bk.tot+'日）')+'</span></button>'
        + (pc >= 100 ? '<span class="donebadge">✓</span>' : '<button class="mini" onclick="markDone(\''+bk.useId+'\')">終わった</button>')
        + '</div>';

const AI_URL = 'https://chatgpt.com/';   // 塾のGPTsを公開したら、ここをそのURLにする
function fmtDate(d){ return (d.getMonth()+1) + '月' + d.getDate() + '日'; }
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function consultCalc(id){
  const b = bookOf(id), v = variantOf(b, S.vari[id] || 0); if(!v) return null;
  const tot = totalDays(v), mark = Math.min(S.mark[id] || 0, tot), rem = tot - mark;
  const pace = Math.max(0.1, parseFloat(S.consult.pace) || 1);
  const t0 = today0();
  const finish = new Date(t0); finish.setDate(finish.getDate() + Math.ceil(rem / pace));
  const out = { tot, mark, rem, pace, finish, pct: tot ? Math.round(mark / tot * 100) : 0 };
  const ts = S.consult.target[id];
  if(ts){
    const t = new Date(ts + 'T00:00:00');
    const cal = Math.round((t - t0) / 86400000);
    out.target = t; out.cal = cal;
    if(cal > 0){ out.need = rem / cal; out.late = Math.ceil(rem / pace) - cal; }
  }
  return out;
}
function calcHTML(id){
  const c = consultCalc(id); if(!c) return '';

function planLines(v, mark, limit){
  const days = dayList(v).filter(x => x.d > mark);
  const lines = []; let cur = null;
  days.forEach(x => {
    const lab = headLabel(v.secs[x.si], x.hi, x.si);
    if(cur && cur.t === x.t && cur.lab === lab && cur.b === x.d - 1) cur.b = x.d;
    else { cur = { a:x.d, b:x.d, t:x.t, lab }; lines.push(cur); }
  });
  const txt = lines.map(l => (l.a === l.b ? l.a+'日目' : l.a+'〜'+l.b+'日目') + '：' + l.t + '（' + l.lab + '）');
  if(txt.length > limit){ const cut = txt.slice(0, limit); cut.push('…（このあとも同じ形で続く。全'+txt.length+'区切り）'); return cut; }
  return txt;
}

/* ===== すごろく（いまここ） ===== */
function dayList(v){
  if(v._days) return v._days;
  const out = [];
  v.secs.forEach((s, si) => s.rows.forEach(row => row.forEach((c, ci) => {
    if(!c) return;
    let hi = 0;
    s.heads.forEach((hd, k) => { if(ci >= hd.i && ci < hd.i + hd.n) hi = k; });
    out.push({ d:c[0], t:c[1], si, hi });
  })));
  out.sort((a, b) => a.d - b.d);
  v._days = out;
  return out;
}
/* 表の見出し1つぶん（「１周目」など）のラベル */
function headLabel(sec, hi, si){
  const l = (sec.heads[hi] && sec.heads[hi].l) || '';
  return l.replace(/（[^）]*）/g, '').trim() || ('計画' + (si + 1));
}
function boardHTML(id, v){
  const days = dayList(v), tot = totalDays(v);
  const mark = Math.min(S.mark[id] || 0, tot);
  /* 周目（表の見出し）ごとに1段。日の順にならべる */
  const groups = [], gidx = {};
  days.forEach(x => {
    const k = x.si + ':' + x.hi;
    if(!(k in gidx)){ gidx[k] = groups.length; groups.push({ si:x.si, hi:x.hi, list:[] }); }
    groups[gidx[k]].list.push(x);
  });
  let h = '<div class="card sg">';
  if(mark){
    const pct = Math.round(mark / tot * 100);
    const e = days.find(x => x.d === mark);
    h += '<div class="sghead"><span class="sgtag">いまここ</span><b>'+mark+'<small>日目</small></b>'
      + '<span class="sgsub">全'+tot+'日の '+pct+'%'+(e ? '<br>'+esc(headLabel(v.secs[e.si], e.hi, e.si))+'　'+esc(e.t) : '')+'</span></div>';
    h += '<div class="sgbar"><i style="width:'+pct+'%"></i></div>';
  }else{
    h += '<div class="sghead"><span class="sgtag off">まだ印がありません</span><span class="sgsub">きょう終わった日のマスをタップしてください。</span></div>';
  }
  groups.forEach(g => {
    const list = g.list;
    h += '<div class="sgrow"><span class="sglabel">'+esc(headLabel(v.secs[g.si], g.hi, g.si))+'</span><div class="sgcells">';
    list.forEach(x => {
      const k = x.d < mark ? ' done' : (x.d === mark ? ' now' : '');
      h += '<button class="sq'+k+'" data-d="'+x.d+'" onclick="setMark(\''+id+'\','+x.d+')" aria-label="'+x.d+'日目"></button>';
    });
    h += '</div></div>';
  });
  if(mark && mark < tot){
    h += '<div class="btnrow" style="margin-top:14px">'
      + '<button class="btn" onclick="setMark(\''+id+'\','+(mark-1)+')">1日もどる</button>'
      + '<button class="btn primary" onclick="setMark(\''+id+'\','+(mark+1)+')">1日すすむ</button></div>';
  }
  h += '<div class="btnrow" style="margin-top:8px">';
  if(mark >= tot) h += '<button class="btn" onclick="setMark(\''+id+'\','+(tot-1)+')">1日もどる</button>';
  else h += '<button class="btn" onclick="setMark(\''+id+'\','+tot+')">この問題集は終わった ✓</button>';
  if(mark) h += '<button class="btn small" onclick="setMark(\''+id+'\',0)">消す</button>';
  h += '</div></div>';
  return h;
}
function setMark(id, d){
  const b = bookOf(id), v = variantOf(b, S.vari[id] || 0); if(!v) return;
  const tot = totalDays(v);
  d = Math.max(0, Math.min(tot, d | 0));
  if(d) S.mark[id] = d; else delete S.mark[id];
  save();
  /* スクロール位置を保ったまま、印だけ描き直す */
  const board = document.getElementById('board');
  if(board) board.innerHTML = boardHTML(id, v);
  document.querySelectorAll('#sheetBody td[data-d]').forEach(td => {
    const n = +td.dataset.d;
    td.classList.toggle('now', n === d);
    td.classList.toggle('past', !!d && n < d);
  });
  if(d === tot) toast('全'+tot+'日、完走です 🎉');
  else if(d) toast(d + '日目に印を置きました');
  else toast('印を消しました');
  if(tab === 'route' || tab === 'score') render();
}
function clearMarks(){
  if(!confirm('すべての問題集の「いまここ」の印を消します。よろしいですか？')) return;
  S.mark = {}; save(); render(); toast('印をぜんぶ消しました');
}

/* 元のスプレッドシートと同じ「表」で計画を描く */
function secLabel(sec, i){
  const hs = sec.heads.map(h => (h.l || '').replace(/（[^）]*）/g, '').trim()).filter(Boolean);
  if(!hs.length) return '計画' + (i + 1);
  if(hs.length === 1) return hs[0];
  return hs[0].replace(/周目$/, '') + '〜' + hs[hs.length - 1];
}
function jumpSec(i){
  const el = document.getElementById('sec' + i); if(!el) return;
  const box = document.getElementById('sheetBody');
  box.scrollTo({ top: el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 14, behavior:'smooth' });
}
function planTables(v, id){
  const mark = (id && S.mark[id]) || 0;
  let h = '';
  v.secs.forEach((s, si) => {
    if(s.cap) h += '<div class="tcap">'+esc(s.cap)+'</div>';
    h += '<div class="tscroll" id="sec'+si+'"><table class="plan"><thead><tr>';
    const solo = s.heads.length === 1 ? ' solo' : '';
    if(s.heads.length) s.heads.forEach(hd => { h += '<th colspan="'+(hd.n*2)+'" class="rnd'+solo+'">'+esc(hd.l)+'</th>'; });
    else h += '<th colspan="'+(s.cols*2)+'" class="rnd solo">計画</th>';
    if(s.foots) h += '<th class="ft"></th>';
    h += '</tr><tr class="sub">';
    for(let i = 0; i < s.cols; i++) h += '<th>日</th><th>やる範囲</th>';
    if(s.foots) h += '<th></th>';
    h += '</tr></thead><tbody>';
    s.rows.forEach((row, ri) => {
      h += '<tr>';
      row.forEach(c => {
        if(!c){ h += '<td class="d"></td><td class="t"></td>'; return; }
        const k = c[0] === mark ? ' now' : (mark && c[0] < mark ? ' past' : '');
        const at = ' data-d="'+c[0]+'"' + (id ? ' onclick="setMark(\''+id+'\','+c[0]+')"' : '');
        h += '<td class="d'+k+'"'+at+'>'+c[0]+'</td><td class="t'+k+'"'+at+'>'+esc(c[1])+'</td>';
      });
      if(s.foots) h += '<td class="ft">'+esc(s.foots[ri] || '')+'</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  });
  return h;
}

  { step:'AIに相談', t:'計画を知っているAIに<br>相談できる', art:A.tools,
    b:'<p>問題集の中の「<b class="hl">AIに相談する</b>」を押すと、いまここ・残りの計画表・鉄則・目標日までの必要ペースを1つの文にまとめます。</p>'
      + '<p class="sub">コピーしてChatGPTなどに貼るだけ。「このペースで間に合う？」「遅れをどう取り戻す？」を、計画を知った状態で答えてくれます。</p>' },
  { step:'さいごに', t:'ホーム画面に置く／<br>新しくなったら', art:A.home,
    b:'<p><b class="hl">ホーム画面に追加</b>：iPhoneは共有ボタン →「ホーム画面に追加」。アプリのように開けます。</p>'
      + '<p><b class="hl">更新</b>：オレンジの帯が出たらタップすると最新になります。設定の「更新があるか調べる」でも確認できます。</p>' }
];

function openHelp(){
  let h = '<div class="slides" id="slideBox">';
  SLIDES.forEach(s => {
    h += '<div class="slide"><span class="step">'+s.step+'</span><h3>'+s.t+'</h3>'
      + '<div class="art">'+s.art+'</div>' + s.b + '</div>';
  });
  h += '</div>';
  h += '<div class="snav"><button class="nb" id="sPrev" onclick="slideGo(-1)">‹ もどる</button>'
    + '<span class="sdots" id="sDots"></span>'
    + '<button class="nb primary" id="sNext" onclick="slideGo(1)">つぎへ ›</button></div>';
  openSheet('高校ルートの使い方', h);
  const box = document.getElementById('slideBox');
  box.addEventListener('scroll', () => { clearTimeout(box._t); box._t = setTimeout(slideSync, 60); });
  slideSync();
}
function slideIndex(){
  const box = document.getElementById('slideBox');
  return Math.round(box.scrollLeft / (box.clientWidth + 12));
}
function slideSync(){
  const box = document.getElementById('slideBox'); if(!box) return;
  const i = slideIndex();
  let d = '';
  SLIDES.forEach((_, k) => { d += '<i class="'+(k === i ? 'on' : '')+'"></i>'; });
  document.getElementById('sDots').innerHTML = d;
  document.getElementById('sPrev').disabled = i <= 0;
  const nx = document.getElementById('sNext');
  nx.textContent = i >= SLIDES.length - 1 ? 'とじる' : 'つぎへ ›';
}
function slideGo(dir){
  const box = document.getElementById('slideBox');
  const i = slideIndex();
  if(dir > 0 && i >= SLIDES.length - 1){ closeSheet(); return; }
  box.scrollTo({ left: Math.max(0, i + dir) * (box.clientWidth + 12), behavior:'smooth' });
  setTimeout(slideSync, 320);
}

function openTetsu(key){
  const t = ROUTE.tetsoku[key];
  if(!t){ toast('鉄則がありません'); return; }
  let h = '<div class="card">';
  t.items.forEach(it => {
    const s = fmtItem(it.t);
    if(/^[↓▼]/.test(s)){ h += '<div class="tetsu-head">'+esc(s.replace(/^[↓▼]\s*/, ''))+'</div>'; return; }
    h += '<div class="tetsu-item"><span class="tx">'+linkify(s)+'</span>'
      + (it.time ? '<span class="tm">'+esc(it.time.replace(/\s+/g,' '))+'</span>' : '') + '</div>';
  });
  h += '</div>';
  openSheet(esc(tetsuName(t.title)), h);
}
function openDoc(which){
  if(which === 'prompt'){
    let h = '<div class="lead">解説を読んでもわからない問題は、問題と解説の写真をつけて、この文をAIに送ってください。</div>';
    h += '<div class="card"><div class="doc">'+linkify(fmtDoc(ROUTE.extra.prompt))+'</div>'
      + '<div class="btnrow"><button class="btn primary" onclick="copyText(ROUTE.extra.prompt)">この文をコピー</button></div></div>';
    openSheet('数学の【最強プロンプト】', h);
  }else{
    let h = '<div class="card"><div class="doc">'+linkify(fmtDoc(ROUTE.extra.pro_shikou))+'</div></div>';
    h += '<div class="sec-title">もとになったメモ</div>';
    h += '<div class="card"><div class="doc" style="font-size:14.5px; color:var(--muted)">'+linkify(fmtDoc(ROUTE.extra.pro_shikou_src))+'</div></div>';
    openSheet('プロの思考（国語読解の鉄則）', h);
  }
}
function copyText(t){
  const s = fmtDoc(t);
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(() => toast('コピーしました'), () => fallbackCopy(s));
  else fallbackCopy(s);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーできませんでした'); }
  document.body.removeChild(ta);
}

/* ---------- 更新チェック ---------- */
async function checkUpdate(manual){
  try{
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    const j = await r.json();
    if(j.v > VER){
      document.getElementById('updateBar').classList.remove('hidden');
      if(manual) toast('新しいバージョンがあります');
    }else if(manual) toast('いまのが最新です（v' + VER + '）');
  }catch(e){ if(manual) toast('調べられませんでした'); }
}
async function doUpdate(){
  try{
    if(navigator.serviceWorker){
      const rs = await navigator.serviceWorker.getRegistrations();
      for(const r of rs) await r.unregister();
    }
    if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); }
  }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
}

/* ---------- 起動 ---------- */
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if(b) go(b.dataset.tab);
});
document.getElementById('themeBtn').addEventListener('click', cycleTheme);
document.getElementById('mask').addEventListener('click', closeSheet);
document.getElementById('sheetX').addEventListener('click', closeSheet);
document.getElementById('updateBar').addEventListener('click', doUpdate);
document.getElementById('verLabel').textContent = 'v' + VER;
applyTheme();
render();
checkUpdate(false);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(false); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ───────── 同期 ─────────
   預けるのは route.v1（すごろくの「いまここ」の印・表示する問題集・選んだ版・相談の記録・見た目）。
   1つのまとまりなので、新しいほうが勝つ（足し合わせはしない）。
   同期コードは計画マップ・ReNote・Mindrest と共通。 */
function hsAsk(msg){
  return new Promise(res => {
    openSheet('同期コード',
      '<div class="lead" style="white-space:pre-line">' + esc(msg) + '</div>' +
      '<input id="hsIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="abcd-2345" ' +
      'style="width:100%;box-sizing:border-box;padding:13px 12px;border-radius:11px;border:1px solid var(--line);' +
      'background:var(--card);color:var(--ink);font-size:18px;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace">' +
      '<div class="btnrow" style="margin-top:12px"><button class="btn" id="hsNo">やめる</button>' +
      '<button class="btn primary" id="hsOk">入れる</button></div>');
    const done = v => { closeSheet(); res(v); };
    document.getElementById('hsOk').onclick = () => done(document.getElementById('hsIn').value);
    document.getElementById('hsNo').onclick = () => done(null);
    document.getElementById('mask').onclick = () => done(null);
    setTimeout(() => { try{ document.getElementById('hsIn').focus(); }catch(e){} }, 80);
  });
}
function hsYes(msg){
  return new Promise(res => {
    openSheet('確認',
      '<div class="lead" style="white-space:pre-line">' + esc(msg) + '</div>' +
      '<div class="btnrow" style="margin-top:12px"><button class="btn" id="hsNo">やめる</button>' +
      '<button class="btn primary" id="hsOk">はい</button></div>');
    const done = v => { closeSheet(); res(v); };
    document.getElementById('hsOk').onclick = () => done(true);
    document.getElementById('hsNo').onclick = () => done(false);
    document.getElementById('mask').onclick = () => done(false);
  });
}
HSync.init({
  app: 'route', label: '高校ルート',
  keys: [KEY],
  hasData: function(){ return !!(S.mark && Object.keys(S.mark).length) || !!(S.hidden && Object.keys(S.hidden).length); },
  busy: function(){ return document.getElementById('sheet').classList.contains('on'); },
  mount: '#hsBox', cls: { btn: 'btn primary', ghost: 'btn', dim: 'lead' },
  note: 'すごろくの「いまここ」の印・表示する問題集・選んだ版が同期されます。',
  delay: 3000,
  toast: toast, ask: hsAsk, yes: hsYes
});
