<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>ReNote</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ReNote">
<style>
:root{
  --bg:#f4f2ed; --surf:#fffefc; --surf2:#eceae4; --surf3:#e3e0d8;
  --line:#e4e0d7; --line2:#d5d0c4;
  --ink:#17181c; --ink2:#575a60; --ink3:#96979c;
  --pri:#17181c; --pri-soft:#eceae4; --on-pri:#fffefc;
  --gold:#a8823c; --gold-soft:#f6efe1;
  --ok:#1b7d52; --ok-soft:#e6f2eb;
  --ng:#b83c3c; --ng-soft:#f8eaea;
  --shadow:0 1px 1px rgba(23,24,28,.03), 0 1px 3px rgba(23,24,28,.04);
  --shadow-lift:0 10px 30px rgba(23,24,28,.10), 0 2px 8px rgba(23,24,28,.05);
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --r:16px;
  --tabh:60px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101114; --surf:#191a1f; --surf2:#212329; --surf3:#2a2d34;
    --line:#26282e; --line2:#343740;
    --ink:#efeee9; --ink2:#a5a7ad; --ink3:#75777d;
    --pri:#efeee9; --pri-soft:#252730; --on-pri:#17181c;
    --gold:#cca961; --gold-soft:#2a2418;
    --ok:#4bb98a; --ok-soft:#152720;
    --ng:#e07474; --ng-soft:#2b1717;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --shadow-lift:0 12px 34px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt" 1;
  font-size:16px; line-height:1.72; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:1rem}
button{cursor:pointer;border:none;background:none;color:inherit;padding:0;
  -webkit-user-select:none;user-select:none}
a{color:var(--ink)}
.hidden{display:none!important}
svg{display:block;flex:none}
.serif{font-family:var(--serif);font-weight:600}

/* ---------- 骨格 ---------- */
#top{position:sticky;top:0;z-index:40;background:var(--bg);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent;transition:border-color .25s}
#top.scrolled{border-bottom-color:var(--line)}
.tbar{max-width:620px;margin:0 auto;min-height:54px;display:flex;align-items:center;gap:6px;padding:8px 10px}
.tbar .ttl{font-size:1.02rem;font-weight:700;letter-spacing:.01em;flex:1;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .ttl.big{font-family:var(--serif);font-size:1.62rem;font-weight:600;letter-spacing:.03em;
  text-align:left;padding:6px 0 2px 8px}
.tbar .side{min-width:64px;display:flex;align-items:center;gap:4px}
.tbar .side.r{justify-content:flex-end}
.tbtn{height:36px;padding:0 8px;border-radius:9px;display:flex;align-items:center;gap:4px;
  color:var(--ink2);font-size:.9rem;font-weight:600;transition:opacity .15s}
.tbtn:active{opacity:.5}
.tbtn.accent{color:var(--ink);font-weight:700}
main{max-width:620px;margin:0 auto;padding:4px 18px calc(var(--tabh) + 48px + env(safe-area-inset-bottom));}

/* ---------- グループ行 ---------- */
.label{font-size:.72rem;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin:26px 4px 9px}
.labelrow{display:flex;align-items:flex-end;justify-content:space-between}
.labelrow .label{margin-bottom:9px}
.linkbtn{font-size:.78rem;font-weight:700;color:var(--ink2);padding:4px 6px 9px;letter-spacing:.03em}
.linkbtn:active{opacity:.5}
.rlist{position:relative;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.rrow{display:flex;align-items:center;gap:12px;padding:13px 14px;height:58px;position:relative;
  background:var(--surf);transition:transform .18s cubic-bezier(.2,.9,.3,1)}
.rrow + .rrow::before{content:'';position:absolute;left:51px;right:0;top:0;height:1px;background:var(--line)}
.rrow .nm{flex:1;font-size:.97rem;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding:10px 0;margin:-10px 0;text-decoration:underline;
  text-decoration-color:var(--line2);text-underline-offset:4px}
.rrow .ct{font-size:.82rem;color:var(--ink3)}
.grip{width:42px;height:42px;margin-right:-8px;color:var(--ink3);display:flex;
  align-items:center;justify-content:center;touch-action:none;cursor:grab}
.rrow.lift{transition:none;z-index:6;box-shadow:0 12px 28px rgba(23,24,28,.20);border-radius:12px}
.rrow.lift::before,.rrow.lift + .rrow::before{opacity:0}
.rrow.lift .grip{color:var(--ink)}
.group{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:13px;padding:14px 15px;min-height:56px;
  width:100%;text-align:left;transition:background .12s;position:relative}
.item + .item::before{content:'';position:absolute;left:51px;right:0;top:0;height:1px;background:var(--line)}
.item:active{background:var(--surf2)}
.item .nm{flex:1;font-size:.97rem;font-weight:600;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ct{font-size:.84rem;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.item .chev{color:var(--ink3);opacity:.55}
.item .ic{width:26px;display:flex;justify-content:center;color:var(--ink2)}
.item .pill{flex:none;padding:7px 14px}

/* ---------- メモカード ---------- */
.ncard{display:block;width:100%;text-align:left;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;margin-bottom:11px;
  box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;position:relative;cursor:pointer}
.ncard:active{transform:scale(.995);box-shadow:none}
.ncard.picked{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.chk{position:absolute;top:13px;right:13px;width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--on-pri)}
.chk.on{background:var(--pri);border-color:var(--pri)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:620px;z-index:46;
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom));background:var(--bg);
  border-top:1px solid var(--line);padding:12px 16px 14px}
.selbar .btn[disabled]{opacity:.45}
.starbtn{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--line2);z-index:2}
.starbtn.on{color:var(--gold)}
.starbtn:active{transform:scale(.86)}
.cthumbs{display:flex;gap:6px;margin-top:12px}
.cth{width:33%;max-width:120px;aspect-ratio:1;border-radius:10px;overflow:hidden;
  background:var(--surf2);border:1px solid var(--line);flex:1 1 0}
.cth img{width:100%;height:100%;object-fit:cover;display:block}
.cth.more{display:flex;align-items:center;justify-content:center;color:var(--ink3);
  font-size:.82rem;font-weight:700;flex:0 0 44px}
.nmeta{display:flex;align-items:center;gap:8px;font-size:.71rem;color:var(--ink3);
  font-weight:600;margin-bottom:7px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.nmeta .dot{width:7px;height:7px;border-radius:50%;flex:none}
.nlead{font-family:var(--serif);font-size:1.06rem;font-weight:600;line-height:1.62;letter-spacing:.02em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nprev{font-size:.85rem;color:var(--ink2);line-height:1.75;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nfoot{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--ink3);font-size:.71rem;font-weight:600}

/* ---------- 本文表示 ---------- */
.doc{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 20px;box-shadow:var(--shadow)}
.doc .body{white-space:pre-wrap;word-break:break-word;font-size:.99rem;line-height:2.05;color:var(--ink2)}
.doc .body .lead{font-family:var(--serif);font-weight:600;font-size:1.24rem;letter-spacing:.02em;
  color:var(--ink);line-height:1.7}

/* ---------- 入力 ---------- */
.field{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;outline:none;transition:.15s;box-shadow:var(--shadow)}
.field:focus{border-color:var(--ink3)}
.field::placeholder{color:var(--ink3)}
textarea.field{min-height:44vh;resize:none;line-height:2.05;font-size:1rem;padding:18px}
.onlybar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--pri-soft);border-radius:12px;padding:10px 13px;margin-bottom:12px;
  font-size:.83rem;font-weight:700;color:var(--ink)}
.onlybar button{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:.8rem;font-weight:700}
.search{display:flex;align-items:center;gap:9px;background:var(--surf2);border-radius:12px;
  padding:10px 13px;color:var(--ink3);margin-bottom:12px}
.search input{flex:1;background:none;border:none;outline:none;font-size:.93rem;color:var(--ink)}

/* ---------- ボタン ---------- */
.btn{width:100%;border-radius:13px;padding:15px;font-size:.96rem;font-weight:700;
  letter-spacing:.04em;transition:.12s;border:1px solid transparent}
.btn:active{transform:scale(.99);opacity:.9}
.btn.pri{background:var(--pri);color:var(--on-pri)}
.btn.sec{background:var(--surf);border-color:var(--line);box-shadow:var(--shadow)}
#revnow{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.9rem;padding:12px}
.btn.danger{background:var(--ng-soft);color:var(--ng)}
.pill{border:1px solid var(--line);background:var(--surf);border-radius:999px;
  padding:8px 14px;font-size:.83rem;font-weight:600;color:var(--ink2);
  display:inline-flex;align-items:center;gap:7px;transition:.15s;letter-spacing:.02em}
.pill:active{opacity:.6}
.pill.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill .n{color:var(--ink3);font-weight:600;font-variant-numeric:tabular-nums}
.trail{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.78rem;
  color:var(--ink3);font-weight:600;margin:0 2px 12px}
.trail button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.trail b{color:var(--ink)}
.row-scope{display:flex;align-items:center;gap:12px}
.row-scope .k{font-size:.75rem;font-weight:700;color:var(--ink3);letter-spacing:.06em}
.row-scope .pill{flex:1;justify-content:space-between}
.pill.on .n{color:inherit;opacity:.6}
.seg{display:flex;background:var(--surf2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:.82rem;font-weight:600;
  color:var(--ink2);letter-spacing:.02em;transition:.15s}
.seg button.on{background:var(--surf);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.stepper{display:flex;align-items:center;gap:9px;background:var(--surf2);border-radius:13px;padding:6px}
.stepper .rnd{width:42px;height:40px;border-radius:10px;background:var(--surf);box-shadow:var(--shadow);
  font-size:1.15rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.stepper .rnd:active{opacity:.5}
.stepper b{flex:1;text-align:center;font-family:var(--serif);font-size:1.18rem;letter-spacing:.04em}
.stepper .pill{background:var(--surf)}
.quick{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .pill{flex:none;padding:7px 14px;font-variant-numeric:tabular-nums}

/* ---------- FAB ---------- */
#fab{position:fixed;right:20px;z-index:45;
  bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;background:var(--pri);color:var(--on-pri);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(23,24,28,.28);transition:transform .12s}
#fab:active{transform:scale(.92)}

/* ---------- タブバー ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(1.7) blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink3);font-size:.63rem;font-weight:700;letter-spacing:.06em;transition:color .18s}
.tab.on{color:var(--ink)}

/* ---------- 写真 ---------- */
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:80px;height:80px;border-radius:12px;overflow:hidden;
  background:var(--surf2);border:1px solid var(--line);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
  background:rgba(15,16,20,.72);color:#fff;display:flex;align-items:center;justify-content:center}
.thumb .side{position:absolute;left:3px;bottom:3px;padding:2px 9px;border-radius:999px;
  background:rgba(15,16,20,.72);color:#fff;font-size:.68rem;font-weight:800}
.thumb.isback{outline:2px solid var(--pri);outline-offset:-2px}
.thumb.isback .side{background:var(--pri);color:var(--on-pri)}
.backlabel{font-size:.72rem;font-weight:700;color:var(--ink3);letter-spacing:.08em;margin:18px 2px -6px}
.pics{margin-top:18px}
.pics.one .bigpic{border-radius:13px;overflow:hidden;background:var(--surf2);border:1px solid var(--line)}
.pics.one img{width:100%;max-height:58vh;object-fit:contain;display:block}
.pics.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics.grid2 .cell{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surf2);border:1px solid var(--line)}
.pics.grid2 .cell img{width:100%;height:100%;object-fit:cover;display:block}
.pics [data-t]{transition:opacity .12s}
.pics [data-t]:active{opacity:.75}
.rev .pics{margin-top:16px}
.rev .pics.one img{max-height:38vh}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:1px dashed var(--line2);border-radius:13px;padding:13px;color:var(--ink2);
  font-weight:600;font-size:.87rem;background:var(--surf);letter-spacing:.03em}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pcell{position:relative;aspect-ratio:1;background:var(--surf2);overflow:hidden;
  border-radius:8px;transition:opacity .12s}
.pcell:active{opacity:.7}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pdate{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;color:#fff;font-size:.6rem;
  font-weight:700;letter-spacing:.03em;background:linear-gradient(transparent,rgba(0,0,0,.5))}

.gal{position:fixed;inset:0;z-index:300;background:#0b0c0f;display:flex;flex-direction:column}
.gal .gbar{display:flex;align-items:center;justify-content:space-between;color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 8px 8px}
.gal .gbar button{width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:#fff}
.gal .gct{font-size:.82rem;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;opacity:.85}
.gal .track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}
.gal .track::-webkit-scrollbar{display:none}
.gal .fr{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;
  justify-content:center;padding:6px 10px}
.gal .fr img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.gal .gfoot{padding:14px 18px calc(20px + env(safe-area-inset-bottom));text-align:center}
.gal .gfoot button{color:#fff;background:rgba(255,255,255,.14);border-radius:12px;
  padding:12px 22px;font-size:.88rem;font-weight:700;letter-spacing:.04em}

.viewer{position:fixed;inset:0;z-index:300;background:rgba(10,11,14,.97);
  display:flex;align-items:center;justify-content:center;padding:18px}
.viewer img{max-width:100%;max-height:84vh;border-radius:8px;object-fit:contain}
.viewer .close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:18px;
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  display:flex;align-items:center;justify-content:center}

/* ---------- 振り返り ---------- */
.rev{background:var(--surf);border:1px solid var(--line);border-radius:20px;
  padding:28px 22px;min-height:56vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lift)}
.rev .step{font-size:.7rem;color:var(--ink3);font-weight:700;letter-spacing:.16em;margin-bottom:6px}
.rev .when{font-size:.71rem;color:var(--ink3);font-weight:600;margin-bottom:22px;letter-spacing:.03em}
.rev .lead{font-family:var(--serif);font-size:1.34rem;font-weight:600;line-height:1.78;
  white-space:pre-wrap;word-break:break-word;letter-spacing:.03em}
.rev .rest{white-space:pre-wrap;word-break:break-word;font-size:.97rem;color:var(--ink2);
  line-height:2.1;margin-top:16px;flex:1}
.veil{filter:blur(9px);opacity:.36;user-select:none;transition:filter .3s,opacity .3s}
.pictap{margin-top:12px;align-self:flex-start;font-size:.8rem;font-weight:700;color:var(--ink2);
  background:var(--surf2);border-radius:999px;padding:8px 15px;letter-spacing:.03em}
.pictap:active{opacity:.6}
.sw{width:48px;height:29px;border-radius:999px;background:var(--surf3);position:relative;
  flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:var(--surf);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--pri)}
.sw.on::after{transform:translateX(19px)}
.rev .acts{margin-top:22px;display:flex;gap:9px}
.rev .acts button{flex:1;border-radius:13px;padding:16px;font-weight:700;font-size:.93rem;
  letter-spacing:.04em;transition:.12s}
.rev .acts button:active{opacity:.8}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-ng{background:var(--ng-soft);color:var(--ng)}
.b-show{background:var(--pri);color:var(--on-pri)}
.b-sub{background:var(--surf2);color:var(--ink2)}
.b-sub[disabled]{opacity:.35}

/* ---------- そのほか ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surf);padding:16px 6px;text-align:center;width:100%;transition:background .12s}
button.stat:active{background:var(--surf2)}
.stat b{display:block;font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:.02em;
  line-height:1.4;font-variant-numeric:tabular-nums}
.stat span{font-size:.67rem;color:var(--ink3);font-weight:600;letter-spacing:.06em}
.warn{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);
  padding:16px 17px;margin-top:22px}
.warn .wtxt b{font-size:.95rem;font-weight:700;color:var(--ink)}
.warn .wtxt div{font-size:.85rem;color:var(--ink2);line-height:1.8;margin-top:3px}
.warn .wact{display:flex;gap:8px;margin-top:13px}
.warn .pill{background:var(--surf)}
.empty{text-align:center;color:var(--ink3);padding:66px 24px;font-size:.89rem;line-height:2.1}
.empty svg{margin:0 auto 14px;opacity:.35}
.note-txt{font-size:.83rem;color:var(--ink2);line-height:2}
.note-txt b{color:var(--ink);font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:200;
  bottom:calc(var(--tabh) + 30px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:.85rem;letter-spacing:.04em;box-shadow:var(--shadow-lift);
  opacity:0;transition:.22s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-8px)}
.tact{margin-left:14px;color:var(--bg);font-weight:800;font-size:.85rem;
  text-decoration:underline;text-underline-offset:3px}

/* ---------- ボトムシート ---------- */
.scrim{position:fixed;inset:0;z-index:150;background:rgba(14,15,18,.42);
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:620px;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px 18px calc(26px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);
  position:relative}
@keyframes up{from{transform:translateY(28px);opacity:.7}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:6px auto 12px}
.sheet h3{margin:0 0 16px;font-family:var(--serif);font-size:1.16rem;font-weight:600;letter-spacing:.04em}
.sheet .xbtn{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  background:var(--surf2);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.swatch{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
.swatch button{aspect-ratio:1;border-radius:12px;position:relative;transition:transform .12s}
.swatch button:active{transform:scale(.92)}
.swatch button.on::after{content:'';position:absolute;inset:-4px;border-radius:15px;border:2px solid var(--ink)}

/* ---------- 使い方スライド ---------- */
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -18px}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:0 18px}
.slide .badge{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;
  justify-content:center;margin-bottom:16px}
.slide h4{font-family:var(--serif);font-size:1.62rem;font-weight:600;letter-spacing:.04em;margin:0 0 6px}
.slide .sub{font-size:.76rem;font-weight:700;letter-spacing:.12em;margin-bottom:14px}
.slide p{margin:0 0 12px;font-size:1.02rem;line-height:1.95;color:var(--ink2)}
.slide .kv{display:flex;gap:11px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);
  border-radius:13px;padding:14px 15px;margin-top:11px;box-shadow:var(--shadow)}
.slide .kv b{font-size:1rem;font-weight:700;display:block;margin-bottom:3px;letter-spacing:.01em}
.slide .kv span{font-size:.93rem;color:var(--ink2);line-height:1.8}
.slide .kv .n{font-family:var(--serif);font-size:1.05rem;width:22px;flex:none;text-align:center;opacity:.5}
.dots{display:flex;justify-content:center;gap:7px;margin:20px 0 16px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2);transition:.25s}
.dots i.on{background:var(--ink);width:20px;border-radius:3px}
code{background:var(--surf2);border-radius:6px;padding:2px 6px;font-size:.82rem;
  font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
</style>
</head>
<body>
<div id="top"><div class="tbar" id="tbar"></div></div>
<main id="main"></main>
<button id="fab" class="hidden" aria-label="新しいメモ"></button>
<nav id="tabs"><div class="in" id="tabin"></div></nav>
<div class="toast" id="toast"></div>
<div id="host"></div>
<script>
'use strict';
/* ===================== 定数 ===================== */
const VER = 18;
const K_N = 'mn_notes', K_F = 'mn_folders', K_C = 'mn_cfg';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const COLORS = ['#e5484d','#e08a2e','#d8b12a','#2e9e62','#1f9aa6','#3b76e0','#5b53d6','#d6478f','#7a6a58','#8a8f98'];

const svg = (p, o) => `<svg width="${(o&&o.s)||22}" height="${(o&&o.s)||22}" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="${(o&&o.w)||1.7}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO = {
  inbox:  o => svg('<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>', o),
  folder: o => svg('<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>', o),
  folderFill: o => `<svg width="${(o&&o.s)||22}" height="${(o&&o.s)||22}" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`,
  note:   o => svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>', o),
  loop:   o => svg('<path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>', o),
  gear:   o => svg('<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>', o),
  pencil: o => svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>', o),
  search: o => svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>', o),
  right:  o => svg('<path d="m9 18 6-6-6-6"/>', o),
  left:   o => svg('<path d="m15 18-6-6 6-6"/>', o),
  star:   o => svg('<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>', o),
  starFill: o => `<svg width="${(o&&o.s)||22}" height="${(o&&o.s)||22}" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>`,
  trash:  o => svg('<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', o),
  plus:   o => svg('<path d="M12 5v14M5 12h14"/>', o),
  x:      o => svg('<path d="M18 6 6 18M6 6l12 12"/>', o),
  copy:   o => svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', o),
  image:  o => svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>', o),
  move:   o => svg('<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9.5 13.5 12 11l2.5 2.5"/>', o),
  down:   o => svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>', o),
  up:     o => svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>', o),
  book:   o => svg('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>', o),
  info:   o => svg('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>', o),
  check:  o => svg('<path d="m20 6-11 11-5-5"/>', o),
  grip:   o => svg('<path d="M4 8h16M4 12h16M4 16h16"/>', o),
  chevU:  o => svg('<path d="m18 15-6-6-6 6"/>', o),
  chevD:  o => svg('<path d="m6 9 6 6 6-6"/>', o),
};

/* ===================== データ ===================== */
let notes = [], folders = [], cfg = {};
let S = { screen:'home', fid:null, nid:null, editId:null, q:'', sort:'new', view:'list', sel:null, only:'' };

const now = () => Date.now();
const uid = p => (p||'n') + now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const live = () => notes.filter(n => !n.del);
/* 未確認＝一度も振り返っていない。「あいまい」でも確認ずみとして扱う */
const unseen = n => !n.revAt;
const saveNotes = () => localStorage.setItem(K_N, JSON.stringify(notes));
const saveFolders = () => localStorage.setItem(K_F, JSON.stringify(folders));
const saveCfg = () => localStorage.setItem(K_C, JSON.stringify(cfg));

function load(){
  try{ notes = JSON.parse(localStorage.getItem(K_N) || '[]'); }catch(e){ notes = []; }
  if(!Array.isArray(notes)) notes = [];
  try{ folders = JSON.parse(localStorage.getItem(K_F) || '[]'); }catch(e){ folders = []; }
  if(!Array.isArray(folders)) folders = [];
  try{ cfg = JSON.parse(localStorage.getItem(K_C) || '{}'); }catch(e){ cfg = {}; }
  cfg = Object.assign({ revN:5, revScope:'*', hidePhotos:true }, cfg);
  if(cfg.revScope && cfg.revScope !== '*' && cfg.revScope !== '' && !folders.some(f => f.id === cfg.revScope)){
    cfg.revScope = '*'; saveCfg();
  }
  let dirty = false;
  notes.forEach(n => {
    if(n.title !== undefined || n.src !== undefined){        // v1形式の取り込み
      n.body = [n.title, n.body].filter(Boolean).join('\n');
      if(n.src) n.body += '\n（' + n.src + '）';
      if(n.url) n.body += '\n' + n.url;
      delete n.title; delete n.src; delete n.url; delete n.tags; delete n.kind; delete n.arc;
      dirty = true;
    }
    if(n.fid === undefined){ n.fid = ''; dirty = true; }
  });
  if(dirty) saveNotes();
}

const folderOf = id => folders.find(f => f.id === id);
const countIn = id => live().filter(n => n.fid === id).length;
/* フォルダは何階層でも入れ子にできる。子は pid に親のidを持つ */
const topFolders = () => folders.filter(f => !f.pid || !folderOf(f.pid));
const subsOf = pid => (pid ? folders.filter(f => f.pid === pid) : []);
function idsUnder(id){                                 // 自分＋すべての子孫
  if(!id) return [''];
  const out = [id];
  for(let i = 0; i < out.length; i++) subsOf(out[i]).forEach(f => { if(!out.includes(f.id)) out.push(f.id); });
  return out;
}
const countUnder = id => { const ids = idsUnder(id); return live().filter(n => ids.includes(n.fid)).length; };
function chainOf(id){                                  // 上から順にたどった配列
  const out = [];
  let f = id ? folderOf(id) : null, guard = 0;
  while(f && guard++ < 20){ out.unshift(f); f = f.pid ? folderOf(f.pid) : null; }
  return out;
}
const pathOf = n => chainOf(n.fid).map(f => f.name).join(' / ');
/* 上から順に、深さつきで並べた一覧（選択シート用） */
function folderTree(){
  const out = [];
  const walk = (list, d) => list.forEach(f => { out.push({ id:f.id, name:f.name, color:f.color, d }); walk(subsOf(f.id), d+1); });
  walk(topFolders(), 0);
  return out;
}

function fmtDate(ms){
  const d = new Date(ms), t = new Date(), p = x => String(x).padStart(2,'0');
  if(d.toDateString() === t.toDateString()) return '今日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  const y = new Date(t - 86400000);
  if(d.toDateString() === y.toDateString()) return '昨日';
  return (d.getFullYear() === t.getFullYear() ? '' : d.getFullYear() + '/') + (d.getMonth()+1) + '/' + d.getDate();
}
const daysAgo = ms => Math.floor((now() - ms) / 86400000);

let toastT = null;
function toast(msg, action, fn){
  const el = $('#toast');
  el.innerHTML = esc(msg) + (action ? `<button class="tact">${esc(action)}</button>` : '');
  el.classList.add('on');
  el.style.pointerEvents = action ? 'auto' : 'none';
  if(action) el.querySelector('.tact').onclick = () => { el.classList.remove('on'); el.style.pointerEvents = 'none'; fn(); };
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.classList.remove('on'); el.style.pointerEvents = 'none'; }, action ? 6000 : 2000);
}

/* ===================== 写真（IndexedDB） ===================== */
const DB = 'renote', STORE = 'imgs';
let _db = null;
const urlCache = new Map();
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function tx_(mode, fn){
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction(STORE, mode);
    const req = fn(t.objectStore(STORE));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const putImg = (id, b) => tx_('readwrite', st => st.put(b, id));
const getImg = id => tx_('readonly', st => st.get(id));
const delImg = id => tx_('readwrite', st => st.delete(id));
const clearImgs = () => tx_('readwrite', st => st.clear());

async function imgUrl(id){
  if(urlCache.has(id)) return urlCache.get(id);
  const b = await getImg(id);
  if(!b) return '';
  const u = URL.createObjectURL(b); urlCache.set(id, u); return u;
}
let _io = null;
function lazyImgs(root){        // 画面に入った写真だけ読み込む
  if(!_io) _io = new IntersectionObserver(es => es.forEach(async e => {
    if(!e.isIntersecting) return;
    const el = e.target; _io.unobserve(el);
    const u = await imgUrl(el.dataset.img);
    if(u) el.src = u;
  }), { rootMargin:'300px' });
  (root || document).querySelectorAll('img[data-img]:not([src])').forEach(el => _io.observe(el));
}
async function fillImgs(root){
  for(const el of (root || document).querySelectorAll('img[data-img]:not([src])')){
    const u = await imgUrl(el.dataset.img);
    if(u) el.src = u;
  }
}
/* 読むときの写真：1枚なら大きく、複数なら2列 */
const picsHtml = ids => !ids || !ids.length ? '' : (ids.length === 1
  ? `<div class="pics one"><div class="bigpic" data-t="${ids[0]}"><img data-img="${ids[0]}" alt=""></div></div>`
  : `<div class="pics grid2">${ids.map(id => `<div class="cell" data-t="${id}"><img data-img="${id}" alt=""></div>`).join('')}</div>`);

const thumbsHtml = (ids, rm) => (ids||[]).map(id =>
  `<div class="thumb" data-t="${id}"><img data-img="${id}" alt="">${rm ? `<button class="x" data-rm="${id}">${ICO.x({s:13,w:2.4})}</button>` : ''}</div>`).join('');

const draftThumbs = () => draft.map(d =>
  `<div class="thumb ${d.back?'isback':''}" data-t="${d.id}"><img data-img="${d.id}" alt="">
    <button class="x" data-rm="${d.id}">${ICO.x({s:13,w:2.4})}</button>
    <button class="side" data-flip="${d.id}">${d.back ? '裏' : '表'}</button>
  </div>`).join('');

async function shrink(file){
  const MAX = 1600;
  let src = null, w = 0, h = 0, bmp = null, tmp = '';
  try{ bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){ try{ bmp = await createImageBitmap(file); }catch(e2){ bmp = null; } }
  if(bmp){ src = bmp; w = bmp.width; h = bmp.height; }
  else{
    tmp = URL.createObjectURL(file);
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = tmp; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const sc = Math.min(1, MAX / Math.max(w, h));
  const cw = Math.max(1, Math.round(w*sc)), ch = Math.max(1, Math.round(h*sc));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(src, 0, 0, cw, ch);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  if(bmp && bmp.close) bmp.close();
  if(tmp) URL.revokeObjectURL(tmp);
  return blob || file;
}
async function sweepImgs(){
  try{
    const keys = await tx_('readonly', st => st.getAllKeys()) || [];
    const used = new Set();
    notes.forEach(n => (n.imgs||[]).forEach(i => used.add(i)));  // ゴミ箱の中の写真も残す
    draft.forEach(d => used.add(d.id));
    for(const k of keys) if(!used.has(k)) await delImg(k);
  }catch(e){}
}
function openGallery(items, start){
  if(!items.length) return;
  let i = Math.max(0, Math.min(items.length - 1, start || 0));
  const host = $('#host');
  host.innerHTML = `<div class="gal">
      <div class="gbar">
        <button data-gclose>${ICO.x({s:20,w:2.1})}</button>
        <span class="gct" id="gct">${i+1} / ${items.length}</span>
        <span style="width:42px"></span>
      </div>
      <div class="track" id="gtrack">
        ${items.map(x => `<div class="fr"><img data-img="${x.id}" alt=""></div>`).join('')}
      </div>
      <div class="gfoot">${items[0].nid ? `<button id="gopen">このメモを開く</button>` : ''}</div>
    </div>`;
  const track = $('#gtrack');
  const near = async () => {                       // 前後2枚だけ先に読み込む
    for(let k = Math.max(0,i-2); k <= Math.min(items.length-1, i+2); k++){
      const el = track.children[k].querySelector('img');
      if(!el.getAttribute('src')){ const u = await imgUrl(items[k].id); if(u) el.src = u; }
    }
  };
  const jump = () => { track.scrollLeft = track.clientWidth * i; };
  near().then(() => requestAnimationFrame(jump));
  track.addEventListener('scroll', () => {
    clearTimeout(track._t);
    track._t = setTimeout(() => {
      i = Math.round(track.scrollLeft / track.clientWidth);
      $('#gct').textContent = (i+1) + ' / ' + items.length;
      near();
    }, 70);
  }, { passive:true });
  $('#host [data-gclose]').onclick = () => host.innerHTML = '';
  const go2 = $('#gopen');
  if(go2) go2.onclick = () => { const nid = items[i].nid; host.innerHTML = ''; if(nid) go('note', { nid }); };
}

function openViewer(src){
  const host = $('#host');
  host.innerHTML = `<div class="viewer"><button class="close">${ICO.x({s:19,w:2.2})}</button><img src="${src}" alt=""></div>`;
  host.querySelector('.viewer').onclick = () => host.innerHTML = '';
}

/* ===================== 画面の切り替え ===================== */
function bar(left, title, right, big){
  $('#tbar').innerHTML = big
    ? `<div class="ttl big">${title}</div><div class="side r">${right||''}</div>`
    : `<div class="side">${left||''}</div><div class="ttl">${title||''}</div><div class="side r">${right||''}</div>`;
}
const btnBack = (lbl) => `<button class="tbtn" data-back>${ICO.left({s:20,w:2.1})}${lbl?`<span>${lbl}</span>`:''}</button>`;

function go(screen, opt){
  if(screen !== 'list') S.sel = null;
  Object.assign(S, { screen }, opt || {});
  window.scrollTo(0,0);
  render();
}
function render(){
  const r = { home:renderHome, list:renderList, note:renderNote, write:renderWrite, review:renderReview, set:renderSet }[S.screen];
  r();
  $('#fab').classList.toggle('hidden', !(S.screen === 'home' || S.screen === 'list') || !!S.sel);
  $('#tabs').classList.toggle('hidden', S.screen === 'write');
  document.documentElement.style.setProperty('--tabh', S.screen === 'write' ? '0px' : '58px');
  $$('#tabin .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tabOf(S.screen)));
  $('#tbar').querySelectorAll('[data-back]').forEach(b => b.onclick = back);
  fillImgs($('#main'));
}
const tabOf = s => (s === 'review' ? 'review' : s === 'set' ? 'set' : 'notes');
function back(){
  if(S.screen === 'list'){
    const f = S.fid ? folderOf(S.fid) : null;
    if(f && f.pid && folderOf(f.pid)) return go('list', { fid:f.pid, q:'', view:'list' });
    return go('home');
  }
  if(S.screen === 'note') return go('list');
  if(S.screen === 'write') return S.editId ? go('note', { nid:S.editId }) : go(S.fid === null ? 'home' : 'list');
  go('home');
}

/* ===================== ホーム（フォルダ一覧） ===================== */
function renderHome(){
  bar('', 'ReNote', '', true);
  const L = live();
  const un = countIn('');
  const rows = topFolders().map(f => {
    const sub = subsOf(f.id).length;
    return item({
      ic: `<span style="color:${f.color}">${ICO.folderFill({s:21})}</span>`,

    <div class="group">

      <button class="stat" data-jump="unrev"><b>${L.filter(unseen).length}</b><span>未確認</span></button>

  $$('#main [data-open]').forEach(b => b.onclick = () => {

  $('#main [data-newfolder]').onclick = () => folderSheet(null);
  $$('#main [data-jump]').forEach(b => b.onclick = () =>

  $$('#main [data-warn]').forEach(b => b.onclick = () => {

function warnBox(){

  const today = new Date().toDateString();
  if(never < 10 || cfg.warnHide === today) return '';
  return `<div class="warn">
    <div class="wtxt"><b>まだ確認していないメモが${never}件あります</b>
      <div>増やす前に少し振り返っておくと、あとが楽になります。</div></div>
    <div class="wact">
      <button class="pill on" data-warn="rev">未確認を振り返る</button>

      <button class="pill" data-warn="hide">今日は閉じる</button>
    </div>
  </div>`;
}
function item(o){
  return `<button class="item" ${o.attr||''}>
    <span class="ic">${o.ic||''}</span><span class="nm">${o.nm}</span>
    ${o.ct !== undefined ? `<span class="ct">${o.ct}</span>` : ''}
    ${o.right || `<span class="chev">${ICO.right({s:18,w:2})}</span>`}
  </button>`;
}
const rowItem = o => `<button class="item" ${o.attr||''}>
    <span class="ic" style="${o.col?`color:${o.col}`:''}">${o.ic||''}</span>
    <span class="nm" style="${o.col?`color:${o.col}`:''}">${o.nm}</span>${o.right||''}</button>`;

/* ===================== 一覧 ===================== */
function listTitle(){
  if(S.fid === null) return 'すべてのノート';
  if(S.fid === '') return '未分類';
  const f = folderOf(S.fid);
  return f ? f.name : 'ノート';
}
const ONLY = { unrev:'まだ確認していないメモ', today:'今日書いたメモ', star:'重要マーク' };
function inScope(){
  const a = live();
  if(S.fid === null) return a;
  const ids = idsUnder(S.fid);
  return a.filter(n => ids.includes(n.fid));
}
function photosInScope(){
  const out = [];
  inScope().slice().sort((x,y) => y.cre - x.cre)
    .forEach(n => (n.imgs || []).forEach(id => out.push({ id, nid:n.id, cre:n.cre })));
  return out;
}
function renderList(){
  const f = S.fid ? folderOf(S.fid) : null;
  const cur = f;
  if(S.sel){
    bar(`<button class="tbtn" data-selcancel>やめる</button>`,
        `${S.sel.size}件を選択`,
        `<button class="tbtn accent" data-selall>すべて</button>`);
  }else{
    bar(btnBack(), esc(listTitle()),
      `<button class="tbtn" data-select>選択</button>${f ? `<button class="tbtn" data-editfolder>編集</button>` : ''}`);
  }
  const pics = photosInScope();
  const photoView = S.view === 'photos' && pics.length;
  const subs = f ? subsOf(f.id) : [];
  const trail = f ? chainOf(f.id).slice(0, -1) : [];
  const subBar = f ? `
    ${trail.length ? `<div class="trail">${trail.map(p =>
        `<button data-goto="${p.id}">${esc(p.name)}</button><span>›</span>`).join('')}<b>${esc(f.name)}</b></div>` : ''}
    <div class="pills" id="subs" style="margin-bottom:12px">
      ${subs.map(x => `<button class="pill" data-sub="${x.id}">
        <span class="dot" style="width:8px;height:8px;border-radius:50%;background:${x.color}"></span>${esc(x.name)}
        <span class="n">${countUnder(x.id)}</span></button>`).join('')}
      <button class="pill" data-newsub>${ICO.plus({s:14,w:2.2})}フォルダ</button>
      ${subs.length ? `<button class="pill" data-sortsub>${ICO.grip({s:14,w:2})}整理</button>` : ''}
    </div>` : '';
  $('#main').innerHTML = subBar + `
    ${pics.length ? `<div class="seg" id="vsw" style="margin-bottom:12px">
      <button data-v="list" class="${photoView?'':'on'}">メモ ${inScope().length}</button>
      <button data-v="photos" class="${photoView?'on':''}">写真 ${pics.length}</button>
    </div>` : ''}
    ${S.only ? `<div class="onlybar"><span>${ONLY[S.only]}だけを表示中</span>
      <button data-clearonly>${ICO.x({s:14,w:2.2})}解除</button></div>` : ''}
    ${photoView ? `<div class="pgrid" id="pgrid">${pics.map((x,i) =>
        `<button class="pcell" data-p="${i}"><img data-img="${x.id}" alt=""><span class="pdate">${fmtDate(x.cre)}</span></button>`).join('')}</div>`
      : `<div class="search">${ICO.search({s:17,w:2})}<input id="q" placeholder="${f ? 'このフォルダ内を検索' : 'キーワードで検索'}" value="${esc(S.q)}" autocomplete="off"></div>
    <div class="seg" id="sort">
      <button data-s="new" class="${S.sort==='new'?'on':''}">新しい順</button>
      <button data-s="old" class="${S.sort==='old'?'on':''}">古い順</button>
      <button data-s="rev" class="${S.sort==='rev'?'on':''}">未確認順</button>
    </div>
    <div id="revhere" style="margin-top:12px"></div>
    <div id="notelist" style="margin-top:14px"></div>`}`;

  const sc = $('#tbar [data-select]');
  if(sc) sc.onclick = () => { S.sel = new Set(); render(); };
  const sx = $('#tbar [data-selcancel]');
  if(sx) sx.onclick = () => { S.sel = null; render(); };
  const sa = $('#tbar [data-selall]');
  if(sa) sa.onclick = () => { filtered().forEach(n => S.sel.add(n.id)); render(); };
  const co = $('#main [data-clearonly]');
  if(co) co.onclick = () => { S.only = ''; render(); };
  $$('#subs [data-sub]').forEach(b => b.onclick = () => go('list', { fid:b.dataset.sub, q:'', view:'list' }));
  $$('#main [data-goto]').forEach(b => b.onclick = () => go('list', { fid:b.dataset.goto, q:'', view:'list' }));
  const ns = $('#subs [data-newsub]');
  if(ns) ns.onclick = () => folderSheet(null, id => go('list', { fid:id, q:'', view:'list' }), S.fid);
  const ss = $('#subs [data-sortsub]');
  if(ss) ss.onclick = () => reorderSheet(S.fid);
  $$('#vsw button').forEach(b => b.onclick = () => { S.view = b.dataset.v; render(); });
  if(photoView){
    lazyImgs($('#pgrid'));
    $$('#pgrid [data-p]').forEach(b => b.onclick = () => openGallery(pics, +b.dataset.p));
    const ef0 = $('#tbar [data-editfolder]');
    if(ef0) ef0.onclick = () => folderSheet(cur);
    return;
  }
  $('#q').oninput = e => { S.q = e.target.value; paintNotes(); };
  $$('#sort button').forEach(b => b.onclick = () => {
    S.sort = b.dataset.s;
    $$('#sort button').forEach(x => x.classList.toggle('on', x === b));
    paintNotes();
  });
  const ef = $('#tbar [data-editfolder]');
  if(ef) ef.onclick = () => folderSheet(cur);
  paintNotes();
}
function filtered(){
  let a = inScope();
  if(S.only === 'unrev') a = a.filter(unseen);
  if(S.only === 'today') a = a.filter(n => new Date(n.cre).toDateString() === new Date().toDateString());
  if(S.only === 'star')  a = a.filter(n => n.star);
  const q = S.q.trim().toLowerCase();
  if(q) a = a.filter(n => (n.body||'').toLowerCase().includes(q));
  if(S.sort === 'new') a.sort((x,y) => y.cre - x.cre);
  if(S.sort === 'old') a.sort((x,y) => x.cre - y.cre);
  if(S.sort === 'rev') a.sort((x,y) => (x.revAt - y.revAt) || (x.rev - y.rev));
  return a;
}
function noteCard(n){
  const lines = (n.body || '').split('\n').filter(l => l.trim());
  const lead = lines[0] || '（写真のみ）';
  const rest = lines.slice(1).join(' ');
  const f = (S.fid === null && n.fid) ? folderOf(n.fid) : null;   // 「すべて」のときだけ出す
  const pics = (n.imgs||[]).length;
  const picked = S.sel && S.sel.has(n.id);
  return `<div class="ncard ${picked?'picked':''}" data-note="${n.id}">
    ${S.sel
      ? `<span class="chk ${picked?'on':''}">${picked ? ICO.check({s:15,w:2.6}) : ''}</span>`
      : `<button class="starbtn ${n.star?'on':''}" data-star="${n.id}" aria-label="重要">${n.star ? ICO.starFill({s:17}) : ICO.star({s:17,w:1.9})}</button>`}
    <div class="nmeta">
      ${f ? `<span class="dot" style="background:${f.color}"></span><span>${esc(f.name)}</span><span>·</span>` : ''}
      <span>${fmtDate(n.cre)}</span>
    </div>
    <div class="nlead">${esc(lead)}</div>
    ${rest ? `<div class="nprev">${esc(rest)}</div>` : ''}
    ${pics ? `<div class="cthumbs">${(n.imgs||[]).slice(0,3).map(id =>
        `<div class="cth"><img data-img="${id}" alt=""></div>`).join('')}
        ${pics > 3 ? `<div class="cth more">+${pics-3}</div>` : ''}</div>` : ''}
    ${n.rev ? `<div class="nfoot">${ICO.loop({s:13,w:1.9})}<span>${n.rev}</span></div>` : ''}
  </div>`;
}
function paintNotes(){
  const a = filtered();
  const rh = $('#revhere');
  if(rh){
    rh.innerHTML = (a.length && !S.sel)
      ? `<button class="btn sec" id="revnow">${ICO.loop({s:17,w:1.9})}<span>この${a.length}件を振り返る</span></button>` : '';
    const rn = $('#revnow');
    if(rn) rn.onclick = () => startRevWith(a);
  }
  $('#notelist').innerHTML = a.length ? a.map(noteCard).join('')
    : `<div class="empty">${ICO.note({s:34,w:1.4})}${S.q ? '見つかりませんでした' : 'まだメモがありません<br>右下のボタンから書けます'}</div>`;
  $$('#notelist [data-note]').forEach(b => b.onclick = e => {
    if(e.target.closest('[data-star]')) return;
    if(S.sel){
      const id = b.dataset.note;
      S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
      render();
      return;
    }
    go('note', { nid:b.dataset.note });
  });
  if(S.sel){
    const host = document.createElement('div');
    host.className = 'selbar';
    host.innerHTML = `<button class="btn danger" id="seldel" ${S.sel.size?'':'disabled'}>
      ${S.sel.size ? S.sel.size + '件を削除' : 'メモを選んでください'}</button>`;
    $('#main').appendChild(host);
    if(S.sel.size) $('#seldel').onclick = () => {
      const ids = [...S.sel];
      ids.forEach(id => { const n = notes.find(x => x.id === id); if(n){ n.del = true; n.upd = now(); } });
      S.sel = null; saveNotes(); render();
      toast(`${ids.length}件を削除しました`, '元に戻す', () => {
        ids.forEach(id => { const n = notes.find(x => x.id === id); if(n){ n.del = false; n.upd = now(); } });
        saveNotes(); render();
      });
    };
  }
  $$('#notelist [data-star]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const n = notes.find(x => x.id === b.dataset.star);
    if(!n) return;
    n.star = !n.star; n.upd = now(); saveNotes(); paintNotes();
    toast(n.star ? '重要にしました' : '重要をはずしました');
  });
  lazyImgs($('#notelist'));
}

/* ===================== メモ詳細 ===================== */
function renderNote(){
  const n = notes.find(x => x.id === S.nid);
  if(!n) return go('list');
  const f = n.fid ? folderOf(n.fid) : null;
  const lines = (n.body||'').split('\n');
  const lead = lines[0] || '';
  const rest = lines.slice(1).join('\n');
  bar(btnBack(), '', `<button class="tbtn accent" data-edit>編集</button>`);
  $('#main').innerHTML = `
    <div class="doc">
      <div class="nmeta" style="margin-bottom:10px">
        ${f ? `<span class="dot" style="background:${f.color}"></span><span>${esc(f.name)}</span><span>·</span>` : ''}
        <span>${fmtDate(n.cre)}</span>
        ${n.rev ? `<span>· 振り返り${n.rev}回</span>` : ''}
      </div>
      <div class="body"><span class="lead">${esc(lead)}</span>${rest ? '\n' + esc(rest) : ''}</div>
      ${picsHtml((n.imgs||[]).filter(i => !(n.back||[]).includes(i)))}
      ${(n.back||[]).length ? `<div class="backlabel">裏</div>${picsHtml((n.imgs||[]).filter(i => (n.back||[]).includes(i)))}` : ''}
    </div>
    <div class="label">このメモ</div>
    <div class="group">
      ${rowItem({ ic: n.star ? ICO.starFill({s:19}) : ICO.star({s:19}),
                  nm: n.star ? '重要をはずす' : '重要にする', attr:'data-a="star"',
                  col: n.star ? 'var(--gold)' : '' })}
      ${rowItem({ ic:ICO.move({s:19}), nm:'フォルダを移動', attr:'data-a="move"' })}
      ${rowItem({ ic:ICO.copy({s:19}), nm:'本文をコピー', attr:'data-a="copy"' })}
      ${rowItem({ ic:ICO.trash({s:19}), nm:'削除', attr:'data-a="del"', col:'var(--ng)' })}
    </div>`;
  $('#tbar [data-edit]').onclick = () => startEdit(n.id);
  $$('#main [data-a]').forEach(b => b.onclick = () => noteAct(b.dataset.a, n));
  const ordered = (n.imgs||[]).filter(i => !(n.back||[]).includes(i))
    .concat((n.imgs||[]).filter(i => (n.back||[]).includes(i)));
  $$('#main .pics [data-t]').forEach((t, k) => t.onclick = () =>
    openGallery(ordered.map(id => ({ id })), k));
}
function noteAct(a, n){
  if(a === 'star'){ n.star = !n.star; n.upd = now(); saveNotes(); render(); toast(n.star ? '重要にしました' : '重要をはずしました'); }
  if(a === 'copy'){ navigator.clipboard.writeText(n.body || '').then(() => toast('コピーしました'), () => toast('コピーできませんでした')); }
  if(a === 'move'){ moveSheet(n); }
  if(a === 'del'){
    n.del = true; n.upd = now(); saveNotes();
    go('list');
    toast('削除しました', '元に戻す', () => { n.del = false; n.upd = now(); saveNotes(); render(); });
  }
}

/* ===================== 書く・編集 ===================== */
let draft = [], draftFid = '';
function startNew(){
  S.editId = null;
  draft = [];
  draftFid = (S.screen === 'list') ? (S.fid || '') : '';
  go('write');
}
function startEdit(id){
  const n = notes.find(x => x.id === id); if(!n) return;
  S.editId = id;
  draft = (n.imgs || []).map(i => ({ id:i, back:(n.back || []).includes(i) }));
  draftFid = n.fid || '';
  go('write');
}
function renderWrite(){
  const n = S.editId ? notes.find(x => x.id === S.editId) : null;
  bar(`<button class="tbtn" data-cancel>キャンセル</button>`, n ? '編集' : '新しいメモ',
      `<button class="tbtn accent" data-save>保存</button>`);
  $('#main').innerHTML = `
    <div class="pills" id="fpick" style="margin:4px 0 12px"></div>
    <textarea class="field" id="body" placeholder="学んだこと、気づいたことを書く">${esc(n ? n.body : '')}</textarea>
    <div class="note-txt" style="margin:8px 2px 14px">
      <b>1行目が「表」</b>、2行目からが「裏」になります。振り返りでは1行目だけが出て、
      「続きを表示」で残りが出ます。単語カードのようにも使えます。</div>
    <div class="thumbs" id="dthumbs" style="margin-bottom:12px"></div>
    <div class="note-txt" style="margin:-4px 2px 10px">写真の左下の「表／裏」を押すと、
      その写真を裏（「続きを表示」で出る側）にできます。</div>
    <button class="addbtn" id="addphoto">${ICO.image({s:18})}<span>写真を追加</span></button>
    <input type="file" id="pfile" accept="image/*" multiple class="hidden">`;
  paintFolderPick(); paintDraft();
  $('#tbar [data-cancel]').onclick = back;
  $('#tbar [data-save]').onclick = doSave;
  $('#addphoto').onclick = () => $('#pfile').click();
  $('#pfile').onchange = e => { addPhotos(e.target.files); e.target.value = ''; };
  if(!n) setTimeout(() => { const t = $('#body'); if(t) t.focus(); }, 120);
}
function paintFolderPick(){
  const chain = chainOf(draftFid);
  const label = chain.length ? chain.map(f => esc(f.name)).join(' › ') : '未分類';
  const color = chain.length ? chain[chain.length-1].color : 'var(--ink3)';
  $('#fpick').innerHTML = `<button class="pill" id="fpickbtn" style="max-width:100%">
      <span class="dot" style="width:8px;height:8px;border-radius:50%;background:${color}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</span>
      <span style="opacity:.5">${ICO.right({s:13,w:2.2})}</span></button>`;
  $('#fpickbtn').onclick = () => folderPicker(draftFid, id => { draftFid = id; paintFolderPick(); });
}

/* フォルダを選ぶ共通のシート（書くとき・移動するとき） */
function folderPicker(curId, onPick, title){
  const list = [{ id:'', name:'未分類', color:'var(--ink3)', d:0 }].concat(folderTree());
  sheet(`<h3>${title || 'フォルダを選ぶ'}</h3>
    <div class="group">${list.map(f => `<button class="item" data-pick="${f.id}"
        ${f.d ? `style="padding-left:${16 + f.d*18}px"` : ''}>
        <span class="ic" style="color:${f.color}">${ICO.folderFill({s:f.d?18:19})}</span>
        <span class="nm" style="font-weight:${f.d?500:600}">${esc(f.name)}</span>
        ${curId === f.id ? `<span style="color:var(--pri)">${ICO.check({s:18,w:2.2})}</span>` : ''}
      </button>`).join('')}</div>
    <button class="btn sec" id="pnew" style="margin-top:12px">新しいフォルダを作る</button>`, close => {
    $$('#host [data-pick]').forEach(b => b.onclick = () => { onPick(b.dataset.pick); close(); });
    $('#pnew').onclick = () => { close(); folderSheet(null, id => onPick(id), curId || undefined); };
  });
}
function paintDraft(){
  const box = $('#dthumbs');
  if(!box) return;
  box.innerHTML = draftThumbs();
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    draft = draft.filter(d => d.id !== b.dataset.rm); paintDraft();
  });
  box.querySelectorAll('[data-flip]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const d = draft.find(x => x.id === b.dataset.flip);
    if(d){ d.back = !d.back; paintDraft(); toast(d.back ? '裏（続きを表示で出ます）' : '表（最初から見えます）'); }
  });
  fillImgs(box);
}
async function addPhotos(files){
  const list = [...files].slice(0, 8);
  if(!list.length) return;
  toast('写真を読み込み中…');
  for(const f of list){
    if(!/^image\//.test(f.type)) continue;
    try{
      const blob = await shrink(f);
      const id = uid('i');
      await putImg(id, blob);
      draft.push({ id });
    }catch(e){ toast('読み込めない写真がありました'); }
  }
  paintDraft();
}
function doSave(){
  const body = ($('#body') ? $('#body').value : '').trim();
  const imgs = draft.map(d => d.id);
  const backs = draft.filter(d => d.back).map(d => d.id);
  if(!body && !imgs.length){ toast('本文が空です'); return; }
  if(S.editId){
    const n = notes.find(x => x.id === S.editId);
    (n.imgs||[]).forEach(i => { if(!imgs.includes(i)){ urlCache.delete(i); delImg(i).catch(()=>{}); } });
    Object.assign(n, { body, imgs, back:backs, fid:draftFid, upd:now() });
    toast('保存しました');
    go('note', { nid:n.id });
  }else{
    const n = { id:uid(), body, imgs, back:backs, fid:draftFid, cre:now(), upd:now(), rev:0, ng:0, revAt:0, star:false, del:false };
    notes.unshift(n);
    toast('保存しました');
    go('list', { fid: draftFid || '', q:'', view:'list' });
  }
  saveNotes();
  draft = [];
}

/* ===================== 振り返り ===================== */
let revQ = [], revI = 0, revOk = 0, revNg = 0, revOpen = false, revMode = 'quiz', revPic = false, revList = null;

function scopeNotes(){                       // 振り返る範囲のメモ
  const sc = cfg.revScope || '*';
  if(sc === '未') return live().filter(unseen);
  if(sc === '★') return live().filter(n => n.star);
  if(sc === '*') return live();
  if(sc === '') return live().filter(n => !n.fid);
  const ids = idsUnder(sc);
  return live().filter(n => ids.includes(n.fid));
}
function scopeName(){
  const sc = cfg.revScope || '*';
  if(sc === '未') return 'まだ確認していないメモ';
  if(sc === '★') return '重要マークだけ';
  if(sc === '*') return 'すべてのノート';
  if(sc === '') return '未分類';
  const f = folderOf(sc);
  if(!f) return 'すべてのノート';
  const p = f.pid ? folderOf(f.pid) : null;
  return p ? p.name + '　' + f.name : f.name;
}
function scopeSheet(){

function pickReview(k){
  const pool = scopeNotes();
  if(!pool.length) return [];
  const sorted = pool.slice().sort((a,b) => (a.rev - b.rev) || (a.revAt - b.revAt));
  if(!k) k = pool.length;                       // 「全部」
  const head = sorted.slice(0, Math.max(k*3, k));
  for(let i = head.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [head[i],head[j]] = [head[j],head[i]]; }
  return head.slice(0, k);
}

    if(done){

    else{

      $('#scope').onclick = scopeSheet;
      $$('#main [data-rj]').forEach(b => b.onclick = () => {

      const setN = v => {

      $('#revn [data-all]').onclick = () => setN(0);
    }
    return;
  }
  const n = revQ[revI];
  const lines = (n.body||'').split('\n');
  const lead = lines[0] || '（写真のみ）';
  const rest = lines.slice(1).join('\n').trim();
  const imgs = n.imgs || [];

  if(revMode === 'shuffle'){
    const f = n.fid ? folderOf(n.fid) : null;
    const last = revI >= revQ.length - 1;
    $('#main').innerHTML = `
      <div class="rev">

        <div class="when">${f ? esc(f.name) + '　' : ''}${fmtDate(n.cre)}</div>

  else{ $('#rok').onclick = () => revAnswer(true); $('#rng').onclick = () => revAnswer(false); }

}
function startRevWith(list){                 // いま出ている一覧を、そのまま振り返る
  if(!list.length){ toast('メモがありません'); return; }
  revList = list.slice();
  const pool = list.slice();
  for(let i = pool.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
  revMode = 'quiz'; revQ = pool; revI = 0; revOk = 0; revNg = 0; revOpen = false; revPic = false;
  go('review');
}
function startRev(mode){
  revMode = mode || 'quiz';
  if(revMode === 'shuffle'){
    const pool = scopeNotes().slice();
    for(let i = pool.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
    revQ = pool;
  }else{
    revQ = pickReview(cfg.revN);
  }
  revList = null;
  revI = 0; revOk = 0; revNg = 0; revOpen = false; revPic = false;
  if(!revQ.length){ toast('メモがありません'); return; }
  render();
}
function revAnswer(ok){
  const n = revQ[revI];
  if(n){
    n.revAt = now(); n.upd = now();
    if(ok){ n.rev = (n.rev||0)+1; revOk++; } else { n.ng = (n.ng||0)+1; revNg++; }
  }
  revI++; revOpen = false; revPic = false; saveNotes(); render();
}

function setAct(x){
  if(x === 'json') return expJson();
  if(x === 'md')   return expMd();
  if(x === 'csv')  return expCsv();
  if(x === 'txt')  return expTxt();
  if(x === 'imp')  return $('#impfile').click();
  if(x === 'pics'){ cfg.hidePhotos = cfg.hidePhotos === false; saveCfg(); render();
                    toast(cfg.hidePhotos ? '写真も伏せます' : '写真は最初から見せます'); return; }
  if(x === 'trash') return trashSheet();
  if(x === 'help') return helpSheet();
  if(x === 'upd')  return checkUpd(false);
  if(x === 'wipe'){
    if(!confirm('すべてのメモと写真を削除します。よろしいですか？')) return;
    if(!confirm('元に戻せません。本当に削除しますか？')) return;
    notes = []; saveNotes(); clearImgs().catch(()=>{}); urlCache.clear();
    toast('削除しました'); render();
  }
}

function folderSheet(f, onCreate, pid){

  const kind = 'フォルダ';
  let color = f ? f.color : (parent ? parent.color : COLORS[topFolders().length % COLORS.length]);
  sheet(`
    <h3>${f ? kind + 'を編集' : '新しい' + kind}</h3>
    ${parent ? `<div class="note-txt" style="margin:-10px 2px 14px">「${esc(parent.name)}」の中に作ります。</div>` : ''}
    <input class="field" id="fname" placeholder="${parent ? '中に作るフォルダの名前' : 'フォルダ名'}" value="${f ? esc(f.name) : ''}" autocomplete="off">
    ${f ? `<div class="label" style="margin:18px 4px 8px">場所</div>
      <div id="fparent"></div>
      <div class="note-txt" style="margin-top:8px">選んだフォルダの中に入ります。
        中にフォルダを持っていても移動できます（自分の中には入れられません）。</div>` : ''}
    <div class="label" style="margin:18px 4px 8px">いろ</div>
    <div class="swatch" id="sw">${COLORS.map(c =>
      `<button data-c="${c}" class="${c===color?'on':''}" style="background:${c}"></button>`).join('')}</div>
    <button class="btn pri" id="fsave" style="margin-top:22px">${f ? '保存' : '作成'}</button>
    ${f ? `<button class="btn danger" id="fdel" style="margin-top:8px">${kind}を削除</button>` : ''}
  `, close => {
    let newPid = f ? (f.pid || '') : '';
    const paintParent = () => {
      const box = $('#fparent');
      if(!box) return;
      const banned = idsUnder(f.id);                 // 自分と、その中のフォルダには入れられない
      const opts = [{ id:'', name:'いちばん上', d:0 }]
        .concat(folderTree().filter(x => !banned.includes(x.id)));
      box.innerHTML = `<div class="group">${opts.map(o => `<button class="item" data-p="${o.id}"
          ${o.d ? `style="padding-left:${16 + o.d*18}px"` : ''}>
          <span class="ic" style="color:${o.color || 'var(--ink3)'}">${o.id === '' ? ICO.up({s:18}) : ICO.folderFill({s:18})}</span>
          <span class="nm" style="font-weight:${o.d?500:600}">${esc(o.name)}</span>
          ${newPid === o.id ? `<span style="color:var(--pri)">${ICO.check({s:18,w:2.2})}</span>` : ''}
        </button>`).join('')}</div>`;
      $$('#fparent [data-p]').forEach(b => b.onclick = () => { newPid = b.dataset.p; paintParent(); });
    };
    paintParent();
    $$('#sw button').forEach(b => b.onclick = () => {
      color = b.dataset.c;
      $$('#sw button').forEach(x => x.classList.toggle('on', x === b));
    });
    setTimeout(() => { const t = $('#fname'); if(!f && t) t.focus(); }, 150);
    $('#fsave').onclick = () => {
      const name = $('#fname').value.trim();
      if(!name){ toast('名前を入れてください'); return; }
      if(f){
        f.name = name; f.color = color;
        if(newPid !== (f.pid || '')){                 // 入れ子の付け替え
          if(newPid) f.pid = newPid; else delete f.pid;
          const me = folders.splice(folders.indexOf(f), 1)[0];
          folders.push(me);
        }
        toast('保存しました');
      }
      else{
        const nf = { id:uid('f'), name, color };
        if(parentId) nf.pid = parentId;
        folders.push(nf);
        toast('作成しました');
        if(onCreate) onCreate(nf.id);
      }
      saveFolders(); close();
      if(f) go('list', { fid:f.id, q:'', view:'list' });
      else if(S.screen !== 'write') render();
    };
    if(f) $('#fdel').onclick = () => {
      const subs = subsOf(f.id);
      const c = countUnder(f.id);
      const to = f.pid ? (folderOf(f.pid) || {}).name : '未分類';
      const msg = `「${f.name}」を削除します。`
        + (subs.length ? `中のフォルダ${subs.length}個もなくなり、` : '')
        + (c ? `${c}件のメモは「${to}」に移ります（メモは消えません）。` : '');
      if(!confirm(msg)) return;
      const gone = idsUnder(f.id);
      const dest = f.pid || '';
      live().forEach(n => { if(gone.includes(n.fid)){ n.fid = dest; n.upd = now(); } });
      folders = folders.filter(x => !gone.includes(x.id));
      if(cfg.revScope && gone.includes(cfg.revScope)){ cfg.revScope = '*'; saveCfg(); }
      saveFolders(); saveNotes(); close();
      toast('削除しました');
      if(f.pid && folderOf(f.pid)) go('list', { fid:f.pid }); else go('home');
    };
  });

function reorderSheet(pid){
  const inList = () => pid ? subsOf(pid) : topFolders();
  const rowHtml = (f) => `<div class="rrow" data-id="${f.id}">
      <span class="ic" style="width:26px;display:flex;justify-content:center;color:${f.color}">${ICO.folderFill({s:20})}</span>
      <span class="nm">${esc(f.name)}</span>
      <span class="ct">${countIn(f.id)}</span>
      <span class="grip">${ICO.grip({s:20,w:2})}</span>
    </div>`;

  sheet(`<h3>${pid ? '単元' : 'フォルダ'}の整理</h3>
    <div class="note-txt" style="margin:-8px 2px 16px">
      右の ≡ をつまんだまま上下に滑らせると、順番が変わります。<br>
      <b>行の名前のところをタップ</b>すると、名前・色のほか、
      ${pid ? 'どのフォルダの中に置くか' : '<b>ほかのフォルダの中に入れる（場所）</b>'}を変えられます。</div>
    <div class="rlist" id="rlist">${inList().map(rowHtml).join('')}</div>
    <button class="btn pri" id="rdone" style="margin-top:18px">完了</button>`, close => {

    const list = $('#rlist');
    let rows = [...list.children];
    const H = rows.length ? rows[0].offsetHeight : 58;
    let from = -1, to = -1, startY = 0, moved = false;

    const setY = (el, y) => el.style.transform = y ? `translateY(${y}px)` : '';

    function start(e, i){
      from = i; to = i; startY = e.clientY; moved = false;
      rows = [...list.children];
      rows[i].classList.add('lift');
      try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    }
    function move(e){
      if(from < 0) return;
      const dy = e.clientY - startY;
      if(Math.abs(dy) > 3) moved = true;
      setY(rows[from], dy);
      const next = Math.max(0, Math.min(rows.length - 1, from + Math.round(dy / H)));
      if(next !== to){
        to = next;
        rows.forEach((r, j) => {
          if(j === from) return;
          let off = 0;
          if(from < to && j > from && j <= to) off = -H;
          if(from > to && j >= to && j < from) off = H;
          setY(r, off);
        });
        if(navigator.vibrate) navigator.vibrate(6);
      }
      e.preventDefault();
    }
    function end(){
      if(from < 0) return;
      rows[from].classList.remove('lift');
      rows.forEach(r => setY(r, 0));
      if(moved && to !== from){
        const grp = inList();
        const moving = grp[from];
        const others = folders.filter(x => grp.indexOf(x) < 0);
        grp.splice(from, 1); grp.splice(to, 0, moving);
        folders = pid ? others.concat(grp) : grp.concat(others);
        saveFolders();
        list.innerHTML = inList().map(rowHtml).join('');
        bind();
      }
      from = -1;
    }
    function bind(){
      rows = [...list.children];
      rows.forEach((r, i) => {
        r.querySelector('.nm').onclick = () => { close(); folderSheet(folderOf(r.dataset.id)); };
        const g = r.querySelector('.grip');
        g.onpointerdown = e => start(e, i);
        g.onpointermove = move;
        g.onpointerup = end;
        g.onpointercancel = end;
      });
    }
    bind();
    $('#rdone').onclick = () => { close(); render(); toast('並べ替えました'); };
  });
}

    box.innerHTML = bin.length ? `<div class="group">${bin.map(n => {

  sheet(`<h3>ゴミ箱</h3>
    <div class="note-txt" style="margin:-10px 2px 14px">削除したメモはここに残ります。「戻す」でいつでも元に戻せます。

/* ===================== 書き出し・読み込み ===================== */
function dl(name, text, type){
  const b = new Blob([text], { type: type + ';charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1000);
  toast('書き出しました');
}
function stamp(){ const d = new Date(), p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; }
const sortedLive = () => live().slice().sort((x,y) => y.cre - x.cre);
const fname = n => pathOf(n);
const blobToData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const dataToBlob = async d => (await fetch(d)).blob();

async function expJson(){
  if(notes.some(n => (n.imgs||[]).length)) toast('写真を含めて準備中…');
  const out = [];
  for(const n of notes){
    const o = Object.assign({}, n), data = [];
    for(const id of (n.imgs || [])){
      const b = await getImg(id);
      if(b) data.push({ id, d: await blobToData(b) });
    }
    if(data.length) o.imgData = data;
    out.push(o);
  }
  dl(`renote-${stamp()}.json`, JSON.stringify({ app:'renote', ver:VER, at:now(), folders, notes: out }, null, 2), 'application/json');
}
function expMd(){
  const a = sortedLive();
  let s = `# ReNote（${a.length}件・${stamp()}）\n\n`;
  a.forEach(n => {
    const f = fname(n), ph = (n.imgs||[]).length ? `\n\n（写真${n.imgs.length}枚・アプリ内に保存）` : '';
    s += `### ${new Date(n.cre).toLocaleDateString('ja-JP')}${f ? '　' + f : ''}${n.star ? '　★' : ''}\n\n${n.body}${ph}\n\n---\n\n`;
  });
  dl(`renote-${stamp()}.md`, s, 'text/markdown');
}
function expCsv(){
  const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const rows = [['日付','フォルダ','本文','写真','振り返り回数','重要']];
  sortedLive().forEach(n => rows.push([
    new Date(n.cre).toLocaleDateString('ja-JP'), fname(n), n.body, (n.imgs||[]).length, n.rev||0, n.star ? '★' : ''
  ]));
  dl(`renote-${stamp()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}
function expTxt(){
  const a = sortedLive();
  let s = `ReNote　${a.length}件　${new Date().toLocaleDateString('ja-JP')}\n\n`;
  a.forEach((n,i) => {
    const f = fname(n), ph = (n.imgs||[]).length ? `\n（写真${n.imgs.length}枚）` : '';
    s += `${'─'.repeat(30)}\n${i+1}. ${new Date(n.cre).toLocaleDateString('ja-JP')}${f ? '　[' + f + ']' : ''}\n\n${n.body}${ph}\n\n`;
  });
  dl(`renote-${stamp()}.txt`, s, 'text/plain');
}
function doImport(file){
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      const arr = Array.isArray(d) ? d : d.notes;
      if(!Array.isArray(arr)) throw 0;
      if(Array.isArray(d.folders)) d.folders.forEach(f => {          // フォルダも復元
        if(f && f.id && !folderOf(f.id)) folders.push(f);
      });
      let add = 0, upd = 0, pic = 0;
      for(const x of arr){
        if(!x || !x.id) continue;
        if(Array.isArray(x.imgData)){
          for(const im of x.imgData){ try{ await putImg(im.id, await dataToBlob(im.d)); pic++; }catch(e){} }
          delete x.imgData;
        }
        if(x.fid === undefined) x.fid = '';
        const cur = notes.find(n => n.id === x.id);
        if(!cur){ notes.push(x); add++; }
        else if((x.upd||0) > (cur.upd||0)){ Object.assign(cur, x); upd++; }
      }
      notes.sort((a,b) => b.cre - a.cre);
      saveNotes(); saveFolders(); load(); render();
      toast(`追加 ${add}件 / 上書き ${upd}件` + (pic ? ` / 写真 ${pic}枚` : ''));
    }catch(e){ alert('読み込めませんでした。ReNoteから書き出したJSONを選んでください。'); }
  };
  r.readAsText(file);
}

/* ===================== 更新の確認 ===================== */
async function checkUpd(quiet){
  const st = $('#updState');
  if(!quiet && st) st.textContent = '確認しています…';
  try{
    const r = await fetch('version.json?t=' + now(), { cache:'no-store' });
    const j = await r.json();
    if(+j.v > VER){
      if(st){
        st.innerHTML = `新しい v${j.v} があります（${esc(j.note||'')}）`;
        const b = document.createElement('button');
        b.className = 'btn pri'; b.style.marginTop = '10px'; b.textContent = '更新する';
        b.onclick = doUpd; st.after(b);
      }else if(confirm(`新しいバージョン v${j.v} があります。更新しますか？`)) doUpd();
    }else if(st && !quiet) st.textContent = `最新です（v${VER}）`;
  }catch(e){ if(st && !quiet) st.textContent = '確認できませんでした'; }
}
async function doUpd(){
  try{
    if(window.caches) for(const k of await caches.keys()) await caches.delete(k);
    if(navigator.serviceWorker){
      for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    }
  }catch(e){}
  location.replace(location.pathname + '?v=' + now());
}
